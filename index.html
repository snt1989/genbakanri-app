  /* ---- what each screen currently shows (export / "select all" use these) ---- */
  function filterProjects(mode){
    var f = mode==="sales" ? state.salesFilter : state.constFilter;
    return state.projects.filter(function(p){
      if(f.name && (p.name||"").indexOf(f.name)===-1 && propertyAddressOf(p).full.indexOf(f.name)===-1 && (p.address||"").indexOf(f.name)===-1) return false;
      if(f.status.length && f.status.indexOf(p.status)===-1) return false;
      if(f.type!=="all" && p.type!==f.type) return false;
      if(f.store!=="all" && p.store!==f.store) return false;
      if(f.assignees.length){
        var names = normalizeAssignees(p.assignees).map(function(a){return a.name;});
        if(!names.some(function(n){return f.assignees.indexOf(n)!==-1;})) return false;
      }
      return true;
    }).sort(function(a,b){return (b.createdAt||"").localeCompare(a.createdAt||"");});
  }
  function filterCustomers(){
    var q = state.custQuery||"";
    return state.customers.filter(function(c){
      if(!q) return true;
      return (c.name||"").indexOf(q)!==-1 || (c.address||"").indexOf(q)!==-1 || (c.phone||"").indexOf(q)!==-1;
    });
  }
  function filterMembers(){
    return state.members.filter(function(m){
      if(state.memberSeg==="all") return true;
      return m.kind===(state.memberSeg==="internal"?"internal":"external");

  function filterFiles(){
    var f = state.filesFilter;
    return state.files.filter(function(x){
      if(f.project!=="all" && x.projectId!==f.project) return false;
      if(f.kind==="image" && !isImageFile(x)) return false;
      if(f.kind==="other" && isImageFile(x)) return false;

    }).sort(function(a,b){return (b.uploadedAt||"").localeCompare(a.uploadedAt||"");});

  /* ---- CSV text <-> rows ---- */
  function parseCsv(text){
    if(text.charCodeAt(0)===0xFEFF) text = text.slice(1);
    var rows=[], row=[], cur="", inQ=false;
    for(var i=0;i<text.length;i++){
      var ch = text.charAt(i);
      if(inQ){
        if(ch==='"'){ if(text.charAt(i+1)==='"'){ cur+='"'; i++; } else inQ=false; }
        else cur+=ch;
      }else{
        if(ch==='"') inQ=true;
        else if(ch===','){ row.push(cur); cur=""; }
        else if(ch==="\r"){ /* ignore: \r\n and lone \r both end up handled by \n / end */ if(text.charAt(i+1)!=="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; } }
        else if(ch==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
        else cur+=ch;
      }
    }
    if(cur!=="" || row.length){ row.push(cur); rows.push(row); }
    return rows;
  }
  function csvEscape(v){
    v = v==null ? "" : String(v);
    return /[",\r\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  }
  function csvDecode(buf){
    try{ return new TextDecoder("utf-8",{fatal:true}).decode(buf); }
    catch(e){
      try{ return new TextDecoder("shift_jis").decode(buf); }
      catch(e2){ return new TextDecoder("utf-8").decode(buf); }
    }
  }
  function cellOut(c, r){
    var v = r[c.key];
    switch(c.type){
      case "number": return (v==null||v==="") ? "" : v;
      case "names": return normalizeAssignees(v).map(function(a){return a.name;}).join("、");
      case "list": return (v||[]).join("、");
      case "bool": return v ? "はい" : "いいえ";
      case "perm": return permissionLabel(memberPermission(r));
      default:
        var s = v==null ? "" : String(v);
        // Stop spreadsheet apps from treating text as a formula.
        if(!c.type && /^[=+\-@]/.test(s)) s = "'"+s;
        return s;
    }
  }
  function buildCsv(entity, rows){
    var cols = CSV_ENTITIES[entity].columns.filter(function(c){ return !c.importOnly; });
    var out = [cols.map(function(c){return c.label;})];
    rows.forEach(function(r){ out.push(cols.map(function(c){ return cellOut(c, r); })); });
    return "﻿"+out.map(function(r){ return r.map(csvEscape).join(","); }).join("\r\n");
  }
  function downloadBlob(filename, blob){
    if(downloadsCap){
      downloadsCap.save({filename:filename, data:blob}).catch(function(){ toast("ダウンロードがキャンセルされました"); });
    }else{
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    }
  }

  /* ---- cell parsing (shared by import and bulk edit) ---- */
  // Returns {empty:true} | {value:...} | {error:"..."}.
  function parseCell(c, raw, existing){
    var s = String(raw==null ? "" : raw).trim();
    if(s==="") return {empty:true};
    switch(c.type){
      case "number":
        var n = parseFloat(s.replace(/[,，¥￥円\s　]/g,""));
        if(isNaN(n)) return {error:"「"+c.label+"」が数値ではありません（"+s+"）"};
        return {value:n};
      case "date":
        var d = csvNormDate(s);
        if(!d) return {error:"「"+c.label+"」は 2026-10-06 の形式で入力してください（"+s+"）"};
        return {value:d};
      case "bool":
        if(/^(はい|true|1|yes|完了|済|○|〇)$/i.test(s)) return {value:true};
        if(/^(いいえ|false|0|no|未完了|未|×)$/i.test(s)) return {value:false};
        return {error:"「"+c.label+"」は はい／いいえ で入力してください（"+s+"）"};
      case "perm":
        var p = PERMISSION_LEVELS.find(function(x){ return x[0]===s.toLowerCase() || x[1]===s; });
        if(!p) return {error:"「"+c.label+"」は 管理者／一般／外部 のいずれかです（"+s+"）"};
        return {value:p[0]};
      case "names":
        var names = [];
        var bad = [];
        s.split(CSV_LIST_SEP).forEach(function(part){
          part = part.trim(); if(!part) return;
          var nm = csvResolveMemberName(part);
          if(!nm) bad.push(part); else if(names.indexOf(nm)===-1) names.push(nm);
        });
        if(bad.length) return {error:"「"+c.label+"」に未登録のメンバーがいます（"+bad.join("、")+"）"};
        return {value:names};
      case "list":
        var items = [], badItems = [];
        s.split(/[、,，;；\s　]+/).forEach(function(part){
          if(!part) return;
          if(c.options && c.options.indexOf(part)===-1) badItems.push(part);
          else if(items.indexOf(part)===-1) items.push(part);
        });
        if(badItems.length) return {error:"「"+c.label+"」に選択肢にない値があります（"+badItems.join("、")+"）"};
        return {value:items};
      default:
        if(c.options){
          // Accept a value the record already has even if it is not in the list.
          if(c.options.indexOf(s)===-1 && !(existing && existing[c.key]===s))
            return {error:"「"+c.label+"」は次のいずれかです："+c.options.join("／")+"（"+s+"）"};
          return {value:s};
        }
        if(/^'[=+\-@]/.test(s)) s = s.slice(1);
        return {value:s};
    }
  }

  /* ---- raw writes (no per-row toast; callers report totals) ---- */
  function saveRaw(col, id, data){
    var now = new Date().toISOString();
    data = Object.assign({}, data, {updatedAt:now});
    if(!db){
      var arr = state[col];
      if(id){ var i = arr.findIndex(function(x){return x.id===id;}); if(i>-1) arr[i] = Object.assign({}, arr[i], data); }
      else arr.unshift(Object.assign({id:uid(), createdAt:now}, data));
      return Promise.resolve();
    }
    return id ? db.collection(col).doc(id).update(data) : db.collection(col).add(Object.assign({createdAt:now}, data));
  }
  function deleteRaw(col, id){
    if(!db){ state[col] = state[col].filter(function(x){return x.id!==id;}); return Promise.resolve(); }
    return db.collection(col).doc(id).delete();
  }
  function runBatch(promises, doneLabel){
    var ok = 0, fail = 0;
    return Promise.all(promises.map(function(p){ return p.then(function(){ ok++; }, function(){ fail++; }); })).then(function(){
      closeModal();
      toast(fail ? (ok+"件を"+doneLabel+"、"+fail+"件は失敗しました") : (ok+"件を"+doneLabel+"しました"));
      render();
    });
  }

  /* ---- import ---- */
  function csvTemplate(entity){
    var E = CSV_ENTITIES[entity];
    var cols = E.columns.filter(function(c){ return !c.readonly || c.key==="id"; });
    var rows = [cols.map(function(c){return c.label;}), cols.map(function(c){ return c.key==="id" ? "" : (E.sample[c.key]||""); })];
    var text = "﻿"+rows.map(function(r){ return r.map(csvEscape).join(","); }).join("\r\n");
    downloadBlob(E.label+"_取込テンプレート.csv", new Blob([text], {type:"text/csv"}));
  }

  function planImport(entity, rows){
    var E = CSV_ENTITIES[entity];
    var plan = {ops:[], errors:[], unknown:[], total:0};
    if(!rows.length){ plan.errors.push({line:0, msg:"ファイルが空です"}); return plan; }
    var header = rows[0].map(function(h){ return String(h==null?"":h).replace(/^﻿/,"").trim(); });
    var colIdx = {};
    header.forEach(function(h, i){
      var c = E.columns.find(function(x){ return x.label===h || x.key.toLowerCase()===h.toLowerCase(); });
      if(c && colIdx[c.key]==null) colIdx[c.key] = i; else if(h && !c) plan.unknown.push(h);
    });
    if(Object.keys(colIdx).length===0){ plan.errors.push({line:1, msg:"見出し行が認識できません。「CSV出力」したファイルかテンプレートの形式にしてください"}); return plan; }

    var existingList = E.all();
    var seenNames = {};
    var adminAfter = null;
    if(entity==="members"){
      adminAfter = {};
      state.members.forEach(function(m){ adminAfter[m.id] = memberPermission(m)==="admin"; });
    }
    for(var i=1;i<rows.length;i++){
      var row = rows[i];
      if(!row.some(function(v){ return String(v||"").trim()!==""; })) continue;
      plan.total++;
      var line = i+1;
      var idRaw = colIdx.id!=null ? String(row[colIdx.id]||"").trim() : "";
      var existing = idRaw ? existingList.find(function(x){ return x.id===idRaw; }) : null;
      var patch = {}, rowErrors = [];
      E.columns.forEach(function(c){
        if(c.readonly || colIdx[c.key]==null) return;
        var res = parseCell(c, row[colIdx[c.key]], existing);
        if(res.error) rowErrors.push(res.error); else if(!res.empty) patch[c.key] = res.value;
      });
      var label = patch[E.nameKey] || (existing && existing[E.nameKey]) || "";
      if(!existing && !patch[E.nameKey]) rowErrors.push("必須項目「"+E.requiredLabel+"」が空です");
      if(entity==="members" && patch.name){
        var dup = state.members.find(function(m){ return csvSpaceless(m.name)===csvSpaceless(patch.name) && (!existing || m.id!==existing.id); });
        if(dup) rowErrors.push("同じ氏名のメンバーが既に登録されています（"+patch.name+"）");
        if(seenNames[csvSpaceless(patch.name)]) rowErrors.push("ファイル内で氏名が重複しています（"+patch.name+"）");
        seenNames[csvSpaceless(patch.name)] = true;
      }
      if(rowErrors.length){ plan.errors.push({line:line, msg:(label?label+"：":"")+rowErrors.join(" / ")}); continue; }
      var data = E.finalize(patch, existing);
      plan.ops.push({type: existing ? "update" : "create", id: existing ? existing.id : null, data:data, label:label});
      if(adminAfter && existing && data.permission) adminAfter[existing.id] = data.permission==="admin";
      else if(adminAfter && !existing) adminAfter["new"+i] = data.permission==="admin";
    }
    if(adminAfter && plan.ops.length && !Object.keys(adminAfter).some(function(k){ return adminAfter[k]; })){
      plan.ops = []; plan.errors.push({line:0, msg:"管理者が1人もいなくなるため取り込めません"});
    }
    return plan;
  }

  function openCsvImport(entity){
    var E = CSV_ENTITIES[entity];
    if(!E.importable || !csvCanWrite(entity)) return;
    var body = '<div style="font-size:12.5px;line-height:1.7">'+
      '<div>CSVファイルから「'+esc(E.label)+'」を追加・更新します。</div>'+
      '<ul style="margin:8px 0 10px 18px;padding:0;color:var(--ink-soft)">'+
        '<li>1行目は見出し行です（「CSV出力」したファイルと同じ形式）。</li>'+
        '<li>「ID」が一致する行は更新、IDが空・未登録の行は新規登録です。</li>'+
        '<li>空欄のセルは変更されません。</li>'+
        '<li>文字コードはUTF-8・Shift_JIS（Excel保存）に対応しています。</li>'+
      '</ul><button class="btn sm" id="csv-template">テンプレートをダウンロード</button></div>'+
      '<div style="margin-top:14px"><input type="file" id="csv-file" accept=".csv,text/csv"></div>'+
      '<div id="csv-preview" style="margin-top:14px;font-size:12.5px"></div>';
    openModal(E.label+"のCSV入力", body, '<button class="btn" data-close-modal>閉じる</button><button class="btn primary" id="csv-run" disabled>取り込む</button>');
    var currentPlan = null;
    document.getElementById("csv-template").onclick = function(){ csvTemplate(entity); };
    document.getElementById("csv-file").addEventListener("change", function(ev){
      var file = ev.target.files && ev.target.files[0];
      var box = document.getElementById("csv-preview");
      var run = document.getElementById("csv-run");
      run.disabled = true; currentPlan = null;
      if(!file) return;
      var fr = new FileReader();
      fr.onerror = function(){ box.textContent = "ファイルを読み込めませんでした"; };
      fr.onload = function(){
        var plan;
        try{ plan = planImport(entity, parseCsv(csvDecode(fr.result))); }
        catch(e){ box.textContent = "CSVの解析に失敗しました"; return; }
        currentPlan = plan;
        var created = plan.ops.filter(function(o){return o.type==="create";}).length;
        var updated = plan.ops.length - created;
        var h = '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px"><span>新規 <b>'+created+'</b>件</span><span>更新 <b>'+updated+'</b>件</span>'+
          '<span style="color:'+(plan.errors.length?'var(--danger)':'inherit')+'">エラー <b>'+plan.errors.length+'</b>件（取り込まれません）</span></div>';
        if(plan.unknown.length) h += '<div style="color:var(--ink-faint);margin-bottom:6px">無視した列：'+esc(plan.unknown.join("、"))+'</div>';
        if(plan.errors.length){
          h += '<div style="max-height:150px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--danger)">'+
            plan.errors.slice(0,30).map(function(er){ return '<div>'+(er.line?er.line+'行目：':'')+esc(er.msg)+'</div>'; }).join("")+
            (plan.errors.length>30?'<div>…ほか'+(plan.errors.length-30)+'件</div>':'')+'</div>';
        }
        box.innerHTML = h;
        run.disabled = plan.ops.length===0;
      };
      fr.readAsArrayBuffer(file);
    });
    document.getElementById("csv-run").onclick = function(){
      if(!currentPlan || !currentPlan.ops.length) return;
      if(!csvCanWrite(entity)) return;
      document.getElementById("csv-run").disabled = true;
      runBatch(currentPlan.ops.map(function(op){ return saveRaw(E.col, op.id, op.data); }), "取り込み");
    };
  }

      '<button class="btn'+(on?' primary':' outline')+sm+'" data-bulk-toggle="'+entity+'">'+iAdmin()+'一括編集'+(on?'（終了）':'')+'</button>';

  function bulkValueControl(c){
    if(!c) return "";
    var opts = null;
    if(c.options && c.type!=="list") opts = c.options.map(function(o){ return [o,o]; });
    else if(c.type==="perm") opts = PERMISSION_LEVELS.map(function(p){ return [p[1],p[1]]; });
    else if(c.type==="bool") opts = [["はい","はい"],["いいえ","いいえ"]];
    if(opts) return '<select id="bulk-value">'+opts.map(function(o){ return '<option value="'+esc(o[0])+'"'+(state.bulk.value===o[0]?" selected":"")+'>'+esc(o[1])+'</option>'; }).join("")+'</select>';
    var type = c.type==="date" ? "date" : (c.type==="number" ? "number" : "text");
    var ph = c.type==="names" ? "例：阿部 晋太郎、佐藤 裕之（空欄で担当者なし）" : (c.type==="list" ? "例：営業、現場監督" : "");
    return '<input type="'+type+'" id="bulk-value" placeholder="'+esc(ph)+'" value="'+esc(state.bulk.value||"")+'" style="min-width:150px">';
  }
  function bulkBarHtml(){
    var E = CSV_ENTITIES[state.bulk.entity];
    var cols = E.columns.filter(function(c){ return c.bulk; });
    if(cols.length && !cols.some(function(c){ return c.key===state.bulk.field; })) state.bulk.field = cols[0].key;
    var html = '<div class="card bulk-bar" id="bulk-bar"><b style="font-size:12.5px">一括編集：'+esc(E.label)+'</b><span id="bulk-count" style="font-size:12px"></span>'+
      '<button class="btn sm" id="bulk-sel-visible">表示中を選択</button>'+
      '<button class="btn sm" id="bulk-sel-all">絞り込み結果すべて選択</button>'+
      '<button class="btn sm" id="bulk-sel-none">選択解除</button>';
    if(cols.length){
      html += '<span style="flex:1"></span><span style="font-size:12px">項目</span><select id="bulk-field">'+cols.map(function(c){ return '<option value="'+c.key+'"'+(c.key===state.bulk.field?" selected":"")+'>'+esc(c.label)+'</option>'; }).join("")+'</select>'+
        '<span style="font-size:12px">→</span><span id="bulk-value-wrap">'+bulkValueControl(cols.find(function(c){return c.key===state.bulk.field;}))+'</span>'+
        '<button class="btn primary sm" id="bulk-apply">選択行に適用</button>';
    }else{
      html += '<span style="flex:1"></span>';
    }
    html += '<button class="btn sm" id="bulk-delete" style="color:var(--danger)">選択を削除</button><button class="btn sm" id="bulk-exit">終了</button></div>';
    return html;
  }
  function bulkRefreshCount(){
    var n = bulkSelectedIds().length;
    var el = document.getElementById("bulk-count"); if(el) el.textContent = n+"件選択中";
    var c = document.getElementById("content");
    if(c) c.querySelectorAll("[data-row-id]").forEach(function(row){
      var on = !!state.bulk.selected[row.getAttribute("data-row-id")];
      row.classList.toggle("row-selected", on);
      var chk = row.querySelector("input[data-bulk-chk]"); if(chk) chk.checked = on;
    });
    var all = c && c.querySelector("input[data-bulk-all]");
    if(all){
      var rows = c.querySelectorAll("tbody [data-row-id]");
      all.checked = rows.length>0 && Array.prototype.every.call(rows, function(r){ return state.bulk.selected[r.getAttribute("data-row-id")]; });
    }
  }
  function bulkSetSelected(ids, on){ ids.forEach(function(id){ state.bulk.selected[id] = on; }); bulkRefreshCount(); }

  function applyBulkUi(){
    if(!state.bulk.on) return;
    if(!state.isAdmin){ bulkReset(); return; }
    var entity = currentEntity();
    if(state.bulk.entity!==entity){ bulkReset(); return; }
    var c = document.getElementById("content");
    var wrap = document.createElement("div");
    wrap.innerHTML = bulkBarHtml();
    c.insertBefore(wrap.firstChild, c.firstChild);

    // checkboxes: table rows get a leading column, card-like rows get a floating box
    c.querySelectorAll("table").forEach(function(tbl){
      var rows = tbl.querySelectorAll("tbody tr[data-row-id]");
      if(!rows.length) return;
      var hr = tbl.querySelector("thead tr");
      if(hr){ var th = document.createElement("th"); th.className = "bulk-cell"; th.innerHTML = '<input type="checkbox" data-bulk-all title="表示中をすべて選択">'; hr.insertBefore(th, hr.firstChild); }
      rows.forEach(function(tr){
        var td = document.createElement("td"); td.className = "bulk-cell";
        td.innerHTML = '<input type="checkbox" data-bulk-chk>';
        tr.insertBefore(td, tr.firstChild);
      });
    });
    c.querySelectorAll(".photo-grid [data-row-id], .todo-row[data-row-id]").forEach(function(el){
      el.style.position = "relative";
      if(el.classList.contains("todo-row")) el.style.paddingLeft = "30px";
      var box = document.createElement("input"); box.type = "checkbox"; box.className = "bulk-float"; box.setAttribute("data-bulk-chk","");
      el.insertBefore(box, el.firstChild);
    });

    c.querySelectorAll("input[data-bulk-chk]").forEach(function(chk){
      chk.addEventListener("click", function(ev){ ev.stopPropagation(); });
      chk.addEventListener("change", function(){
        var row = chk.closest("[data-row-id]");
        if(row) state.bulk.selected[row.getAttribute("data-row-id")] = chk.checked;
        bulkRefreshCount();
      });
    });
    // file thumbnails are links: in selection mode a click selects instead of opening
    c.querySelectorAll(".photo-grid [data-row-id]").forEach(function(a){
      a.addEventListener("click", function(ev){
        if(ev.target.closest("[data-del-file]")) return;
        ev.preventDefault();
        var id = a.getAttribute("data-row-id");
        state.bulk.selected[id] = !state.bulk.selected[id];
        bulkRefreshCount();
      });
    });
    var all = c.querySelector("input[data-bulk-all]");
    if(all) all.addEventListener("change", function(){
      var ids = Array.prototype.map.call(c.querySelectorAll("tbody [data-row-id]"), function(r){ return r.getAttribute("data-row-id"); });
      bulkSetSelected(ids, all.checked);
    });

    var E = CSV_ENTITIES[entity];
    document.getElementById("bulk-sel-visible").onclick = function(){
      bulkSetSelected(Array.prototype.map.call(c.querySelectorAll("[data-row-id]"), function(r){ return r.getAttribute("data-row-id"); }), true);
    };
    document.getElementById("bulk-sel-all").onclick = function(){ bulkSetSelected(filteredList(entity).map(function(x){return x.id;}), true); };
    document.getElementById("bulk-sel-none").onclick = function(){ state.bulk.selected = {}; bulkRefreshCount(); };
    document.getElementById("bulk-exit").onclick = function(){ bulkReset(); render(); };
    var fieldSel = document.getElementById("bulk-field");
    if(fieldSel){
      fieldSel.onchange = function(){
        state.bulk.field = fieldSel.value; state.bulk.value = "";
        document.getElementById("bulk-value-wrap").innerHTML = bulkValueControl(E.columns.find(function(x){return x.key===state.bulk.field;}));
        bindBulkValue();
      };
      bindBulkValue();
      document.getElementById("bulk-apply").onclick = bulkApply;
    }
    document.getElementById("bulk-delete").onclick = bulkDelete;
    bulkRefreshCount();
  }
  function bindBulkValue(){
    var v = document.getElementById("bulk-value");
    if(v){ v.addEventListener("input", function(){ state.bulk.value = v.value; }); v.addEventListener("change", function(){ state.bulk.value = v.value; }); if(v.tagName==="SELECT") state.bulk.value = v.value; }
  }

  // After the change, would at least one admin remain?
  function adminsRemainAfter(changes){   // changes: {memberId: "admin"|"general"|"external"|null(deleted)}
    return state.members.some(function(m){
      var p = Object.prototype.hasOwnProperty.call(changes, m.id) ? changes[m.id] : memberPermission(m);
      return p==="admin";
    });
  }
  function bulkApply(){
    var entity = state.bulk.entity, E = CSV_ENTITIES[entity];
    if(!csvCanWrite(entity)) return;
    var ids = bulkSelectedIds();
    if(!ids.length){ toast("変更する行を選択してください"); return; }
    var col = E.columns.find(function(c){ return c.key===state.bulk.field; });
    if(!col) return;
    var raw = (document.getElementById("bulk-value")||{}).value || "";
    var res = parseCell(col, raw, null), value;
    if(res.error){ toast(res.error); return; }
    if(res.empty){
      if(col.options && col.type!=="list" || col.type==="number" || col.type==="bool" || col.type==="perm"){ toast("変更後の値を入力してください"); return; }
      value = (col.type==="names"||col.type==="list") ? [] : "";
    }else value = res.value;
    var shown = Array.isArray(value) ? (value.join("、")||"（なし）") : (col.type==="perm" ? permissionLabel(value) : (col.type==="bool" ? (value?"はい":"いいえ") : (value===""?"（空欄）":String(value))));
    if(entity==="members" && col.key==="permission"){
      var ch = {}; ids.forEach(function(id){ ch[id] = value; });
      if(!adminsRemainAfter(ch)){ toast("管理者が1人もいなくなるため変更できません"); return; }
    }
    openModal("一括編集の確認",
      '<div style="font-size:13px;line-height:1.7">選択した <b>'+ids.length+'</b> 件の「'+esc(col.label)+'」を<br><b>'+esc(shown)+'</b><br>に変更します。よろしいですか？</div>',
      '<button class="btn" data-close-modal>キャンセル</button><button class="btn primary" id="bulk-apply-ok">変更する</button>');
    document.getElementById("bulk-apply-ok").onclick = function(){
      document.getElementById("bulk-apply-ok").disabled = true;
      var list = E.all();
      var jobs = ids.map(function(id){
        var existing = list.find(function(x){ return x.id===id; });
        var patch = {}; patch[col.key] = value;
        return saveRaw(E.col, id, E.finalize(patch, existing));
      });
      state.bulk.selected = {};
      runBatch(jobs, "変更");
    };
  }
  function bulkDelete(){
    var entity = state.bulk.entity, E = CSV_ENTITIES[entity];
    if(!csvCanWrite(entity)) return;
    var ids = bulkSelectedIds();
    if(!ids.length){ toast("削除する行を選択してください"); return; }
    if(entity==="members"){
      var me = myMember();
      if(me && ids.indexOf(me.id)!==-1){ toast("ログイン中のご自身は削除できません"); return; }
      var ch = {}; ids.forEach(function(id){ ch[id] = null; });
      if(!adminsRemainAfter(ch)){ toast("管理者が1人もいなくなるため削除できません"); return; }
    }
    confirmDelete("選択した"+ids.length+"件の"+E.label+"を削除しますか？この操作は取り消せません。", function(){
      state.bulk.selected = {};
      runBatch(ids.map(function(id){ return deleteRaw(E.col, id); }), "削除");
    });
  }


  function copyProjectSummary(id){
    var p = state.projects.find(function(x){return x.id===id;});

    var lines = [
      "【"+p.name+"】",
      "進捗: "+p.status, "案件種類: "+(p.type||""), "金額: "+fmtYen(p.amount),

      "顧客: "+(p.customerName||"")

      navigator.clipboard.writeText(text).then(function(){toast("案件情報をコピーしました");}).catch(function(){toast("コピーに失敗しました");});

    var meSave = document.getElementById("me-save");
    if(meSave){
      meSave.addEventListener("click", function(){
        var me = myMember(); if(!me) return;
        var val = function(id){ return document.getElementById(id).value.trim(); };
        var name = val("me-name"), oldName = me.name;
        if(!name){ toast("氏名を入力してください"); return; }
        if(name!==oldName && state.members.some(function(x){ return x.id!==me.id && x.name===name; })){ toast("同じ氏名のメンバーが既に登録されています"); return; }
        var store = document.getElementById("me-store").value;
        writeDoc("members", me.id, {name:name, kana:val("me-kana"), phone:val("me-phone"), email:val("me-email"), company:val("me-company"), store:store==="未選択"?"":store}, "個人情報を保存しました", function(){
          if(name!==oldName){
            renameInProjects(oldName, name);
            state.myName = name;
            try{ localStorage.setItem("gc_myname", name); if(localStorage.getItem("gc_login_name")!==null) localStorage.setItem("gc_login_name", name); }catch(e){}
          }
          render();
        });
      });
    }
    var mePw = document.getElementById("me-pw-save");
    if(mePw){
      mePw.addEventListener("click", function(){
        var me = myMember(); if(!me) return;
        var oldPw = document.getElementById("me-pw-old").value;
        var newPw = document.getElementById("me-pw-new").value;
        var newPw2 = document.getElementById("me-pw-new2").value;
        if(oldPw!==me.password){ toast("現在のパスワードが正しくありません"); return; }
        if(!newPw || newPw.length<4){ toast("新しいパスワードは4文字以上で入力してください"); return; }
        if(newPw!==newPw2){ toast("新しいパスワード（確認）が一致しません"); return; }
        writeDoc("members", me.id, {password:newPw}, "パスワードを変更しました", function(){
          try{ if(localStorage.getItem("gc_login_password")!==null) localStorage.setItem("gc_login_password", newPw); }catch(e){}
        });
      });
    }

    c.querySelectorAll("[data-reset-pw]").forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.getAttribute("data-reset-pw");
        var m = state.members.find(function(x){ return x.id===id; });
        if(!m) return;
        openModal("パスワードの初期化",'<div style="font-size:13px">'+esc(m.name)+' さんのパスワードを「1234」に戻します。よろしいですか？</div>',
          '<button class="btn" data-close-modal>キャンセル</button><button class="btn primary" id="f-reset-confirm">初期化する</button>');
        document.getElementById("f-reset-confirm").onclick = function(){
          writeDoc("members", id, {password:"1234"}, m.name+" さんのパスワードを初期化しました");
        };
      });
    });
    var delPwSave = document.getElementById("del-pw-save");
    if(delPwSave) delPwSave.addEventListener("click", function(){
      if(!state.isAdmin){ toast("削除用パスワードの変更は管理者のみ行えます"); return; }
      var oldPw = document.getElementById("del-pw-old").value;
      var newPw = document.getElementById("del-pw-new").value;
      var newPw2 = document.getElementById("del-pw-new2").value;
      loadDeletePassword(function(current){
        if(oldPw!==current){ toast("現在の削除用パスワードが正しくありません"); return; }
        if(!newPw || newPw.length<4){ toast("新しい削除用パスワードは4文字以上で入力してください"); return; }
        if(newPw!==newPw2){ toast("新しい削除用パスワード（確認）が一致しません"); return; }
        var done = function(){ state.deletePassword = newPw; toast("削除用パスワードを変更しました"); render(); };
        if(db) db.doc("settings/security").set({deletePassword:newPw, updatedAt:new Date().toISOString()}).then(done).catch(function(){ toast("保存に失敗しました"); });
        else done();
      });
    });
    var saveSecretDefaults = function(list, msg){
      if(!state.isAdmin){ toast("初期設定の変更は管理者のみ行えます"); return; }
      var done = function(){ state.secretDefaults = list; toast(msg); render(); };
      if(db) db.doc("settings/secret").set({defaults:list, updatedAt:new Date().toISOString()}).then(done).catch(function(){ toast("保存に失敗しました"); });
      else done();
    };
    var sdSave = document.getElementById("secret-def-save");
    if(sdSave) sdSave.addEventListener("click", function(){
      var list = Array.prototype.slice.call(c.querySelectorAll("input[data-secret-default]:checked")).map(function(b){ return b.getAttribute("data-secret-default"); });
      saveSecretDefaults(list, "社外秘の初期設定を保存しました");
    });
    var sdReset = document.getElementById("secret-def-reset");
    if(sdReset) sdReset.addEventListener("click", function(){ saveSecretDefaults(DEFAULT_SECRET.slice(), "標準の設定に戻しました"); });
    var backupBtn = document.getElementById("admin-backup");
    if(backupBtn) backupBtn.addEventListener("click", function(){ if(!state.isAdmin) return; backupAllData(); });
  }

  document.addEventListener("click", function(e){
    var navBtn = e.target.closest("[data-tab]");
    if(navBtn){ setTab(navBtn.getAttribute("data-tab")); return; }
