          '<button class="chat-pin'+(isPinned(c)?" on":"")+'" data-chat-pin="'+esc(c.id)+'" title="'+(isPinned(c)?"ピン留めを外す":"ピン留めする")+'">'+iPin(isPinned(c))+'</button>'+
          '<button class="chat-pin chat-hide" data-chat-hide="'+esc(c.id)+'" title="'+(isHidden(c)?"再表示する":"非表示にする")+'">'+iEye(!isHidden(c))+'</button>'+
          '<div class="chat-ava">'+(c.kind==="group"?iUsers():iDoc())+'</div>'+
          '<div class="chat-item-main"><div class="chat-item-name">'+esc(c.name)+((c.id!==state.activeChat && (c.reads||{})[state.myName] && String(c.updatedAt||"")>String((c.reads||{})[state.myName]))?' <span class="chat-unread">未読</span>':'')+'</div><div class="chat-item-meta"><span>'+(c.kind==="group"?"グループ":"案件")+'</span><span>'+esc(fmtAgo(c.updatedAt))+'</span></div></div>'+
        '</div>';
      }).join("");
    }
    html += '</div></div>';
    html += '<div class="chat-pane">';
    if(!chat){
      html += '<div class="chat-empty">左のリストからチャットを選択してください</div></div>';
    }else{
      html += '<div class="chat-backbar"><button class="chat-back" data-chat-back="1">'+iBack()+' 一覧</button><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(chat.name)+'</span>'+(chatProject(chat)?'<a class="btn sm primary" href="#" data-open-project="'+esc(chatProject(chat).id)+'" style="flex:none">'+iDoc()+' 案件詳細へ</a>':'')+'</div>';
      html += '<div class="chat-msgs" id="chat-msgs">';
      var msgs = state.chatMsgs[chat.id] || [];
      if(msgs.length===0){ html += '<div style="color:var(--ink-faint);font-size:12px;text-align:center;margin-top:20px">まだメッセージはありません</div>'; }
      else{
        var lastDay = "";
        html += msgs.map(function(m){
          var out = "", day = chatDay(m.ts);
          if(day && day!==lastDay){ out += '<div class="cdate">'+esc(day)+'</div>'; lastDay = day; }
          if(m.system) return out+'<div class="csys">'+esc(chatTime(m.ts))+'<br>'+esc(m.text)+'</div>';
          var mine = state.myName && m.author===state.myName;
          var loc = (m.location && isFinite(m.location.lat) && isFinite(m.location.lng)) ?
            '<br><a class="cfile" href="https://www.google.com/maps?q='+encodeURIComponent(Number(m.location.lat)+","+Number(m.location.lng))+'" target="_blank" rel="noopener noreferrer">'+iPin(false)+' 地図で開く（'+Number(m.location.lat).toFixed(5)+', '+Number(m.location.lng).toFixed(5)+(m.location.accuracy>0?' ／ 誤差 約'+Math.round(m.location.accuracy)+'m':'')+'）</a>' : '';
          var att = m.attachment ? (String(m.attachment.contentType||"").indexOf("image/")===0 ?
              '<a href="'+esc(m.attachment.url)+'" target="_blank" rel="noopener"><img class="catt" src="'+esc(m.attachment.url)+'" alt=""></a>' :
              '<br><a class="cfile" href="'+esc(m.attachment.url)+'" target="_blank" rel="noopener">'+iDoc()+esc(m.attachment.filename||"ファイル")+'</a>') : '';
          return out+'<div class="cm'+(mine?" me":"")+'" id="cm-'+esc(m.id||"")+'">'+(mine?'':'<div class="cav" style="background:'+avaColor(m.author)+'">'+esc(initials(m.author))+'</div>')+
            '<div class="cbody">'+(mine?'':'<div class="cname">'+esc(m.author)+'</div>')+'<div class="crow"><div class="cbub">'+(m.replyTo?'<div class="cquote" data-chat-jump="'+esc(m.replyTo.id||"")+'"><b>'+esc(m.replyTo.author||"")+'</b><span>'+esc(m.replyTo.text||"")+'</span></div>':'')+chatText(m.text)+att+loc+'</div><div class="ctime">'+esc(chatTime(m.ts))+(m.edited?'<span class="cedited">編集済み</span>':'')+'</div>'+
            (m.id ? '<div class="cact"><button data-chat-reply="'+esc(m.id)+'" title="返信">'+iReply()+'</button>'+(mine?'<button data-chat-medit="'+esc(m.id)+'" title="編集">'+iEdit()+'</button>':'')+((mine||state.isAdmin)?'<button class="del" data-chat-mdel="'+esc(m.id)+'" title="削除">'+iTrash()+'</button>':'')+'</div>' : '')+
            '</div>'+readLine(chat, m, mine)+'</div></div>';
        }).join("");

      html += '</div>';
      var draft = (state.chatDraft||{})[chat.id] || "";
      html += '<div class="chat-input-wrap">';
      var rp = (state.chatReply||{})[chat.id];
      if(rp) html += '<div class="chat-replybar"><div><b>'+esc(rp.author)+'</b> に返信<span>'+esc(rp.text)+'</span></div><button type="button" id="chat-reply-x" title="返信をやめる">×</button></div>';
      if(state.chatPop==="emoji") html += '<div class="chat-pop"><div class="emo">'+CHAT_EMOJI.map(function(e){ return '<button data-chat-emoji="'+e+'">'+e+'</button>'; }).join("")+'</div></div>';
      if(state.chatPop==="mention") html += '<div class="chat-pop"><button class="mem" data-chat-mention="全員" style="font-weight:700">@全員<span style="font-weight:400;color:var(--ink-faint);font-size:11px;margin-left:6px">このチャットのメンバー全員宛て</span></button>'+chatMembers(chat).map(function(m){ return '<button class="mem" data-chat-mention="'+esc(m.name)+'">@'+esc(m.name)+'</button>'; }).join("")+'</div>';
      html += '<div class="chat-tools">'+
        '<button type="button" data-chat-tool="emoji" title="絵文字"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5c1 1.3 2.2 2 3.5 2s2.5-.7 3.5-2"/><path d="M9 9.5h.01M15 9.5h.01"/></svg></button>'+
        '<button type="button" data-chat-tool="mention" title="メンションする">@</button>'+
        '<button type="button" data-chat-tool="file" title="ファイルを添付"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 2h8l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm7 1.5V8h4.5L13 3.5z"/></svg></button>'+
        '<button type="button" data-chat-tool="location" title="位置情報を送る">'+iPin(false)+'</button>'+
        '<button type="button" data-chat-tool="image" title="写真を添付"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg></button>'+
        '<input type="file" id="chat-file" style="display:none"><input type="file" id="chat-image" accept="image/*" style="display:none"></div>'+
        '<div class="chat-input-row"><textarea id="chat-input" placeholder="メッセージ">'+esc(draft)+'</textarea><button class="chat-send'+(draft.trim()?' ready':'')+'" id="chat-send">送信</button></div>'+
        '<div class="chat-hint">Ctrl + Enter で送信、Enter で改行</div></div></div>';
    }
    if(chat){
      var mem = chatMembers(chat);
      html += '<div class="chat-side">'+(chatProject(chat)?'<a class="goproj" href="#" data-open-project="'+esc(chatProject(chat).id)+'">'+iDoc()+' 案件詳細へ</a>':'<div style="height:12px"></div>')+
        '<h3 style="padding-left:12px;display:flex;justify-content:space-between;align-items:center;padding-right:12px">メンバー<button class="btn sm outline" id="chat-edit">'+iEdit()+' チャットを編集</button></h3><div class="mlist">'+
        (mem.length ? mem.map(function(m){
          return '<div class="mi"><div class="cav" style="background:'+avaColor(m.name)+'">'+esc(initials(m.name))+'</div><div><div class="mn">'+esc(m.name)+'</div><div class="ms" style="color:'+((chat.reads||{})[m.name]?'var(--ink-faint)':'var(--danger)')+'">'+((chat.reads||{})[m.name]?'最終確認 '+esc(fmtDateTime(chat.reads[m.name])):(m.name===state.myName?'':'まだ開いていません'))+'</div><div class="ms">'+esc(m.company||"")+(m.division?'<br>'+esc(m.division):'')+((m.roles||[]).length?'<br>'+esc(m.roles.join(",")):'')+'</div></div></div>';
        }).join("") : '<div style="padding:16px;font-size:12px;color:var(--ink-faint)">メンバーが登録されていません</div>')+
        '</div><button class="chat-del" data-chat-hide="'+esc(chat.id)+'" style="margin-bottom:0">'+iEye(!isHidden(chat))+' '+(isHidden(chat)?'チャットを再表示する':'チャットを非表示にする')+'</button><button class="chat-del" id="chat-del">'+iTrash()+' チャットを削除する</button></div>';
    }
    html += '</div></div>';
    if(chat && !state.chatMsgs[chat.id]) loadChatMsgs(chat.id);
    else if(chat) setTimeout(function(){ markChatRead(chat, state.chatMsgs[chat.id]); }, 300);
    return html;
  }
  function loadChatMsgs(chatId){
    if(!db){ state.chatMsgs[chatId] = (SAMPLE_MSGS[chatId] || []).map(function(m){ return m.id ? m : Object.assign({id:uid()}, m); }); render(); return; }
    db.collection("chats").doc(chatId).collection("messages").orderBy("ts").limit(200).onSnapshot(function(snap){
      state.chatMsgs[chatId] = snap.docs.map(toObj);
      if(state.activeChat===chatId) render();
    }, function(){});
  }
  function scrollChatToBottom(){
    var el = document.getElementById("chat-msgs");
    if(el) el.scrollTop = el.scrollHeight;
  }
  function ensureProjectChat(project, cb){
    var existing = state.chats.find(function(c){return c.projectId===project.id;});
    if(existing){ cb(existing.id); return; }
    var data = {name:project.name, kind:"project", projectId:project.id, updatedAt:new Date().toISOString()};
    if(!db){ data.id=uid(); state.chats.unshift(data); cb(data.id); return; }
    db.collection("chats").add(data).then(function(ref){ cb(ref.id); }).catch(function(){ toast("チャットの作成に失敗しました"); });
  }

  /* ============ SETTINGS ============ */
  // 設定 has three sections: 会社情報 (everyone can view, admins edit),
  // 個人情報 (each person edits only their own record), and 管理画面
  // (admins only: stats, permission/password management, backup).
  function settingsSections(){
    var s = state.isAdmin ? [["company","会社情報"],["personal","個人情報"]] : [["personal","個人情報"]];   // 会社情報は管理者のみ
    if(state.isAdmin){ s.push(["admin","管理画面"]); s.push(["loginlog","ログイン履歴"]); s.push(["master","マスタ管理"]); s.push(["trash","ゴミ箱"]); }
    if(worksAvailable()) s.push(["works","LINE WORKS"]);
    if(state.isAdmin){ s.push(["freee","freee連携"]); s.push(["backup","バックアップ"]); }
    return s;
  }
  function myMember(){
    if(!state.myName) return null;
    return state.members.find(function(m){ return m.name===state.myName; }) || null;
  }
  function renderSettings(){
    var sections = settingsSections();
    // 「個人情報」は設定のタブには出さず、画面右上の名前から開く
    var tabs = sections.filter(function(x){ return x[0]!=="personal"; });
    if(state.settingsSeg==="personal" && !state.personalOpen && tabs.length) state.settingsSeg = tabs[0][0];
    if(!sections.some(function(x){return x[0]===state.settingsSeg;})) state.settingsSeg = sections[0][0];
    if(state.settingsSeg!=="admin") state.navDraft = null;
    var html = '<h1 class="pagetitle">'+(state.settingsSeg==="personal"?"個人情報":"設定")+'</h1><div style="height:14px"></div>';
    if(tabs.length && state.settingsSeg!=="personal") html += '<div class="segmented" style="margin-bottom:16px">'+tabs.map(function(x){
      return '<div class="segopt'+(state.settingsSeg===x[0]?" active":"")+'" data-setseg="'+x[0]+'">'+((x[0]==="company"||x[0]==="admin"||x[0]==="loginlog"||x[0]==="freee"||x[0]==="master"||x[0]==="trash"||x[0]==="backup")?iAdmin():'')+x[1]+'</div>';
    }).join("")+'</div>';
    if(state.settingsSeg==="personal") html += renderSettingsPersonal();
    else if(state.settingsSeg==="admin") html += renderSettingsAdmin();
    else if(state.settingsSeg==="loginlog") html += renderSettingsLoginLog();
    else if(state.settingsSeg==="freee") html += renderSettingsFreee();
    else if(state.settingsSeg==="works") html += renderSettingsWorks();
    else if(state.settingsSeg==="master") html += renderSettingsMaster();
    else if(state.settingsSeg==="trash") html += renderSettingsTrash();
    else if(state.settingsSeg==="backup") html += renderSettingsBackup();
    else html += renderSettingsCompany();
    return html;
  }

  // ---- マスタ管理 ---------------------------------------------------------
  // 選択肢（案件種類・職種・物件種類・物件構造）を管理者が編集できる。
  // 元の配列を“その場で”書き換えるので、画面側のコードは変更不要。保存先: settings/master
  var REPORT_TYPES = ["作業報告書","日報","進捗報告書","完了報告書","是正・指摘事項報告書"];
  var MASTERS = [
    {key:"statuses", label:"案件進捗", arr:STATUS_LIST, note:"案件の進捗（一覧の絞り込み・登録画面）に出ます。契約済・施工中・施工完了・清算済・失注は集計に使うため削除できません。色は自動で付きます"},
    {key:"projectTypes", label:"案件種類", arr:PROJECT_TYPES, note:"案件の登録・編集の「案件種類」に出ます"},
    {key:"divisions", label:"事業部", arr:DIVISIONS, note:"自社メンバーの「事業部」に出ます"},
    {key:"roles", label:"職種", arr:ROLES, note:"メンバーの「職種」に出ます"},
    {key:"propertyTypes", label:"物件種類", arr:PROPERTY_TYPES, note:"物件情報の「物件種類」に出ます"},
    {key:"propertyStructures", label:"物件構造", arr:PROPERTY_STRUCTURES, note:"物件情報の「構造」に出ます"},
    {key:"stepNames", label:"工程名", arr:STEP_NAMES, note:"工程表の「工程を追加」で選ぶ工程名に出ます"},
    {key:"eventTypes", label:"予定の種類", arr:EVENT_TYPES, note:"カレンダーの「予定を追加」で選ぶ種類に出ます"},
    {key:"reportTypes", label:"報告書の種類", arr:REPORT_TYPES, note:"報告書の「報告書を作成」で選ぶ種類と、一覧の絞り込みに出ます"}
  ];
  // 画面ごとのタブ
  var MASTER_TABS = [
    ["project","案件",["statuses","projectTypes"]],
    ["property","物件情報",["propertyTypes","propertyStructures"]],
    ["member","メンバー",["divisions","roles"]],
    ["schedule","工程表",["stepNames"]],
    ["calendar","カレンダー",["eventTypes"]],
    ["reports","報告書",["reportTypes"]]
  ];
  var MASTER_DEFAULTS = {};
  MASTERS.forEach(function(m){ MASTER_DEFAULTS[m.key] = m.arr.slice(); });
  function applyMasters(d){
    var rolesDefault = MASTER_DEFAULTS.roles || [];
    MASTERS.forEach(function(m){
      if(d && Array.isArray(d[m.key]) && d[m.key].length){
        var list = d[m.key].slice();

  var MASTER_FIELDS = {

  function masterAffected(key, removed){
    var out = [];
    (MASTER_FIELDS[key]||[]).forEach(function(cf){
      var col = cf[0], fld = cf[1], rows = col==="projects" ? rawStore.projects : state[col];
      rows.forEach(function(r){
        if(fld==="roles"){
          var cur = r.roles||[]; var next = cur.filter(function(x){ return removed.indexOf(x)===-1; });
          if(next.length!==cur.length){ out.push({col:col,id:r.id,data:{roles:next}}); }
        }else if(removed.indexOf(r[fld])!==-1){ var d2={}; d2[fld]=""; out.push({col:col,id:r.id,data:d2}); }
      });
    });
    return out;
  }
  function saveMaster(key, list, msg, confirmed){
    var m = MASTERS.find(function(x){return x.key===key;});
    if(!state.isAdmin){ toast("マスタの変更は管理者のみ行えます"); return; }
    var removed = m.arr.filter(function(n){ return list.indexOf(n)===-1; });
    var affected = masterAffected(key, removed);
    var payload = {}; MASTERS.forEach(function(x){ payload[x.key] = x.key===key ? list : x.arr.slice(); });
    payload.updatedAt = new Date().toISOString();
    payload.rolesMerged = 1;
    var run = function(){
      var finish = function(){
        m.arr.length = 0; Array.prototype.push.apply(m.arr, list);
        if(key==="statuses") syncStatusFilters();
        toast(msg + (affected.length ? "（"+affected.length+"件のデータを「未入力」に変更しました）" : "")); render();
      };
      var writes = affected.map(function(a){ return saveRaw(a.col, a.id, a.data); });
      var saveDoc = db ? db.doc("settings/master").set(payload) : Promise.resolve();
      Promise.all(writes.concat([saveDoc])).then(finish).catch(function(){ toast("保存に失敗しました"); });
    };
    if(affected.length && !confirmed){
      confirmDelete("「"+removed.filter(function(n){ return masterAffected(key,[n]).length; }).join("」「")+"」を削除します。使用中の登録済みデータ "+affected.length+"件 は「未入力」に変わります。", run);
    }else run();
  }

  function loginLogsLoad(force){
    var L = state.loginLogs = state.loginLogs || {list:null, loading:false, name:"all", kind:"all", days:"30"};
    if(L.loading || (L.list && !force)) return;
    if(!db){ L.list = localLoginLogs.slice(); return; }
    L.loading = true; L.error = false;
    var finished = false;
    var done = function(list, err){
      if(finished) return; finished = true;
      L.loading = false; L.error = !!err; if(list) L.list = list; else if(!L.list) L.list = [];
      if(state.tab==="settings" && state.settingsSeg==="loginlog") render();
    };
    var timer = setTimeout(function(){ done(null, true); }, 15000);
    try{
      var q = db.collection("loginLogs");
      try{ q = q.orderBy("at","desc").limit(1000); }catch(e){}
      var p;
      if(typeof q.get==="function") p = q.get();
      else p = new Promise(function(res, rej){   // get() が無い接続方式では onSnapshot を1回だけ使う
        var un = null, got = false;
        un = q.onSnapshot(function(snap){ if(got) return; got = true; try{ un&&un(); }catch(e){} res(snap); }, rej);
        if(got && un){ try{ un(); }catch(e){} }
      });
      p.then(function(snap){ clearTimeout(timer); done(snap.docs.map(toObj), false); },
             function(){ clearTimeout(timer); done(null, true); });
    }catch(e){ clearTimeout(timer); done(null, true); }
  }

  // サーバー（Firestore等）の容量の目安：読み込み済みデータからの概算
  var STORAGE_COLS = [["projects","案件"],["customers","顧客"],["members","メンバー"],["tasks","タスク"],["chats","チャット（一覧）"],["files","写真・ファイル"],["reports","報告書"],["events","予定"],["steps","工程"],["folders","フォルダ"],["trash","ゴミ箱"]];
  function fmtBytes(n){ n = Number(n)||0; if(n<1024) return n+" B"; if(n<1048576) return (n/1024).toFixed(1)+" KB"; if(n<1073741824) return (n/1048576).toFixed(1)+" MB"; return (n/1073741824).toFixed(2)+" GB"; }
  function storageStats(){
    var key = STORAGE_COLS.map(function(c){ return (state[c[0]]||[]).length; }).join(",");
    var now = Date.now(), cache = state.storageCache;
    if(cache && cache.key===key && now-cache.at<15000) return cache.rows;
    var enc = (typeof TextEncoder!=="undefined") ? new TextEncoder() : null;
    var rows = STORAGE_COLS.map(function(c){
      var arr = state[c[0]]||[], bytes = 0; if(!arr.length) return {key:c[0], label:c[1], count:0, bytes:0};
      try{ var str = JSON.stringify(arr); bytes = enc ? enc.encode(str).length : str.length*2; }catch(e){}
      return {key:c[0], label:c[1], count:arr.length, bytes:bytes};
    });
    state.storageCache = {key:key, at:now, rows:rows};
    return rows;
  }
  function loadAssetUsage(){
    if(!assetsCap || state.assetUsageLoading || state.assetUsage) return;
    state.assetUsageLoading = true;
    Promise.resolve().then(function(){ return assetsCap.list(); }).then(function(r){ state.assetUsage = r && r.usage || null; }, function(){ state.assetUsage = {error:true}; })
      .then(function(){ state.assetUsageLoading = false; if(state.tab==="settings" && state.settingsSeg==="admin") render(); });
  }
  function renderStorageCard(){
    var rows = storageStats();
    var totalB = rows.reduce(function(a,r){ return a+r.bytes; },0), totalN = rows.reduce(function(a,r){ return a+r.count; },0);
    var LIMIT = 1073741824, pct = Math.min(100, totalB/LIMIT*100);
    var loads = totalN ? Math.floor(50000/totalN) : 0;
    var barColor = pct>80 ? "var(--danger)" : (pct>50 ? "var(--warning)" : "var(--accent)");
    var h = '<h2 style="font-size:13.5px;margin:4px 0 10px">サーバーの容量</h2><div class="card" style="padding:16px 18px;margin-bottom:18px;max-width:760px">';
    h += '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap"><div><span class="num" style="font-size:22px;font-weight:700">'+fmtBytes(totalB)+'</span> <span style="font-size:12px;color:var(--ink-soft)">／ 無料枠 1 GB（'+pct.toFixed(2)+'%）</span></div><div style="font-size:12px;color:var(--ink-soft)">データ件数 <b>'+totalN.toLocaleString()+'</b> 件</div></div>';
    h += '<div style="height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:10px 0 12px"><div style="height:100%;width:'+Math.max(pct,0.5)+'%;background:'+barColor+'"></div></div>';
    h += '<div class="tablewrap"><table><thead><tr><th>項目</th><th>件数</th><th>容量（概算）</th></tr></thead><tbody>'+
      rows.map(function(r){ return '<tr><td>'+esc(r.label)+'</td><td class="num" data-label="件数">'+r.count.toLocaleString()+'</td><td class="num" data-label="容量">'+fmtBytes(r.bytes)+'</td></tr>'; }).join("")+'</tbody></table></div>';
    h += '<div style="margin-top:12px;font-size:12.5px;line-height:1.8;color:var(--ink-soft)"><b>読み取り回数の目安：</b>アプリを開くたびに約 <b>'+totalN.toLocaleString()+'</b> 件を読み取ります。Firestoreの無料枠は1日5万件なので、'+(loads?'1日あたり約 <b>'+loads+'</b> 回の読み込みまでが目安です（全員の合計）。':'十分に余裕があります。')+'</div>';
    if(assetsCap){
      loadAssetUsage();
      var u = state.assetUsage;
      h += '<div style="margin-top:8px;font-size:12.5px;color:var(--ink-soft)"><b>アップロードしたファイル（プレビュー版）：</b>'+(u && !u.error ? fmtBytes(u.bytes)+' ／ '+fmtBytes(u.maxBytes)+'（'+u.files+' / '+u.maxFiles+' 件）' : (u && u.error ? '取得できませんでした' : '取得中…'))+'</div>';
    }
    h += '<div style="margin-top:8px;font-size:11px;color:var(--ink-faint);line-height:1.7">※読み込み済みのデータから計算した概算です。チャットの会話本文やGoogle側の保存分は含みません。正確な使用量は Firebase コンソールの「Usage」で確認できます。</div></div>';
    return h;
  }

  // この画面は「管理者の氏名＋パスワード」を毎回サーバーへ送って本人確認します。
  var FREEE_API = "/api/freee";

  var FREEE_DEAL_STATUSES = ["契約済","施工中","施工完了","清算済"];   // 売上として取引登録する進捗

  function freeeCall(action, extra){
    var me = myMember();
    if(!me){ return Promise.reject(new Error("ログイン情報を確認できません")); }
    return fetch(FREEE_API, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({auth:{name:me.name, password:me.password||""}, action:action}, extra||{}))})
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if(!r.ok) throw new Error(j.error || ("サーバーエラー（"+r.status+"）")); return j; }); });
  }

      .then(function(){ state.freee.loading = false; if(state.tab==="settings" && state.settingsSeg==="freee") render(); });

  function freeeBusy(msg){ state.freee.busy = !!msg; if(msg) toast(msg); }
  // 100件単位の処理を、進捗を出しながら順に実行する
  function freeeChunks(items, size, fn, label){
    var done = 0, ok = 0, fail = [], i = 0;
    var next = function(){
      if(i>=items.length) return Promise.resolve();
      var part = items.slice(i, i+size); i += size;
      return fn(part).then(function(r){ ok += r.ok; fail = fail.concat(r.fail); done += part.length; toast(label+"… "+done+" / "+items.length); }).then(next);
    };
    return next().then(function(){ return {ok:ok, fail:fail}; });
  }
  function freeeReport(label, r){
    state.freee.busy = false;
    var msg = r.ok+"件を"+label+"しました";
    if(r.fail.length){ msg += "（"+r.fail.length+"件は失敗）"; }
    toast(msg);
    if(r.fail.length){
      openModal(label+"できなかった項目", '<div style="font-size:12.5px;line-height:1.7;max-height:50vh;overflow:auto">'+r.fail.slice(0,50).map(function(f){ return '<div>'+esc(f.name)+'：<span style="color:var(--danger)">'+esc(f.msg)+'</span></div>'; }).join("")+(r.fail.length>50?'<div>…ほか'+(r.fail.length-50)+'件</div>':'')+'</div>', '<button class="btn" data-close-modal>閉じる</button>');
    }
    render();
  }
  // freeeの取引先 → このアプリの顧客（新規追加／同名の既存顧客に紐づけ）
  function freeeImportPartners(){

    openModal("freeeの取引先を取り込む", '<label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.6;cursor:pointer"><input type="checkbox" id="fr-onlyq" checked style="margin-top:4px"><span>見積書の作成履歴がある取引先だけに絞り込む<span style="display:block;font-size:11.5px;color:var(--ink-faint)">freeeで見積書を作成したことのある取引先だけを一覧に出します。外すとすべての取引先が対象です。</span></span></label>',
      '<button class="btn" data-close-modal>キャンセル</button><button class="btn primary" id="fr-onlyq-go">取引先を取得する</button>');

  function freeeImportRun(onlyQuoted){
    state.freee.busy = true; toast(onlyQuoted ? "freeeの見積書履歴を確認中…" : "freeeから取引先を取得中…");
    freeeCall("partners.list", {onlyQuoted: !!onlyQuoted}).then(function(j){
      state.freee.busy = false;
      var nz = function(x){ return String(x||"").normalize("NFKC").replace(/[\s\u3000]/g,"").toLowerCase(); };
      var linkedIds = {}; state.customers.forEach(function(c){ if(c.freeePartnerId) linkedIds[c.freeePartnerId] = 1; });
      var unlinked = {}; state.customers.forEach(function(c){ if(!c.freeePartnerId && c.name) unlinked[nz(c.name)] = c; });
      var cands = (j.partners||[]).filter(function(p){ return !linkedIds[p.id]; }).map(function(p){
        var m = unlinked[nz(p.name)] || null;
        return {p:p, match:m};
      });
      if(!cands.length){ toast(j.quotedOnly ? "見積書の作成履歴があり、まだ取り込んでいない取引先はありません" : "取り込む取引先はありません（freee側 "+(j.total||0)+"件、すべて取り込み済みです）"); return; }
      var byId = {}; cands.forEach(function(x){ byId[x.p.id] = x; });
      freeePicker("freeeの取引先を取り込む", (j.quotedOnly?"見積書の作成履歴がある取引先のうち、":"freeeにある取引先のうち、")+"まだこのアプリに紐づいていないものです。選んだものを顧客として追加します。",
        cands.map(function(x){ return {id:String(x.p.id), label:x.p.name, sub:(x.match?"既存の顧客「"+x.match.name+"」に紐づけ":"新規の顧客として追加")+(x.p.phone?"　"+x.p.phone:"")+(x.p.quoteCount?"　見積書 "+x.p.quoteCount+"件"+(x.p.lastQuote?"（最新 "+x.p.lastQuote+"）":""):"")}; }),
        "取り込む", function(ids){
          state.freee.busy = true; var ok = 0, linked = 0, filledN = 0;
          var jobs = ids.map(function(id){
            var x = byId[id]; if(!x) return Promise.resolve();
            if(x.match){ linked++; var f3 = freeeFillBlanks(x.match, {kana:x.p.kana, email:x.p.email, phone:x.p.phone, zipcode:x.p.zipcode, prefectureCode:x.p.prefectureCode, street1:x.p.street1, street2:x.p.street2}); if(Object.keys(f3).length) filledN++; return saveRaw("customers", x.match.id, Object.assign({freeePartnerId:x.p.id}, f3)); }
            var pr = x.p.prefectureCode!=="" ? PREFS[Number(x.p.prefectureCode)] : "";
            ok++;
            return saveRaw("customers", null, {name:x.p.name, kana:x.p.kana||"", email:x.p.email||"", phone:x.p.phone||"", postalCode:x.p.zipcode||"",
              prefecture:pr||"未選択", address:x.p.street1||"", building:x.p.street2||"", region:"国内", registeredDate:todayISO(), freeePartnerId:x.p.id});
          });
          Promise.all(jobs).then(function(){ state.freee.busy = false; toast(ok+"件を顧客に追加"+(linked?"、"+linked+"件を既存の顧客に紐づけ":"")+"しました"+(filledN?"（うち"+filledN+"件はfreeeの情報で空欄を補いました）":"")); render(); },
            function(){ state.freee.busy = false; toast("取り込みに失敗しました"); render(); });
        });
    }, function(e){ state.freee.busy = false; toast("取得できませんでした："+e.message); });
  }
  function freeePushCustomers(){
    var all = freeeCustomersToPush();
    freeePicker("取引先として登録する顧客", "freee会計に登録する顧客を選んでください。freeeにすでにある取引先と名前が近い場合は、次の画面で確認します。",
      all.map(function(c){ return {id:c.id, label:c.name, sub:[customerPostal(c), (c.prefecture||"")+(c.address||"")+(c.building?" "+c.building:""), c.phone].filter(Boolean).join("　")}; }),
      "次へ（名前の確認）", function(ids){
      var list = all.filter(function(c){ return ids.indexOf(c.id)!==-1; });
      state.freee.busy = true; toast("freeeの取引先と照合中…");
      freeeCall("partners.check", {customers: list.map(function(c){ return {id:c.id, name:c.name}; })}).then(function(j){
        state.freee.busy = false;

        var ask = list.filter(function(c){ return cands[c.id]; });
        if(!ask.length){ freeeRunCustomers(list, {}); return; }
        freeeResolveNames(list, ask, cands);
      }, function(e){ state.freee.busy = false; toast("照合できませんでした："+e.message); });

  // 名前が近い取引先が見つかった顧客ごとに、紐づける／新規登録／今回は登録しない を選ばせる
  function freeeResolveNames(list, ask, cands){
    var rows = ask.map(function(c){
      var cs = cands[c.id], exact = cs.some(function(x){ return x.exact; });
      var radios = cs.map(function(x, i){

      }).join("");
      return '<div style="padding:10px 4px;border-bottom:1px solid var(--border)"><div style="font-size:12.5px;margin-bottom:2px">アプリの顧客：<b>'+esc(c.name)+'</b></div><div style="font-size:11px;color:var(--ink-faint);margin-bottom:4px">'+esc([(c.prefecture||"")+(c.address||""), c.phone].filter(Boolean).join("　"))+'</div>'+radios+
        '<label style="display:flex;gap:8px;align-items:center;margin:4px 0;font-size:12.5px;cursor:pointer"><input type="radio" name="frn-'+esc(c.id)+'" value="new">別の取引先として新規登録する</label>'+
        '<label style="display:flex;gap:8px;align-items:center;margin:4px 0;font-size:12.5px;cursor:pointer"><input type="radio" name="frn-'+esc(c.id)+'" value="skip">今回は登録しない</label></div>';
    }).join("");
    var rest = list.length - ask.length;
    openModal("名前が近い取引先があります", '<div style="font-size:12.5px;line-height:1.7;margin-bottom:6px">freeeにすでにある取引先と、名前が同じか近い顧客が'+ask.length+'件あります。同じ相手なら「紐づける」を選ぶと、二重登録を防げます。'+(rest?'（ほかの'+rest+'件は近い名前がないため、そのまま新規登録します）':'')+'</div><div style="max-height:52vh;overflow:auto;border-top:1px solid var(--border)">'+rows+'</div>',
      '<button class="btn" data-close-modal>キャンセル</button><button class="btn primary" id="frn-run" disabled>この内容で登録する</button>');
    var box = document.getElementById("modal-box");
    var refresh = function(){ var ok = ask.every(function(c){ return box.querySelector('input[name="frn-'+c.id+'"]:checked'); }); document.getElementById("frn-run").disabled = !ok; };
    box.querySelectorAll("input[type=radio]").forEach(function(r){ r.addEventListener("change", refresh); });
    refresh();
    document.getElementById("frn-run").onclick = function(){
      var dec = {};
      ask.forEach(function(c){ dec[c.id] = box.querySelector('input[name="frn-'+c.id+'"]:checked').value; });
      closeModal(); freeeRunCustomers(list, dec);
    };
  }
  // freeeの取引先情報のうち、アプリの顧客で空欄の項目だけを補う（入力済みの項目は上書きしない）
  var freeeInfoCache = {};
  function freeeFillBlanks(c, info){
    var o = {}; if(!info) return o;
    var blank = function(v){ return v==null || v==="" || v==="未選択"; };
    if(blank(c.kana) && info.kana) o.kana = info.kana;
    if(blank(c.email) && info.email) o.email = info.email;
    if(blank(c.phone) && info.phone) o.phone = info.phone;
    if(blank(customerPostal(c)) && info.zipcode) o.postalCode = info.zipcode;
    if(blank(c.prefecture) && info.prefectureCode!=="" && PREFS[Number(info.prefectureCode)]) o.prefecture = PREFS[Number(info.prefectureCode)];
    if(blank(c.address) && info.street1) o.address = info.street1;
    if(blank(c.building) && info.street2) o.building = info.street2;
    return o;
  }
  var FREEE_FILL_LABEL = {kana:"ふりがな", email:"メール", phone:"電話番号", postalCode:"郵便番号", prefecture:"都道府県", address:"住所", building:"建物名"};
  // dec[id]: "link:<freeeのID>" | "new" | "skip"（未指定は新規登録）
  function freeeRunCustomers(list, dec){
    var links = list.filter(function(c){ return /^link:/.test(dec[c.id]||""); });
    var creates = list.filter(function(c){ return !dec[c.id] || dec[c.id]==="new"; });
    state.freee.busy = true; var filled = 0;
    var linked = Promise.all(links.map(function(c){ var pid = Number(dec[c.id].slice(5)), fill = freeeFillBlanks(c, freeeInfoCache[pid]); filled += Object.keys(fill).length?1:0; return saveRaw("customers", c.id, Object.assign({freeePartnerId:pid}, fill)); }));
    linked.then(function(){
      return freeeChunks(creates, 20, function(part){
        return freeeCall("partners.push", {customers: part.map(function(c){
          var pi = PREFS.indexOf(c.prefecture);
          return {id:c.id, name:c.name, kana:c.kana, email:c.email, phone:c.phone, postalCode:customerPostal(c), prefectureCode: pi>=0?pi:"", street1:c.address, street2:c.building, force:true};
        })}).then(function(j){
          var ok = 0, fail = [], jobs = [];
          (j.results||[]).forEach(function(x){
            var c = part.find(function(y){ return y.id===x.id; });
            if(x.error){ fail.push({name:c?c.name:x.id, msg:x.error}); return; }
            ok++; var fill2 = x.status==="linked" ? freeeFillBlanks(c||{}, x.info) : {}; if(Object.keys(fill2).length) filled++;
            jobs.push(saveRaw("customers", x.id, Object.assign({freeePartnerId:x.partnerId}, fill2)));
          });
          return Promise.all(jobs).then(function(){ return {ok:ok, fail:fail}; });
        });
      }, "取引先を登録中");
    }).then(function(r){
      r.ok += links.length;
      var skipped = list.filter(function(c){ return dec[c.id]==="skip"; }).length;
      freeeReport("登録", r);
      if(skipped) setTimeout(function(){ toast("（"+skipped+"件は登録せず、そのままにしました）"); }, 2500);
      else if(filled) setTimeout(function(){ toast("freeeにあった情報を"+filled+"件の顧客に反映しました（空欄の項目のみ）"); }, 2500);
    }, function(e){ state.freee.busy = false; toast("失敗しました："+e.message); render(); });
  }
  function freeePushDeals(){
    var all = freeeProjectsToPush(), s = freeeSet();
    var partnerOf = function(p){ var c = state.customers.find(function(x){ return x.id===p.customerId; }); return c && c.freeePartnerId; };
    var noPartner = all.filter(function(p){ return !partnerOf(p); }).length;
    freeePicker("売上取引として登録する案件", "freee会計に、未決済の収入取引として登録する案件を選んでください。"+(noPartner?"「取引先未連携」の"+noPartner+"件は、取引先なしで登録されます（先に取引先を登録することをおすすめします）。":"")+"登録後はfreee側で内容を確認してください。",
      all.map(function(p){ return {id:p.id, label:p.name, sub:[p.status, (p.startDate||(p.createdAt||"").slice(0,10))+"発生", p.customerName||"顧客なし", partnerOf(p)?"":"取引先未連携"].filter(Boolean).join("　"), right:fmtYen(p.amount)}; }),
      "選択した案件を登録する", function(ids){
      var list = all.filter(function(p){ return ids.indexOf(p.id)!==-1; });
      state.freee.busy = true;
      freeeChunks(list, 20, function(part){
        return freeeCall("deals.push", {settings:{accountItemId:s.accountItemId, taxCode:s.taxCode}, projects: part.map(function(p){
          var c = state.customers.find(function(x){ return x.id===p.customerId; });
          return {id:p.id, name:p.name, amount:p.amount, issueDate:p.startDate||(p.createdAt||"").slice(0,10)||todayISO(), dueDate:p.endDate||"", partnerId:c&&c.freeePartnerId||"", ref:""};
        })}).then(function(j){
          var ok = 0, fail = [], jobs = [];
          (j.results||[]).forEach(function(x){
            var p = part.find(function(y){ return y.id===x.id; });
            if(x.error){ fail.push({name:p?p.name:x.id, msg:x.error}); return; }
            ok++; jobs.push(saveRaw("projects", x.id, {freeeDealId:x.dealId, freeeStatus:"unsettled", freeeSyncedAt:new Date().toISOString()}));
          });
          return Promise.all(jobs).then(function(){ return {ok:ok, fail:fail}; });
        });
      }, "売上取引を登録中").then(function(r){ freeeReport("登録", r); }, function(e){ state.freee.busy = false; toast("失敗しました："+e.message); render(); });
    });
  }
  function freeeSyncStatus(){
    var list = freeeProjectsToCheck();
    state.freee.busy = true;
    freeeChunks(list, 30, function(part){
      return freeeCall("deals.status", {deals: part.map(function(p){ return {id:p.id, dealId:p.freeeDealId}; })}).then(function(j){
        var ok = 0, fail = [], jobs = [];
        (j.results||[]).forEach(function(x){
          var p = part.find(function(y){ return y.id===x.id; });
          if(x.error){ fail.push({name:p?p.name:x.id, msg:x.error}); return; }
          ok++; jobs.push(saveRaw("projects", x.id, {freeeStatus:x.status, freeeDue:x.dueAmount||0, freeeSyncedAt:new Date().toISOString()}));
        });
        return Promise.all(jobs).then(function(){ return {ok:ok, fail:fail}; });
      });
    }, "入金状況を取得中").then(function(r){ freeeReport("更新", r); }, function(e){ state.freee.busy = false; toast("失敗しました："+e.message); render(); });
  }
  // 登録前に対象の一覧を出し、チェックを付けたものだけを実行する
  function freeePicker(title, intro, items, runLabel, onRun){
    if(state.freee.busy){ toast("処理中です。完了までお待ちください"); return; }
    var rows = items.map(function(it){
      return '<label style="display:flex;gap:10px;align-items:flex-start;padding:9px 4px;border-bottom:1px solid var(--border);margin:0;cursor:pointer"><input type="checkbox" data-fr-pick="'+esc(it.id)+'" checked style="margin-top:3px">'+
        '<span style="flex:1;min-width:0"><span style="display:block;font-weight:700;font-size:12.5px;word-break:break-all">'+esc(it.label)+'</span>'+(it.sub?'<span style="display:block;font-size:11px;color:var(--ink-faint);line-height:1.5">'+esc(it.sub)+'</span>':'')+'</span>'+
        (it.right?'<span class="num" style="font-size:12px;white-space:nowrap">'+esc(it.right)+'</span>':'')+'</label>';
    }).join("");
    openModal(title, '<div style="font-size:12.5px;line-height:1.7;margin-bottom:8px">'+esc(intro)+'</div>'+
      '<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><button class="btn sm" id="fr-pick-all">すべて選択</button><button class="btn sm" id="fr-pick-none">すべて解除</button><span id="fr-pick-count" style="font-size:12px;margin-left:auto"></span></div>'+
      '<div id="fr-pick-list" style="max-height:48vh;overflow:auto;border-top:1px solid var(--border)">'+rows+'</div>',
      '<button class="btn" data-close-modal>キャンセル</button><button class="btn primary" id="fr-pick-run">'+esc(runLabel)+'</button>');
    var box = document.getElementById("modal-box");
    var checks = function(){ return Array.prototype.slice.call(box.querySelectorAll("input[data-fr-pick]")); };
    var refresh = function(){ var n = checks().filter(function(c){ return c.checked; }).length; document.getElementById("fr-pick-count").textContent = n+" / "+items.length+"件を選択中"; document.getElementById("fr-pick-run").disabled = n===0; };
    checks().forEach(function(c){ c.addEventListener("change", refresh); });
    document.getElementById("fr-pick-all").onclick = function(){ checks().forEach(function(c){ c.checked = true; }); refresh(); };
    document.getElementById("fr-pick-none").onclick = function(){ checks().forEach(function(c){ c.checked = false; }); refresh(); };
    document.getElementById("fr-pick-run").onclick = function(){
      var ids = checks().filter(function(c){ return c.checked; }).map(function(c){ return c.getAttribute("data-fr-pick"); });
      if(!ids.length) return;
      closeModal(); onRun(ids);
    };
    refresh();
  }

    openModal(title, '<div style="font-size:13px;line-height:1.7">'+esc(msg)+'</div>', '<button class="btn" data-close-modal>キャンセル</button><button class="btn primary" id="fr-yes">実行する</button>');

  function bindFreeeEvents(c){
    var on = function(id, fn){ var el = document.getElementById(id); if(el) el.addEventListener("click", function(){ if(!state.isAdmin){ toast("管理者のみ行えます"); return; } fn(el); }); };
    on("fr-reload", function(){ state.freee.error = ""; freeeLoadStatus(true); render(); });
    on("fr-connect", function(){
      freeeCall("connect").then(function(j){ if(j.url) location.href = j.url; }, function(e){ toast("開始できませんでした："+e.message); });
    });
    on("fr-disconnect", function(){
      freeeConfirm("連携の解除", "freeeとの連携を解除します（freee側のデータは消えません）。よろしいですか？", function(){
        freeeCall("disconnect").then(function(){ state.freee.status = null; state.freee.master = null; toast("連携を解除しました"); render(); }, function(e){ toast("失敗しました："+e.message); });
      });
    });
    on("fr-master", function(){
      freeeCall("master").then(function(j){ state.freee.master = j; toast("freeeから選択肢を読み込みました"); render(); }, function(e){ toast("読み込めませんでした："+e.message); });
    });
    on("fr-save", function(){
      var acc = document.getElementById("fr-acc").value, tax = document.getElementById("fr-tax").value;
      if(!acc || tax===""){ toast("勘定科目と税区分を選択してください"); return; }
      var m = state.freee.master, accO = m && m.accountItems.find(function(x){ return String(x.id)===acc; }), taxO = m && m.taxes.find(function(x){ return String(x.code)===tax; });
      var prev = freeeSet();
      var data = {accountItemId:Number(acc), accountItemName: accO?accO.name:(String(prev.accountItemId)===acc?prev.accountItemName:""), taxCode:Number(tax), taxName: taxO?taxO.name:(String(prev.taxCode)===tax?prev.taxName:""), updatedAt:new Date().toISOString()};
      db.doc("settings/freee").set(data).then(function(){ state.freee.settings = data; toast("設定を保存しました"); render(); }).catch(function(){ toast("保存に失敗しました"); });
    });
    on("fr-push-customers", freeePushCustomers);
    on("fr-import-partners", freeeImportPartners);
    on("fr-push-deals", freeePushDeals);
    on("fr-sync-status", freeeSyncStatus);
    on("fr-csv", function(){
      var list = state.projects.filter(function(p){ return p.amount>0 && FREEE_DEAL_STATUSES.indexOf(p.status)!==-1; });
      if(!list.length){ toast("出力する案件がありません"); return; }
      downloadBlob("freee取込用_売上取引_"+todayISO()+".csv", new Blob([freeeCsvBuild(list)], {type:"text/csv"}));
      toast(list.length+"件をCSV出力しました");
    });
  }

  /* ============ LINE WORKS 連携 ============ */
  // 連携はVercel版（/api/works）でのみ動きます。通知先は「Botを追加したグループトークルーム」です。
  // この画面は「ログイン中メンバーの氏名＋パスワード」を毎回サーバーへ送って本人確認します。
  var WORKS_API = "/api/works";
  function worksAvailable(){ return !!db && !window.claude && !state.offlineMode; }
  function worksCall(action, extra){
    var me = myMember();
    if(!me) return Promise.reject(new Error("ログイン情報を確認できません"));
    return fetch(WORKS_API, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({auth:{name:me.name, password:me.password||""}, action:action}, extra||{}))})
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if(!r.ok) throw new Error(j.error || ("サーバーエラー（"+r.status+"）")); return j; }); });
  }
  // 状態を一度だけ取得（連携が有効かどうかの判定にも使う）
  function worksLoadStatus(force){
    var w = state.works;
    if(!worksAvailable() || w.loading || (w.status && !force) || (w.failed && !force) || !myMember()) return Promise.resolve(w.status);
    w.loading = true;
    return worksCall("status").then(function(j){ w.status = j; w.error = ""; w.failed = false; }, function(e){ w.status = null; w.error = e.message; w.failed = true; })
      .then(function(){ w.loading = false; if((state.tab==="settings" && state.settingsSeg==="works") || state.viewingProjectId) render(); return w.status; });
  }
  function worksReady(){ var s = state.works.status; return !!(s && s.configured); }
  // 画面での登録・更新に合わせて、トークルームへ通知する（失敗しても画面の操作は妨げない）
  function worksNotifyAfterWrite(col, id, data, old){
    if(!worksAvailable()) return;
    var ev = "", text = "";
    var proj = function(pid, nm){ return nm || ((state.projects.find(function(x){return x.id===pid;})||{}).name) || ""; };
    if(col==="projects"){
      var name = data.name || (old && old.name) || proj(id);
      if(!old){ ev = "status"; text = "【案件登録】"+name+(data.status?"（"+data.status+"）":""); }
      else if(data.status!==undefined && data.status!==old.status){ ev = "status"; text = "【進捗変更】"+name+"\n"+(old.status||"未入力")+" → "+(data.status||"未入力"); }
    }else if(col==="reports"){
      var prev = old ? (old.status||"下書き") : "";
      if(data.status==="提出済" && prev!=="提出済"){
        ev = "report";
        text = "【報告書】"+(data.type||"")+" "+(data.title||"")+"\n案件: "+(data.projectName||"—")+"　作成者: "+(data.author||"—")+(data.content?"\n"+String(data.content).slice(0,300):"");
      }
    }else if(col==="tasks"){
      if(!old){ ev = "task"; text = "【タスク追加】"+(data.title||"")+"\n期限: "+(data.dueDate||"—")+(data.assignee?"　担当: "+data.assignee:"")+(data.projectName?"\n案件: "+data.projectName:""); }
    }
    if(!ev) return;
    try{ pushEventAfterWrite(col, id, data, old); }catch(e){}
    worksLoadStatus().then(function(st){
      if(st && st.configured) worksCall("notify", {event:ev, text:text}).catch(function(){});
    });
  }
  // スマホ通知（案件・報告書・タスクの新着）。通知を受けるかは各端末の設定（PUSH_KINDS）で選べる。
  function pushEventAfterWrite(col, id, data, old){
    var kind="", title="", body="", names=[];
    var projOf=function(pid, nm){ return state.projects.find(function(x){return x.id===pid;}) || state.projects.find(function(x){return nm && x.name===nm;}) || null; };
    var asg=function(p){ return p ? normalizeAssignees(p.assignees).map(function(a){return a.name;}) : []; };
    if(col==="projects"){
      var nm = data.name || (old && old.name) || ((projOf(id)||{}).name) || "";
      names = normalizeAssignees(data.assignees || (old && old.assignees) || (projOf(id)||{}).assignees).map(function(a){return a.name;});
      if(!old){ kind="projectNew"; title="新しい案件が登録されました"; body=nm+(data.status?"（"+data.status+"）":""); }
      else if(data.status!==undefined && data.status!==old.status){ kind="projectStatus"; title="案件の進捗が変わりました"; body=nm+"：" +(old.status||"未入力")+" → "+(data.status||"未入力"); }
    }else if(col==="reports"){
      var prev = old ? (old.status||"下書き") : "";
      if(data.status==="提出済" && prev!=="提出済"){ kind="report"; title="報告書が提出されました"; body=(data.type||"")+" "+(data.title||"")+"（"+(data.projectName||"—")+"）"; names=asg(projOf(data.projectId, data.projectName)); }
    }else if(col==="tasks"){
      if(!old){ kind="task"; title="タスクが追加されました"; body=(data.title||"")+(data.dueDate?"（期限 "+data.dueDate+"）":""); names=[data.assignee].filter(Boolean); }
    }
    if(!kind) return;
    pushCall("event", {kind:kind, title:title, text:body, names:names}).catch(function(){});
  }

      '<code style="word-break:break-all;font-size:12px;user-select:all">'+esc(st.callbackUrl||"")+'</code></div>'+

          (w.code?'<div style="font-size:26px;font-weight:700;letter-spacing:.2em;padding:6px 0">'+esc(w.code)+'</div>':'')+

  function field(label,inner){ return '<label class="field">'+esc(label)+inner+'</label>'; }
  function selectHtml(id,options,selected){ if(selected && options.indexOf(selected)===-1) options = options.concat([selected]); if(selected==="") options = [""].concat(options); return '<select id="'+id+'">'+options.map(function(o){return '<option value="'+esc(o)+'"'+(o===selected?" selected":"")+'>'+(o===""?"（未入力）":esc(o))+'</option>';}).join("")+'</select>'; }
  function openModal(title,bodyHtml,footHtml){
    document.getElementById("modal-box").innerHTML =
      '<div class="modal-head"><h3>'+esc(title)+'</h3><button class="iconbtn" data-close-modal>'+iX()+'</button></div>'+
      '<div class="modal-body">'+bodyHtml+'</div><div class="modal-foot">'+footHtml+'</div>';

  // Every delete asks for the 削除用パスワード (set by an admin; default 0000).
  function confirmDelete(msg,onYes,opts){
    opts = opts || {};
    openModal(opts.title||"削除の確認",
      '<div style="font-size:13px;line-height:1.6">'+esc(msg)+'</div>'+
      '<label class="field">削除用パスワードを入力してください<input type="password" id="f-del-pw" autocomplete="off" placeholder="削除用パスワード"></label>',
      '<button class="btn" data-close-modal>キャンセル</button><button class="btn primary" style="background:var(--danger);border-color:var(--danger)" id="f-confirm">'+(opts.button||"削除する")+'</button>');
    var pw = document.getElementById("f-del-pw"), btn = document.getElementById("f-confirm");
    var run = function(){
      var typed = pw.value;
      btn.disabled = true;
      // re-read so a password changed by another admin takes effect immediately
      loadDeletePassword(function(current){
        btn.disabled = false;
        if(!typed || typed!==current){ toast("削除用パスワードが正しくありません"); pw.value=""; pw.focus(); return; }
        closeModal(); onYes();
      });
    };
    btn.onclick = run;
    pw.addEventListener("keydown", function(e){ if(e.key==="Enter") run(); });
    pw.focus();
  }

  // 顧客の登録・編集: 基本情報 / 住所 / 担当者
  var CUSTOMER_HONORIFICS = ["未選択","御中","様","殿"];
  function customerPostal(c){
    if(!c) return "";
    if(c.postalCode!=null) return c.postalCode;
    return c.postalCode1 ? c.postalCode1+(c.postalCode2?"-"+c.postalCode2:"") : "";
  }
  // Customer-form field table: [customer key, element id, kind]. "sel" fields
  // store "" for 未選択. Used by the 顧客 modal AND the 案件 form's 顧客情報.
  var CUSTOMER_FORM_FIELDS = [
    ["name","f-cname"],["kana","f-ckana"],["invoiceIssuer","f-cinvoice","sel"],["invoiceNumber","f-cinvno"],
    ["entityType","f-cetype","sel"],["corporateNumber","f-ccorpno"],["notes","f-cnotes"],
    ["region","f-cregion"],["postalCode","f-cpostal"],["prefecture","f-cpref","sel"],["address","f-caddress"],["building","f-cbuilding"],
    ["contactName","f-ccontact"],["contactHonorific","f-ccontacthonor","sel"],["department","f-cdept"],["email","f-cemail"],["phone","f-cphone"]
  ];
  // The same fields as stored on a 案件 (which keeps its own copy of the customer).
  var CUSTOMER_PROJECT_KEYS = {
    name:"customerName", kana:"customerKana", invoiceIssuer:"customerInvoiceIssuer", invoiceNumber:"customerInvoiceNumber",
    entityType:"customerEntityType", corporateNumber:"customerCorporateNumber", notes:"customerNotes",
    region:"customerRegion", postalCode:"postalCode", prefecture:"prefecture", address:"address", building:"building",
    contactName:"customerContactName", contactHonorific:"customerContactHonorific", department:"customerDepartment",
    email:"customerEmail", phone:"customerPhone"
  };
  function projectCustomerSrc(p){
    var o = {};
    Object.keys(CUSTOMER_PROJECT_KEYS).forEach(function(k){ o[k] = p[CUSTOMER_PROJECT_KEYS[k]]; });
    o.postalCode = customerPostal({postalCode:p.postalCode, postalCode1:p.postalCode1, postalCode2:p.postalCode2});
    return o;
  }
  function projectCustomerData(cdata){
    var o = {};
    Object.keys(CUSTOMER_PROJECT_KEYS).forEach(function(k){ o[CUSTOMER_PROJECT_KEYS[k]] = cdata[k]; });
    o.postalCode1 = ""; o.postalCode2 = "";   // superseded by the single postalCode
    return o;

        cf("法人番号", '<div style="display:flex;gap:6px"><input type="text" id="f-ccorpno" placeholder="13桁" maxlength="13" inputmode="numeric" value="'+v("corporateNumber")+'" style="flex:1;min-width:0"><button type="button" class="btn sm" id="f-ccorpno-btn" style="white-space:nowrap">法人情報を呼び出す</button></div><div id="f-ccorpno-msg" style="font-size:11px;color:var(--ink-faint);margin-top:3px">法人番号（13桁）を入れて呼び出すと、名前・住所などを自動入力します（空欄の項目のみ）</div>', false, 2)+
        cf("社内メモ", '<textarea id="f-cnotes" placeholder="例：昼間は仕事のため連絡NG" style="min-height:70px">'+v("notes")+'</textarea>', false, 4, "c_notes")

  //郵便番号→住所の自動入力、登録番号の整形・法人番号の補完。
  // 法人番号 → 国税庁の法人番号公表サイトから名称・所在地などを呼び出す
  function houjinAvailable(){ return !!(db && !window.claude && !state.offlineMode && /^https?:$/.test(location.protocol)); }
  function kataToHira(x){ return String(x||"").replace(/[ァ-ヶ]/g, function(ch){ return String.fromCharCode(ch.charCodeAt(0)-0x60); }); }
  function bindHoujinLookup(){
    var btn = document.getElementById("f-ccorpno-btn"), inp = document.getElementById("f-ccorpno"), msg = document.getElementById("f-ccorpno-msg");
    if(!btn || !inp) return;
    var say = function(t, bad){ if(msg){ msg.textContent = t; msg.style.color = bad ? "var(--danger)" : "var(--ink-faint)"; } };
    btn.addEventListener("click", function(){
      var n = inp.value.normalize("NFKC").replace(/[^0-9]/g,"");
      if(n.length!==13){ say("法人番号は13桁の数字で入力してください", true); return; }
      if(!houjinAvailable()){ say("この機能は公開版（Vercel）のアプリで使えます。このプレビューでは利用できません", true); return; }
      var me = myMember(); if(!me){ say("ログイン情報を確認できません", true); return; }
      btn.disabled = true; say("呼び出し中…");
      fetch("/api/houjin", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({auth:{name:me.name, password:me.password||""}, number:n})})
        .then(function(r){ return r.json().catch(function(){ return {}; }); })
        .then(function(j){
          btn.disabled = false;
          if(j.error==="notconfigured"){ say("管理者の設定が必要です：国税庁のアプリケーションIDを取得し、Vercelの環境変数 HOUJIN_APP_ID に登録してください（使い方・Q&Aに手順があります）", true); return; }
          if(j.error==="invalid"){ say("法人番号が正しくありません（チェックデジットが一致しません）", true); return; }
          if(j.error==="notfound"){ say("該当する法人が見つかりませんでした", true); return; }
          if(j.error || !j.corp){ say("呼び出しに失敗しました。しばらくしてからもう一度お試しください", true); return; }
          var c = j.corp, filled = [];
          var put = function(id, val, label, force){
            var el = document.getElementById(id); if(!el || !val) return;
            if(force || !String(el.value||"").trim() || el.value==="未選択"){ el.value = val; filled.push(label); }
          };
          var addrEl0 = document.getElementById("f-caddress"), addrBlank = !(addrEl0 && String(addrEl0.value||"").trim());
          put("f-cname", c.name, "名前");
          put("f-ckana", kataToHira(c.furigana), "ふりがな");
          put("f-cetype", "法人", "事業所種別");
          put("f-cregion", "国内", "地域");
          put("f-cpostal", c.postalCode, "郵便番号");
          put("f-cpref", c.prefecture, "都道府県", addrBlank);
          put("f-caddress", (c.city||"")+(c.street||""), "市区町村・番地");
          var addr = document.getElementById("f-caddress"); if(addr) addr.removeAttribute("data-auto");
          say((c.name||"")+"（"+(c.kind||"法人")+"）"+(c.closed?"【閉鎖：登記が閉鎖されています】":"")+" を呼び出しました。"+(filled.length?"入力：" + filled.join("、"):"入力済みの項目はそのままです"), c.closed);
        })
        .catch(function(){ btn.disabled = false; say("通信に失敗しました", true); });
    });
  }
  function bindCustomerFormEvents(){
    bindHoujinLookup();
    bindPostalLookup("f-cpostal", null, "f-cpref", "f-caddress");
    var invEl = document.getElementById("f-cinvno"), corpEl = document.getElementById("f-ccorpno"), typeEl = document.getElementById("f-cetype");
    invEl.addEventListener("input", function(){
      invEl.value = invEl.value.replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0xFEE0); }).replace(/[\s\-]/g,"").toUpperCase();
    });
    invEl.addEventListener("blur", function(){
      var m = /^T?(\d{13})$/.exec(invEl.value);
      if(m){ invEl.value = "T"+m[1]; if(!corpEl.value.trim() && typeEl.value==="法人") corpEl.value = m[1]; }
    });

  // Reads and validates the form. Returns the customer data object, or null (after a toast).
  function readCustomerForm(){
    var val = function(id){ return document.getElementById(id).value.trim(); };
    var pick = function(id){ var x = document.getElementById(id).value; return x==="未選択" ? "" : x; };
    var name = val("f-cname");
    if(!name){ toast("名前を入力してください"); return null; }
    var invNo = val("f-cinvno");
    if(invNo && !/^T\d{13}$/.test(invNo)){ toast("登録番号は T + 13桁の数字で入力してください"); return null; }
    var corp = val("f-ccorpno");
    if(corp && !/^\d{13}$/.test(corp)){ toast("法人番号は13桁の数字で入力してください"); return null; }
    var d = {};
    CUSTOMER_FORM_FIELDS.forEach(function(f){ d[f[0]] = f[2]==="sel" ? pick(f[1]) : val(f[1]); });
    return d;
  }
  // Fills the form from a customer record (used by 顧客一覧から選ぶ).
  function setCustomerFormValues(src){
    CUSTOMER_FORM_FIELDS.forEach(function(f){
      var el = document.getElementById(f[1]); if(!el) return;

  /* ---- 顧客の重複チェック／顧客から案件へ ---- */
  function custNormName(x){ return String(x||"").normalize("NFKC").toLowerCase().replace(/株式会社|有限会社|合同会社|\(株\)|\(有\)|㈱|㈲|御中|様|殿/g,"").replace(/[\s\u3000・\-ー_.,、。()（）]/g,""); }
  function custMatchReasons(a, b){
    var r = [], na = custNormName(a.name), nb = custNormName(b.name);
    if(na && nb){
      if(na===nb) r.push("名前が同じ");
      else if(Math.min(na.length,nb.length)>=3 && (na.indexOf(nb)!==-1 || nb.indexOf(na)!==-1)) r.push("名前が似ている");
    }
    var pa = normPhone(a.phone), pb = normPhone(b.phone);
    if(pa && pb && pa===pb) r.push("電話番号が同じ");
    var ea = String(a.email||"").trim().toLowerCase(), eb = String(b.email||"").trim().toLowerCase();
    if(ea && eb && ea===eb) r.push("メールが同じ");
    return r;
  }
  function findCustomerDuplicates(data, excludeId){
    var out = [];
    state.customers.forEach(function(c){ if(c.id===excludeId) return; var r = custMatchReasons(data, c); if(r.length) out.push({c:c, reasons:r}); });
    return out;
  }
  function dupWarnHtml(dups){
    return '<div id="cust-dup-warn" style="background:#fff4e0;border:1px solid #f0c36d;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:12.5px;line-height:1.7"><b>すでに登録されている顧客と重複している可能性があります</b>'+
      dups.slice(0,5).map(function(d){ return '<div>・<a href="#" data-dup-edit="'+esc(d.c.id)+'">'+esc(d.c.name)+'</a>'+(d.c.phone?'（'+esc(d.c.phone)+'）':'')+' <span style="color:var(--ink-faint)">'+esc(d.reasons.join("・"))+'</span></div>'; }).join("")+
      '<div style="margin-top:4px;color:var(--ink-faint)">問題なければ、もう一度「登録」を押すと登録します。</div></div>';
  }
  function openCustomerDupScan(){
    var groups = [], seen = {};
    state.customers.forEach(function(a, i){
      var members = [a];
      state.customers.forEach(function(b, j){ if(j>i && custMatchReasons(a,b).length) members.push(b); });
      if(members.length>1 && !seen[a.id]){ members.forEach(function(m){ seen[m.id]=1; }); groups.push(members); }
    });
    var body = groups.length ? groups.map(function(g, gi){
      return '<div style="border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px">'+g.map(function(c){
        return '<div style="display:flex;gap:8px;align-items:center;justify-content:space-between;padding:3px 0"><span style="font-size:12.5px"><b>'+esc(c.name)+'</b> <span style="color:var(--ink-faint)">'+esc([c.phone,c.email,c.address].filter(Boolean).join("　"))+'（案件 '+custProjCount(c)+'件）</span></span><button class="btn sm" data-dup-edit="'+esc(c.id)+'">開く</button></div>';
      }).join("")+'</div>';
    }).join("") : '<div style="font-size:13px">重複している可能性のある顧客は見つかりませんでした。</div>';
    openModal("重複チェック", '<div style="font-size:12px;color:var(--ink-faint);margin-bottom:8px">名前（株式会社などを除く）・電話番号・メールが同じか似ている顧客をまとめています。'+(groups.length?'（'+groups.length+'組）':'')+'</div><div style="max-height:55vh;overflow:auto">'+body+'</div>', '<button class="btn" data-close-modal>閉じる</button>');
    document.querySelectorAll("#modal-box [data-dup-edit]").forEach(function(el){ el.addEventListener("click", function(ev){ ev.preventDefault(); var id = el.getAttribute("data-dup-edit"); closeModal(); openCustomerForm(id); }); });
  }

      return '<a href="#" data-cust-proj="'+esc(p.id)+'" style="display:flex;gap:10px;justify-content:space-between;align-items:center;padding:9px 4px;border-bottom:1px solid var(--border);color:inherit;text-decoration:none"><span><span style="font-weight:700;font-size:12.5px;display:block">'+esc(p.name)+'</span><span style="font-size:11px;color:var(--ink-faint)">'+esc(p.type||"")+(p.startDate?'　'+esc(p.startDate)+(p.endDate?'〜'+esc(p.endDate):''):'')+'</span></span><span style="font-size:11.5px;color:var(--ink-faint);white-space:nowrap;text-align:right">'+(p.status?'<span class="tag muted">'+esc(p.status)+'</span>':'')+(p.amount?'<span style="display:block;margin-top:2px">¥'+Number(p.amount).toLocaleString()+'</span>':'')+'</span></a>';
    }).join("") : '<div style="font-size:12.5px;color:var(--ink-faint);padding:14px 4px">この顧客の案件はまだありません</div>';
    openModal(c.name||"顧客", (info?'<div style="font-size:12px;color:var(--ink-soft);line-height:1.6;margin-bottom:8px">'+info+'</div>':'')+
      '<div style="font-size:12.5px;font-weight:700;margin-bottom:4px">案件一覧（'+ps.length+'件'+(total?'・合計 ¥'+total.toLocaleString():'')+'）</div><div style="max-height:50vh;overflow:auto;border-top:1px solid var(--border)">'+list+'</div>',
      '<button class="btn" data-close-modal>閉じる</button><button class="btn" id="cust-modal-edit">'+iEdit()+' 顧客情報を編集</button>');
    document.getElementById("cust-modal-edit").onclick = function(){ closeModal(); openCustomerForm(cid); };
    document.querySelectorAll("#modal-box [data-cust-proj]").forEach(function(el){ el.addEventListener("click", function(ev){ ev.preventDefault(); var id = el.getAttribute("data-cust-proj"); closeModal(); goProjectDetail(id); }); });
  }
  function openCustomerForm(editId){
    var cu = editId ? state.customers.find(function(x){ return x.id===editId; }) : null;
    if(editId && !cu) return;
    var src = cu ? Object.assign({}, cu, {postalCode:customerPostal(cu)}) : null;
    openModal(cu?"顧客情報の編集":"顧客情報の登録", '<div style="margin:-4px 0">'+customerFormSectionsHtml(src, !cu)+'</div>', '<button class="btn" data-close-modal>キャンセル</button><button class="btn primary" id="f-submit" disabled>'+(cu?"保存する":"追加する")+'</button>');
    var box = document.getElementById("modal-box");
    box.style.maxWidth = "860px";
    var foot = box.querySelector(".modal-foot");
    if(foot){ foot.style.background = "var(--surface-2)"; foot.style.borderRadius = "0 0 16px 16px"; }
    bindCustomerFormEvents();
    var nameEl = document.getElementById("f-cname"), submit = document.getElementById("f-submit");
    var refresh = function(){ submit.disabled = !nameEl.value.trim(); };
    nameEl.addEventListener("input", refresh); refresh();
    submit.onclick = function(){
      var data = readCustomerForm(); if(!data) return;
      if(!submit.getAttribute("data-dup-ok")){
        var dups = findCustomerDuplicates(data, cu && cu.id);
        if(dups.length){
          var oldW = document.getElementById("cust-dup-warn"); if(oldW) oldW.remove();
          var bodyEl = document.querySelector("#modal-box .modal-body"); bodyEl.insertAdjacentHTML("afterbegin", dupWarnHtml(dups)); bodyEl.scrollTop = 0;
          bodyEl.querySelectorAll("[data-dup-edit]").forEach(function(el){ el.addEventListener("click", function(ev){ ev.preventDefault(); var id = el.getAttribute("data-dup-edit"); closeModal(); openCustomerForm(id); }); });
          submit.setAttribute("data-dup-ok","1"); submit.textContent = cu ? "重複を承知で保存" : "重複を承知で登録";
          return;
        }
      }
      if(!cu){ data.registeredDate = todayISO(); writeDoc("customers", null, data, "顧客を登録しました"); return; }
      writeDoc("customers", cu.id, data, "顧客情報を更新しました", function(){
        // Projects keep a copy of the customer name; keep them in step.
        if(cu.name!==data.name){
          state.projects.forEach(function(p){
            if(p.customerId!==cu.id) return;
            if(db) db.collection("projects").doc(p.id).update({customerName:data.name}).catch(function(){});
            else p.customerName = data.name;
          });
        }
      });
    };
  }

    };

  /* ============ db writes ============ */
  function writeDoc(col,id,data,msg,after){
    if(!state.canWrite){ toast("この操作を行う権限がありません"); return; }
    if(col==="members" && !state.isAdmin){
      // Non-admins may only edit their OWN contact fields / password
      // (個人情報) -- never name, company, roles or permission.
      var me = myMember();
      var selfOk = !!(id && me && me.id===id && Object.keys(data).every(function(k){ return ["name","kana","phone","email","company","password"].indexOf(k)!==-1; }));
      if(!selfOk){ toast("メンバーの変更は管理者のみ行えます"); return; }
    }
    data.updatedAt = new Date().toISOString();
    var oldRec = id ? (rawOf(col).find(function(x){ return x.id===id; }) || null) : null;
    if(!db){
      var arr = rawOf(col);
      if(id){ var idx=arr.findIndex(function(x){return x.id===id;}); if(idx>-1) arr[idx]=Object.assign({},arr[idx],data); }
      else { data.id=uid(); data.createdAt=new Date().toISOString(); arr.unshift(data); }
      closeModal(); toast(msg+"（プレビューのみ）"); render(); try{ worksNotifyAfterWrite(col, id||data.id, data, oldRec); }catch(e){} if(after) after(id||data.id); return;
    }
    var p = id ? db.collection(col).doc(id).update(data) : db.collection(col).add(Object.assign({createdAt:new Date().toISOString()},data));
    p.then(function(ref){ closeModal(); toast(msg); try{ worksNotifyAfterWrite(col, id||(ref&&ref.id), data, oldRec); }catch(e){} if(after) after(id||(ref&&ref.id)); }).catch(function(e){ toast("保存に失敗しました"); });
  }
  // ---- ゴミ箱: 削除したデータは trash コレクションに控えを残し、管理画面から復元できる ----
  var TRASH_TYPES = {reports:"報告書",projects:"案件",customers:"顧客",members:"メンバー",tasks:"タスク",files:"ファイル",events:"予定",steps:"工程",folders:"フォルダ"};
  var TRASH_NAME = {reports:"title",projects:"name",customers:"name",members:"name",tasks:"title",files:"filename",events:"title",steps:"name",folders:"name"};
  function trashPut(col, id){
    var rec = TRASH_TYPES[col] ? rawOf(col).find(function(x){ return x.id===id; }) : null;
    if(!rec) return Promise.resolve();
    var data = Object.assign({}, rec); delete data.id;
    var nm = rec[TRASH_NAME[col]] || "";
    if(col==="steps") nm = (rec.projectName?rec.projectName+"：":"")+(rec.name||"");
    var entry = {col:col, docId:id, name:nm, data:data, deletedAt:new Date().toISOString(), deletedBy:state.myName||""};

    if(col==="members" && !state.isAdmin){ toast("メンバーの削除は管理者のみ行えます"); return; }

  function projSortFn(k){

    var cr = function(a,b){ return (b.createdAt||"").localeCompare(a.createdAt||""); };
    var up = function(a,b){ return (b.updatedAt||b.createdAt||"").localeCompare(a.updatedAt||a.createdAt||""); };
    var f = {
      "upd": up,
      "updr": function(a,b){ return -up(a,b); },
      "new": cr,
      "old": function(a,b){ return -cr(a,b); },
      "name": function(a,b){ return (a.name||"").localeCompare(b.name||"","ja"); },
      "namer": function(a,b){ return (b.name||"").localeCompare(a.name||"","ja"); },
      "start": function(a,b){ return dt(a,b,"startDate",false)||cr(a,b); },
      "startr": function(a,b){ return dt(a,b,"startDate",true)||cr(a,b); },
      "end": function(a,b){ return dt(a,b,"endDate",false)||cr(a,b); },
      "endr": function(a,b){ return dt(a,b,"endDate",true)||cr(a,b); },
      "amount": function(a,b){ return (Number(b.amount)||0)-(Number(a.amount)||0)||cr(a,b); },

      "cust": function(a,b){ var x=a.customerName||"", y=b.customerName||""; if(!x&&!y) return cr(a,b); if(!x) return 1; if(!y) return -1; return x.localeCompare(y,"ja")||cr(a,b); }

      "proj": function(a,b){ return (cnt[b.id]||0)-(cnt[a.id]||0) || key(a).localeCompare(key(b),"ja"); },
      "pref": function(a,b){ var ia=PREFS.indexOf(a.prefecture), ib=PREFS.indexOf(b.prefecture); return (ia<0?99:ia)-(ib<0?99:ib) || key(a).localeCompare(key(b),"ja"); }
    }[f.sort] || null;
    return cmp ? list.sort(cmp) : list;
  }
  function filterMembers(){
    return state.members.filter(function(m){
      if(state.memberSeg==="all") return true;
      return m.kind===(state.memberSeg==="internal"?"internal":"external");

  function filterFiles(){

    return state.files.filter(function(x){
      if(f.project!=="all" && x.projectId!==f.project) return false;
      if(f.kind==="image" && !isImageFile(x)) return false;
      if(f.kind==="other" && isImageFile(x)) return false;
      return true;
    }).sort(function(a,b){return (b.uploadedAt||"").localeCompare(a.uploadedAt||"");});
  }
  function taskMatches(t, f){
    if(f.status==="open" && t.done) return false;
    if(f.status==="done" && !t.done) return false;
    if(f.project!=="all" && t.projectId!==f.project) return false;
    if(f.assignee!=="all" && (t.assignee||"")!==f.assignee) return false;
    if(f.q && ((t.title||"")+(t.projectName||"")+(t.note||"")).indexOf(f.q)===-1) return false;
    return true;
  }
  function filterTasks(){
    var list = state.tasks.slice();
    if(state.tab==="tasks") list = list.filter(function(t){ return taskMatches(t, state.taskFilter); });
    return list.sort(function(a,b){return (a.dueDate||"").localeCompare(b.dueDate||"");});

      case "events": return filterEvents();
      case "steps": return filterSteps();

  /* ---- CSV text <-> rows ---- */
  function parseCsv(text){
    if(text.charCodeAt(0)===0xFEFF) text = text.slice(1);
    var rows=[], row=[], cur="", inQ=false;
    for(var i=0;i<text.length;i++){
      var ch = text.charAt(i);
      if(inQ){
        if(ch==='"'){ if(text.charAt(i+1)==='"'){ cur+='"'; i++; } else inQ=false; }
        else cur+=ch;
      }else{
        if(ch==='"') inQ=true;
        else if(ch===','){ row.push(cur); cur=""; }
        else if(ch==="\r"){ /* ignore: \r\n and lone \r both end up handled by \n / end */ if(text.charAt(i+1)!=="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; } }
        else if(ch==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
        else cur+=ch;
      }
    }
    if(cur!=="" || row.length){ row.push(cur); rows.push(row); }
    return rows;
  }
  function csvEscape(v){
    v = v==null ? "" : String(v);
    return /[",\r\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  }
  function csvDecode(buf){
    try{ return new TextDecoder("utf-8",{fatal:true}).decode(buf); }
    catch(e){
      try{ return new TextDecoder("shift_jis").decode(buf); }
      catch(e2){ return new TextDecoder("utf-8").decode(buf); }
    }
  }
  function cellOut(c, r){
    var v = r[c.key];
    switch(c.type){
      case "number": return (v==null||v==="") ? "" : v;
      case "names": return normalizeAssignees(v).map(function(a){return a.name;}).join("、");
      case "list": return (v||[]).join("、");
      case "bool": return v ? "はい" : "いいえ";
      case "perm": return permissionLabel(memberPermission(r));
      default:
        var s = v==null ? "" : String(v);
        // Stop spreadsheet apps from treating text as a formula.
        if(!c.type && /^[=+\-@]/.test(s)) s = "'"+s;
        return s;
    }
  }
  function buildCsv(entity, rows){
    var cols = CSV_ENTITIES[entity].columns.filter(function(c){ return !c.importOnly; });
    var out = [cols.map(function(c){return c.label;})];
    rows.forEach(function(r){ out.push(cols.map(function(c){ return cellOut(c, r); })); });
    return "﻿"+out.map(function(r){ return r.map(csvEscape).join(","); }).join("\r\n");
  }
  function downloadBlob(filename, blob){
    if(downloadsCap){
      downloadsCap.save({filename:filename, data:blob}).catch(function(){ toast("ダウンロードがキャンセルされました"); });
    }else{
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    }
  }

  /* ---- cell parsing (shared by import and bulk edit) ---- */
  // Returns {empty:true} | {value:...} | {error:"..."}.
  function parseCell(c, raw, existing){
    var s = String(raw==null ? "" : raw).trim();
    if(s==="") return {empty:true};
    switch(c.type){
      case "number":
        var n = parseFloat(s.replace(/[,，¥￥円\s　]/g,""));
        if(isNaN(n)) return {error:"「"+c.label+"」が数値ではありません（"+s+"）"};
        return {value:n};
      case "date":
        var d = csvNormDate(s);
        if(!d) return {error:"「"+c.label+"」は 2026-10-06 の形式で入力してください（"+s+"）"};
        return {value:d};
      case "bool":
        if(/^(はい|true|1|yes|完了|済|○|〇)$/i.test(s)) return {value:true};
        if(/^(いいえ|false|0|no|未完了|未|×)$/i.test(s)) return {value:false};
        return {error:"「"+c.label+"」は はい／いいえ で入力してください（"+s+"）"};
      case "perm":
        var p = PERMISSION_LEVELS.find(function(x){ return x[0]===s.toLowerCase() || x[1]===s; });
        if(!p) return {error:"「"+c.label+"」は 管理者／一般／外部 のいずれかです（"+s+"）"};
        return {value:p[0]};
      case "names":
        var names = [];
        var bad = [];
        s.split(CSV_LIST_SEP).forEach(function(part){
          part = part.trim(); if(!part) return;
          var nm = csvResolveMemberName(part);
          if(!nm && existing){ var keep = normalizeAssignees(existing[c.key]).find(function(x){ return csvSpaceless(x.name)===csvSpaceless(part); }); if(keep) nm = keep.name; }   // その案件に既にいる担当者は（メンバー一覧に無くても）そのまま許可
          if(!nm) bad.push(part); else if(names.indexOf(nm)===-1) names.push(nm);
        });
        if(bad.length) return {error:"「"+c.label+"」に未登録のメンバーがいます（"+bad.join("、")+"）"};
        return {value:names};
      case "list":
        var items = [], badItems = [];
        s.split(/[、,，;；\s　]+/).forEach(function(part){
          if(!part) return;
          if(c.options && c.options.indexOf(part)===-1) badItems.push(part);
          else if(items.indexOf(part)===-1) items.push(part);
        });
        if(badItems.length) return {error:"「"+c.label+"」に選択肢にない値があります（"+badItems.join("、")+"）"};
        return {value:items};
      default:
        if(c.options){
          // Accept a value the record already has even if it is not in the list.
          if(c.options.indexOf(s)===-1 && !(existing && existing[c.key]===s))
            return {error:"「"+c.label+"」は次のいずれかです："+c.options.join("／")+"（"+s+"）"};
          return {value:s};
        }
        if(/^'[=+\-@]/.test(s)) s = s.slice(1);
        return {value:s};
    }
  }

  /* ---- raw writes (no per-row toast; callers report totals) ---- */
  function saveRaw(col, id, data){
    var now = new Date().toISOString();
    data = Object.assign({}, data, {updatedAt:now});
    if(!db){
      var arr = rawOf(col);
      if(id){ var i = arr.findIndex(function(x){return x.id===id;}); if(i>-1) arr[i] = Object.assign({}, arr[i], data); }
      else arr.unshift(Object.assign({id:uid(), createdAt:now}, data));
      return Promise.resolve();
    }
    return id ? db.collection(col).doc(id).update(data) : db.collection(col).add(Object.assign({createdAt:now}, data));
  }
  function deleteRaw(col, id){
    return trashPut(col,id).then(function(){
      if(!db){ setRaw(col, rawOf(col).filter(function(x){return x.id!==id;})); return; }
      return db.collection(col).doc(id).delete();
    });
  }
  function runBatch(promises, doneLabel){
    var ok = 0, fail = 0;
    return Promise.all(promises.map(function(p){ return p.then(function(){ ok++; }, function(){ fail++; }); })).then(function(){
      closeModal();
      toast(fail ? (ok+"件を"+doneLabel+"、"+fail+"件は失敗しました") : (ok+"件を"+doneLabel+"しました"));
      render();
    });
  }

  /* ---- import ---- */
  function csvTemplate(entity){
    var E = CSV_ENTITIES[entity];
    var cols = E.columns.filter(function(c){ return !c.readonly || c.key==="id"; });
    var rows = [cols.map(function(c){return c.label;}), cols.map(function(c){ return c.key==="id" ? "" : (E.sample[c.key]||""); })];
    var text = "﻿"+rows.map(function(r){ return r.map(csvEscape).join(","); }).join("\r\n");
    downloadBlob(E.label+"_取込テンプレート.csv", new Blob([text], {type:"text/csv"}));
  }

  function planImport(entity, rows){
    var E = CSV_ENTITIES[entity];
    var plan = {ops:[], errors:[], unknown:[], total:0};
    if(!rows.length){ plan.errors.push({line:0, msg:"ファイルが空です"}); return plan; }
    var header = rows[0].map(function(h){ return String(h==null?"":h).replace(/^﻿/,"").trim(); });
    var colIdx = {};
    header.forEach(function(h, i){
      var c = E.columns.find(function(x){ return x.label===h || x.key.toLowerCase()===h.toLowerCase(); });
      if(c && colIdx[c.key]==null) colIdx[c.key] = i; else if(h && !c) plan.unknown.push(h);
    });
    if(Object.keys(colIdx).length===0){ plan.errors.push({line:1, msg:"見出し行が認識できません。「CSV出力」したファイルかテンプレートの形式にしてください"}); return plan; }

    var existingList = E.all();
    var seenNames = {};
    var adminAfter = null;
    if(entity==="members"){
      adminAfter = {};
      state.members.forEach(function(m){ adminAfter[m.id] = memberPermission(m)==="admin"; });
    }
    for(var i=1;i<rows.length;i++){
      var row = rows[i];
      if(!row.some(function(v){ return String(v||"").trim()!==""; })) continue;
      plan.total++;
      var line = i+1;
      var idRaw = colIdx.id!=null ? String(row[colIdx.id]||"").trim() : "";
      var existing = idRaw ? existingList.find(function(x){ return x.id===idRaw; }) : null;
      var patch = {}, rowErrors = [];
      E.columns.forEach(function(c){
        if(c.readonly || colIdx[c.key]==null) return;
        var res = parseCell(c, row[colIdx[c.key]], existing);
        if(res.error) rowErrors.push(res.error); else if(!res.empty) patch[c.key] = res.value;
      });
      var label = patch[E.nameKey] || (existing && existing[E.nameKey]) || "";
      if(!existing && !patch[E.nameKey]) rowErrors.push("必須項目「"+E.requiredLabel+"」が空です");
      if(entity==="members" && patch.name){
        var dup = state.members.find(function(m){ return csvSpaceless(m.name)===csvSpaceless(patch.name) && (!existing || m.id!==existing.id); });
        if(dup) rowErrors.push("同じ氏名のメンバーが既に登録されています（"+patch.name+"）");
        if(seenNames[csvSpaceless(patch.name)]) rowErrors.push("ファイル内で氏名が重複しています（"+patch.name+"）");
        seenNames[csvSpaceless(patch.name)] = true;
      }
      if(!rowErrors.length && E.validate){ var ve = E.validate(patch, existing); if(ve) rowErrors.push(ve); }
      if(rowErrors.length){ plan.errors.push({line:line, msg:(label?label+"：":"")+rowErrors.join(" / ")}); continue; }
      var data = E.finalize(patch, existing);
      plan.ops.push({type: existing ? "update" : "create", id: existing ? existing.id : null, data:data, label:label});
      if(adminAfter && existing && data.permission) adminAfter[existing.id] = data.permission==="admin";
      else if(adminAfter && !existing) adminAfter["new"+i] = data.permission==="admin";
    }
    if(adminAfter && plan.ops.length && !Object.keys(adminAfter).some(function(k){ return adminAfter[k]; })){
      plan.ops = []; plan.errors.push({line:0, msg:"管理者が1人もいなくなるため取り込めません"});
    }
    return plan;
  }

            (plan.errors.length>30?'<div>…ほか'+(plan.errors.length-30)+'件</div>':'')+'</div>';

    document.getElementById("csv-run").onclick = function(){

    };
  }

  function extIsoDate(v){

    var rows = null, head = [], skippedRows = 0, asgCols = [];
