  var GANTT_SCALES = {"2w":{days:14,dw:46,label:"2週間"}, "1m":{days:35,dw:26,label:"5週間"}, "3m":{days:91,dw:12,label:"3か月"}};
  var GANTT_LBL = 250;
  function renderSchedule(){
    if(!state.loaded.projects || !state.loaded.steps) return skeleton();
    var today = localToday(), sc = GANTT_SCALES[state.ganttScale]||GANTT_SCALES["1m"], dw = sc.dw, days = sc.days;
    var availW = (document.getElementById("content")||document.querySelector(".content")||{}).clientWidth || 0;
    if(availW) dw = Math.max(dw, Math.min(80, Math.floor((availW - 60 - GANTT_LBL) / days)));
    if(!state.ganttStart) state.ganttStart = addDays(today,-3);
    var start = state.ganttStart, end = addDays(start,days-1), W = days*dw;
    var startDow = parseISO(start).getDay();
    var grid = 'background-image:linear-gradient(to right,#EEF1F0 0,#EEF1F0 '+dw+'px,transparent '+dw+'px,transparent '+(6*dw)+'px,#EEF1F0 '+(6*dw)+'px,#EEF1F0 '+(7*dw)+'px),linear-gradient(to right,rgba(0,0,0,.06) 1px,transparent 1px);background-size:'+(7*dw)+'px 100%,'+dw+'px 100%;background-position:'+(-startDow*dw)+'px 0,0 0;';
    var html = '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px"><h1 class="pagetitle">工程表</h1>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap">'+csvToolbar("steps")+'<button class="btn primary" data-step-add="">'+iPlus()+' 工程を追加</button></div></div><div style="height:12px"></div>'+
      '<div class="segmented" style="margin-bottom:14px"><div class="segopt'+(state.ganttView==="chart"?' active':'')+'" data-gantt-view="chart">横断工程表（案件別）</div><div class="segopt'+(state.ganttView==="people"?' active':'')+'" data-gantt-view="people">担当別</div><div class="segopt'+(state.ganttView==="list"?' active':'')+'" data-gantt-view="list">工程一覧</div></div>';
    if(state.ganttView==="list") return html + renderStepList();
    if(state.ganttView==="people") return html + renderPeopleChart();
    html += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px">'+
      '<button class="btn sm" data-gantt-nav="-1">'+iBack()+'</button><button class="btn sm" data-gantt-nav="0">今日</button><button class="btn sm" data-gantt-nav="1" style="transform:scaleX(-1)">'+iBack()+'</button>'+
      '<b style="font-size:13px;margin:0 6px">'+fmtDate(start)+' 〜 '+fmtDate(end)+'</b><span style="flex:1"></span>'+
      '<label style="display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer"><input type="checkbox" id="gt-hide"'+(state.ganttHideDone?" checked":"")+'> 清算済・失注を除く</label>'+
      '<select id="gt-scale" style="width:auto">'+Object.keys(GANTT_SCALES).map(function(k){ return '<option value="'+k+'"'+(state.ganttScale===k?" selected":"")+'>'+GANTT_SCALES[k].label+'表示</option>'; }).join("")+'</select></div>';

    // header rows
    var months = "", i=0;
    while(i<days){
      var d0 = parseISO(addDays(start,i)), j=i; while(j<days && parseISO(addDays(start,j)).getMonth()===d0.getMonth()) j++;
      months += '<div class="gt-mon" style="width:'+((j-i)*dw)+'px">'+d0.getFullYear()+'年'+(d0.getMonth()+1)+'月</div>'; i=j;
    }
    var dayCells = "";
    for(var k=0;k<days;k++){
      var dk = addDays(start,k), dd = parseISO(dk), dow = dd.getDay();
      var showNum = dw>=20 || dd.getDate()===1 || dow===1;
      dayCells += '<div class="gt-d'+(dk===today?' today':'')+(dow===0?' sun':(dow===6?' sat':''))+'" style="width:'+dw+'px">'+(showNum?'<span>'+dd.getDate()+'</span>':'')+(dw>=20?'<span class="w">'+WEEKDAYS[dow]+'</span>':'')+'</div>';
    }
    var projs = state.projects.filter(function(p){ return !(state.ganttHideDone && (p.status==="清算済"||p.status==="失注")); });
    var stepsBy = {}; state.steps.filter(secretVisible).forEach(function(s){ if(!s.startDate) return; (stepsBy[s.projectId]=stepsBy[s.projectId]||[]).push(s); });
    projs = projs.filter(function(p){ return !!stepsBy[p.id]; })
      .sort(function(a,b){ return (a.startDate||"9999").localeCompare(b.startDate||"9999"); });

    var bar = function(s,e,cls,text,prog,attr){
      if(!s || e<start || s>end) return "";
      var cs = s<start?start:s, ce = e>end?end:e;
      var left = diffDays(start,cs)*dw, width = (diffDays(cs,ce)+1)*dw - 2;
      return '<div class="gt-bar '+cls+(s<start?' cl':'')+(e>end?' cr':'')+'" '+attr+' style="left:'+left+'px;width:'+Math.max(width,6)+'px" title="'+esc(text)+'（'+fmtDate(s)+'〜'+fmtDate(e)+(prog!=null?'　進捗'+prog+'%':'')+'）">'+(prog?'<i class="pg" style="width:'+prog+'%"></i>':'')+'<span>'+esc(text)+'</span></div>';
    };
    var rows = "", dot = Math.max(7, Math.min(16, dw-8));
    // 日ごとの丸印：青＝予定、緑＝完了、赤＝期限を過ぎて未完了
    var dots = function(p, sts){
      var out = "";
      for(var k=0;k<days;k++){
        var dk = addDays(start,k), act = sts.filter(function(x){ return x.startDate && x.startDate<=dk && (x.endDate||x.startDate)>=dk; }), cls = "";
        if(act.length){

          else cls = "blue";
        } else if(!sts.length && p.startDate && !hiddenFor(p,"p_period") && p.startDate<=dk && ((p.endDate&&p.endDate>=p.startDate)?p.endDate:p.startDate)>=dk) cls = "gray";

      }
      return out;
    };
    projs.forEach(function(p){
      var sts = (stepsBy[p.id]||[]).slice().sort(function(a,b){ return (a.startDate||"").localeCompare(b.startDate||""); });
      var open = !state.ganttClosed[p.id];

        '<div class="gt-cols" style="width:'+W+'px;'+grid+'">'+dots(p, sts)+'</div></div>';

        var bars = byP[n].map(function(x){ var b = bar(x.startDate,(x.endDate&&x.endDate>=x.startDate)?x.endDate:x.startDate,"k-step",x.name,+x.progress||0,'data-cal-item="step:'+esc(x.id)+'"'); return b.replace('style="','style="top:'+(4+x._lane*26)+'px;'); }).join("");
        rows += '<div class="gt-row ppl" style="min-height:'+h+'px"><div class="gt-lbl sub"><div class="gt-pl"><span class="mini-avatar" style="background:'+avaColor(n)+';width:20px;height:20px;font-size:10px">'+esc(initials(n))+'</span><span>'+esc(n)+'</span><small>'+byP[n].length+'工程</small></div></div>'+
          '<div class="gt-cols" style="width:'+W+'px;height:'+h+'px;'+grid+'">'+bars+'</div></div>';
      });
    });
    if(!rows){
      html += emptyState(iBriefcase,"表示できる工程がありません","「工程を追加」から工程を登録すると、ここに表示されます");
      return html;
    }
    var todayOff = diffDays(start,today);
    html += '<div class="gt-wrap"><div class="gt" style="width:'+(GANTT_LBL+W)+'px">'+
      '<div class="gt-head"><div class="gt-lbl head">案件 ／ 担当</div><div style="width:'+W+'px"><div style="display:flex">'+months+'</div><div style="display:flex">'+dayCells+'</div></div></div>'+
      '<div class="gt-body">'+rows+(todayOff>=0&&todayOff<days?'<div class="gt-todaycol" style="left:'+(GANTT_LBL+todayOff*dw)+'px;width:'+dw+'px"></div><div class="gt-today" style="left:'+(GANTT_LBL+todayOff*dw+Math.floor(dw/2))+'px"></div>':'')+'</div></div></div>';
    html += '<div class="gt-legend"><span><i style="background:#2f80d8"></i>予定あり</span><span><i style="background:#2f9e63"></i>完了</span><span><i style="background:#e0443c"></i>期限超過（未完了）</span><span style="color:var(--ink-faint)">▸ を押すと担当者ごとの工程が開きます。丸や帯を押すと編集できます。</span></div>';
    return html;
  }
  var PPL_SCALES = {"1w":{days:7,label:"1週間"},"2w":{days:14,label:"2週間"},"4w":{days:28,label:"4週間"}};
  var PPL_COLORS = ["#4a78c8","#2f8f5b","#c9722a","#8a5fc0","#2a9aa6","#b8497a","#7a8f2f","#5b6bb3"];
  function pplColor(id){ var h=0, t=String(id||""); for(var i=0;i<t.length;i++) h=(h*31+t.charCodeAt(i))%PPL_COLORS.length; return PPL_COLORS[h]; }
  function mondayOf(iso){ var d = parseISO(iso), dow = d.getDay(); return addDays(iso, -((dow+6)%7)); }
  function renderPeopleChart(){
    var today = localToday(), sc = PPL_SCALES[state.pplScale]||PPL_SCALES["1w"], days = sc.days;
    if(!state.pplStart) state.pplStart = mondayOf(today);
    var start = state.pplStart, end = addDays(start, days-1);
    var items = [];
    state.steps.filter(secretVisible).forEach(function(x){
      if(!x.startDate || !projectVisibleId(x.projectId)) return;
      items.push({kind:"step", id:x.id, who:x.assignee||"", s:x.startDate, e:(x.endDate&&x.endDate>=x.startDate)?x.endDate:x.startDate, title:x.name||"（未入力）", sub:x.projectName||"", pid:x.projectId, done:(+x.progress||0)>=100, prog:+x.progress||0});
    });
    state.tasks.forEach(function(t){
      if(!t.dueDate) return;
      items.push({kind:"task", id:t.id, who:t.assignee||"", s:t.dueDate, e:t.dueDate, title:t.title||"", sub:t.projectName||"", pid:t.projectId, done:!!t.done, prog:t.done?100:0});
    });
    items = items.filter(function(it){ return it.e>=start && it.s<=end; });
    var names = state.members.map(function(m){ return m.name; });
    items.forEach(function(it){ if(it.who && names.indexOf(it.who)===-1) names.push(it.who); });
    var only = state.pplOnly!==false;
    var rowsFor = names.filter(function(n){ return !only || items.some(function(it){return it.who===n;}); });
    var hasUn = items.some(function(it){ return !it.who; });
    var html = '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px">'+
      '<button class="btn sm" data-ppl-nav="-1">'+iBack()+'</button><button class="btn sm" data-ppl-nav="0">今日</button><button class="btn sm" data-ppl-nav="1" style="transform:scaleX(-1)">'+iBack()+'</button>'+
      '<b style="font-size:13px;margin:0 6px">'+fmtDate(start)+' 〜 '+fmtDate(end)+'</b><span style="flex:1"></span>'+
      '<label style="display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer"><input type="checkbox" id="ppl-only"'+(only?" checked":"")+'> 予定のある担当者のみ</label>'+

  function renderProjectList(mode){
    if(!state.loaded.projects || !state.loaded.members) return skeleton();
    var f = mode==="sales" ? state.salesFilter : state.constFilter;
    var title = mode==="sales" ? "営業案件一覧" : "施工案件一覧";

    // 検索：案件名・住所・顧客名（ふりがな・電話番号も）。全角半角・大文字小文字・空白の違いは無視する。社外メンバーには社外秘の項目では一致させない
    var fz = function(x){ return String(x||"").normalize("NFKC").toLowerCase().replace(/[\s\u3000]/g,"").replace(/[\u30a1-\u30f6]/g,function(ch){ return String.fromCharCode(ch.charCodeAt(0)-0x60); }); };   // カタカナ→ひらがなにそろえる
    var fq = fz(f.name), custById = {};
    if(fq) state.customers.forEach(function(c){ custById[c.id] = c; });
    var matchQ = function(p){

  /* ============ 郵便番号 → 住所 自動入力 ============ */
  // zipcloud (https://zipcloud.ibsnet.jp) returns the 都道府県/市区町村/町域 for
  // a 7-digit postal code. Try fetch first; if the browser blocks it (CORS /
  // CSP) fall back to JSONP. Never throws -- calls cb(result|null, err).
  function lookupPostal(zip, cb){
    var done = false;
    function finish(res, err){ if(done) return; done = true; cb(res, err); }
    function parse(j){
      if(j && j.results && j.results.length){ var r=j.results[0]; finish({prefecture:r.address1, address:(r.address2||"")+(r.address3||"")}); }
      else if(j && j.status===200) finish(null, "notfound");
      else finish(null, "error");
    }
    function proxy(){
      if(done) return;
      if(!/^https?:$/.test(location.protocol) || window.claude){ static_(); return; }
      fetch("/api/zip?zipcode="+zip).then(function(r){ return r.json(); }).then(function(j){ if(j && j.results && j.results.length) parse(j); else if(j && j.status===200) finish(null,"notfound"); else static_(); }).catch(static_);
    }
    // 予備: 郵便番号の静的データ（zipcloudが止まっているときでも取得できる）
    function static_(){
      if(done) return;
      fetch("https://madefor.github.io/postal-code-api/api/v1/"+zip.slice(0,3)+"/"+zip.slice(3)+".json").then(function(r){ if(r.status===404) throw "nf"; return r.json(); }).then(function(j){
        var d = j && j.data && j.data[0] && j.data[0].ja;
        if(d) finish({prefecture:d.prefecture, address:(d.address1||"")+(d.address2||"")+(d.address3||"")+(d.address4||"")});
        else finish(null, "notfound");
      }).catch(function(e){ finish(null, e==="nf" ? "notfound" : "error"); });
    }
    function jsonp(){
      var name = "__zipcb"+Date.now(), sc = document.createElement("script");
      var timer = setTimeout(function(){ cleanup(); proxy(); }, 8000);
      function cleanup(){ clearTimeout(timer); try{ delete window[name]; }catch(e){ window[name]=undefined; } if(sc.parentNode) sc.parentNode.removeChild(sc); }
      window[name] = function(j){ cleanup(); parse(j); };
      sc.onerror = function(){ cleanup(); proxy(); };
      sc.src = "https://zipcloud.ibsnet.jp/api/search?zipcode="+zip+"&callback="+name;
      document.head.appendChild(sc);
    }
    try{
      fetch("https://zipcloud.ibsnet.jp/api/search?zipcode="+zip).then(function(r){ return r.json(); }).then(parse).catch(jsonp);
    }catch(e){ jsonp(); }
  }
  // Wires postal input(s) to the 都道府県 select and 住所 input. With id2 it is
  // the 3+4 digit pair; with id2 === null it is one field ("020-0033").
  function bindPostalLookup(id1, id2, prefId, addrId){
    var e1 = document.getElementById(id1), e2 = id2 ? document.getElementById(id2) : null;
    var pref = document.getElementById(prefId), addr = document.getElementById(addrId);
    if(!e1 || (id2 && !e2) || !pref || !addr) return;
    var seq = 0;
    // A typed address is never overwritten; one we filled in ourselves may be refreshed.
    addr.addEventListener("input", function(){ addr.removeAttribute("data-auto"); });
    function toHalf(v){ return String(v).replace(/[０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0xFEE0); }).replace(/[^0-9]/g, ""); }
    function digits(){ return e2 ? toHalf(e1.value)+toHalf(e2.value) : toHalf(e1.value); }
    function run(){
      var z = digits();
      if(z.length!==7 || (e2 && (toHalf(e1.value).length!==3 || toHalf(e2.value).length!==4))) return;
      var my = ++seq;
      lookupPostal(z, function(res, err){
        if(my!==seq) return;
        if(!res){ toast(err==="notfound" ? "該当する住所が見つかりませんでした" : "住所を取得できませんでした。手入力してください"); return; }
        if(Array.prototype.some.call(pref.options, function(o){ return o.value===res.prefecture; })) pref.value = res.prefecture;
        if(!addr.value.trim() || addr.getAttribute("data-auto")==="1"){ addr.value = res.address; addr.setAttribute("data-auto","1"); }
        toast("郵便番号から住所を入力しました");
      });
    }
    if(!e2){
      e1.addEventListener("input", function(){
        var d = toHalf(e1.value).slice(0,7);
        e1.value = d.length>3 ? d.slice(0,3)+"-"+d.slice(3) : d;
        run();
      });
      return;
    }
    e1.addEventListener("input", function(){
      var d = toHalf(e1.value);
      if(d.length>3){ e2.value = d.slice(3,7); d = d.slice(0,3); }   // pasted "0200866" / "020-0866"
      e1.value = d;
      if(d.length===3 && toHalf(e2.value)==="") e2.focus();
      run();
    });
    e2.addEventListener("input", function(){ e2.value = toHalf(e2.value).slice(0,4); run(); });
  }

  // Finds the customer by name or creates it. An existing customer is only
  // topped up with the non-empty values entered on the 案件 form.
  function ensureCustomer(cdata, cb){
    var existing = state.customers.find(function(c){return c.name===cdata.name;});
    if(existing){
      var patch = {};
      Object.keys(cdata).forEach(function(k){ if(k!=="name" && cdata[k]!=="" && cdata[k]!==existing[k]) patch[k] = cdata[k]; });
      if(!Object.keys(patch).length){ cb(existing.id); return; }
      saveRaw("customers", existing.id, patch).then(function(){ cb(existing.id); }, function(){ cb(existing.id); });
      return;
    }
    var rec = Object.assign({}, cdata, {registeredDate:todayISO()});
    if(!db){ rec.id = uid(); state.customers.unshift(rec); cb(rec.id); return; }
    db.collection("customers").add(Object.assign({createdAt:new Date().toISOString()}, rec))
      .then(function(ref){ cb(ref.id); }).catch(function(){ cb(""); });
  }

  // 顧客名の入力欄に、登録済み顧客の候補を出す（選ぶと顧客情報をまとめて入力）
  function attachCustomerSuggest(inp, onPick){
    if(!inp || !state.customers.length) return;
    var wrap = inp.parentNode; if(wrap && getComputedStyle(wrap).position==="static") wrap.style.position = "relative";
    var box = document.createElement("div");
    box.style.cssText = "display:none;position:absolute;left:0;right:0;top:100%;z-index:60;background:var(--surface,#fff);border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.15);max-height:260px;overflow:auto;margin-top:2px";
    wrap.appendChild(box);
    var nz = function(x){ return String(x||"").normalize("NFKC").toLowerCase().replace(/[\s\u3000]/g,""); };
    var hide = function(){ box.style.display = "none"; };
    var show = function(){
      var q = nz(inp.value), cnt = {}; state.projects.forEach(function(p){ if(p.customerId) cnt[p.customerId] = (cnt[p.customerId]||0)+1; });
      var list = state.customers.filter(function(c){ return !c.hidden && (!q || nz([c.name,c.kana,c.phone,c.address].join(" ")).indexOf(q)!==-1); }).slice(0, 8);
      if(!list.length || (list.length===1 && nz(list[0].name)===q)){ hide(); return; }
      box.innerHTML = '<div style="font-size:10.5px;color:var(--ink-faint);padding:6px 10px 2px">登録済みの顧客から選べます'+(onPick?'':'（新しい顧客はそのまま入力）')+'</div>'+list.map(function(c){
        return '<div data-sug="'+esc(c.id)+'" style="padding:7px 10px;cursor:pointer;border-top:1px solid var(--border)"><div style="font-weight:700;font-size:12.5px">'+esc(c.name)+(cnt[c.id]?' <span style="font-weight:400;font-size:10.5px;color:var(--ink-faint)">案件'+cnt[c.id]+'件</span>':'')+'</div><div style="font-size:11px;color:var(--ink-faint)">'+esc([c.phone,c.address].filter(Boolean).join("　"))+'</div></div>';
      }).join("");
      box.style.display = "block";
      box.querySelectorAll("[data-sug]").forEach(function(el){
        el.addEventListener("mousedown", function(ev){ ev.preventDefault(); var c = state.customers.find(function(x){ return x.id===el.getAttribute("data-sug"); }); if(c){ if(onPick) onPick(c); else setCustomerFormValues(c); } hide(); });
      });
    };
    inp.setAttribute("autocomplete","off");
    inp.addEventListener("input", show); inp.addEventListener("focus", show);
    inp.addEventListener("blur", function(){ setTimeout(hide, 120); });
    inp.addEventListener("keydown", function(e){ if(e.key==="Escape") hide(); });
  }

  function saveMemos(pid, arr, msg){
    var p = state.projects.find(function(x){ return x.id===pid; }); if(!p) return;
    if(!db){ p.memos = arr; closeModal(); toast(msg+"（プレビューのみ）"); render(); return; }
    // メモの追加・編集は「案件の最終編集者」には含めない
    db.collection("projects").doc(pid).update({memos:arr}).then(function(){ closeModal(); toast(msg); }).catch(function(){ toast("保存に失敗しました"); });
  }
  function openMemoModal(pid, memoId){
    var p = state.projects.find(function(x){ return x.id===pid; }); if(!p) return;
    var cur = memoId ? projMemos(p).find(function(m){ return m.id===memoId; }) : null;

    openModal(cur ? "メモの編集" : "メモを追加",
      '<label class="field">メモ<textarea id="memo-text" rows="7" maxlength="3000" placeholder="申し送り・注意点・連絡事項など" style="width:100%">'+esc(cur?cur.text:"")+'</textarea></label><div style="font-size:11.5px;color:var(--ink-faint)">社外メンバーには表示されません。記入者名と日時が残ります。</div>',
      (cur?'<button class="btn" id="memo-del" style="color:var(--danger);margin-right:auto">'+iTrash()+' 削除</button>':'')+'<button class="btn" data-close-modal>キャンセル</button><button class="btn primary" id="memo-save">保存する</button>');
    setTimeout(function(){ var t = document.getElementById("memo-text"); if(t) t.focus(); }, 50);
    document.getElementById("memo-save").addEventListener("click", function(){
      var text = document.getElementById("memo-text").value.trim();
      if(!text){ toast("メモを入力してください"); return; }
      var fresh = state.projects.find(function(x){ return x.id===pid; }) || p, arr = projMemos(fresh).slice(), now = new Date().toISOString();
      if(cur){ arr = arr.map(function(m){ return m.id===cur.id ? Object.assign({}, m, {text:text, edited:now}) : m; }); }
      else{
        if(arr.length>=300){ toast("メモは1案件につき300件までです"); return; }
        arr.push({id:uid(), text:text, by:state.myName||"", at:now});
        // Firestoreは1ドキュメント約1MBまで（日本語は1文字3バイト）。案件データ本体の余裕を残す
        try{ if(new Blob([JSON.stringify(arr)]).size > 600000){ toast("メモの合計が大きすぎます。古いメモを整理してください"); return; } }catch(e){}
      }
      saveMemos(pid, arr, cur ? "メモを更新しました" : "メモを追加しました");
    });
    var d = document.getElementById("memo-del");
    if(d) d.addEventListener("click", function(){
      var fresh = state.projects.find(function(x){ return x.id===pid; }) || p;
      saveMemos(pid, projMemos(fresh).filter(function(m){ return m.id!==cur.id; }), "メモを削除しました");
    });
  }

  function bindMemberFormEvents(){
    var editing = state.editingMember;
    var picked = editing ? (editing.roles||[]).slice() : [];
    var c = document.getElementById("content");
    var submit = document.getElementById("f-submit");
    function refreshEnabled(){
      var ok = document.getElementById("f-mphone").value.trim() && document.getElementById("f-mname").value.trim() && document.getElementById("f-mpassword").value.trim() && picked.length>0;
      submit.disabled = !ok;
    }
    ["f-mphone","f-mname","f-mpassword"].forEach(function(id){ var el=document.getElementById(id); if(el) el.addEventListener("input", refreshEnabled); });
    bindPwToggle("f-mpassword-toggle", "f-mpassword");
    // 自社メンバー / 社外メンバーの切り替え（権限の選択肢・事業部・所属会社の入力欄が切り替わる）
    var mkind = editing ? (memberPermission(editing)==="external" ? "external" : "internal") : (state.newMemberExt ? "external" : "internal");
    var applyKind = function(){
      var ext = mkind==="external", sel = document.getElementById("f-mpermission");
      document.querySelectorAll("#f-mkind [data-mkind]").forEach(function(o){ o.classList.toggle("active", o.getAttribute("data-mkind")===mkind); });
      document.getElementById("f-mtitle").textContent = editing ? "メンバー編集" : (ext ? "社外メンバー登録" : "自社メンバー登録");
      document.getElementById("f-row-division").style.display = ext ? "none" : "";
      var comp = document.getElementById("f-mcompany"), st = document.getElementById("f-mcompany-static");
      if(comp) comp.style.display = (ext || editing) ? "" : "none";
      if(st) st.style.display = ext ? "none" : "";
      var list = PERMISSION_LEVELS.filter(function(x){ return ext ? x[0]==="external" : x[0]!=="external"; });
      var keep = sel.value;
      sel.innerHTML = list.map(function(x){ return '<option value="'+x[0]+'">'+x[1]+'</option>'; }).join("");
      sel.value = list.some(function(x){ return x[0]===keep; }) ? keep : (ext ? "external" : (editing && memberPermission(editing)!=="external" ? memberPermission(editing) : "general"));
    };
    document.querySelectorAll("#f-mkind [data-mkind]").forEach(function(o){ o.addEventListener("click", function(){ mkind = o.getAttribute("data-mkind"); applyKind(); }); });
    var rolesWrap = document.getElementById("f-mroles");
    if(rolesWrap) rolesWrap.querySelectorAll(".chip-toggle").forEach(function(chip){
      chip.addEventListener("click", function(){
        var r = chip.getAttribute("data-role-pick"); var idx = picked.indexOf(r);
        if(idx===-1){picked.push(r);chip.classList.add("on");} else {picked.splice(idx,1);chip.classList.remove("on");}
        refreshEnabled();
      });
    });
    if(submit) submit.addEventListener("click", function(){
      var name = document.getElementById("f-mname").value.trim();
      var phone = document.getElementById("f-mphone").value.trim();
      var password = document.getElementById("f-mpassword").value.trim();
      if(!name||!phone||!password||picked.length===0){ toast("携帯番号・氏名・職種・パスワードは必須です"); return; }
      if(phoneTaken(phone, state.editingMember ? (state.editingMember.id||state.editingMember) : null)){ toast("この携帯番号は他のメンバーに登録されています（ログインに使うため重複できません）"); return; }
      var perm = mkind==="external" ? "external" : document.getElementById("f-mpermission").value;
      if(perm==="external" && mkind!=="external") perm = "general";
      var data = Object.assign({
        name:name, phone:phone, kana:document.getElementById("f-mkana").value.trim(),
        email:document.getElementById("f-memail").value.trim(),
        company: (editing || mkind==="external") ? document.getElementById("f-mcompany").value.trim() : state.orgSettings.companyName,
        division: (mkind==="external" || document.getElementById("f-mdivision").value==="未選択") ? "" : document.getElementById("f-mdivision").value, roles:picked, password:password
      }, permissionFields(perm));
      if(!editing){
        writeDoc("members", null, data, "メンバーを登録しました", function(){ setTab("members"); });
        return;
      }
      // Never let the last remaining admin be demoted.
      var adminCount = state.members.filter(function(x){ return memberPermission(x)==="admin"; }).length;
      if(memberPermission(editing)==="admin" && perm!=="admin" && adminCount<=1){ toast("最後の管理者の権限は変更できません"); return; }
      var oldName = editing.name, id = editing.id;
      writeDoc("members", id, data, "メンバー情報を更新しました", function(){
        if(oldName!==name){ renameInProjects(oldName, name); if(state.myName===oldName){ state.myName=name; try{ localStorage.setItem("gc_myname", name); if(localStorage.getItem("gc_login_name")!==null) localStorage.setItem("gc_login_name", name); }catch(e){} } }
        if(state.myName===name) state.isAdmin = perm==="admin";
        state.editingMember = null;
        setTab("members");
      });
    });
  }

  // Projects reference assignees by name, so when a member is renamed the
  // same name is updated in every project's assignee list.
  function renameInProjects(oldName, newName){
    state.projects.forEach(function(p){
      var list = normalizeAssignees(p.assignees);
      if(!list.some(function(a){ return a.name===oldName; })) return;
      var updated = list.map(function(a){ return a.name===oldName ? Object.assign({}, a, {name:newName}) : a; });
      if(db) db.collection("projects").doc(p.id).update({assignees:updated, updatedAt:new Date().toISOString(), updatedBy:state.myName||""}).catch(function(){});
      else p.assignees = updated;
    });
  }

  /* ============ MEMBERS ============ */
  // Unified 3-tier permission: "admin" (管理者), "general" (一般), "external"

  // from whichever fields are present without needing a one-time migration.
  var PERMISSION_LEVELS = [["admin","管理者"],["general","一般"],["external","外部"]];
  function memberPermission(m){
    if(m.permission) return m.permission;
    if(m.isAdmin) return "admin";
    if(m.kind==="external") return "external";
    return "general";

  function permissionFields(p){
    // Keeps the legacy kind/isAdmin fields in sync with the new permission
    // field, so existing code that reads m.kind / m.isAdmin still works.
    return { permission:p, isAdmin: p==="admin", kind: p==="external"?"external":"internal" };
  }

  /* ============ 名刺管理（管理者のみ） ============ */
  // コレクション: cards。名刺の表・裏の写真は縮小したJPEGとしてそのまま書類内に保存する（1件あたり数百KB以内）。
  var CARD_CATS = ["取引先","仕入先・協力会社","見込み客","その他"];
  var CARD_IMG_MAX = 1200, CARD_IMG_BYTES = 330000;
  var cardDraft = {front:"", back:""}, cardOrig = {front:"", back:""};
  function cardFz(x){ return String(x||"").normalize("NFKC").toLowerCase().replace(/[\s　]/g,"").replace(/[ァ-ヶ]/g,function(ch){ return String.fromCharCode(ch.charCodeAt(0)-0x60); }); }
  function cardList(){
    var q = cardFz(state.cardQuery||""), cat = state.cardCat||"all", sort = state.cardSort||"new";
    var list = (state.cards||[]).filter(function(c){
      if(cat!=="all" && (c.category||"その他")!==cat) return false;
      if(!q) return true;
      return [c.name,c.kana,c.company,c.department,c.title,c.phone,c.mobile,c.email,c.address,c.memo,c.receivedBy].some(function(x){ return x && cardFz(x).indexOf(q)!==-1; });
    });
    var key = function(c){ return cardFz(sort==="company" ? (c.company||"") : (c.kana||c.name||"")); };
    list.sort(function(a,b){
      if(sort==="new") return (b.receivedDate||b.createdAt||"").localeCompare(a.receivedDate||a.createdAt||"");
      return key(a).localeCompare(key(b),"ja");
    });
    return list;
  }

  var CARD_OCR_LANGS = ["https://tessdata.projectnaptha.com/4.0.0_fast", "https://cdn.jsdelivr.net/npm/@tesseract.js-data/jpn@1.0.0/4.0.0_fast", "https://cdn.jsdelivr.net/npm/@tesseract.js-data/jpn@1.0.0/4.0.0_best_int"];
  function cardOcrLoad(){
    if(window.Tesseract) return Promise.resolve(window.Tesseract);
    if(cardOcrLib) return cardOcrLib;
    var tryLib = function(idx){
      return new Promise(function(res, rej){
        var sc = document.createElement("script"), to = setTimeout(function(){ sc.remove(); rej(new Error("timeout")); }, 20000);
        sc.src = CARD_OCR_LIBS[idx];
        sc.onload = function(){ clearTimeout(to); window.Tesseract ? res(window.Tesseract) : rej(new Error("load")); };
        sc.onerror = function(){ clearTimeout(to); sc.remove(); rej(new Error("load")); };
        document.head.appendChild(sc);
      }).catch(function(e){ if(idx+1<CARD_OCR_LIBS.length) return tryLib(idx+1); throw e; });
    };
    cardOcrLib = tryLib(0).catch(function(e){ cardOcrLib = null; throw e; });
    return cardOcrLib;
  }
  // 日本語データをダウンロードして OCR 用のワーカーを作る（進みが25秒止まったら次の配信元に切り替える）。作ったワーカーは使い回す
  function cardOcrWorker(T, onSt){
    if(cardWorkerP) return cardWorkerP;
    var attempt = function(idx){
      return new Promise(function(res, rej){
        var last = Date.now(), done = false, w = null;
        var tm = setInterval(function(){ if(!done && Date.now()-last>25000){ done = true; clearInterval(tm); try{ if(w) w.terminate(); }catch(e){} rej(new Error("stall")); } }, 2000);
        T.createWorker("jpn", 1, {
          langPath: CARD_OCR_LANGS[idx],
          logger: function(m){ last = Date.now(); onSt(m); },
          errorHandler: function(){}
        }).then(function(x){ w = x; if(done){ try{ x.terminate(); }catch(e){} return; } done = true; clearInterval(tm); res(x); },
          function(e){ if(done) return; done = true; clearInterval(tm); rej(e); });
      }).catch(function(e){ if(idx+1<CARD_OCR_LANGS.length) return attempt(idx+1); throw e; });
    };
    cardWorkerP = attempt(0).catch(function(e){ cardWorkerP = null; throw e; });
    return cardWorkerP;
  }
  function cardOcrPrep(u){
    return new Promise(function(res){
      var im = new Image();
      im.onload = function(){
        var s = Math.min(1, 1400/Math.max(im.width,im.height)), w = Math.round(im.width*s), h = Math.round(im.height*s);
        var cv = document.createElement("canvas"); cv.width = w; cv.height = h; var cx = cv.getContext("2d");
        cx.filter = "grayscale(1) contrast(1.25)"; cx.drawImage(im,0,0,w,h); res(cv);
      };
      im.onerror = function(){ res(u); }; im.src = u;
    });
  }
  function cardOcrRun(w, img){ return w.recognize(img).then(function(r){ return (r && r.data && r.data.text) || ""; }); }
  // OCRの生テキストから項目を推測する（足りない所は人が直す前提）
  function cardParse(text){
    var out = {}, used = {};
    var cjk = "[\u3040-\u30ff\u3400-\u9fff]";
    var lines = String(text||"").normalize("NFKC").split(/\r?\n/).map(function(l){
      return l.replace(new RegExp("(?<="+cjk+")\\s+(?="+cjk+")","g"),"").replace(/[|｜]/g," ").trim();
    }).filter(function(l){ return l.length>1; });
    var take = function(i){ used[i] = 1; };
    lines.forEach(function(l,i){
      var m;
      if(!out.email && (m = l.match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/))){ out.email = m[0]; }
      if(!out.website && (m = l.match(/(?:https?:\/\/)?(?:www\.)[A-Za-z0-9.\/_%-]+|https?:\/\/[A-Za-z0-9.\/_%-]+/i))){ out.website = m[0]; take(i); }
      if(/^(〒|\d{3}-\d{4})/.test(l) || /(都|道|府|県).{1,}(市|区|町|村|郡)/.test(l)){
        if(!out.address){ out.address = l.replace(/^〒?\s*/,"〒").replace(/^〒(?!\d)/,""); take(i); }
        return;
      }
      var isFax = /fax|ＦＡＸ|ファックス/i.test(l);
      var pl = l.split(/fax|ＦＡＸ|ファックス/i)[0];
      var pm = pl.match(/0\d{1,4}[-ー(（)）\s]{0,2}\d{1,4}[-ー)）\s]{0,2}\d{3,4}/);
      if(pm && /^\d{10,11}$/.test(pm[0].replace(/\D/g,""))){
        var num = pm[0].replace(/[ー()（）\s]/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"");
        if(/^0[789]0/.test(num.replace(/-/g,""))){ if(!out.mobile) out.mobile = num; } else if(!out.phone) out.phone = num;
        take(i);
      }
    });
    var kw = /(株式会社|有限会社|合同会社|㈱|\(株\)|（株）|Inc\.?|Co\.|Ltd|法人|組合|事務所|工務店|建設|工業|商事)/;
    var titleKw = /(?:代表取締役|取締役|代表|社長|会長|専務|常務|部長|次長|課長|係長|主任|店長|所長|支店長|マネージャー?|リーダー|主査|統括|担当|室長|チーフ|ディレクター)/;
    var deptKw = new RegExp("("+cjk+"+(部|課|室|支店|営業所|事業所|チーム|グループ|センター))$");
    lines.forEach(function(l,i){
      if(used[i]) return;
      if(!out.company && kw.test(l) && l.length<=40){ out.company = l; take(i); return; }
      if(!out.title && titleKw.test(l) && l.length<=30 && !/\d{4}/.test(l)){
        var tk = "(?:"+titleKw.source+")+", mm = l.match(new RegExp("^("+tk+")(.*)$")) || l.match(new RegExp("^(.*?)("+tk+")$"));
        var tpart = l, rest = "";
        if(mm){ if(new RegExp("^"+tk).test(l)){ tpart = mm[1]; rest = mm[2]; } else { tpart = mm[2]; rest = mm[1]; } }
        var okName = new RegExp("^"+cjk+"{3,8}$").test(rest) && !kw.test(rest);
        out.title = (rest && !okName) ? l : tpart; take(i);
        if(!out.name && okName) out.name = rest;
        return;
      }
      if(!out.department && deptKw.test(l) && l.length<=24){ out.department = l; take(i); }
    });
    var kata = function(s){ return s.replace(/[\u30a1-\u30f6]/g,function(ch){ return String.fromCharCode(ch.charCodeAt(0)-0x60); }); };
    lines.forEach(function(l,i){
      if(used[i]) return;
      var core = l.replace(/\s/g,"");
      if(!out.kana && /^[\u3040-\u30ffー・]{3,20}$/.test(core) && /[\u3040-\u30ff]/.test(core) && !kw.test(l)){ out.kana = kata(l); take(i); return; }
      if(!out.name && new RegExp("^"+cjk+"{2,8}$").test(core) && !/[\d]/.test(core) && !kw.test(l) && !titleKw.test(l) && !deptKw.test(l) && !/(都|道|府|県|市|区|町|村)$/.test(core)){ out.name = l.length<=5 ? l : l; take(i); }
    });
    return out;
  }
  function cardOcrStart(){
    var side = cardDraft.front ? "front" : (cardDraft.back ? "back" : "");
    if(!side){ toast("先に名刺の写真を追加してください"); return; }
    var btn = document.getElementById("card-ocr-btn"), st = document.getElementById("card-ocr-status");
    var setSt = function(t){ if(st) st.textContent = t; };
    if(btn) btn.disabled = true;
    var srcs = [cardDraft.front, cardDraft.back].filter(Boolean);
    var stMap = function(m){
      var p = Math.round((m.progress||0)*100), t = m.status||"";
      if(/core/.test(t)) setSt("OCRエンジンを読み込み中…");
      else if(/language|traineddata/.test(t)) setSt("日本語データをダウンロード中… "+p+"%（初回だけ時間がかかります）");
      else if(/initializ/.test(t)) setSt("準備中…");
      else if(/recogniz/.test(t)) setSt("文字を読み取り中… "+p+"%");
    };
    setSt("OCRを読み込み中…");
    cardOcrLoad().then(function(T){
      return cardOcrWorker(T, stMap);
    }).then(function(w){
      var all = "", chain = Promise.resolve();
      srcs.forEach(function(u){
        chain = chain.then(function(){ return cardOcrPrep(u); }).then(function(img){ return cardOcrRun(w, img); }).then(function(t){ all += "\n"+t; });
      });
      // 使い終わったらワーカー（数百MBのメモリを使う）を必ず閉じる。スマホのメモリ不足で画面が落ちるのを防ぐ
      var close = function(){ cardWorkerP = null; try{ w.terminate(); }catch(e){} };
      return chain.then(function(){ close(); return all; }, function(e){ close(); throw e; });
    }).then(function(text){
      var r = cardParse(text), map = {name:"f-card-name",kana:"f-card-kana",company:"f-card-company",department:"f-card-dept",title:"f-card-title",phone:"f-card-phone",mobile:"f-card-mobile",email:"f-card-email",address:"f-card-addr",website:"f-card-web"};
      var filled = 0;
      Object.keys(map).forEach(function(k){ var el = document.getElementById(map[k]); if(el && r[k] && !el.value.trim()){ el.value = r[k]; filled++; } });
      var raw = document.getElementById("card-ocr-raw"); if(raw){ raw.value = text.trim(); raw.parentNode.style.display = ""; }
      var sb = document.getElementById("f-card-submit"), ne = document.getElementById("f-card-name"); if(sb && ne) sb.disabled = !ne.value.trim() && !cardDraft.front;
      setSt(filled ? filled+"項目を入力しました。読み間違いがないか確認してください" : (text.trim() ? "項目を判別できませんでした。下の読み取り結果を見ながら入力してください" : "文字を読み取れませんでした。明るい場所でまっすぐ撮影した写真でお試しください"));
    }).catch(function(){
      setSt("OCRを読み込めませんでした。通信状況を確認して、もう一度お試しください（会社の回線などで外部サイトへの接続が制限されている場合は使えません。その場合は手入力してください）");
    }).then(function(){ if(btn) btn.disabled = false; });
  }

  function renderFiles(){
    if(!state.loaded.files || !state.loaded.projects) return skeleton();
    var f = state.filesFilter;
    var list = state.files.filter(function(x){
      if(!fileVisible(x) || !projectVisibleId(x.projectId)) return false;
      if(f.project!=="all" && x.projectId!==f.project) return false;
      if(f.kind==="image" && !isMediaFile(x)) return false;
      if(f.kind==="other" && isMediaFile(x)) return false;
      return true;
    });
    var fso = state.filesSort || "date_desc";
    var pname = function(x){ var q = state.projects.find(function(p){ return p.id===x.projectId; }); return q ? (q.name||"") : ""; };
    list.sort(function(a,b){
      var c;
      if(fso==="date_asc") c = (a.uploadedAt||"").localeCompare(b.uploadedAt||"");
      else if(fso==="name") c = String(a.filename||"").localeCompare(String(b.filename||""), "ja");
      else if(fso==="project") c = pname(a).localeCompare(pname(b), "ja") || (b.uploadedAt||"").localeCompare(a.uploadedAt||"");
      else if(fso==="size") c = (b.size||0)-(a.size||0);
      else c = (b.uploadedAt||"").localeCompare(a.uploadedAt||"");

  /* ---- ダウンロード（単体は直接、複数はZIP） ---- */
  var CRC_T = null;
  function crc32(u8){
    if(!CRC_T){ CRC_T = []; for(var n=0;n<256;n++){ var c=n; for(var k=0;k<8;k++) c = c&1 ? (0xEDB88320^(c>>>1)) : (c>>>1); CRC_T[n]=c>>>0; } }
    var crc = 0xFFFFFFFF; for(var i=0;i<u8.length;i++) crc = CRC_T[(crc^u8[i])&0xFF]^(crc>>>8);
    return (crc^0xFFFFFFFF)>>>0;
  }
  // 無圧縮(store)のZIPを作る。写真は既に圧縮済みなので十分。entries: [{name, data:Uint8Array}]
  function makeZip(entries){
    var enc = new TextEncoder(), parts = [], cd = [], off = 0, dt = new Date();
    var dosT = (dt.getHours()<<11)|(dt.getMinutes()<<5)|(dt.getSeconds()>>1), dosD = ((dt.getFullYear()-1980)<<9)|((dt.getMonth()+1)<<5)|dt.getDate();
    entries.forEach(function(e){
      var nm = enc.encode(e.name), crc = crc32(e.data), sz = e.data.length;
      var lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
      lh.setUint16(10,dosT,true); lh.setUint16(12,dosD,true); lh.setUint32(14,crc,true); lh.setUint32(18,sz,true); lh.setUint32(22,sz,true); lh.setUint16(26,nm.length,true); lh.setUint16(28,0,true);
      parts.push(lh.buffer, nm, e.data);
      var ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true);
      ch.setUint16(12,dosT,true); ch.setUint16(14,dosD,true); ch.setUint32(16,crc,true); ch.setUint32(20,sz,true); ch.setUint32(24,sz,true); ch.setUint16(28,nm.length,true);
      ch.setUint32(42,off,true);
      cd.push(ch.buffer, nm);
      off += 30+nm.length+sz;
    });
    var cdSize = 0; cd.forEach(function(x){ cdSize += x.byteLength||x.length; });
    var end = new DataView(new ArrayBuffer(22));
    end.setUint32(0,0x06054b50,true); end.setUint16(8,entries.length,true); end.setUint16(10,entries.length,true); end.setUint32(12,cdSize,true); end.setUint32(16,off,true);
    return new Blob(parts.concat(cd,[end.buffer]), {type:"application/zip"});
  }
  function safeName(n){ return String(n||"ファイル").replace(/[\\/:*?"<>|]/g,"_"); }
  // list: ファイルdoc配列。dirOf(f): ZIP内のフォルダ名（任意）
  function dir2(d){ return String(d||"").split("/").filter(Boolean).map(safeName).join("/"); }
  function downloadFiles(list, zipName, dirOf){
    if(!list.length){ toast("ダウンロードするファイルがありません"); return; }
    var getBlob = fileBlob;
    if(list.length===1){
      return getBlob(list[0]).then(function(b){ downloadBlob(safeName(list[0].filename), b); toast("ダウンロードしました"); }).catch(function(){ toast("ダウンロードに失敗しました"); });
    }
    var entries = [], used = {}, failed = 0, i = 0;
    var next = function(){
      if(i>=list.length) return Promise.resolve();
      var f = list[i++]; toast("ダウンロード準備中… "+i+" / "+list.length);
      return getBlob(f).then(function(b){ return b.arrayBuffer(); }).then(function(buf){
        var dir = dirOf ? dir2(dirOf(f)) : "", base = safeName(f.filename), path = (dir?dir+"/":"")+base, k = 1;
        while(used[path]){ var dot = base.lastIndexOf("."); path = (dir?dir+"/":"")+(dot>0?base.slice(0,dot)+"("+(++k)+")"+base.slice(dot):base+"("+(++k)+")"); }
        used[path] = true; entries.push({name:path, data:new Uint8Array(buf)});
      }).catch(function(){ failed++; }).then(next);
    };
    return next().then(function(){
      if(!entries.length){ toast("ダウンロードに失敗しました"); return; }
      downloadBlob(safeName(zipName)+"-"+todayISO()+".zip", makeZip(entries));
      toast(entries.length+"件をダウンロードしました"+(failed?"（"+failed+"件は取得できませんでした）":""));
    });
  }

  function fmtSize(n){
    n = n||0;

  /* 保存済みの大きい写真を、見た目をほぼ変えずに軽くする（読み込みが速くなる）。管理者が案件ごとに実行 */

  // いま選択中のファイル（案件のファイル画面のチェック／一括編集の選択）
  function lightenSelection(){

    var only = function(){ var e = document.getElementById("lt-scope"); return (sel && (!e || e.value==="sel")) ? sel : null; };

    document.getElementById("lt-go").addEventListener("click", function(){

      var list = lightenCandidates(projectId, min, only());
      if(!list.length){ toast("対象の写真がありません"); return; }
      var stop = false, i = 0, saved = 0, done = 0;
      openModal("写真を軽量化中", '<div id="lt-prog" style="font-size:14px;padding:6px 0">準備中…</div><div style="height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:8px"><div id="lt-bar" style="height:100%;width:0;background:var(--primary,#175c40)"></div></div>', '<button class="btn" id="lt-stop" style="color:var(--danger)">中止する</button>');

        fetch(f.url).then(function(r){ return r.blob(); }).then(function(b){ return shrinkImage(b, side, q, 1e9); }).then(function(out){

            return db.collection("files").doc(f.id).update({url:out, size:Math.round(out.length*0.75), lightenedAt:new Date().toISOString()});

  /* アップロード: claude.ai の assets が無い環境(Vercel等)では、画像は縮小して
     データURLとして保存する(Firestore 1ドキュメント約1MBの制限内)。 */
  var INLINE_MAX = 900000, PHOTO_TARGET = 300000;
  function readAsDataURL(blob){ return new Promise(function(ok,ng){ var r=new FileReader(); r.onload=function(){ok(r.result);}; r.onerror=function(){ng(r.error);}; r.readAsDataURL(blob); }); }
  function shrinkImage(file, side0, q0, max0){
    return new Promise(function(ok,ng){
      var u=URL.createObjectURL(file), img=new Image();
      img.onload=function(){
        URL.revokeObjectURL(u);
        var side=side0||1280, q=q0||0.74, out=null, lim=max0||PHOTO_TARGET;
        for(var i=0;i<8;i++){
          var sc=Math.min(1, side/Math.max(img.width,img.height));
          var cv=document.createElement("canvas"); cv.width=Math.max(1,Math.round(img.width*sc)); cv.height=Math.max(1,Math.round(img.height*sc));
          cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
          out=cv.toDataURL("image/jpeg",q);
          if(out.length<=lim || (i>=5 && out.length<=INLINE_MAX)) return ok(out);
          side=Math.round(side*0.75); q=Math.max(0.5,q-0.07);
        }
        ng(new Error("too large"));
      };
      img.onerror=function(){ URL.revokeObjectURL(u); ng(new Error("img")); };
      img.src=u;
    });
  }
  /* アップロード時の写真サイズ（選んだ内容はこの端末に覚えておく） */
  var UP_SIZES = [
    {n:"高画質（長辺2000px）", side:2000, q:0.85, max:900000},
    {n:"やや高画質（長辺1600px）", side:1600, q:0.8, max:500000},
    {n:"標準（長辺1280px）", side:1280, q:0.74, max:300000},
    {n:"軽め（長辺1024px）", side:1024, q:0.7, max:200000},
    {n:"小さめ（長辺800px）", side:800, q:0.65, max:150000}
  ];
  /* 写真のサイズは、管理画面で全員共通に設定する（settings/photo）。未設定なら「標準」 */
  state.photoCfg = {up:2, side:1280, q:0.74, min:400};
  function upOpt(){ var i = Number(state.photoCfg.up); return UP_SIZES[(i>=0 && i<UP_SIZES.length) ? i : 2]; }
  function loadPhotoCfg(){
    if(!db) return;
    db.doc("settings/photo").get().then(function(snap){
      var d = snap.exists ? snap.data() : null;
      if(d){ state.photoCfg = Object.assign({}, state.photoCfg, {up:d.up, side:d.side, q:d.q, min:d.min}); if(state.tab==="settings") render(); }
    }).catch(function(){});
  }
  function pickUploadSize(files, cb){ cb(); }   // サイズは管理画面の設定に従う（アップロード時の選択は行わない）
  function uploadBlob(file){
    if(assetsCap) return assetsCap.upload(file);
    var isImg=(file.type||"").indexOf("image/")===0 && file.type!=="image/svg+xml" && file.type!=="image/gif";
    var p = isImg ? shrinkImage(file, upOpt().side, upOpt().q, upOpt().max) : readAsDataURL(file).then(function(d){ if(d.length>INLINE_MAX) throw new Error("too large"); return d; });
    return p.then(function(d){ return {id:null, url:d, contentType: isImg?"image/jpeg":file.type, sizeBytes:file.size}; });
  }
  function uploadFail(e){ toast(e && e.message==="too large" ? "ファイルが大きすぎます（画像以外は約650KBまで）" : "アップロードに失敗しました"); }

  /* 大きいファイル(PDF等)：claude.ai の assets が無い環境では、約600KBずつに分けて fileChunks に保存する */
  var CHUNK_RAW = 600*1024, CHUNK_FILE_MAX = 10*1024*1024, VIDEO_FILE_MAX = 30*1024*1024;
  function isShrinkable(file){ var t=file.type||""; return t.indexOf("image/")===0 && t!=="image/svg+xml" && t!=="image/gif"; }
  function uploadChunked(projectId, file, folderId){
    var p = state.projects.find(function(x){return x.id===projectId;});
    var vid = isVideoFile({contentType:file.type, filename:file.name});
    if(file.size>(vid?VIDEO_FILE_MAX:CHUNK_FILE_MAX)){ toast("ファイルが大きすぎます（"+(vid?"動画は30MB":"10MB")+"まで。動画は短く撮るか、画質を下げて撮影してください）"); return; }
    var id = uid(), n = Math.ceil(file.size/CHUNK_RAW), done = 0;
    toast("アップロード中… 0/"+n);
    var chain = Promise.resolve();
    for(var i=0;i<n;i++) (function(i){
      chain = chain.then(function(){
        return readAsDataURL(file.slice(i*CHUNK_RAW,(i+1)*CHUNK_RAW)).then(function(d){
          return db.doc("fileChunks/"+id+"_"+i).set({data:d.slice(d.indexOf(",")+1), i:i});
        }).then(function(){ done++; toast("アップロード中… "+done+"/"+n); });
      });
    })(i);
    chain.then(function(){
      return db.collection("files").doc(id).set({projectId:projectId, projectName:p?p.name:"", folderId:folderId||null, chunked:true, chunks:n,
        filename:file.name||"ファイル", contentType:(vid?videoType(file):file.type)||"application/octet-stream", size:file.size||0, uploadedAt:new Date().toISOString(), uploadedBy:state.myName||""});
    }).then(function(){ toast((vid?"動画":"写真・ファイル")+"を追加しました"); }).catch(function(e){
      for(var i=0;i<n;i++) db.doc("fileChunks/"+id+"_"+i).delete().catch(function(){});
      toast("アップロードに失敗しました"+(e&&e.code==="resource-exhausted"?"（データベースの上限）":""));
    });
  }
  // 保存できなかった変更は、消えない赤い帯で知らせる（そのまま画面を閉じない）／送信待ちのあいだは「保存中」を表示する
  window.__writeFail = function(e){
    try{
      toast("保存が反映されませんでした"+(e&&e.code?"（"+e.code+"）":""));
      var b = document.getElementById("save-problem");
      if(!b){ b = document.createElement("div"); b.id = "save-problem"; b.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:99999;background:#c0392b;color:#fff;padding:10px 14px;font-size:13px;line-height:1.6;display:flex;gap:10px;align-items:flex-start"; document.body.appendChild(b); }
      b.innerHTML = '<span style="flex:1">⚠ サーバーに保存できなかった変更があります'+(e&&e.code?'（'+esc(e.code)+'）':'')+'。画面の表示が元に戻ることがあります。通信状況を確認して、もう一度操作してください。</span><button type="button" style="flex:none;background:#fff;color:#c0392b;border:0;border-radius:6px;padding:4px 10px;font-weight:700" onclick="this.parentNode.remove()">閉じる</button>';
    }catch(x){}
  };
  (function(){
    var chip = null, tm = null;
    window.__pendUi = function(){
      var n = window.__pend||0;
      if(n<=0){ clearTimeout(tm); tm = null; if(chip){ chip.remove(); chip = null; } return; }
      if(chip || tm) { if(chip) chip.textContent = "サーバーに保存中… ("+n+"件)"; return; }
      tm = setTimeout(function(){ tm = null; if((window.__pend||0)<=0) return; chip = document.createElement("div"); chip.style.cssText = "position:fixed;right:12px;bottom:84px;z-index:99998;background:#7a5a00;color:#fff;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.25)"; chip.textContent = "サーバーに保存中… ("+window.__pend+"件)"; document.body.appendChild(chip); }, 2000);
    };
    window.addEventListener("beforeunload", function(e){ if((window.__pend||0)>0){ e.preventDefault(); e.returnValue = ""; } });
  })();
  function uploadProjectFile(projectId, file, folderId){
    var p = state.projects.find(function(x){return x.id===projectId;});
    if(!assetsCap && db && !isShrinkable(file) && (file.size>600000 || isVideoFile({contentType:file.type, filename:file.name}))){ uploadChunked(projectId, file, folderId); return; }
    toast("アップロード中…");
    uploadBlob(file).then(function(res){
      writeDoc("files", null, {
        projectId: projectId,
        projectName: p?p.name:"",
        folderId: folderId||null,
        assetId: res.id,
        url: res.url||null,

        contentType: res.contentType||file.type||"",
        size: file.size||0,
        uploadedAt: new Date().toISOString(),
        uploadedBy: state.myName||""
      }, "写真・ファイルを追加しました");
    }).catch(uploadFail);
  }

  document.addEventListener("click", function(ev){ var b = ev.target.closest && ev.target.closest("[data-proj-loadall]"); if(b){ b.disabled = true; loadAllProjects(); } });

  /* ============ オートコンプリート（入力すると候補が出る） ============
     ・件数の多いプルダウン（案件・担当者・都道府県など）は、入力して絞り込める欄に自動で変わる
     ・会社名の欄には、登録済みの会社名の候補を表示する */
  var ACNZ = function(x){ return String(x||"").normalize("NFKC").toLowerCase().replace(/[\s\u3000]/g,""); };
  function acDropdown(inp, getItems, onPick){
    var wrap = inp.parentNode; if(getComputedStyle(wrap).position==="static") wrap.style.position = "relative";
    var box = document.createElement("div");
    box.style.cssText = "display:none;position:absolute;left:0;right:0;top:100%;z-index:80;background:var(--surface,#fff);border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.14);max-height:260px;overflow:auto;margin-top:2px;text-align:left;";
    wrap.appendChild(box);
    var cur = -1, shown = [];
    var hide = function(){ box.style.display = "none"; cur = -1; };
    var paint = function(){ Array.prototype.forEach.call(box.children, function(el,i){ el.style.background = i===cur ? "var(--surface-2,#eef3f0)" : ""; }); };
    var show = function(all){
      var q = all ? "" : ACNZ(inp.value);
      shown = getItems().filter(function(it){ return !q || ACNZ(it.label).indexOf(q)!==-1; }).slice(0, 60);
      if(!shown.length){ hide(); return; }
      box.innerHTML = shown.map(function(it,i){ return '<div data-i="'+i+'" style="padding:8px 10px;cursor:pointer;font-size:13px;border-top:'+(i?'1px solid var(--border)':'none')+'">'+esc(it.label)+'</div>'; }).join("");
      box.style.display = "block"; cur = -1;
      Array.prototype.forEach.call(box.children, function(el){ el.addEventListener("mousedown", function(ev){ ev.preventDefault(); pick(Number(el.getAttribute("data-i"))); }); });
    };
    var pick = function(i){ var it = shown[i]; if(!it) return; hide(); onPick(it); };
    inp.addEventListener("input", function(){ show(false); });
    inp.addEventListener("focus", function(){ show(inp.dataset.acAll==="1"); });
    inp.addEventListener("click", function(){ if(box.style.display==="none") show(inp.dataset.acAll==="1"); });
    inp.addEventListener("blur", function(){ setTimeout(hide, 130); });
    inp.addEventListener("keydown", function(e){
      if(box.style.display==="none") return;
      if(e.key==="ArrowDown"){ e.preventDefault(); cur = Math.min(shown.length-1, cur+1); paint(); }
      else if(e.key==="ArrowUp"){ e.preventDefault(); cur = Math.max(0, cur-1); paint(); }
      else if(e.key==="Enter"){ if(cur>=0 || shown.length===1){ e.preventDefault(); pick(cur>=0?cur:0); } }
      else if(e.key==="Escape"){ hide(); }

  function loadChatMsgs(chatId){
    if(!db){ state.chatMsgs[chatId] = (SAMPLE_MSGS[chatId] || []).map(function(m){ return m.id ? m : Object.assign({id:uid()}, m); }); render(); return; }
    db.collection("chats").doc(chatId).collection("messages").orderBy("ts").limit(200).onSnapshot(function(snap){
      state.chatMsgs[chatId] = snap.docs.map(toObj);
      if(state.activeChat===chatId) render();

  function ensureProjectChat(project, cb){
    var existing = state.chats.find(function(c){return c.projectId===project.id;});
    if(existing){ cb(existing.id); return; }
    var data = {name:project.name, kind:"project", projectId:project.id, updatedAt:new Date().toISOString()};
    if(!db){ data.id=uid(); state.chats.unshift(data); cb(data.id); return; }
    db.collection("chats").add(data).then(function(ref){ cb(ref.id); }).catch(function(){ toast("チャットの作成に失敗しました"); });
  }

  /* ============ SETTINGS ============ */
  // 設定 has three sections: 会社情報 (everyone can view, admins edit),
  // 個人情報 (each person edits only their own record), and 管理画面
  // (admins only: stats, permission/password management, backup).
  function settingsSections(){
    var s = state.isAdmin ? [["company","会社情報"],["personal","個人情報"]] : [["personal","個人情報"]];   // 会社情報は管理者のみ
    if(state.isAdmin){ s.push(["admin","管理画面"]); s.push(["loginlog","ログイン履歴"]); s.push(["master","マスタ管理"]); s.push(["trash","ゴミ箱"]); }
    if(worksAvailable()) s.push(["works","LINE WORKS"]);
    if(state.isAdmin){ s.push(["freee","freee連携"]); s.push(["backup","バックアップ"]); }
    return s;
  }
  function myMember(){
    if(!state.myName) return null;
    return state.members.find(function(m){ return m.name===state.myName; }) || null;
  }
  function renderSettings(){
    var sections = settingsSections();
    // 「個人情報」は設定のタブには出さず、画面右上の名前から開く
    var tabs = sections.filter(function(x){ return x[0]!=="personal"; });
    // LINE WORKSとfreeeは「連携」の1つのタブにまとめる
    var integ = tabs.filter(function(x){ return x[0]==="works" || x[0]==="freee"; }), integIdx = -1;
    if(integ.length){
      tabs.forEach(function(x,i){ if(integIdx<0 && (x[0]==="works"||x[0]==="freee")) integIdx = i; });
      tabs = tabs.filter(function(x){ return x[0]!=="works" && x[0]!=="freee"; });
      tabs.splice(integIdx, 0, ["integ","連携"]);
    }
    var inInteg = state.settingsSeg==="works" || state.settingsSeg==="freee";
    if(state.settingsSeg==="personal" && !state.personalOpen && tabs.length) state.settingsSeg = tabs[0][0];
    if(!sections.some(function(x){return x[0]===state.settingsSeg;})) state.settingsSeg = sections[0][0];
    if(state.settingsSeg!=="admin") state.navDraft = null;
    var html = '<h1 class="pagetitle">'+(state.settingsSeg==="personal"?"個人情報":"設定")+'</h1><div style="height:14px"></div>';
    if(tabs.length && state.settingsSeg!=="personal") html += '<div class="segmented" style="margin-bottom:16px">'+tabs.map(function(x){
      return '<div class="segopt'+((state.settingsSeg===x[0] || (x[0]==="integ" && inInteg))?" active":"")+'" data-setseg="'+x[0]+'">'+((x[0]==="company"||x[0]==="admin"||x[0]==="integ"||x[0]==="loginlog"||x[0]==="freee"||x[0]==="master"||x[0]==="trash"||x[0]==="backup")?iAdmin():'')+x[1]+'</div>';
    }).join("")+'</div>';
    if(inInteg && integ.length>1) html += '<div class="admtabs">'+integ.map(function(x){ return '<div class="admtab'+(state.settingsSeg===x[0]?" active":"")+'" data-setseg="'+x[0]+'">'+x[1].replace(/連携$/,"")+'</div>'; }).join("")+'</div>';
    if(state.settingsSeg==="personal") html += renderSettingsPersonal();
    else if(state.settingsSeg==="admin") html += renderSettingsAdmin();
    else if(state.settingsSeg==="loginlog") html += renderSettingsLoginLog();
    else if(state.settingsSeg==="freee") html += renderSettingsFreee();
    else if(state.settingsSeg==="works") html += renderSettingsWorks();
    else if(state.settingsSeg==="master") html += renderSettingsMaster();
    else if(state.settingsSeg==="trash") html += renderSettingsTrash();
    else if(state.settingsSeg==="backup") html += renderSettingsBackup();
    else html += renderSettingsCompany();
    return html;
  }

  // ---- マスタ管理 ---------------------------------------------------------
  // 選択肢（案件種類・職種・物件種類・物件構造）を管理者が編集できる。
  // 元の配列を“その場で”書き換えるので、画面側のコードは変更不要。保存先: settings/master
  var REPORT_TYPES = ["作業報告書","日報","進捗報告書","完了報告書","是正・指摘事項報告書"];
  var MASTERS = [
    {key:"statuses", label:"案件進捗", arr:STATUS_LIST, note:"案件の進捗（一覧の絞り込み・登録画面）に出ます。契約済・施工中・施工完了・清算済・失注は集計に使うため削除できません。色は自動で付きます"},
    {key:"projectTypes", label:"案件種類", arr:PROJECT_TYPES, note:"案件の登録・編集の「案件種類」に出ます"},
    {key:"divisions", label:"事業部", arr:DIVISIONS, note:"自社メンバーの「事業部」に出ます"},
    {key:"roles", label:"職種", arr:ROLES, note:"メンバーの「職種」に出ます"},
    {key:"propertyTypes", label:"物件種類", arr:PROPERTY_TYPES, note:"物件情報の「物件種類」に出ます"},
    {key:"propertyStructures", label:"物件構造", arr:PROPERTY_STRUCTURES, note:"物件情報の「構造」に出ます"},
    {key:"stepNames", label:"工程名", arr:STEP_NAMES, note:"工程表の「工程を追加」で、入力欄の候補として出ます（工程名は自由に入力できます）"},
    {key:"eventTypes", label:"予定の種類", arr:EVENT_TYPES, note:"カレンダーの「予定を追加」で選ぶ種類に出ます"},
    {key:"reportTypes", label:"報告書の種類", arr:REPORT_TYPES, note:"報告書の「報告書を作成」で選ぶ種類と、一覧の絞り込みに出ます"}
  ];
  // 画面ごとのタブ
  var MASTER_TABS = [
    ["project","案件",["statuses"]],
    ["property","物件情報",["propertyTypes","propertyStructures"]],
    ["member","メンバー",["divisions","roles"]],
    ["schedule","工程表",["stepNames"]],
    ["calendar","カレンダー",["eventTypes"]],
    ["reports","報告書",["reportTypes"]]
  ];
  var MASTER_DEFAULTS = {};
  MASTERS.forEach(function(m){ MASTER_DEFAULTS[m.key] = m.arr.slice(); });
  function applyMasters(d){
    var rolesDefault = MASTER_DEFAULTS.roles || [];
    MASTERS.forEach(function(m){
      if(d && Array.isArray(d[m.key]) && d[m.key].length){
        var list = d[m.key].slice();
        // 職種を増やした版: 保存済みのマスタに、新しい職種を一度だけ追加する（以後は管理者の編集どおり）
        if(m.key==="roles" && d.rolesMerged!==1) rolesDefault.forEach(function(r){ if(list.indexOf(r)===-1) list.push(r); });
        m.arr.length = 0; Array.prototype.push.apply(m.arr, list);
      }
    });
    syncStatusFilters();
  }
  // 進捗の追加・削除に合わせて、一覧の絞り込み（チェック済み進捗）を揃える
  function syncStatusFilters(){
    var prev = syncStatusFilters._prev || MASTER_DEFAULTS.statuses;
    var f = state.salesFilter;
    f.status = STATUS_LIST.filter(function(x){ return f.status.indexOf(x)!==-1 || prev.indexOf(x)===-1; });
    state.constFilter.status = state.constFilter.status.filter(function(x){ return STATUS_LIST.indexOf(x)!==-1; });
    syncStatusFilters._prev = STATUS_LIST.slice();
  }
  function loadMasters(){
    if(!db) return;
    db.doc("settings/master").get().then(function(snap){ if(snap.exists){ applyMasters(snap.data()); render(); } }).catch(function(){});
  }
  function masterUsage(m, name){
    var n = 0;
    if(m.key==="projectTypes") n = rawStore.projects.filter(function(p){return p.type===name;}).length;
    else if(m.key==="statuses") n = rawStore.projects.filter(function(p){return p.status===name;}).length;
    else if(m.key==="divisions") n = state.members.filter(function(x){return x.division===name;}).length;
    else if(m.key==="roles") n = state.members.filter(function(x){return (x.roles||[]).indexOf(name)!==-1;}).length;
    else if(m.key==="propertyTypes") n = rawStore.projects.filter(function(p){return p.propertyType===name;}).length;
    else if(m.key==="reportTypes") n = state.reports.filter(function(x){return x.type===name;}).length;
    else if(m.key==="eventTypes") n = state.events.filter(function(x){return x.category===name;}).length;
    else if(m.key==="propertyStructures") n = rawStore.projects.filter(function(p){return p.propertyStructure===name;}).length;
    return n;
  }
  function renderSettingsTrash(){
    if(!state.isAdmin) return emptyState(iBox,"管理者のみ閲覧できます","");
    if(!state.loaded.trash) return skeleton();
    var t = state.trashType||"all";
    var all = state.trash.slice().sort(function(a,b){ return (b.deletedAt||"").localeCompare(a.deletedAt||""); });
    var list = all.filter(function(x){ return t==="all" || x.col===t; });
    var html = '<div style="font-size:12px;color:var(--ink-faint);line-height:1.7;max-width:760px;margin-bottom:12px">削除したデータはここに残り、「元に戻す」で復元できます。「完全に削除」するとデータは消えて復元できません。</div>';
    html += '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">'+
      '<select id="trash-type" style="width:auto"><option value="all">すべての種類（'+all.length+'件）</option>'+Object.keys(TRASH_TYPES).map(function(k){ var n=all.filter(function(x){return x.col===k;}).length; return n?'<option value="'+k+'"'+(t===k?' selected':'')+'>'+TRASH_TYPES[k]+'（'+n+'件）</option>':''; }).join("")+'</select><span style="flex:1"></span>'+
      (list.length?'<button class="btn outline" id="trash-empty" style="color:var(--danger)">'+iAdmin()+iTrash()+' '+(t==="all"?'ゴミ箱を空にする':TRASH_TYPES[t]+'をすべて完全に削除')+'</button>':'')+'</div>';

  // マスタから項目を削除すると、その項目を使っていた登録済みデータは「未入力」に変わる。
  var MASTER_FIELDS = {
    statuses:[["projects","status"]], projectTypes:[["projects","type"]],
    propertyTypes:[["projects","propertyType"]], propertyStructures:[["projects","propertyStructure"]],
    divisions:[["members","division"]], roles:[["members","roles"]], eventTypes:[["events","category"]], reportTypes:[["reports","type"]]
  };
  function masterAffected(key, removed){
    var out = [];
    (MASTER_FIELDS[key]||[]).forEach(function(cf){
      var col = cf[0], fld = cf[1], rows = col==="projects" ? rawStore.projects : state[col];
      rows.forEach(function(r){
        if(fld==="roles"){
          var cur = r.roles||[]; var next = cur.filter(function(x){ return removed.indexOf(x)===-1; });
          if(next.length!==cur.length){ out.push({col:col,id:r.id,data:{roles:next}}); }
        }else if(removed.indexOf(r[fld])!==-1){ var d2={}; d2[fld]=""; out.push({col:col,id:r.id,data:d2}); }
      });
    });
    return out;
  }
  function saveMaster(key, list, msg, confirmed){
    var m = MASTERS.find(function(x){return x.key===key;});
    if(!state.isAdmin){ toast("マスタの変更は管理者のみ行えます"); return; }
    var removed = m.arr.filter(function(n){ return list.indexOf(n)===-1; });
    var affected = masterAffected(key, removed);
    var payload = {}; MASTERS.forEach(function(x){ payload[x.key] = x.key===key ? list : x.arr.slice(); });
    payload.updatedAt = new Date().toISOString();
    payload.rolesMerged = 1;
    var run = function(){
      var finish = function(){
        m.arr.length = 0; Array.prototype.push.apply(m.arr, list);
        if(key==="statuses") syncStatusFilters();
        toast(msg + (affected.length ? "（"+affected.length+"件のデータを「未入力」に変更しました）" : "")); render();
      };
      var writes = affected.map(function(a){ return saveRaw(a.col, a.id, a.data); });
      var saveDoc = db ? db.doc("settings/master").set(payload) : Promise.resolve();
      Promise.all(writes.concat([saveDoc])).then(finish).catch(function(){ toast("保存に失敗しました"); });
    };
    if(affected.length && !confirmed){
      confirmDelete("「"+removed.filter(function(n){ return masterAffected(key,[n]).length; }).join("」「")+"」を削除します。使用中の登録済みデータ "+affected.length+"件 は「未入力」に変わります。", run);
    }else run();
  }
  var LOGIN_KIND = {login:["ログイン",""], auto:["自動ログイン","muted"], fail:["失敗","danger"]};
  function loginLogsLoad(force){
    var L = state.loginLogs = state.loginLogs || {list:null, loading:false, name:"all", kind:"all", days:"30"};
    if(L.loading || (L.list && !force)) return;
    if(!db){ L.list = localLoginLogs.slice(); return; }
    L.loading = true; L.error = false;
    var finished = false;
    var done = function(list, err){
      if(finished) return; finished = true;
      L.loading = false; L.error = !!err; if(list) L.list = list; else if(!L.list) L.list = [];
      if(state.tab==="settings" && state.settingsSeg==="loginlog") render();
    };
    var timer = setTimeout(function(){ done(null, true); }, 15000);
    try{
      var q = db.collection("loginLogs");
      try{ q = q.orderBy("at","desc").limit(1000); }catch(e){}
      var p;
      if(typeof q.get==="function") p = q.get();
      else p = new Promise(function(res, rej){   // get() が無い接続方式では onSnapshot を1回だけ使う
        var un = null, got = false;
        un = q.onSnapshot(function(snap){ if(got) return; got = true; try{ un&&un(); }catch(e){} res(snap); }, rej);
        if(got && un){ try{ un(); }catch(e){} }
      });
      p.then(function(snap){ clearTimeout(timer); done(snap.docs.map(toObj), false); },
             function(){ clearTimeout(timer); done(null, true); });
    }catch(e){ clearTimeout(timer); done(null, true); }
  }

  // サーバー（Firestore等）の容量の目安：読み込み済みデータからの概算
  var STORAGE_COLS = [["projects","案件"],["customers","顧客"],["members","メンバー"],["tasks","タスク"],["chats","チャット（一覧）"],["files","写真・ファイル"],["reports","報告書"],["events","予定"],["steps","工程"],["folders","フォルダ"],["cards","名刺"],["trash","ゴミ箱"]];
  function fmtBytes(n){ n = Number(n)||0; if(n<1024) return n+" B"; if(n<1048576) return (n/1024).toFixed(1)+" KB"; if(n<1073741824) return (n/1048576).toFixed(1)+" MB"; return (n/1073741824).toFixed(2)+" GB"; }
  function storageStats(){
    var key = STORAGE_COLS.map(function(c){ return (state[c[0]]||[]).length; }).join(",");
    var now = Date.now(), cache = state.storageCache;
    if(cache && cache.key===key && now-cache.at<15000) return cache.rows;
    var enc = (typeof TextEncoder!=="undefined") ? new TextEncoder() : null;
    var rows = STORAGE_COLS.map(function(c){
      var arr = state[c[0]]||[], bytes = 0; if(!arr.length) return {key:c[0], label:c[1], count:0, bytes:0};
      try{ var str = JSON.stringify(arr); bytes = enc ? enc.encode(str).length : str.length*2; }catch(e){}
      return {key:c[0], label:c[1], count:arr.length, bytes:bytes};
    });
    state.storageCache = {key:key, at:now, rows:rows};
    return rows;
  }

  function quotaMark(){ try{ localStorage.setItem("quotaHitAt", String(Date.now())); }catch(e){} state.quotaHitAt = Date.now(); }
  function quotaInfo(){
    var at = state.quotaHitAt; if(!at){ try{ at = Number(localStorage.getItem("quotaHitAt"))||0; }catch(e){ at = 0; } }
    if(!at) return null;
    // 解除の目安：検知後、最初に来る日本時間17:00（無料枠は日本時間の夕方にリセット）
    var d = new Date(at + 9*3600000); d.setUTCHours(17,0,0,0);
    var reset = d.getTime() - 9*3600000; if(reset <= at) reset += 86400000;

    var row = function(label, val, lim){
      val = Number(val)||0; lim = Number(lim)||1;

    };

  function reportDraftText(pid, date){
    var lines = [];
    state.steps.filter(function(x){ return x.projectId===pid && secretVisible(x) && x.startDate<=date && (x.endDate||x.startDate)>=date; }).forEach(function(x){
      lines.push("・"+x.name+(x.progress!=null&&x.progress!==""?"（進捗 "+x.progress+"%）":""));
    });

  function freeeBusy(msg){ state.freee.busy = !!msg; if(msg) toast(msg); }
  // 100件単位の処理を、進捗を出しながら順に実行する
  function freeeChunks(items, size, fn, label){
    var done = 0, ok = 0, fail = [], i = 0;
    var next = function(){
      if(i>=items.length) return Promise.resolve();
      var part = items.slice(i, i+size); i += size;
      return fn(part).then(function(r){ ok += r.ok; fail = fail.concat(r.fail); done += part.length; toast(label+"… "+done+" / "+items.length); }).then(next);
    };
    return next().then(function(){ return {ok:ok, fail:fail}; });
  }
  function freeeReport(label, r){

    if(r.fail.length){ msg += "（"+r.fail.length+"件は失敗）"; }
    toast(msg);
    if(r.fail.length){
      openModal(label+"できなかった項目", '<div style="font-size:12.5px;line-height:1.7;max-height:50vh;overflow:auto">'+r.fail.slice(0,50).map(function(f){ return '<div>'+esc(f.name)+'：<span style="color:var(--danger)">'+esc(f.msg)+'</span></div>'; }).join("")+(r.fail.length>50?'<div>…ほか'+(r.fail.length-50)+'件</div>':'')+'</div>', '<button class="btn" data-close-modal>閉じる</button>');
    }
    render();
  }

  function freeeImportRun(onlyQuoted){
    state.freee.busy = true; toast(onlyQuoted ? "freeeの見積書履歴を確認中…" : "freeeから取引先を取得中…");
    freeeCall("partners.list", {onlyQuoted: !!onlyQuoted}).then(function(j){
      state.freee.busy = false;
      var nz = function(x){ return String(x||"").normalize("NFKC").replace(/[\s\u3000]/g,"").toLowerCase(); };
      var linkedIds = {}; state.customers.forEach(function(c){ if(c.freeePartnerId) linkedIds[c.freeePartnerId] = 1; });
      var unlinked = {}; state.customers.forEach(function(c){ if(!c.freeePartnerId && c.name) unlinked[nz(c.name)] = c; });
      var cands = (j.partners||[]).filter(function(p){ return !linkedIds[p.id]; }).map(function(p){
        var m = unlinked[nz(p.name)] || null;
        return {p:p, match:m};
      });
      if(!cands.length){ toast(j.quotedOnly ? "見積書の作成履歴があり、まだ取り込んでいない取引先はありません" : "取り込む取引先はありません（freee側 "+(j.total||0)+"件、すべて取り込み済みです）"); return; }
      var byId = {}; cands.forEach(function(x){ byId[x.p.id] = x; });
      freeePicker("freeeの取引先を取り込む", (j.quotedOnly?"見積書の作成履歴がある取引先のうち、":"freeeにある取引先のうち、")+"まだこのアプリに紐づいていないものです。選んだものを顧客として追加します。",
        cands.map(function(x){ return {id:String(x.p.id), label:x.p.name, sub:(x.match?"既存の顧客「"+x.match.name+"」に紐づけ":"新規の顧客として追加")+(x.p.phone?"　"+x.p.phone:"")+(x.p.quoteCount?"　見積書 "+x.p.quoteCount+"件"+(x.p.lastQuote?"（最新 "+x.p.lastQuote+"）":""):"")}; }),
        "取り込む", function(ids){
          state.freee.busy = true; var ok = 0, linked = 0, filledN = 0;
          var jobs = ids.map(function(id){
            var x = byId[id]; if(!x) return Promise.resolve();
            if(x.match){ linked++; var f3 = freeeFillBlanks(x.match, {kana:x.p.kana, email:x.p.email, phone:x.p.phone, zipcode:x.p.zipcode, prefectureCode:x.p.prefectureCode, street1:x.p.street1, street2:x.p.street2}); if(Object.keys(f3).length) filledN++; return saveRaw("customers", x.match.id, Object.assign({freeePartnerId:x.p.id, freeeUpdated:x.p.updateDate||""}, f3)); }
            var pr = x.p.prefectureCode!=="" ? PREFS[Number(x.p.prefectureCode)] : "";
            ok++;
            return saveRaw("customers", null, {name:x.p.name, kana:x.p.kana||"", email:x.p.email||"", phone:x.p.phone||"", postalCode:x.p.zipcode||"",
              prefecture:pr||"未選択", address:x.p.street1||"", building:x.p.street2||"", region:"国内", registeredDate:todayISO(), freeePartnerId:x.p.id, freeeUpdated:x.p.updateDate||""});
          });
          Promise.all(jobs).then(function(){ state.freee.busy = false; toast(ok+"件を顧客に追加"+(linked?"、"+linked+"件を既存の顧客に紐づけ":"")+"しました"+(filledN?"（うち"+filledN+"件はfreeeの情報で空欄を補いました）":"")); render(); },
            function(){ state.freee.busy = false; toast("取り込みに失敗しました"); render(); });
        });
    }, function(e){ state.freee.busy = false; toast("取得できませんでした："+e.message); });
  }
  function freeePushCustomers(){
    var all = freeeCustomersToPush();
    freeePicker("取引先として登録する顧客", "freee会計に登録する顧客を選んでください。freeeにすでにある取引先と名前が近い場合は、次の画面で確認します。",

      "次へ（名前の確認）", function(ids){
      var list = all.filter(function(c){ return ids.indexOf(c.id)!==-1; });
      state.freee.busy = true; toast("freeeの取引先と照合中…");
      freeeCall("partners.check", {customers: list.map(function(c){ return {id:c.id, name:c.name}; })}).then(function(j){

  // 名前が近い取引先が見つかった顧客ごとに、紐づける／新規登録／今回は登録しない を選ばせる
  function freeeResolveNames(list, ask, cands){
    var rows = ask.map(function(c){

  // freeeの取引先情報のうち、アプリの顧客で空欄の項目だけを補う（入力済みの項目は上書きしない）
  var freeeInfoCache = {};
  function freeeFillBlanks(c, info){
    var o = {}; if(!info) return o;
    var blank = function(v){ return v==null || v==="" || v==="未選択"; };
    if(blank(c.kana) && info.kana) o.kana = info.kana;
    if(blank(c.email) && info.email) o.email = info.email;
    if(blank(c.phone) && info.phone) o.phone = info.phone;
    if(blank(customerPostal(c)) && info.zipcode) o.postalCode = info.zipcode;
    if(blank(c.prefecture) && info.prefectureCode!=="" && PREFS[Number(info.prefectureCode)]) o.prefecture = PREFS[Number(info.prefectureCode)];
    if(blank(c.address) && info.street1) o.address = info.street1;
    if(blank(c.building) && info.street2) o.building = info.street2;
    return o;
  }
  var FREEE_FILL_LABEL = {kana:"ふりがな", email:"メール", phone:"電話番号", postalCode:"郵便番号", prefecture:"都道府県", address:"住所", building:"建物名"};
  // dec[id]: "link:<freeeのID>" | "new" | "skip"（未指定は新規登録）
  function freeeRunCustomers(list, dec){
    var links = list.filter(function(c){ return /^link:/.test(dec[c.id]||""); });
    var creates = list.filter(function(c){ return !dec[c.id] || dec[c.id]==="new"; });
    state.freee.busy = true; var filled = 0;
    var linked = Promise.all(links.map(function(c){ var pid = Number(dec[c.id].slice(5)), fill = freeeFillBlanks(c, freeeInfoCache[pid]); filled += Object.keys(fill).length?1:0; return saveRaw("customers", c.id, Object.assign({freeePartnerId:pid, freeeUpdated:(freeeInfoCache[pid]&&freeeInfoCache[pid].updateDate)||""}, fill)); }));
    linked.then(function(){
      return freeeChunks(creates, 20, function(part){
        return freeeCall("partners.push", {customers: part.map(function(c){
          var pi = PREFS.indexOf(c.prefecture);
          return {id:c.id, name:c.name, kana:c.kana, email:c.email, phone:c.phone, postalCode:customerPostal(c), prefectureCode: pi>=0?pi:"", street1:c.address, street2:c.building, force:true};
        })}).then(function(j){
          var ok = 0, fail = [], jobs = [];
          (j.results||[]).forEach(function(x){
            var c = part.find(function(y){ return y.id===x.id; });
            if(x.error){ fail.push({name:c?c.name:x.id, msg:x.error}); return; }
            ok++; var fill2 = x.status==="linked" ? freeeFillBlanks(c||{}, x.info) : {}; if(Object.keys(fill2).length) filled++;
            jobs.push(saveRaw("customers", x.id, Object.assign({freeePartnerId:x.partnerId, freeeUpdated:(x.info&&x.info.updateDate)||""}, fill2)));
          });
          return Promise.all(jobs).then(function(){ return {ok:ok, fail:fail}; });
        });
      }, "取引先を登録中");
    }).then(function(r){
      r.ok += links.length;
      var skipped = list.filter(function(c){ return dec[c.id]==="skip"; }).length;
      freeeReport("登録", r);
      if(skipped) setTimeout(function(){ toast("（"+skipped+"件は登録せず、そのままにしました）"); }, 2500);
      else if(filled) setTimeout(function(){ toast("freeeにあった情報を"+filled+"件の顧客に反映しました（空欄の項目のみ）"); }, 2500);
    }, function(e){ state.freee.busy = false; toast("失敗しました："+e.message); render(); });
  }
  function freeePushDeals(){

      all.map(function(p){ return {id:p.id, label:p.name, sub:[p.status, (p.startDate||(p.createdAt||"").slice(0,10))+"発生", p.customerName||"顧客なし", partnerOf(p)?"":"取引先未連携"].filter(Boolean).join("　"), right:fmtYen(p.amount)}; }),

          var c = state.customers.find(function(x){ return x.id===p.customerId; });
          return {id:p.id, name:p.name, amount:p.amount, issueDate:p.startDate||(p.createdAt||"").slice(0,10)||todayISO(), dueDate:p.endDate||"", partnerId:c&&c.freeePartnerId||"", ref:""};
        })}).then(function(j){
          var ok = 0, fail = [], jobs = [];
          (j.results||[]).forEach(function(x){
            var p = part.find(function(y){ return y.id===x.id; });
            if(x.error){ fail.push({name:p?p.name:x.id, msg:x.error}); return; }
