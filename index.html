  /* ---- ダウンロード（単体は直接、複数はZIP） ---- */
  var CRC_T = null;
  function crc32(u8){
    if(!CRC_T){ CRC_T = []; for(var n=0;n<256;n++){ var c=n; for(var k=0;k<8;k++) c = c&1 ? (0xEDB88320^(c>>>1)) : (c>>>1); CRC_T[n]=c>>>0; } }
    var crc = 0xFFFFFFFF; for(var i=0;i<u8.length;i++) crc = CRC_T[(crc^u8[i])&0xFF]^(crc>>>8);
    return (crc^0xFFFFFFFF)>>>0;
  }
  // 無圧縮(store)のZIPを作る。写真は既に圧縮済みなので十分。entries: [{name, data:Uint8Array}]
  function makeZip(entries){
    var enc = new TextEncoder(), parts = [], cd = [], off = 0, dt = new Date();
    var dosT = (dt.getHours()<<11)|(dt.getMinutes()<<5)|(dt.getSeconds()>>1), dosD = ((dt.getFullYear()-1980)<<9)|((dt.getMonth()+1)<<5)|dt.getDate();
    entries.forEach(function(e){
      var nm = enc.encode(e.name), crc = crc32(e.data), sz = e.data.length;
      var lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
      lh.setUint16(10,dosT,true); lh.setUint16(12,dosD,true); lh.setUint32(14,crc,true); lh.setUint32(18,sz,true); lh.setUint32(22,sz,true); lh.setUint16(26,nm.length,true); lh.setUint16(28,0,true);
      parts.push(lh.buffer, nm, e.data);
      var ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true);
      ch.setUint16(12,dosT,true); ch.setUint16(14,dosD,true); ch.setUint32(16,crc,true); ch.setUint32(20,sz,true); ch.setUint32(24,sz,true); ch.setUint16(28,nm.length,true);
      ch.setUint32(42,off,true);
      cd.push(ch.buffer, nm);
      off += 30+nm.length+sz;
    });
    var cdSize = 0; cd.forEach(function(x){ cdSize += x.byteLength||x.length; });
    var end = new DataView(new ArrayBuffer(22));
    end.setUint32(0,0x06054b50,true); end.setUint16(8,entries.length,true); end.setUint16(10,entries.length,true); end.setUint32(12,cdSize,true); end.setUint32(16,off,true);
    return new Blob(parts.concat(cd,[end.buffer]), {type:"application/zip"});
  }
  function safeName(n){ return String(n||"ファイル").replace(/[\\/:*?"<>|]/g,"_"); }
  // list: ファイルdoc配列。dirOf(f): ZIP内のフォルダ名（任意）
  function dir2(d){ return String(d||"").split("/").filter(Boolean).map(safeName).join("/"); }
  function downloadFiles(list, zipName, dirOf){
    if(!list.length){ toast("ダウンロードするファイルがありません"); return; }
    var getBlob = function(f){ return fetch(fileUrl(f)).then(function(r){ if(!r.ok) throw 0; return r.blob(); }); };
    if(list.length===1){
      return getBlob(list[0]).then(function(b){ downloadBlob(safeName(list[0].filename), b); toast("ダウンロードしました"); }).catch(function(){ toast("ダウンロードに失敗しました"); });
    }
    var entries = [], used = {}, failed = 0, i = 0;
    var next = function(){
      if(i>=list.length) return Promise.resolve();
      var f = list[i++]; toast("ダウンロード準備中… "+i+" / "+list.length);
      return getBlob(f).then(function(b){ return b.arrayBuffer(); }).then(function(buf){
        var dir = dirOf ? dir2(dirOf(f)) : "", base = safeName(f.filename), path = (dir?dir+"/":"")+base, k = 1;
        while(used[path]){ var dot = base.lastIndexOf("."); path = (dir?dir+"/":"")+(dot>0?base.slice(0,dot)+"("+(++k)+")"+base.slice(dot):base+"("+(++k)+")"); }
        used[path] = true; entries.push({name:path, data:new Uint8Array(buf)});
      }).catch(function(){ failed++; }).then(next);
    };
    return next().then(function(){
      if(!entries.length){ toast("ダウンロードに失敗しました"); return; }
      downloadBlob(safeName(zipName)+"-"+todayISO()+".zip", makeZip(entries));
      toast(entries.length+"件をダウンロードしました"+(failed?"（"+failed+"件は取得できませんでした）":""));
    });
  }

  function fmtSize(n){
    n = n||0;
    if(n<1024) return n+" B";
    if(n<1024*1024) return (n/1024).toFixed(1)+" KB";
    return (n/1024/1024).toFixed(1)+" MB";
  }

  /* ============ CHAT ============ */
  var CHAT_EMOJI = ["😀","😊","😂","🙂","😉","😍","🤔","😅","🙏","👍","👏","🙌","💪","✨","🔥","🎉","✅","❌","⚠️","📷","📄","🚧","🔧","🌧️","☀️","🚛","🕐","❗","❓","🙇","👌","🤝"];
  function fmtAgo(iso){
    if(!iso) return "";
    var d = (Date.now()-new Date(iso).getTime())/1000;
    if(isNaN(d)) return "";
    if(d<60) return "たった今";
    if(d<3600) return Math.floor(d/60)+"分前";
    if(d<86400) return Math.floor(d/3600)+"時間前";
    return Math.floor(d/86400)+"日前";
  }
  function chatTime(iso){ var d=new Date(iso); return isNaN(d)?"":String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
  function chatDay(iso){ var d=new Date(iso); return isNaN(d)?"":d.getFullYear()+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+String(d.getDate()).padStart(2,"0"); }
  function chatText(t){
    var h = esc(t||"");
    state.members.map(function(m){return m.name;}).concat(["全員"]).filter(Boolean).sort(function(a,b){return b.length-a.length;}).forEach(function(n){
      h = h.split("@"+esc(n)).join('<b class="mention">@'+esc(n)+'</b>');
    });
    return h.replace(/\n/g,"<br>");
  }
  function chatProject(chat){
    if(!chat || chat.kind!=="project") return null;
    return state.projects.find(function(x){return x.id===chat.projectId;}) || state.projects.find(function(x){return x.name===chat.name;}) || null;
  }
  function chatMembers(chat){
    if(!chat) return [];
    var names;
    if(chat.kind==="project"){
      var p = chatProject(chat);
      names = p ? normalizeAssignees(p.assignees).map(function(a){return a.name;}) : [];
    } else names = Array.isArray(chat.members) && chat.members.length ? chat.members : state.members.map(function(m){return m.name;});
    return names.map(function(n){ return state.members.find(function(m){return m.name===n;}) || {name:n}; });
  }
  function renderChat(){

      var lastSec = null;

          '<button class="chat-pin chat-hide" data-chat-hide="'+esc(c.id)+'" title="'+(isHidden(c)?"再表示する":"非表示にする")+'">'+iEye(!isHidden(c))+'</button>'+
          '<div class="chat-ava">'+(c.kind==="group"?iUsers():iDoc())+'</div>'+
          '<div class="chat-item-main"><div class="chat-item-name">'+esc(c.name)+'</div><div class="chat-item-meta"><span>'+(c.kind==="group"?"グループ":"案件")+'</span><span>'+esc(fmtAgo(c.updatedAt))+'</span></div></div>'+

              '<a href="'+esc(m.attachment.url)+'" target="_blank" rel="noopener"><img class="catt" src="'+esc(m.attachment.url)+'" alt=""></a>' :
              '<br><a class="cfile" href="'+esc(m.attachment.url)+'" target="_blank" rel="noopener">'+iDoc()+esc(m.attachment.filename||"ファイル")+'</a>') : '';

  function loadChatMsgs(chatId){
    if(!db){ state.chatMsgs[chatId] = (SAMPLE_MSGS[chatId] || []).map(function(m){ return m.id ? m : Object.assign({id:uid()}, m); }); render(); return; }
    db.collection("chats").doc(chatId).collection("messages").orderBy("ts").limit(200).onSnapshot(function(snap){
      state.chatMsgs[chatId] = snap.docs.map(toObj);
      if(state.activeChat===chatId) render();
    }, function(){});
  }

  function ensureProjectChat(project, cb){

  var REPORT_TYPES = ["作業報告書","日報","進捗報告書","完了報告書","是正・指摘事項報告書"];
  var MASTERS = [
    {key:"statuses", label:"案件進捗", arr:STATUS_LIST, note:"案件の進捗（一覧の絞り込み・登録画面）に出ます。契約済・施工中・施工完了・清算済・失注は集計に使うため削除できません。色は自動で付きます"},

  var MASTER_TABS = [
    ["project","案件",["statuses","projectTypes"]],
    ["property","物件情報",["propertyTypes","propertyStructures"]],
    ["member","メンバー",["roles","stores"]],
    ["schedule","工程表",["stepNames"]],
    ["calendar","カレンダー",["eventTypes"]],

  ];
  var MASTER_DEFAULTS = {};
  MASTERS.forEach(function(m){ MASTER_DEFAULTS[m.key] = m.arr.slice(); });
  function applyMasters(d){
    MASTERS.forEach(function(m){
      if(d && Array.isArray(d[m.key]) && d[m.key].length){ m.arr.length = 0; Array.prototype.push.apply(m.arr, d[m.key]); }
    });
    syncStatusFilters();
  }
  // 進捗の追加・削除に合わせて、一覧の絞り込み（チェック済み進捗）を揃える
  function syncStatusFilters(){
    var prev = syncStatusFilters._prev || MASTER_DEFAULTS.statuses;
    var f = state.salesFilter;
    f.status = STATUS_LIST.filter(function(x){ return f.status.indexOf(x)!==-1 || prev.indexOf(x)===-1; });
    state.constFilter.status = state.constFilter.status.filter(function(x){ return STATUS_LIST.indexOf(x)!==-1; });
    syncStatusFilters._prev = STATUS_LIST.slice();
  }
  function loadMasters(){
    if(!db) return;
    db.doc("settings/master").get().then(function(snap){ if(snap.exists){ applyMasters(snap.data()); render(); } }).catch(function(){});
  }
  function masterUsage(m, name){
    var n = 0;
    if(m.key==="projectTypes") n = rawStore.projects.filter(function(p){return p.type===name;}).length;
    else if(m.key==="statuses") n = rawStore.projects.filter(function(p){return p.status===name;}).length;
    else if(m.key==="stores") n = state.members.filter(function(x){return x.store===name;}).length;
    else if(m.key==="roles") n = state.members.filter(function(x){return (x.roles||[]).indexOf(name)!==-1;}).length;
    else if(m.key==="propertyTypes") n = rawStore.projects.filter(function(p){return p.propertyType===name;}).length;
    else if(m.key==="stepNames") n = state.steps.filter(function(x){return x.name===name;}).length;
    else if(m.key==="reportTypes") n = state.reports.filter(function(x){return x.type===name;}).length;
    else if(m.key==="eventTypes") n = state.events.filter(function(x){return x.category===name;}).length;
    else if(m.key==="propertyStructures") n = rawStore.projects.filter(function(p){return p.propertyStructure===name;}).length;

  // マスタから項目を削除すると、その項目を使っていた登録済みデータは「未入力」に変わる。
  var MASTER_FIELDS = {
    statuses:[["projects","status"]], projectTypes:[["projects","type"]],
    stores:[["members","store"]],
    propertyTypes:[["projects","propertyType"]], propertyStructures:[["projects","propertyStructure"]],
    roles:[["members","roles"]], stepNames:[["steps","name"]], eventTypes:[["events","category"]], reportTypes:[["reports","type"]]
  };
  function masterAffected(key, removed){
    var out = [];
    (MASTER_FIELDS[key]||[]).forEach(function(cf){
      var col = cf[0], fld = cf[1], rows = col==="projects" ? rawStore.projects : state[col];
      rows.forEach(function(r){
        if(fld==="roles"){
          var cur = r.roles||[]; var next = cur.filter(function(x){ return removed.indexOf(x)===-1; });
          if(next.length!==cur.length){ out.push({col:col,id:r.id,data:{roles:next}}); }
        }else if(removed.indexOf(r[fld])!==-1){ var d2={}; d2[fld]=""; out.push({col:col,id:r.id,data:d2}); }
      });
    });
    return out;
  }
  function saveMaster(key, list, msg, confirmed){
    var m = MASTERS.find(function(x){return x.key===key;});
    if(!state.isAdmin){ toast("マスタの変更は管理者のみ行えます"); return; }
    var removed = m.arr.filter(function(n){ return list.indexOf(n)===-1; });
    var affected = masterAffected(key, removed);
    var payload = {}; MASTERS.forEach(function(x){ payload[x.key] = x.key===key ? list : x.arr.slice(); });
    payload.updatedAt = new Date().toISOString();
    var run = function(){
      var finish = function(){
        m.arr.length = 0; Array.prototype.push.apply(m.arr, list);
        if(key==="statuses") syncStatusFilters();
        toast(msg + (affected.length ? "（"+affected.length+"件のデータを「未入力」に変更しました）" : "")); render();
      };
      var writes = affected.map(function(a){ return saveRaw(a.col, a.id, a.data); });
      var saveDoc = db ? db.doc("settings/master").set(payload) : Promise.resolve();
      Promise.all(writes.concat([saveDoc])).then(finish).catch(function(){ toast("保存に失敗しました"); });
    };
    if(affected.length && !confirmed){
      confirmDelete("「"+removed.filter(function(n){ return masterAffected(key,[n]).length; }).join("」「")+"」を削除します。使用中の登録済みデータ "+affected.length+"件 は「未入力」に変わります。", run);
    }else run();
  }

  /* ============ freee会計 連携 ============ */
  // 連携はVercel版（/api/freee）でのみ動きます。freeeのトークンはサーバー側に暗号化して保存され、
  // この画面は「管理者の氏名＋パスワード」を毎回サーバーへ送って本人確認します。
  var FREEE_API = "/api/freee";
  var FREEE_RETURN = (function(){ try{ return new URLSearchParams(location.search).get("freee") || ""; }catch(e){ return ""; } })();
  var FREEE_DEAL_STATUSES = ["契約済","施工中","施工完了","清算済"];   // 売上として取引登録する進捗
  function freeeAvailable(){ return !!db && !window.claude && !state.offlineMode; }
  function freeeSet(){ return state.freee.settings || {}; }
  function loadFreeeSettings(){
    if(!db) return;
    db.doc("settings/freee").get().then(function(snap){ if(snap.exists){ state.freee.settings = snap.data() || {}; if(state.tab==="settings") render(); } }).catch(function(){});
  }
  function freeeCall(action, extra){
    var me = myMember();
    if(!me){ return Promise.reject(new Error("ログイン情報を確認できません")); }
    return fetch(FREEE_API, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({auth:{name:me.name, password:me.password||""}, action:action}, extra||{}))})
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if(!r.ok) throw new Error(j.error || ("サーバーエラー（"+r.status+"）")); return j; }); });
  }
  function freeeLoadStatus(force){
    if(state.freee.loading || (state.freee.status && !force)) return;
    state.freee.loading = true;
    freeeCall("status").then(function(j){ state.freee.status = j; state.freee.error = ""; }, function(e){ state.freee.status = null; state.freee.error = e.message; })
      .then(function(){ state.freee.loading = false; if(state.tab==="settings" && state.settingsSeg==="freee") render(); });
  }
  function freeeCustomersToPush(){ return state.customers.filter(function(c){ return !c.freeePartnerId && (c.name||"").trim(); }); }
  function freeeProjectsToPush(){ return state.projects.filter(function(p){ return !p.freeeDealId && p.amount>0 && FREEE_DEAL_STATUSES.indexOf(p.status)!==-1; }); }
  function freeeProjectsToCheck(){ return state.projects.filter(function(p){ return !!p.freeeDealId; }); }
  function freeeBadge(p){

  function freeeBusy(msg){ state.freee.busy = !!msg; if(msg) toast(msg); }
  // 100件単位の処理を、進捗を出しながら順に実行する
  function freeeChunks(items, size, fn, label){
    var done = 0, ok = 0, fail = [], i = 0;
    var next = function(){
      if(i>=items.length) return Promise.resolve();
      var part = items.slice(i, i+size); i += size;
      return fn(part).then(function(r){ ok += r.ok; fail = fail.concat(r.fail); done += part.length; toast(label+"… "+done+" / "+items.length); }).then(next);
    };
    return next().then(function(){ return {ok:ok, fail:fail}; });
  }
  function freeeReport(label, r){
    state.freee.busy = false;
    var msg = r.ok+"件を"+label+"しました";
    if(r.fail.length){ msg += "（"+r.fail.length+"件は失敗）"; }
    toast(msg);
    if(r.fail.length){
      openModal(label+"できなかった項目", '<div style="font-size:12.5px;line-height:1.7;max-height:50vh;overflow:auto">'+r.fail.slice(0,50).map(function(f){ return '<div>'+esc(f.name)+'：<span style="color:var(--danger)">'+esc(f.msg)+'</span></div>'; }).join("")+(r.fail.length>50?'<div>…ほか'+(r.fail.length-50)+'件</div>':'')+'</div>', '<button class="btn" data-close-modal>閉じる</button>');
    }
    render();
  }
  function freeePushCustomers(){
    var all = freeeCustomersToPush();
    freeePicker("取引先として登録する顧客", "freee会計に登録する顧客を選んでください。freeeにすでにある取引先と名前が近い場合は、次の画面で確認します。",
      all.map(function(c){ return {id:c.id, label:c.name, sub:[customerPostal(c), (c.prefecture||"")+(c.address||"")+(c.building?" "+c.building:""), c.phone].filter(Boolean).join("　")}; }),
      "次へ（名前の確認）", function(ids){
      var list = all.filter(function(c){ return ids.indexOf(c.id)!==-1; });
      state.freee.busy = true; toast("freeeの取引先と照合中…");
      freeeCall("partners.check", {customers: list.map(function(c){ return {id:c.id, name:c.name}; })}).then(function(j){
        state.freee.busy = false;
        var cands = {}; (j.results||[]).forEach(function(r){ if(r.candidates && r.candidates.length) cands[r.id] = r.candidates; });
        var ask = list.filter(function(c){ return cands[c.id]; });
        if(!ask.length){ freeeRunCustomers(list, {}); return; }
        freeeResolveNames(list, ask, cands);
      }, function(e){ state.freee.busy = false; toast("照合できませんでした："+e.message); });
    });
  }
  // 名前が近い取引先が見つかった顧客ごとに、紐づける／新規登録／今回は登録しない を選ばせる
  function freeeResolveNames(list, ask, cands){
    var rows = ask.map(function(c){
      var cs = cands[c.id], exact = cs.some(function(x){ return x.exact; });
      var radios = cs.map(function(x, i){
        return '<label style="display:flex;gap:8px;align-items:flex-start;margin:4px 0;font-size:12.5px;cursor:pointer"><input type="radio" name="frn-'+esc(c.id)+'" value="link:'+esc(x.id)+'"'+(exact&&i===0?' checked':'')+' style="margin-top:3px"><span>freeeの「<b>'+esc(x.name)+'</b>」と同じ取引先として紐づける <span class="badge '+(x.exact?'soft-success':'soft-warning')+'">'+(x.exact?'完全一致':'名前が近い')+'</span></span></label>';
      }).join("");
      return '<div style="padding:10px 4px;border-bottom:1px solid var(--border)"><div style="font-size:12.5px;margin-bottom:2px">アプリの顧客：<b>'+esc(c.name)+'</b></div><div style="font-size:11px;color:var(--ink-faint);margin-bottom:4px">'+esc([(c.prefecture||"")+(c.address||""), c.phone].filter(Boolean).join("　"))+'</div>'+radios+
        '<label style="display:flex;gap:8px;align-items:center;margin:4px 0;font-size:12.5px;cursor:pointer"><input type="radio" name="frn-'+esc(c.id)+'" value="new">別の取引先として新規登録する</label>'+
        '<label style="display:flex;gap:8px;align-items:center;margin:4px 0;font-size:12.5px;cursor:pointer"><input type="radio" name="frn-'+esc(c.id)+'" value="skip">今回は登録しない</label></div>';
    }).join("");
    var rest = list.length - ask.length;
    openModal("名前が近い取引先があります", '<div style="font-size:12.5px;line-height:1.7;margin-bottom:6px">freeeにすでにある取引先と、名前が同じか近い顧客が'+ask.length+'件あります。同じ相手なら「紐づける」を選ぶと、二重登録を防げます。'+(rest?'（ほかの'+rest+'件は近い名前がないため、そのまま新規登録します）':'')+'</div><div style="max-height:52vh;overflow:auto;border-top:1px solid var(--border)">'+rows+'</div>',
      '<button class="btn" data-close-modal>キャンセル</button><button class="btn primary" id="frn-run" disabled>この内容で登録する</button>');
    var box = document.getElementById("modal-box");
    var refresh = function(){ var ok = ask.every(function(c){ return box.querySelector('input[name="frn-'+c.id+'"]:checked'); }); document.getElementById("frn-run").disabled = !ok; };
    box.querySelectorAll("input[type=radio]").forEach(function(r){ r.addEventListener("change", refresh); });
    refresh();
    document.getElementById("frn-run").onclick = function(){
      var dec = {};
      ask.forEach(function(c){ dec[c.id] = box.querySelector('input[name="frn-'+c.id+'"]:checked').value; });
      closeModal(); freeeRunCustomers(list, dec);
    };
  }
  // dec[id]: "link:<freeeのID>" | "new" | "skip"（未指定は新規登録）
  function freeeRunCustomers(list, dec){
    var links = list.filter(function(c){ return /^link:/.test(dec[c.id]||""); });
    var creates = list.filter(function(c){ return !dec[c.id] || dec[c.id]==="new"; });
    state.freee.busy = true;
    var linked = Promise.all(links.map(function(c){ return saveRaw("customers", c.id, {freeePartnerId:Number(dec[c.id].slice(5))}); }));
    linked.then(function(){
      return freeeChunks(creates, 20, function(part){
        return freeeCall("partners.push", {customers: part.map(function(c){
          var pi = PREFS.indexOf(c.prefecture);
          return {id:c.id, name:c.name, kana:c.kana, email:c.email, phone:c.phone, postalCode:customerPostal(c), prefectureCode: pi>=0?pi:"", street1:c.address, street2:c.building, force:true};
        })}).then(function(j){
          var ok = 0, fail = [], jobs = [];
          (j.results||[]).forEach(function(x){
            var c = part.find(function(y){ return y.id===x.id; });
            if(x.error){ fail.push({name:c?c.name:x.id, msg:x.error}); return; }
            ok++; jobs.push(saveRaw("customers", x.id, {freeePartnerId:x.partnerId}));
          });
          return Promise.all(jobs).then(function(){ return {ok:ok, fail:fail}; });
        });
      }, "取引先を登録中");
    }).then(function(r){
      r.ok += links.length;
      var skipped = list.filter(function(c){ return dec[c.id]==="skip"; }).length;
      freeeReport("登録", r);
      if(skipped) setTimeout(function(){ toast("（"+skipped+"件は登録せず、そのままにしました）"); }, 2500);
    }, function(e){ state.freee.busy = false; toast("失敗しました："+e.message); render(); });
  }
  function freeePushDeals(){
    var all = freeeProjectsToPush(), s = freeeSet();
    var partnerOf = function(p){ var c = state.customers.find(function(x){ return x.id===p.customerId; }); return c && c.freeePartnerId; };
    var noPartner = all.filter(function(p){ return !partnerOf(p); }).length;
    freeePicker("売上取引として登録する案件", "freee会計に、未決済の収入取引として登録する案件を選んでください。"+(noPartner?"「取引先未連携」の"+noPartner+"件は、取引先なしで登録されます（先に取引先を登録することをおすすめします）。":"")+"登録後はfreee側で内容を確認してください。",
      all.map(function(p){ return {id:p.id, label:p.name, sub:[p.status, (p.startDate||(p.createdAt||"").slice(0,10))+"発生", p.customerName||"顧客なし", partnerOf(p)?"":"取引先未連携"].filter(Boolean).join("　"), right:fmtYen(p.amount)}; }),
      "選択した案件を登録する", function(ids){
      var list = all.filter(function(p){ return ids.indexOf(p.id)!==-1; });
      state.freee.busy = true;
      freeeChunks(list, 20, function(part){
        return freeeCall("deals.push", {settings:{accountItemId:s.accountItemId, taxCode:s.taxCode}, projects: part.map(function(p){
          var c = state.customers.find(function(x){ return x.id===p.customerId; });
          return {id:p.id, name:p.name, amount:p.amount, issueDate:p.startDate||(p.createdAt||"").slice(0,10)||todayISO(), dueDate:p.endDate||"", partnerId:c&&c.freeePartnerId||"", ref:""};
        })}).then(function(j){
          var ok = 0, fail = [], jobs = [];
          (j.results||[]).forEach(function(x){
            var p = part.find(function(y){ return y.id===x.id; });
            if(x.error){ fail.push({name:p?p.name:x.id, msg:x.error}); return; }
            ok++; jobs.push(saveRaw("projects", x.id, {freeeDealId:x.dealId, freeeStatus:"unsettled", freeeSyncedAt:new Date().toISOString()}));
          });
          return Promise.all(jobs).then(function(){ return {ok:ok, fail:fail}; });
        });
      }, "売上取引を登録中").then(function(r){ freeeReport("登録", r); }, function(e){ state.freee.busy = false; toast("失敗しました："+e.message); render(); });
    });
  }
  function freeeSyncStatus(){
    var list = freeeProjectsToCheck();
    state.freee.busy = true;
    freeeChunks(list, 30, function(part){
      return freeeCall("deals.status", {deals: part.map(function(p){ return {id:p.id, dealId:p.freeeDealId}; })}).then(function(j){
        var ok = 0, fail = [], jobs = [];
        (j.results||[]).forEach(function(x){
          var p = part.find(function(y){ return y.id===x.id; });
          if(x.error){ fail.push({name:p?p.name:x.id, msg:x.error}); return; }
          ok++; jobs.push(saveRaw("projects", x.id, {freeeStatus:x.status, freeeDue:x.dueAmount||0, freeeSyncedAt:new Date().toISOString()}));
        });
        return Promise.all(jobs).then(function(){ return {ok:ok, fail:fail}; });
      });
    }, "入金状況を取得中").then(function(r){ freeeReport("更新", r); }, function(e){ state.freee.busy = false; toast("失敗しました："+e.message); render(); });
  }
  // 登録前に対象の一覧を出し、チェックを付けたものだけを実行する
  function freeePicker(title, intro, items, runLabel, onRun){

        '<span style="flex:1;min-width:0"><span style="display:block;font-weight:700;font-size:12.5px;word-break:break-all">'+esc(it.label)+'</span>'+(it.sub?'<span style="display:block;font-size:11px;color:var(--ink-faint);line-height:1.5">'+esc(it.sub)+'</span>':'')+'</span>'+
        (it.right?'<span class="num" style="font-size:12px;white-space:nowrap">'+esc(it.right)+'</span>':'')+'</label>';
    }).join("");
    openModal(title, '<div style="font-size:12.5px;line-height:1.7;margin-bottom:8px">'+esc(intro)+'</div>'+
      '<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><button class="btn sm" id="fr-pick-all">すべて選択</button><button class="btn sm" id="fr-pick-none">すべて解除</button><span id="fr-pick-count" style="font-size:12px;margin-left:auto"></span></div>'+
      '<div id="fr-pick-list" style="max-height:48vh;overflow:auto;border-top:1px solid var(--border)">'+rows+'</div>',
      '<button class="btn" data-close-modal>キャンセル</button><button class="btn primary" id="fr-pick-run">'+esc(runLabel)+'</button>');
    var box = document.getElementById("modal-box");
    var checks = function(){ return Array.prototype.slice.call(box.querySelectorAll("input[data-fr-pick]")); };
    var refresh = function(){ var n = checks().filter(function(c){ return c.checked; }).length; document.getElementById("fr-pick-count").textContent = n+" / "+items.length+"件を選択中"; document.getElementById("fr-pick-run").disabled = n===0; };

  /* ============ バックアップ / 復元 ============ */
  var BACKUP_COLS = [["projects","案件"],["customers","顧客"],["members","メンバー"],["tasks","タスク"],["chats","チャット"],["files","ファイル"],["folders","フォルダ"],["events","予定"],["steps","工程"],["reports","報告書"],["trash","ゴミ箱"]];
  function lastBackupAt(){ try{ return localStorage.getItem("genba_last_backup")||state.lastBackup||""; }catch(e){ return state.lastBackup||""; } }
  function markBackup(){ var t=new Date().toISOString(); state.lastBackup=t; try{ localStorage.setItem("genba_last_backup", t); }catch(e){} }
  function buildBackup(includePw){
    var data = {}, counts = {};
    BACKUP_COLS.forEach(function(c){
      data[c[0]] = rawOf(c[0]).map(function(o){ var x=Object.assign({},o); if(c[0]==="members" && !includePw) delete x.password; return x; });
      counts[c[0]] = data[c[0]].length;
    });
    var master = {}; MASTERS.forEach(function(m){ master[m.key] = m.arr.slice(); });
    return {format:"genba-backup", version:2, exportedAt:new Date().toISOString(), exportedBy:state.myName||"", includesPasswords:!!includePw,
      counts:counts, settings:{org:state.orgSettings, secret:{defaults:secretDefaults()}, master:master}, data:data};
  }
  function blobToB64(blob){
    return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){ res(String(r.result).split(",")[1]||""); }; r.onerror=rej; r.readAsDataURL(blob); });
  }
  // 写真・ファイルの本体を取得してbase64で同梱する（1件ずつ処理してメモリを抑える）
  function collectFileBlobs(payload){
    var list = payload.data.files, blobs = {}, failed = [], i = 0;
    var next = function(){
      if(i>=list.length) return Promise.resolve();
      var f = list[i++]; toast("写真・ファイルを取得中… "+i+" / "+list.length);
      return fetch(fileUrl(f)).then(function(r){ if(!r.ok) throw 0; return r.blob(); })
        .then(blobToB64).then(function(b64){ blobs[f.id] = {contentType:f.contentType||"", b64:b64}; })
        .catch(function(){ failed.push(f.filename||f.id); }).then(next);
    };
    return next().then(function(){ payload.blobs = blobs; payload.includesFiles = true; return failed; });
  }
  function backupAllData(includePw, withFiles){
    var payload = buildBackup(includePw===true);
    if(withFiles === true){
      return collectFileBlobs(payload).then(function(failed){ saveBackupPayload(payload, failed); });
    }
    saveBackupPayload(payload, []);
  }
  // 写真・ファイル画面用：ファイル情報・フォルダ・本体だけのバックアップ（projectId指定でその案件のみ）
  function backupFilesOnly(projectId){
    var pick = function(col){ return rawOf(col).filter(function(x){ return !projectId || x.projectId===projectId; }).map(function(o){ return Object.assign({},o); }); };
    var payload = {format:"genba-backup", version:2, scope:"files", exportedAt:new Date().toISOString(), exportedBy:state.myName||"", data:{files:pick("files"), folders:pick("folders")}};
    payload.counts = {files:payload.data.files.length, folders:payload.data.folders.length};
    if(!payload.data.files.length && !payload.data.folders.length){ toast("バックアップするファイルがありません"); return; }
    return collectFileBlobs(payload).then(function(failed){ saveBackupPayload(payload, failed); });
  }
  function saveBackupPayload(payload, failed){
    var blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
    var filename = (payload.scope==="files"?"genba-files-backup-":"genba-backup-"+(payload.includesFiles?"full-":""))+todayISO()+".json";
    var done = function(){ markBackup(); toast("バックアップを保存しました（"+BACKUP_COLS.reduce(function(n,c){return n+(payload.counts[c[0]]||0);},0)+"件"+(payload.includesFiles?"・写真/ファイル"+Object.keys(payload.blobs).length+"点":"")+"）"+(failed.length?" 取得できなかったファイル: "+failed.length+"点":"")); render(); };
    if(downloadsCap){
      downloadsCap.save({filename:filename, data:blob}).then(done).catch(function(){ toast("ダウンロードがキャンセルされました"); });
    } else {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
      done();
    }
  }
  // 古い形式（コレクションが最上位にある旧バックアップ）も読めるように正規化する
  function parseBackup(text){
    var j; try{ j = JSON.parse(text); }catch(e){ return {error:"JSONとして読み込めませんでした"}; }
    if(!j || typeof j!=="object") return {error:"バックアップファイルの形式が正しくありません"};
    var src = j.format==="genba-backup" ? (j.data||{}) : j;
    var data = {}, total = 0;
    BACKUP_COLS.forEach(function(c){
      var arr = Array.isArray(src[c[0]]) ? src[c[0]].filter(function(x){ return x && typeof x==="object" && x.id; }) : [];
      data[c[0]] = arr; total += arr.length;
    });
    var st = j.format==="genba-backup" ? (j.settings||{}) : {org:j.orgSettings};
    if(!total && !st.org) return {error:"復元できるデータが見つかりませんでした"};
    return {data:data, settings:st, exportedAt:j.exportedAt||"", exportedBy:j.exportedBy||"", total:total, hasPw:!!j.includesPasswords, blobs:(j.blobs&&typeof j.blobs==="object")?j.blobs:{}, legacy:j.format!=="genba-backup"};
  }
  function restoreBackup(b){
    var ps = [];
    BACKUP_COLS.forEach(function(c){
      var col = c[0];
      b.data[col].forEach(function(item){
        var id = item.id, d = Object.assign({}, item); delete d.id;
        if(col==="members"){
          var ex = rawOf("members").find(function(x){return x.id===id;});
          if(!d.password) d.password = (ex && ex.password) || "1234";
        }
        var blobInfo = (col==="files" && assetsCap) ? b.blobs[id] : null;
        if(blobInfo && blobInfo.b64){
          ps.push(new Promise(function(res,rej){
            try{
              var bin = atob(blobInfo.b64), u8 = new Uint8Array(bin.length);
              for(var k=0;k<bin.length;k++) u8[k]=bin.charCodeAt(k);
              var file = new File([u8], d.filename||"ファイル", {type:d.contentType||blobInfo.contentType||""});
              assetsCap.upload(file).then(function(r){
                d.assetId = r.id; d.url = r.url||null;
                if(!db){ var a2=rawOf("files"), j2=a2.findIndex(function(x){return x.id===id;}); if(j2>-1) a2[j2]=Object.assign({id:id},d); else a2.push(Object.assign({id:id},d)); res(); }
                else db.collection("files").doc(id).set(d).then(res,rej);
              }).catch(rej);
            }catch(e){ rej(e); }
          }));
          return;
        }
        if(!db){
          var arr = rawOf(col), i = arr.findIndex(function(x){return x.id===id;});
          if(i>-1) arr[i] = Object.assign({id:id}, d); else arr.push(Object.assign({id:id}, d));
          ps.push(Promise.resolve());
        } else ps.push(db.collection(col).doc(id).set(d));
      });
    });
    var st = b.settings||{}, stamp = new Date().toISOString();
    if(st.org){ state.orgSettings = Object.assign({}, state.orgSettings, st.org); if(db) ps.push(db.doc("settings/org").set(Object.assign({}, st.org, {updatedAt:stamp}))); }
    if(st.secret && Array.isArray(st.secret.defaults)){ state.secretDefaults = st.secret.defaults; if(db) ps.push(db.doc("settings/secret").set({defaults:st.secret.defaults, updatedAt:stamp})); }
    if(st.master){ applyMasters(st.master); if(db) ps.push(db.doc("settings/master").set(Object.assign({}, st.master, {updatedAt:stamp}))); }
    state.backupPreview = null;
    return runBatch(ps, "復元");
  }

  function bindCustomerFormEvents(){
    bindPostalLookup("f-cpostal", null, "f-cpref", "f-caddress");
    var invEl = document.getElementById("f-cinvno"), corpEl = document.getElementById("f-ccorpno"), typeEl = document.getElementById("f-cetype");

      invEl.value = invEl.value.replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0xFEE0); }).replace(/[\s\-]/g,"").toUpperCase();

      var m = /^T?(\d{13})$/.exec(invEl.value);

  // Reads and validates the form. Returns the customer data object, or null (after a toast).
  function readCustomerForm(){
    var val = function(id){ return document.getElementById(id).value.trim(); };
    var pick = function(id){ var x = document.getElementById(id).value; return x==="未選択" ? "" : x; };
    var name = val("f-cname");
    if(!name){ toast("名前を入力してください"); return null; }
    var invNo = val("f-cinvno");
    if(invNo && !/^T\d{13}$/.test(invNo)){ toast("登録番号は T + 13桁の数字で入力してください"); return null; }
    var corp = val("f-ccorpno");
    if(corp && !/^\d{13}$/.test(corp)){ toast("法人番号は13桁の数字で入力してください"); return null; }
    var d = {};
    CUSTOMER_FORM_FIELDS.forEach(function(f){ d[f[0]] = f[2]==="sel" ? pick(f[1]) : val(f[1]); });
    return d;
  }
  // Fills the form from a customer record (used by 顧客一覧から選ぶ).
  function setCustomerFormValues(src){
    CUSTOMER_FORM_FIELDS.forEach(function(f){
      var el = document.getElementById(f[1]); if(!el) return;
      var x = f[0]==="postalCode" ? customerPostal(src) : src[f[0]];

  /* ============ db writes ============ */
  function writeDoc(col,id,data,msg,after){
    if(!state.canWrite){ toast("この操作を行う権限がありません"); return; }
    if(col==="members" && !state.isAdmin){
      // Non-admins may only edit their OWN contact fields / password
      // (個人情報) -- never name, company, store, roles or permission.
      var me = myMember();
      var selfOk = !!(id && me && me.id===id && Object.keys(data).every(function(k){ return ["name","kana","phone","email","company","store","password"].indexOf(k)!==-1; }));
      if(!selfOk){ toast("メンバーの変更は管理者のみ行えます"); return; }
    }
    data.updatedAt = new Date().toISOString();
    if(!db){
      var arr = rawOf(col);
      if(id){ var idx=arr.findIndex(function(x){return x.id===id;}); if(idx>-1) arr[idx]=Object.assign({},arr[idx],data); }
      else { data.id=uid(); data.createdAt=new Date().toISOString(); arr.unshift(data); }
      closeModal(); toast(msg+"（プレビューのみ）"); render(); if(after) after(id||data.id); return;
    }
    var p = id ? db.collection(col).doc(id).update(data) : db.collection(col).add(Object.assign({createdAt:new Date().toISOString()},data));
    p.then(function(ref){ closeModal(); toast(msg); if(after) after(id||(ref&&ref.id)); }).catch(function(e){ toast("保存に失敗しました"); });
  }
  // ---- ゴミ箱: 削除したデータは trash コレクションに控えを残し、管理画面から復元できる ----
  var TRASH_TYPES = {reports:"報告書",projects:"案件",customers:"顧客",members:"メンバー",tasks:"タスク",files:"ファイル",events:"予定",steps:"工程",folders:"フォルダ"};
  var TRASH_NAME = {reports:"title",projects:"name",customers:"name",members:"name",tasks:"title",files:"filename",events:"title",steps:"name",folders:"name"};
  function trashPut(col, id){
    var rec = TRASH_TYPES[col] ? rawOf(col).find(function(x){ return x.id===id; }) : null;
    if(!rec) return Promise.resolve();
    var data = Object.assign({}, rec); delete data.id;
    var nm = rec[TRASH_NAME[col]] || "";
    if(col==="steps") nm = (rec.projectName?rec.projectName+"：":"")+(rec.name||"");
    var entry = {col:col, docId:id, name:nm, data:data, deletedAt:new Date().toISOString(), deletedBy:state.myName||""};
    if(!db){ state.trash.unshift(Object.assign({id:uid()}, entry)); return Promise.resolve(); }
    return db.collection("trash").add(entry);
  }
  function deleteDoc(col,id,msg,after){
    if(!state.canWrite){ toast("この操作を行う権限がありません"); return; }
    if(col==="members" && !state.isAdmin){ toast("メンバーの削除は管理者のみ行えます"); return; }
    var put = trashPut(col,id);
    if(!db){ put.then(function(){ setRaw(col, rawOf(col).filter(function(x){return x.id!==id;})); toast(msg+"（プレビューのみ）"); render(); if(after) after(); }); return; }
    put.then(function(){ return db.collection(col).doc(id).delete(); }).then(function(){toast(msg); if(after) after();}).catch(function(){toast("削除に失敗しました");});
  }
  function restoreTrash(entry){
    var col = entry.col, id = entry.docId;
    if(rawOf(col).some(function(x){ return x.id===id; })){ toast("同じデータがすでに存在します"); return; }
    var data = Object.assign({}, entry.data);
    if(col==="files" && data.folderId && !state.folders.some(function(g){ return g.id===data.folderId; })) data.folderId = null;
    if(!db){
      rawOf(col).unshift(Object.assign({id:id}, data));
      state.trash = state.trash.filter(function(x){ return x.id!==entry.id; });
      toast("「"+(entry.name||TRASH_TYPES[col])+"」を元に戻しました（プレビューのみ）"); render(); return;
    }
    db.collection(col).doc(id).set(data).then(function(){ return db.collection("trash").doc(entry.id).delete(); })
      .then(function(){ toast("「"+(entry.name||TRASH_TYPES[col])+"」を元に戻しました"); }).catch(function(){ toast("元に戻せませんでした"); });
  }
  function purgeTrash(ids){
    if(!db){ state.trash = state.trash.filter(function(x){ return ids.indexOf(x.id)===-1; }); toast(ids.length+"件を完全に削除しました（プレビューのみ）"); render(); return; }
    Promise.all(ids.map(function(id){ return db.collection("trash").doc(id).delete(); })).then(function(){ toast(ids.length+"件を完全に削除しました"); }).catch(function(){ toast("削除に失敗しました"); });
  }

  /* ============ CSV 入力・出力 / 一括編集 (all list screens) ============ */
  // One generic mechanism shared by every list screen: 営業/施工案件, 顧客,
  // メンバー, ホーム(タスク) and 写真・ファイル. Each entity below declares its
  // CSV columns; export, import (upsert by ID) and bulk edit/delete are all
  // driven from that declaration.
  var CSV_LIST_SEP = /[、,，;；]+/;

  function csvNormDate(s){
    var m = /^(\d{4})[-\/.年](\d{1,2})[-\/.月](\d{1,2})日?$/.exec(String(s).trim());
    if(!m) return null;
    var y=+m[1], mo=+m[2], d=+m[3], dt=new Date(y,mo-1,d);
    if(dt.getFullYear()!==y || dt.getMonth()!==mo-1 || dt.getDate()!==d) return null;
    return y+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0");
  }
  function csvSpaceless(s){ return String(s||"").replace(/[\s　]+/g,""); }
  function csvResolveMemberName(raw){
    var key = csvSpaceless(raw);
    var m = state.members.find(function(x){ return csvSpaceless(x.name)===key; });
    return m ? m.name : null;
  }
  // Keep each assignee's existing 確認 status; new ones start 未確認.
  function csvBuildAssignees(names, existing){
    var old = normalizeAssignees(existing||[]);
    return names.map(function(n){
      var o = old.find(function(a){ return a.name===n; });
      if(o) return o;
      var m = memberByName(n);
      return {name:n, kind:m?m.kind:"internal", status:"未確認"};
    });
  }

  /* ---- what each screen currently shows (export / "select all" use these) ---- */
  function filterProjects(mode){
    var f = mode==="sales" ? state.salesFilter : state.constFilter;
    return state.projects.filter(function(p){
      if(f.name && (p.name||"").indexOf(f.name)===-1 && propertyAddressOf(p).full.indexOf(f.name)===-1 && (p.address||"").indexOf(f.name)===-1) return false;
      if(f.status.length && p.status && f.status.indexOf(p.status)===-1) return false;
      if(f.type!=="all" && p.type!==f.type) return false;
      if(f.noSched){ var wc = projectWorkCounts(p); if(wc.steps>0 && wc.events>0) return false; }
      if(f.assignees.length){
        var names = normalizeAssignees(p.assignees).map(function(a){return a.name;});
        if(!names.some(function(n){return f.assignees.indexOf(n)!==-1;})) return false;
      }
      return true;
    }).sort(function(a,b){return (b.createdAt||"").localeCompare(a.createdAt||"");});
  }
  function filterCustomers(){
    var q = state.custQuery||"";
    return state.customers.filter(function(c){
      if(!q) return true;
      return (c.name||"").indexOf(q)!==-1 || (c.address||"").indexOf(q)!==-1 || (c.phone||"").indexOf(q)!==-1;
    });
  }
  function filterMembers(){
    return state.members.filter(function(m){
      if(state.memberSeg==="all") return true;
      return m.kind===(state.memberSeg==="internal"?"internal":"external");
    });
  }
  function filterFiles(){
    var f = state.filesFilter;
    return state.files.filter(function(x){
      if(f.project!=="all" && x.projectId!==f.project) return false;
      if(f.kind==="image" && !isImageFile(x)) return false;
      if(f.kind==="other" && isImageFile(x)) return false;
      return true;
    }).sort(function(a,b){return (b.uploadedAt||"").localeCompare(a.uploadedAt||"");});
  }
  function taskMatches(t, f){
    if(f.status==="open" && t.done) return false;
    if(f.status==="done" && !t.done) return false;
    if(f.project!=="all" && t.projectId!==f.project) return false;
    if(f.assignee!=="all" && (t.assignee||"")!==f.assignee) return false;
    if(f.q && ((t.title||"")+(t.projectName||"")+(t.note||"")).indexOf(f.q)===-1) return false;
    return true;
  }
  function filterTasks(){
    var list = state.tasks.slice();
    if(state.tab==="tasks") list = list.filter(function(t){ return taskMatches(t, state.taskFilter); });
    return list.sort(function(a,b){return (a.dueDate||"").localeCompare(b.dueDate||"");});
  }
  function filterEvents(){ return state.events.slice().sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); }); }
  function filterSteps(){ return state.steps.slice().sort(function(a,b){ return (a.projectName||"").localeCompare(b.projectName||"") || (a.startDate||"").localeCompare(b.startDate||""); }); }
  function currentEntity(){
    switch(state.tab){
      case "calendar": return state.calView==="list" ? "events" : null;
      case "schedule": return state.ganttView==="list" ? "steps" : null;
      case "home": case "tasks": return "tasks";
      case "sales": case "construction": return "projects";
      case "customers": return "customers";
      case "members": return "members";

  function filteredList(entity){
    switch(entity){
      case "projects": return filterProjects(state.tab==="construction"?"construction":"sales");
      case "customers": return filterCustomers();
      case "members": return filterMembers();
      case "files": return filterFiles();
      case "tasks": return filterTasks();
      case "events": return filterEvents();
      case "steps": return filterSteps();
    }
    return [];
  }

  /* ---- CSV text <-> rows ---- */
  function parseCsv(text){
    if(text.charCodeAt(0)===0xFEFF) text = text.slice(1);
    var rows=[], row=[], cur="", inQ=false;
    for(var i=0;i<text.length;i++){
      var ch = text.charAt(i);
      if(inQ){
        if(ch==='"'){ if(text.charAt(i+1)==='"'){ cur+='"'; i++; } else inQ=false; }
        else cur+=ch;
      }else{
        if(ch==='"') inQ=true;
        else if(ch===','){ row.push(cur); cur=""; }
        else if(ch==="\r"){ /* ignore: \r\n and lone \r both end up handled by \n / end */ if(text.charAt(i+1)!=="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; } }
        else if(ch==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
        else cur+=ch;
      }
    }
    if(cur!=="" || row.length){ row.push(cur); rows.push(row); }
    return rows;
  }
  function csvEscape(v){
    v = v==null ? "" : String(v);
    return /[",\r\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  }
  function csvDecode(buf){
    try{ return new TextDecoder("utf-8",{fatal:true}).decode(buf); }
    catch(e){
      try{ return new TextDecoder("shift_jis").decode(buf); }
      catch(e2){ return new TextDecoder("utf-8").decode(buf); }
    }
  }
  function cellOut(c, r){
    var v = r[c.key];
    switch(c.type){
      case "number": return (v==null||v==="") ? "" : v;
      case "names": return normalizeAssignees(v).map(function(a){return a.name;}).join("、");
      case "list": return (v||[]).join("、");
      case "bool": return v ? "はい" : "いいえ";
      case "perm": return permissionLabel(memberPermission(r));
      default:
        var s = v==null ? "" : String(v);
        // Stop spreadsheet apps from treating text as a formula.
        if(!c.type && /^[=+\-@]/.test(s)) s = "'"+s;
        return s;
    }
  }
  function buildCsv(entity, rows){
    var cols = CSV_ENTITIES[entity].columns.filter(function(c){ return !c.importOnly; });
    var out = [cols.map(function(c){return c.label;})];
    rows.forEach(function(r){ out.push(cols.map(function(c){ return cellOut(c, r); })); });
    return "﻿"+out.map(function(r){ return r.map(csvEscape).join(","); }).join("\r\n");
  }
  function downloadBlob(filename, blob){
    if(downloadsCap){
      downloadsCap.save({filename:filename, data:blob}).catch(function(){ toast("ダウンロードがキャンセルされました"); });
    }else{
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    }
  }

  /* ---- cell parsing (shared by import and bulk edit) ---- */
  // Returns {empty:true} | {value:...} | {error:"..."}.
  function parseCell(c, raw, existing){
    var s = String(raw==null ? "" : raw).trim();
    if(s==="") return {empty:true};
    switch(c.type){
      case "number":
        var n = parseFloat(s.replace(/[,，¥￥円\s　]/g,""));
        if(isNaN(n)) return {error:"「"+c.label+"」が数値ではありません（"+s+"）"};
        return {value:n};
      case "date":
        var d = csvNormDate(s);
        if(!d) return {error:"「"+c.label+"」は 2026-10-06 の形式で入力してください（"+s+"）"};
        return {value:d};
      case "bool":
        if(/^(はい|true|1|yes|完了|済|○|〇)$/i.test(s)) return {value:true};
        if(/^(いいえ|false|0|no|未完了|未|×)$/i.test(s)) return {value:false};
        return {error:"「"+c.label+"」は はい／いいえ で入力してください（"+s+"）"};
      case "perm":
        var p = PERMISSION_LEVELS.find(function(x){ return x[0]===s.toLowerCase() || x[1]===s; });
        if(!p) return {error:"「"+c.label+"」は 管理者／一般／外部 のいずれかです（"+s+"）"};
        return {value:p[0]};
      case "names":
        var names = [];
        var bad = [];
        s.split(CSV_LIST_SEP).forEach(function(part){
          part = part.trim(); if(!part) return;
          var nm = csvResolveMemberName(part);
          if(!nm && existing){ var keep = normalizeAssignees(existing[c.key]).find(function(x){ return csvSpaceless(x.name)===csvSpaceless(part); }); if(keep) nm = keep.name; }   // その案件に既にいる担当者は（メンバー一覧に無くても）そのまま許可
          if(!nm) bad.push(part); else if(names.indexOf(nm)===-1) names.push(nm);
        });
        if(bad.length) return {error:"「"+c.label+"」に未登録のメンバーがいます（"+bad.join("、")+"）"};
        return {value:names};
      case "list":
        var items = [], badItems = [];
        s.split(/[、,，;；\s　]+/).forEach(function(part){
          if(!part) return;
          if(c.options && c.options.indexOf(part)===-1) badItems.push(part);
          else if(items.indexOf(part)===-1) items.push(part);
        });
        if(badItems.length) return {error:"「"+c.label+"」に選択肢にない値があります（"+badItems.join("、")+"）"};
        return {value:items};
      default:
        if(c.options){
          // Accept a value the record already has even if it is not in the list.
          if(c.options.indexOf(s)===-1 && !(existing && existing[c.key]===s))
            return {error:"「"+c.label+"」は次のいずれかです："+c.options.join("／")+"（"+s+"）"};
          return {value:s};
        }
        if(/^'[=+\-@]/.test(s)) s = s.slice(1);
        return {value:s};
    }
  }

  /* ---- raw writes (no per-row toast; callers report totals) ---- */
  function saveRaw(col, id, data){
    var now = new Date().toISOString();
    data = Object.assign({}, data, {updatedAt:now});
    if(!db){
      var arr = rawOf(col);
      if(id){ var i = arr.findIndex(function(x){return x.id===id;}); if(i>-1) arr[i] = Object.assign({}, arr[i], data); }
      else arr.unshift(Object.assign({id:uid(), createdAt:now}, data));
      return Promise.resolve();
    }
    return id ? db.collection(col).doc(id).update(data) : db.collection(col).add(Object.assign({createdAt:now}, data));
  }
  function deleteRaw(col, id){
    return trashPut(col,id).then(function(){
      if(!db){ setRaw(col, rawOf(col).filter(function(x){return x.id!==id;})); return; }
      return db.collection(col).doc(id).delete();
    });
  }
  function runBatch(promises, doneLabel){
    var ok = 0, fail = 0;
    return Promise.all(promises.map(function(p){ return p.then(function(){ ok++; }, function(){ fail++; }); })).then(function(){
      closeModal();
      toast(fail ? (ok+"件を"+doneLabel+"、"+fail+"件は失敗しました") : (ok+"件を"+doneLabel+"しました"));
      render();
    });
  }

  /* ---- import ---- */
  function csvTemplate(entity){
    var E = CSV_ENTITIES[entity];
    var cols = E.columns.filter(function(c){ return !c.readonly || c.key==="id"; });
    var rows = [cols.map(function(c){return c.label;}), cols.map(function(c){ return c.key==="id" ? "" : (E.sample[c.key]||""); })];
    var text = "﻿"+rows.map(function(r){ return r.map(csvEscape).join(","); }).join("\r\n");
    downloadBlob(E.label+"_取込テンプレート.csv", new Blob([text], {type:"text/csv"}));
  }

  function planImport(entity, rows){
    var E = CSV_ENTITIES[entity];
    var plan = {ops:[], errors:[], unknown:[], total:0};
    if(!rows.length){ plan.errors.push({line:0, msg:"ファイルが空です"}); return plan; }
    var header = rows[0].map(function(h){ return String(h==null?"":h).replace(/^﻿/,"").trim(); });
    var colIdx = {};
    header.forEach(function(h, i){
      var c = E.columns.find(function(x){ return x.label===h || x.key.toLowerCase()===h.toLowerCase(); });
      if(c && colIdx[c.key]==null) colIdx[c.key] = i; else if(h && !c) plan.unknown.push(h);
    });
    if(Object.keys(colIdx).length===0){ plan.errors.push({line:1, msg:"見出し行が認識できません。「CSV出力」したファイルかテンプレートの形式にしてください"}); return plan; }

    var existingList = E.all();
    var seenNames = {};
    var adminAfter = null;
    if(entity==="members"){
      adminAfter = {};
      state.members.forEach(function(m){ adminAfter[m.id] = memberPermission(m)==="admin"; });
    }
    for(var i=1;i<rows.length;i++){
      var row = rows[i];
      if(!row.some(function(v){ return String(v||"").trim()!==""; })) continue;
      plan.total++;
      var line = i+1;
      var idRaw = colIdx.id!=null ? String(row[colIdx.id]||"").trim() : "";
      var existing = idRaw ? existingList.find(function(x){ return x.id===idRaw; }) : null;
      var patch = {}, rowErrors = [];
      E.columns.forEach(function(c){
        if(c.readonly || colIdx[c.key]==null) return;
        var res = parseCell(c, row[colIdx[c.key]], existing);
        if(res.error) rowErrors.push(res.error); else if(!res.empty) patch[c.key] = res.value;
      });
      var label = patch[E.nameKey] || (existing && existing[E.nameKey]) || "";
      if(!existing && !patch[E.nameKey]) rowErrors.push("必須項目「"+E.requiredLabel+"」が空です");
      if(entity==="members" && patch.name){
        var dup = state.members.find(function(m){ return csvSpaceless(m.name)===csvSpaceless(patch.name) && (!existing || m.id!==existing.id); });
        if(dup) rowErrors.push("同じ氏名のメンバーが既に登録されています（"+patch.name+"）");
        if(seenNames[csvSpaceless(patch.name)]) rowErrors.push("ファイル内で氏名が重複しています（"+patch.name+"）");
        seenNames[csvSpaceless(patch.name)] = true;
      }
      if(!rowErrors.length && E.validate){ var ve = E.validate(patch, existing); if(ve) rowErrors.push(ve); }
      if(rowErrors.length){ plan.errors.push({line:line, msg:(label?label+"：":"")+rowErrors.join(" / ")}); continue; }
      var data = E.finalize(patch, existing);
      plan.ops.push({type: existing ? "update" : "create", id: existing ? existing.id : null, data:data, label:label});
      if(adminAfter && existing && data.permission) adminAfter[existing.id] = data.permission==="admin";
      else if(adminAfter && !existing) adminAfter["new"+i] = data.permission==="admin";
    }
    if(adminAfter && plan.ops.length && !Object.keys(adminAfter).some(function(k){ return adminAfter[k]; })){
      plan.ops = []; plan.errors.push({line:0, msg:"管理者が1人もいなくなるため取り込めません"});
    }
    return plan;
  }

  function openCsvImport(entity){
    var E = CSV_ENTITIES[entity];
    if(!E.importable || !csvCanWrite(entity)) return;
    var body = '<div style="font-size:12.5px;line-height:1.7">'+
      '<div>CSVファイルから「'+esc(E.label)+'」を追加・更新します。</div>'+
      '<ul style="margin:8px 0 10px 18px;padding:0;color:var(--ink-soft)">'+
        '<li>1行目は見出し行です（「CSV出力」したファイルと同じ形式）。</li>'+
        '<li>「ID」が一致する行は更新、IDが空・未登録の行は新規登録です。</li>'+
        '<li>空欄のセルは変更されません。</li>'+
        '<li>文字コードはUTF-8・Shift_JIS（Excel保存）に対応しています。</li>'+
      '</ul><button class="btn sm" id="csv-template">テンプレートをダウンロード</button></div>'+
      '<div style="margin-top:14px"><input type="file" id="csv-file" accept=".csv,text/csv"></div>'+
      '<div id="csv-preview" style="margin-top:14px;font-size:12.5px"></div>';
    openModal(E.label+"のCSV入力", body, '<button class="btn" data-close-modal>閉じる</button><button class="btn primary" id="csv-run" disabled>取り込む</button>');
    var currentPlan = null;
    document.getElementById("csv-template").onclick = function(){ csvTemplate(entity); };
    document.getElementById("csv-file").addEventListener("change", function(ev){
      var file = ev.target.files && ev.target.files[0];
      var box = document.getElementById("csv-preview");
      var run = document.getElementById("csv-run");
      run.disabled = true; currentPlan = null;
      if(!file) return;
      var fr = new FileReader();
      fr.onerror = function(){ box.textContent = "ファイルを読み込めませんでした"; };
      fr.onload = function(){
        var plan;
        try{ plan = planImport(entity, parseCsv(csvDecode(fr.result))); }
        catch(e){ box.textContent = "CSVの解析に失敗しました"; return; }
        currentPlan = plan;
        var created = plan.ops.filter(function(o){return o.type==="create";}).length;
        var updated = plan.ops.length - created;
        var h = '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px"><span>新規 <b>'+created+'</b>件</span><span>更新 <b>'+updated+'</b>件</span>'+
          '<span style="color:'+(plan.errors.length?'var(--danger)':'inherit')+'">エラー <b>'+plan.errors.length+'</b>件（取り込まれません）</span></div>';
        if(plan.unknown.length) h += '<div style="color:var(--ink-faint);margin-bottom:6px">無視した列：'+esc(plan.unknown.join("、"))+'</div>';
        if(plan.errors.length){
          h += '<div style="max-height:150px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--danger)">'+
            plan.errors.slice(0,30).map(function(er){ return '<div>'+(er.line?er.line+'行目：':'')+esc(er.msg)+'</div>'; }).join("")+
            (plan.errors.length>30?'<div>…ほか'+(plan.errors.length-30)+'件</div>':'')+'</div>';
        }
        box.innerHTML = h;
        run.disabled = plan.ops.length===0;
      };
      fr.readAsArrayBuffer(file);
    });
    document.getElementById("csv-run").onclick = function(){
      if(!currentPlan || !currentPlan.ops.length) return;
      if(!csvCanWrite(entity)) return;
      document.getElementById("csv-run").disabled = true;
      runBatch(currentPlan.ops.map(function(op){ return saveRaw(E.col, op.id, op.data); }), "取り込み");
    };
  }

  /* ---- bulk edit (selection mode) ---- */
  function bulkReset(){ state.bulk = {on:false, entity:null, selected:{}, field:"", value:""}; }
  function bulkSelectedIds(){ return Object.keys(state.bulk.selected).filter(function(k){ return state.bulk.selected[k]; }); }
  function bulkToggle(entity){
    if(state.bulk.on && state.bulk.entity===entity){ bulkReset(); }
    else{
      if(!csvCanWrite(entity)) return;
      if(entity==="events") state.calView = "list";

  function bulkValueControl(c){
    if(!c) return "";
    var opts = null;
    if(c.options && c.type!=="list") opts = c.options.map(function(o){ return [o,o]; });
    else if(c.type==="perm") opts = PERMISSION_LEVELS.map(function(p){ return [p[1],p[1]]; });
    else if(c.type==="bool") opts = [["はい","はい"],["いいえ","いいえ"]];
    if(opts) return '<select id="bulk-value">'+opts.map(function(o){ return '<option value="'+esc(o[0])+'"'+(state.bulk.value===o[0]?" selected":"")+'>'+esc(o[1])+'</option>'; }).join("")+'</select>';
    var type = c.type==="date" ? "date" : (c.type==="number" ? "number" : "text");
    var ph = c.type==="names" ? "例：阿部 晋太郎、佐藤 裕之（空欄で担当者なし）" : (c.type==="list" ? "例：営業、現場監督" : "");
    return '<input type="'+type+'" id="bulk-value" placeholder="'+esc(ph)+'" value="'+esc(state.bulk.value||"")+'" style="min-width:150px">';
  }
  function bulkBarHtml(){
    var E = CSV_ENTITIES[state.bulk.entity];
    var cols = E.columns.filter(function(c){ return c.bulk; });
    if(cols.length && !cols.some(function(c){ return c.key===state.bulk.field; })) state.bulk.field = cols[0].key;
    var html = '<div class="card bulk-bar" id="bulk-bar"><b style="font-size:12.5px">一括編集：'+esc(E.label)+'</b><span id="bulk-count" style="font-size:12px"></span>'+
      '<button class="btn sm" id="bulk-sel-visible">表示中を選択</button>'+
      '<button class="btn sm" id="bulk-sel-all">絞り込み結果すべて選択</button>'+
      '<button class="btn sm" id="bulk-sel-none">選択解除</button>';
    if(cols.length){
      html += '<span style="flex:1"></span><span style="font-size:12px">項目</span><select id="bulk-field">'+cols.map(function(c){ return '<option value="'+c.key+'"'+(c.key===state.bulk.field?" selected":"")+'>'+esc(c.label)+'</option>'; }).join("")+'</select>'+
        '<span style="font-size:12px">→</span><span id="bulk-value-wrap">'+bulkValueControl(cols.find(function(c){return c.key===state.bulk.field;}))+'</span>'+
        '<button class="btn primary sm" id="bulk-apply">選択行に適用</button>';
    }else{
      html += '<span style="flex:1"></span>';
    }
    html += '<button class="btn sm" id="bulk-delete" style="color:var(--danger)">選択を削除</button><button class="btn sm" id="bulk-exit">終了</button></div>';

  function bulkRefreshCount(){
    var n = bulkSelectedIds().length;
    var el = document.getElementById("bulk-count"); if(el) el.textContent = n+"件選択中";
    var c = document.getElementById("content");
    if(c) c.querySelectorAll("[data-row-id]").forEach(function(row){
      var on = !!state.bulk.selected[row.getAttribute("data-row-id")];
      row.classList.toggle("row-selected", on);
      var chk = row.querySelector("input[data-bulk-chk]"); if(chk) chk.checked = on;
    });
    var all = c && c.querySelector("input[data-bulk-all]");
    if(all){
      var rows = c.querySelectorAll("tbody [data-row-id]");
      all.checked = rows.length>0 && Array.prototype.every.call(rows, function(r){ return state.bulk.selected[r.getAttribute("data-row-id")]; });
    }
  }
  function bulkSetSelected(ids, on){ ids.forEach(function(id){ state.bulk.selected[id] = on; }); bulkRefreshCount(); }

  function applyBulkUi(){
    if(!state.bulk.on) return;
    if(!state.isAdmin){ bulkReset(); return; }
    var entity = currentEntity();
    if(state.bulk.entity!==entity){ bulkReset(); return; }
    var c = document.getElementById("content");
    var wrap = document.createElement("div");
    wrap.innerHTML = bulkBarHtml();
    c.insertBefore(wrap.firstChild, c.firstChild);

    // checkboxes: table rows get a leading column, card-like rows get a floating box
    c.querySelectorAll("table").forEach(function(tbl){
      var rows = tbl.querySelectorAll("tbody tr[data-row-id]");
      if(!rows.length) return;
      var hr = tbl.querySelector("thead tr");
      if(hr){ var th = document.createElement("th"); th.className = "bulk-cell"; th.innerHTML = '<input type="checkbox" data-bulk-all title="表示中をすべて選択">'; hr.insertBefore(th, hr.firstChild); }
      rows.forEach(function(tr){
        var td = document.createElement("td"); td.className = "bulk-cell";
        td.innerHTML = '<input type="checkbox" data-bulk-chk>';
        tr.insertBefore(td, tr.firstChild);
      });
    });
    c.querySelectorAll(".photo-grid [data-row-id], .todo-row[data-row-id]").forEach(function(el){
      el.style.position = "relative";
      if(el.classList.contains("todo-row")) el.style.paddingLeft = "30px";
      var box = document.createElement("input"); box.type = "checkbox"; box.className = "bulk-float"; box.setAttribute("data-bulk-chk","");
      el.insertBefore(box, el.firstChild);
    });

    c.querySelectorAll("input[data-bulk-chk]").forEach(function(chk){
      chk.addEventListener("click", function(ev){ ev.stopPropagation(); });
      chk.addEventListener("change", function(){
        var row = chk.closest("[data-row-id]");
        if(row) state.bulk.selected[row.getAttribute("data-row-id")] = chk.checked;
        bulkRefreshCount();
      });
    });
    // file thumbnails are links: in selection mode a click selects instead of opening
    c.querySelectorAll(".photo-grid [data-row-id]").forEach(function(a){
      a.addEventListener("click", function(ev){
        if(ev.target.closest("[data-del-file]")) return;
        ev.preventDefault();
        var id = a.getAttribute("data-row-id");
        state.bulk.selected[id] = !state.bulk.selected[id];
        bulkRefreshCount();
      });
    });
    var all = c.querySelector("input[data-bulk-all]");
    if(all) all.addEventListener("change", function(){
      var ids = Array.prototype.map.call(c.querySelectorAll("tbody [data-row-id]"), function(r){ return r.getAttribute("data-row-id"); });
      bulkSetSelected(ids, all.checked);
    });

    var E = CSV_ENTITIES[entity];
    document.getElementById("bulk-sel-visible").onclick = function(){
      bulkSetSelected(Array.prototype.map.call(c.querySelectorAll("[data-row-id]"), function(r){ return r.getAttribute("data-row-id"); }), true);
    };
    document.getElementById("bulk-sel-all").onclick = function(){ bulkSetSelected(filteredList(entity).map(function(x){return x.id;}), true); };
    document.getElementById("bulk-sel-none").onclick = function(){ state.bulk.selected = {}; bulkRefreshCount(); };
    document.getElementById("bulk-exit").onclick = function(){ bulkReset(); render(); };
    var fieldSel = document.getElementById("bulk-field");
    if(fieldSel){
      fieldSel.onchange = function(){
        state.bulk.field = fieldSel.value; state.bulk.value = "";
        document.getElementById("bulk-value-wrap").innerHTML = bulkValueControl(E.columns.find(function(x){return x.key===state.bulk.field;}));
        bindBulkValue();
      };
      bindBulkValue();
      document.getElementById("bulk-apply").onclick = bulkApply;
    }
    document.getElementById("bulk-delete").onclick = bulkDelete;
    bulkRefreshCount();
  }
  function bindBulkValue(){
    var v = document.getElementById("bulk-value");
    if(v){ v.addEventListener("input", function(){ state.bulk.value = v.value; }); v.addEventListener("change", function(){ state.bulk.value = v.value; }); if(v.tagName==="SELECT") state.bulk.value = v.value; }
  }

  // After the change, would at least one admin remain?
  function adminsRemainAfter(changes){   // changes: {memberId: "admin"|"general"|"external"|null(deleted)}
    return state.members.some(function(m){
      var p = Object.prototype.hasOwnProperty.call(changes, m.id) ? changes[m.id] : memberPermission(m);
      return p==="admin";
    });
  }
  function bulkApply(){
    var entity = state.bulk.entity, E = CSV_ENTITIES[entity];
    if(!csvCanWrite(entity)) return;
    var ids = bulkSelectedIds();
    if(!ids.length){ toast("変更する行を選択してください"); return; }
    var col = E.columns.find(function(c){ return c.key===state.bulk.field; });
    if(!col) return;
    var raw = (document.getElementById("bulk-value")||{}).value || "";
    var res = parseCell(col, raw, null), value;
    if(res.error){ toast(res.error); return; }
    if(res.empty){
      if(col.options && col.type!=="list" || col.type==="number" || col.type==="bool" || col.type==="perm"){ toast("変更後の値を入力してください"); return; }
      value = (col.type==="names"||col.type==="list") ? [] : "";
    }else value = res.value;
    var shown = Array.isArray(value) ? (value.join("、")||"（なし）") : (col.type==="perm" ? permissionLabel(value) : (col.type==="bool" ? (value?"はい":"いいえ") : (value===""?"（空欄）":String(value))));
    if(entity==="members" && col.key==="permission"){
      var ch = {}; ids.forEach(function(id){ ch[id] = value; });
      if(!adminsRemainAfter(ch)){ toast("管理者が1人もいなくなるため変更できません"); return; }
    }
    openModal("一括編集の確認",
      '<div style="font-size:13px;line-height:1.7">選択した <b>'+ids.length+'</b> 件の「'+esc(col.label)+'」を<br><b>'+esc(shown)+'</b><br>に変更します。よろしいですか？</div>',
      '<button class="btn" data-close-modal>キャンセル</button><button class="btn primary" id="bulk-apply-ok">変更する</button>');
    document.getElementById("bulk-apply-ok").onclick = function(){
      document.getElementById("bulk-apply-ok").disabled = true;
      var list = E.all();
      var jobs = ids.map(function(id){
        var existing = list.find(function(x){ return x.id===id; });
        var patch = {}; patch[col.key] = value;
        return saveRaw(E.col, id, E.finalize(patch, existing));
      });
      state.bulk.selected = {};
      runBatch(jobs, "変更");
    };
  }
  function bulkDelete(){
    var entity = state.bulk.entity, E = CSV_ENTITIES[entity];
    if(!csvCanWrite(entity)) return;
    var ids = bulkSelectedIds();
    if(!ids.length){ toast("削除する行を選択してください"); return; }
    if(entity==="members"){
      var me = myMember();
      if(me && ids.indexOf(me.id)!==-1){ toast("ログイン中のご自身は削除できません"); return; }
      var ch = {}; ids.forEach(function(id){ ch[id] = null; });
      if(!adminsRemainAfter(ch)){ toast("管理者が1人もいなくなるため削除できません"); return; }
    }
    confirmDelete("選択した"+ids.length+"件の"+E.label+"を削除しますか？この操作は取り消せません。", function(){
      state.bulk.selected = {};
      runBatch(ids.map(function(id){ return deleteRaw(E.col, id); }), "削除");
    });
  }


  function copyProjectSummary(id){
    var p = state.projects.find(function(x){return x.id===id;});
    if(!p) return;
    var lines = [
      "【"+p.name+"】",
      "進捗: "+p.status, "案件種類: "+(p.type||""), "金額: "+fmtYen(p.amount),
      "施工予定: "+(fmtDate(p.startDate)+" 〜 "+fmtDate(p.endDate)),
      "住所: "+propertyAddressOf(p).full,
      "顧客: "+(p.customerName||"")
    ];
    var text = lines.join("\n");
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){toast("案件情報をコピーしました");}).catch(function(){toast("コピーに失敗しました");});
    } else { toast("この環境ではコピーを利用できません"); }
  }

      if(key==="statuses"){ var miss = STATUS_REQUIRED.filter(function(x){ return list.indexOf(x)===-1; }); if(miss.length){ toast("次の進捗は集計に使うため削除できません：" + miss.join("・")); return; } }
      if(list.some(function(x){ return x.length>30; })){ toast("1項目は30文字以内にしてください"); return; }
      saveMaster(key, list, "マスタを保存しました");
    }); });
    c.querySelectorAll("[data-master-reset]").forEach(function(btn){ btn.addEventListener("click", function(){
      var key = btn.getAttribute("data-master-reset"), m = MASTERS.find(function(x){return x.key===key;});
      confirmDelete("「"+m.label+"」を標準の項目に戻します。標準にない項目を使っている登録済みデータは「未入力」に変わります。", function(){
        saveMaster(key, MASTER_DEFAULTS[key].slice(), "標準の項目に戻しました", true);
      }, {title:"標準に戻す確認", button:"標準に戻す"});
    }); });

    if(sdSave) sdSave.addEventListener("click", function(){
      var list = Array.prototype.slice.call(c.querySelectorAll("input[data-secret-default]:checked")).map(function(b){ return b.getAttribute("data-secret-default"); });
      saveSecretDefaults(list, "社外秘の初期設定を保存しました");
    });

    });
    var backupBtn = document.getElementById("admin-backup");
    if(backupBtn) backupBtn.addEventListener("click", function(){ if(!state.isAdmin) return; backupAllData(); });
    var bkRun = document.getElementById("bk-run");
    if(bkRun) bkRun.addEventListener("click", function(){ if(!state.isAdmin) return; backupAllData(document.getElementById("bk-pw").checked); });
    var fb = document.getElementById("files-backup-btn");
    if(fb) fb.addEventListener("click", function(){ if(state.isAdmin) backupFilesOnly(null); });
    var pb = document.getElementById("pf-backup");
    if(pb) pb.addEventListener("click", function(){ if(state.isAdmin) backupFilesOnly(state.filesProjectId); });
    var bkRunF = document.getElementById("bk-run-files");
    if(bkRunF) bkRunF.addEventListener("click", function(){ if(!state.isAdmin) return; bkRunF.disabled = true; backupAllData(document.getElementById("bk-pw").checked, true); });
    var bkFile = document.getElementById("bk-file");
    if(bkFile) bkFile.addEventListener("change", function(){
      var f = bkFile.files && bkFile.files[0]; if(!f || !state.isAdmin) return;
      var r = new FileReader();
      r.onload = function(){ var b = parseBackup(String(r.result||"")); if(b.error){ state.backupPreview=null; toast(b.error); render(); return; } b.name=f.name; state.backupPreview=b; render(); };
      r.readAsText(f);
    });
    var bkCancel = document.getElementById("bk-cancel");
    if(bkCancel) bkCancel.addEventListener("click", function(){ state.backupPreview=null; render(); });
    var bkRestore = document.getElementById("bk-restore");
    if(bkRestore) bkRestore.addEventListener("click", function(){
      var b = state.backupPreview; if(!b || !state.isAdmin) return;
      confirmDelete("バックアップ（"+b.total+"件）の内容で現在のデータを上書き・追加します。", function(){ restoreBackup(b); }, {title:"復元の確認", button:"復元する"});
    });
  }
