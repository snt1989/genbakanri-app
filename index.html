  /* ============ LINE WORKS 連携 ============ */
  // 連携はVercel版（/api/works）でのみ動きます。通知先は「Botを追加したグループトークルーム」です。
  // この画面は「ログイン中メンバーの氏名＋パスワード」を毎回サーバーへ送って本人確認します。
  var WORKS_API = "/api/works";
  function worksAvailable(){ return !!db && !window.claude && !state.offlineMode; }
  function worksCall(action, extra){
    var me = myMember();
    if(!me) return Promise.reject(new Error("ログイン情報を確認できません"));
    return fetch(WORKS_API, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({auth:{name:me.name, password:me.password||""}, action:action}, extra||{}))})
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if(!r.ok) throw new Error(j.error || ("サーバーエラー（"+r.status+"）")); return j; }); });
  }
  // 状態を一度だけ取得（連携が有効かどうかの判定にも使う）
  function worksLoadStatus(force){
    var w = state.works;
    if(!worksAvailable() || w.loading || (w.status && !force) || (w.failed && !force) || !myMember()) return Promise.resolve(w.status);
    w.loading = true;
    return worksCall("status").then(function(j){ w.status = j; w.error = ""; w.failed = false; }, function(e){ w.status = null; w.error = e.message; w.failed = true; })
      .then(function(){ w.loading = false; if((state.tab==="settings" && state.settingsSeg==="works") || state.viewingProjectId) render(); try{ worksAutoUpdate(w.status); }catch(e){} return w.status; });
  }
  // アプリの更新内容をLINE WORKSへ通知（管理者の画面が新しい版になったとき、1つの版につき1回だけ・サーバー側で重複を防ぐ）
  function worksUpdatePayload(){
    var r = RELEASES[0]; if(!r) return null;
    var items = r.items.filter(function(x){ return !x.admin; }).map(function(x){ return {t:x.t, d:x.d}; });
    if(!items.length) return null;
    return {id:r.id, title:r.title, items:items};
  }
  function worksAutoUpdate(st){
    if(!state.isAdmin || !st || !st.configured || !st.channelId || (st.flags && st.flags.notifyUpdate===false) || state.worksUpdateSent) return;
    var p = worksUpdatePayload(); if(!p) return;
    state.worksUpdateSent = true;
    worksCall("notifyUpdate", p).catch(function(){});
  }
  function worksReady(){ var s = state.works.status; return !!(s && s.configured); }
  // 画面での登録・更新に合わせて、トークルームへ通知する（失敗しても画面の操作は妨げない）
  function worksNotifyAfterWrite(col, id, data, old){
    if(!worksAvailable()) return;
    var ev = "", text = "";
    var proj = function(pid, nm){ return nm || ((state.projects.find(function(x){return x.id===pid;})||{}).name) || ""; };
    if(col==="projects"){
      var name = data.name || (old && old.name) || proj(id);
      if(!old){ ev = "status"; text = "【案件登録】"+name+(data.status?"（"+data.status+"）":""); }
      else if(data.status!==undefined && data.status!==old.status){ ev = "status"; text = "【進捗変更】"+name+"\n"+(old.status||"未入力")+" → "+(data.status||"未入力"); }
    }else if(col==="reports"){
      var prev = old ? (old.status||"下書き") : "";
      if(data.status==="提出済" && prev!=="提出済"){
        ev = "report";
        text = "【報告書】"+(data.type||"")+" "+(data.title||"")+"\n案件: "+(data.projectName||"—")+"　作成者: "+(data.author||"—")+(data.content?"\n"+String(data.content).slice(0,300):"");
      }
    }else if(col==="tasks"){
      if(!old){ ev = "task"; text = "【タスク追加】"+(data.title||"")+"\n期限: "+(data.dueDate||"—")+(data.assignee?"　担当: "+data.assignee:"")+(data.projectName?"\n案件: "+data.projectName:""); }
    }
    if(col==="tasks" && !ev){ try{ pushEventAfterWrite(col, id, data, old); }catch(e){} return; }   // タスク完了は、依頼した人にスマホ通知だけ送る
    if(!ev) return;
    try{ pushEventAfterWrite(col, id, data, old); }catch(e){}
    worksLoadStatus().then(function(st){
      if(st && st.configured) worksCall("notify", {event:ev, text:text}).catch(function(){});
    });
  }
  // スマホ通知（案件・報告書・タスクの新着）。通知を受けるかは各端末の設定（PUSH_KINDS）で選べる。
  function pushEventAfterWrite(col, id, data, old){
    var kind="", title="", body="", names=[];
    var projOf=function(pid, nm){ return state.projects.find(function(x){return x.id===pid;}) || state.projects.find(function(x){return nm && x.name===nm;}) || null; };
    var asg=function(p){ return p ? normalizeAssignees(p.assignees).map(function(a){return a.name;}) : []; };
    if(col==="projects"){
      var nm = data.name || (old && old.name) || ((projOf(id)||{}).name) || "";
      names = normalizeAssignees(data.assignees || (old && old.assignees) || (projOf(id)||{}).assignees).map(function(a){return a.name;});
      if(!old){ kind="projectNew"; title="新しい案件が登録されました"; body=nm+(data.status?"（"+data.status+"）":""); }
      else if(data.status!==undefined && data.status!==old.status){ kind="projectStatus"; title="案件の進捗が変わりました"; body=nm+"：" +(old.status||"未入力")+" → "+(data.status||"未入力"); }
    }else if(col==="reports"){
      var prev = old ? (old.status||"下書き") : "";
      if(data.status==="提出済" && prev!=="提出済"){ kind="report"; title="報告書が提出されました"; body=(data.type||"")+" "+(data.title||"")+"（"+(data.projectName||"—")+"）"; names=asg(projOf(data.projectId, data.projectName)); }
    }else if(col==="tasks"){
      if(old && data.done===true && !old.done && old.createdBy && old.createdBy!==state.myName && old.assignee){ kind="task"; title="依頼したタスクが完了しました"; body=(old.title||data.title||"")+"（"+(state.myName||"")+"さんが完了）"; names=[old.createdBy]; }
      else if(!old){ kind="task"; title="タスクが追加されました"; body=(data.title||"")+(data.dueDate?"（期限 "+data.dueDate+"）":""); names=[data.assignee].filter(Boolean); }
    }
    if(!kind) return;
    pushCall("event", {kind:kind, title:title, text:body, names:names}).catch(function(){});
  }

  /* ============ バックアップ / 復元 ============ */
  var BACKUP_COLS = [["projects","案件"],["customers","顧客"],["members","メンバー"],["tasks","タスク"],["chats","チャット"],["files","ファイル"],["folders","フォルダ"],["events","予定"],["steps","工程"],["reports","報告書"],["cards","名刺"],["trash","ゴミ箱"]];
  function lastBackupAt(){ try{ return localStorage.getItem("genba_last_backup")||state.lastBackup||""; }catch(e){ return state.lastBackup||""; } }
  function markBackup(){ var t=new Date().toISOString(); state.lastBackup=t; try{ localStorage.setItem("genba_last_backup", t); }catch(e){} }
  function buildBackup(includePw){
    var data = {}, counts = {};
    BACKUP_COLS.forEach(function(c){
      data[c[0]] = rawOf(c[0]).map(function(o){ var x=Object.assign({},o); if(c[0]==="members" && !includePw) delete x.password; return x; });
      counts[c[0]] = data[c[0]].length;
    });
    var master = {}; MASTERS.forEach(function(m){ master[m.key] = m.arr.slice(); });
    return {format:"genba-backup", version:2, exportedAt:new Date().toISOString(), exportedBy:state.myName||"", includesPasswords:!!includePw,
      counts:counts, settings:{org:state.orgSettings, secret:{defaults:secretDefaults()}, master:master}, data:data};
  }
  function blobToB64(blob){
    return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){ res(String(r.result).split(",")[1]||""); }; r.onerror=rej; r.readAsDataURL(blob); });
  }
  // 写真・ファイルの本体を取得してbase64で同梱する（1件ずつ処理してメモリを抑える）
  function collectFileBlobs(payload){
    var list = payload.data.files, blobs = {}, failed = [], i = 0;
    var next = function(){
      if(i>=list.length) return Promise.resolve();
      var f = list[i++]; toast("写真・ファイルを取得中… "+i+" / "+list.length);
      if(f.chunked) return next();
      return fetch(fileUrl(f)).then(function(r){ if(!r.ok) throw 0; return r.blob(); })
        .then(blobToB64).then(function(b64){ blobs[f.id] = {contentType:f.contentType||"", b64:b64}; })
        .catch(function(){ failed.push(f.filename||f.id); }).then(next);
    };
    return next().then(function(){ payload.blobs = blobs; payload.includesFiles = true; return failed; });
  }
  function backupAllData(includePw, withFiles){
    if(!lazyReady()) return;
    var payload = buildBackup(includePw===true);
    if(withFiles === true){
      return collectFileBlobs(payload).then(function(failed){ saveBackupPayload(payload, failed); });
    }
    saveBackupPayload(payload, []);
  }
  // 写真・ファイル画面用：ファイル情報・フォルダ・本体だけのバックアップ（projectId指定でその案件のみ）
  function backupFilesOnly(projectId){
    if(!lazyReady()) return;
    var pick = function(col){ return rawOf(col).filter(function(x){ return !projectId || x.projectId===projectId; }).map(function(o){ return Object.assign({},o); }); };
    var payload = {format:"genba-backup", version:2, scope:"files", exportedAt:new Date().toISOString(), exportedBy:state.myName||"", data:{files:pick("files"), folders:pick("folders")}};
    payload.counts = {files:payload.data.files.length, folders:payload.data.folders.length};
    if(!payload.data.files.length && !payload.data.folders.length){ toast("バックアップするファイルがありません"); return; }

  function saveBackupPayload(payload, failed){
    var blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
    var filename = (payload.scope==="files"?"genba-files-backup-":"genba-backup-"+(payload.includesFiles?"full-":""))+todayISO()+".json";
    var done = function(){ markBackup(); toast("バックアップを保存しました（"+BACKUP_COLS.reduce(function(n,c){return n+(payload.counts[c[0]]||0);},0)+"件"+(payload.includesFiles?"・写真/ファイル"+Object.keys(payload.blobs).length+"点":"")+"）"+(failed.length?" 取得できなかったファイル: "+failed.length+"点":"")); render(); };
    if(downloadsCap){
      downloadsCap.save({filename:filename, data:blob}).then(done).catch(function(){ toast("ダウンロードがキャンセルされました"); });
    } else {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = filename;

  // 古い形式（コレクションが最上位にある旧バックアップ）も読めるように正規化する
  function parseBackup(text){
    var j; try{ j = JSON.parse(text); }catch(e){ return {error:"JSONとして読み込めませんでした"}; }
    if(!j || typeof j!=="object") return {error:"バックアップファイルの形式が正しくありません"};
    var src = j.format==="genba-backup" ? (j.data||{}) : j;
    var data = {}, total = 0;
    BACKUP_COLS.forEach(function(c){
      var arr = Array.isArray(src[c[0]]) ? src[c[0]].filter(function(x){ return x && typeof x==="object" && x.id; }) : [];
      data[c[0]] = arr; total += arr.length;
    });
    var st = j.format==="genba-backup" ? (j.settings||{}) : {org:j.orgSettings};
    if(!total && !st.org) return {error:"復元できるデータが見つかりませんでした"};
    return {data:data, settings:st, exportedAt:j.exportedAt||"", exportedBy:j.exportedBy||"", total:total, hasPw:!!j.includesPasswords, blobs:(j.blobs&&typeof j.blobs==="object")?j.blobs:{}, legacy:j.format!=="genba-backup"};

  function restoreBackup(b){
    var ps = [];
    BACKUP_COLS.forEach(function(c){
      var col = c[0];
      b.data[col].forEach(function(item){
        var id = item.id, d = Object.assign({}, item); delete d.id;
        if(col==="members"){
          var ex = rawOf("members").find(function(x){return x.id===id;});
          if(!d.password) d.password = (ex && ex.password) || "1234";
        }
        var blobInfo = (col==="files" && assetsCap) ? b.blobs[id] : null;
        if(blobInfo && blobInfo.b64){
          ps.push(new Promise(function(res,rej){
            try{
              var bin = atob(blobInfo.b64), u8 = new Uint8Array(bin.length);
              for(var k=0;k<bin.length;k++) u8[k]=bin.charCodeAt(k);
              var file = new File([u8], d.filename||"ファイル", {type:d.contentType||blobInfo.contentType||""});
              assetsCap.upload(file).then(function(r){
                d.assetId = r.id; d.url = r.url||null;
                if(!db){ var a2=rawOf("files"), j2=a2.findIndex(function(x){return x.id===id;}); if(j2>-1) a2[j2]=Object.assign({id:id},d); else a2.push(Object.assign({id:id},d)); res(); }
                else db.collection("files").doc(id).set(d).then(res,rej);
              }).catch(rej);
            }catch(e){ rej(e); }
          }));
          return;
        }
        if(!db){
          var arr = rawOf(col), i = arr.findIndex(function(x){return x.id===id;});
          if(i>-1) arr[i] = Object.assign({id:id}, d); else arr.push(Object.assign({id:id}, d));

      });

    if(st.org){ state.orgSettings = Object.assign({}, state.orgSettings, st.org); if(db) ps.push(db.doc("settings/org").set(Object.assign({}, st.org, {updatedAt:stamp}))); }

    if(st.master){ applyMasters(st.master); if(db) ps.push(db.doc("settings/master").set(Object.assign({}, st.master, {updatedAt:stamp}))); }
    state.backupPreview = null;
    return runBatch(ps, "復元");
  }

  // Every delete asks for the 削除用パスワード (set by an admin; default 0000).
  function confirmDelete(msg,onYes,opts){
    opts = opts || {};
    openModal(opts.title||"削除の確認",
      '<div style="font-size:13px;line-height:1.6">'+esc(msg)+'</div>'+
      '<label class="field">削除用パスワードを入力してください<input type="password" id="f-del-pw" autocomplete="off" placeholder="削除用パスワード"></label>',
      '<button class="btn" data-close-modal>キャンセル</button><button class="btn primary" style="background:var(--danger);border-color:var(--danger)" id="f-confirm">'+(opts.button||"削除する")+'</button>');
    var pw = document.getElementById("f-del-pw"), btn = document.getElementById("f-confirm");
    var run = function(){
      var typed = pw.value;
      btn.disabled = true;
      // re-read so a password changed by another admin takes effect immediately
      loadDeletePassword(function(current){
        btn.disabled = false;
        if(!typed || typed!==current){ toast("削除用パスワードが正しくありません"); pw.value=""; pw.focus(); return; }

  //郵便番号→住所の自動入力、登録番号の整形・法人番号の補完。
  // 法人番号 → 国税庁の法人番号公表サイトから名称・所在地などを呼び出す
  function houjinAvailable(){ return !!(db && !window.claude && !state.offlineMode && /^https?:$/.test(location.protocol)); }
  function kataToHira(x){ return String(x||"").replace(/[ァ-ヶ]/g, function(ch){ return String.fromCharCode(ch.charCodeAt(0)-0x60); }); }
  function bindHoujinLookup(){
    var btn = document.getElementById("f-ccorpno-btn"), inp = document.getElementById("f-ccorpno"), msg = document.getElementById("f-ccorpno-msg");
    if(!btn || !inp) return;
    var say = function(t, bad){ if(msg){ msg.textContent = t; msg.style.color = bad ? "var(--danger)" : "var(--ink-faint)"; } };
    btn.addEventListener("click", function(){
      var n = inp.value.normalize("NFKC").replace(/[^0-9]/g,"");
      if(n.length!==13){ say("法人番号は13桁の数字で入力してください", true); return; }
      if(!houjinAvailable()){ say("この機能は公開版（Vercel）のアプリで使えます。このプレビューでは利用できません", true); return; }
      var me = myMember(); if(!me){ say("ログイン情報を確認できません", true); return; }
      btn.disabled = true; say("呼び出し中…");
      fetch("/api/houjin", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({auth:{name:me.name, password:me.password||""}, number:n})})
        .then(function(r){ return r.json().catch(function(){ return {}; }); })
        .then(function(j){
          btn.disabled = false;
          if(j.error==="notconfigured"){ say("管理者の設定が必要です：国税庁のアプリケーションIDを取得し、Vercelの環境変数 HOUJIN_APP_ID に登録してください（使い方・Q&Aに手順があります）", true); return; }
          if(j.error==="server"){ say("アプリ側のデータベースでエラーが発生しました（国税庁への問い合わせまで届いていません）："+(j.detail||""), true); return; }
          if(j.error==="invalid"){ say("法人番号が正しくありません（チェックデジットが一致しません）", true); return; }
          if(j.error==="notfound"){ say("該当する法人が見つかりませんでした", true); return; }
          if(j.error || !j.corp){
            var hint = "";
            if(j.status===401 || j.status===403 || j.status===400) hint = "（アプリケーションIDが正しくない可能性があります。法人番号公表サイトで発行したIDを HOUJIN_APP_ID に登録してください）";
            else if(j.status===404) hint = "（国税庁側で該当なし、またはIDが無効の可能性があります）";
            else if(j.status>=500) hint = "（国税庁のサーバー側の不調です。しばらくしてからお試しください）";
            say("呼び出しに失敗しました"+(j.status?"（HTTP "+j.status+"）":"")+hint+(j.detail?" 詳細: "+j.detail:""), true); return; }
          var c = j.corp, filled = [];
          var put = function(id, val, label, force){
            var el = document.getElementById(id); if(!el || !val) return;
            if(force || !String(el.value||"").trim() || el.value==="未選択"){ el.value = val; filled.push(label); }
          };
          var addrEl0 = document.getElementById("f-caddress"), addrBlank = !(addrEl0 && String(addrEl0.value||"").trim());
          put("f-cname", c.name, "名前");
          put("f-ckana", kataToHira(c.furigana), "ふりがな");
          put("f-cetype", "法人", "事業所種別");
          put("f-cregion", "国内", "地域");
          put("f-cpostal", c.postalCode, "郵便番号");
          put("f-cpref", c.prefecture, "都道府県", addrBlank);
          put("f-caddress", (c.city||"")+(c.street||""), "市区町村・番地");
          var addr = document.getElementById("f-caddress"); if(addr) addr.removeAttribute("data-auto");
          say((c.name||"")+"（"+(c.kind||"法人")+"）"+(c.closed?"【閉鎖：登記が閉鎖されています】":"")+" を呼び出しました。"+(filled.length?"入力：" + filled.join("、"):"入力済みの項目はそのままです"), c.closed);
        })
        .catch(function(){ btn.disabled = false; say("通信に失敗しました", true); });
    });
  }

  /* ---- 重複チェックの「確認済み（重複ではない）」記録（案件・顧客ごとに、組み合わせを保存） ---- */
  function dupKey(a, b){ return a.id < b.id ? a.id+"|"+b.id : b.id+"|"+a.id; }
  function dupIgn(kind){ var d = state.dupIgnore || (state.dupIgnore = {projects:[], customers:[]}); return d[kind] || (d[kind] = []); }
  function dupIgnored(kind, a, b){ return dupIgn(kind).indexOf(dupKey(a,b))!==-1; }
  function dupIgnoreLoad(cb){
    if(state.dupIgnoreLoaded || !db){ cb(); return; }
    db.doc("settings/dupIgnore").get().then(function(sn){
      var d = sn && sn.exists ? sn.data() : null;
      if(d){ state.dupIgnore = {projects:Array.isArray(d.projects)?d.projects:[], customers:Array.isArray(d.customers)?d.customers:[]}; }
      state.dupIgnoreLoaded = true; cb();
    }, function(){ state.dupIgnoreLoaded = true; cb(); });
  }
  function dupIgnoreSave(){
    if(!db) return Promise.resolve();
    var d = state.dupIgnore || {projects:[], customers:[]};
    return db.doc("settings/dupIgnore").set({projects:d.projects||[], customers:d.customers||[]}).catch(function(){ toast("確認済みの保存に失敗しました"); });
  }
  function dupMarkChecked(kind, group){
    var l = dupIgn(kind);
    for(var i=0;i<group.length;i++) for(var j=i+1;j<group.length;j++){ var k = dupKey(group[i], group[j]); if(l.indexOf(k)===-1) l.push(k); }
    return dupIgnoreSave();
  }
  function dupFooter(kind){
    var n = dupIgn(kind).length;
    return (n ? '<button class="btn" id="dup-reset" style="margin-right:auto">確認済み '+n+'組を元に戻す</button>' : '')+'<button class="btn" data-close-modal>閉じる</button>';
  }

  /* ---- 案件の重複チェック ---- */
  function projNorm(x){ return String(x||"").normalize("NFKC").toLowerCase().replace(/[\s\u3000・\-ー_.,、。()（）【】\[\]「」]/g,""); }
  function projSameCustomer(a, b){
    if(a.customerId && b.customerId && a.customerId===b.customerId) return true;
    var x = custNormName(a.customerName), y = custNormName(b.customerName); return !!(x && y && x===y);
  }
  // 重複チェックを速くするため、正規化した値は案件ごとに1回だけ計算して使い回す
  // 社外メンバーには社外秘の項目（顧客名・住所・進捗）を重複チェックの表示・判定に使わせない
  function projAddrHidden(p){ return hiddenFor(p, p.addressMode==="new" ? "pr_addr" : "c_addr"); }
  function projKeys(p){
    var hc = hiddenFor(p,"c_name"), ha = projAddrHidden(p);
    return {id:p.id, n:projNorm(p.name), a:ha?"":projNorm(propertyAddressOf(p).full || p.address), cid:hc?"":(p.customerId||""), c:hc?"":custNormName(p.customerName)};
  }
  function projKeyReasons(x, y){
    var r = [];
    if(x.n && y.n){
      if(x.n===y.n) r.push("案件名が同じ");
      else if(Math.min(x.n.length,y.n.length)>=5 && (x.n.indexOf(y.n)!==-1 || y.n.indexOf(x.n)!==-1)) r.push("案件名が似ている");
    }
    if(x.a && y.a && x.a===y.a && ((x.cid && x.cid===y.cid) || (x.c && x.c===y.c))) r.push("顧客と住所が同じ");
    return r;
  }
  function projMatchReasons(a, b){
    var r = [], na = projNorm(a.name), nb = projNorm(b.name);
    if(na && nb){
      if(na===nb) r.push("案件名が同じ");
      else if(Math.min(na.length,nb.length)>=5 && (na.indexOf(nb)!==-1 || nb.indexOf(na)!==-1)) r.push("案件名が似ている");
    }
    var aa = projAddrHidden(a) ? "" : projNorm(propertyAddressOf(a).full || a.address), ab = projAddrHidden(b) ? "" : projNorm(propertyAddressOf(b).full || b.address);
    if(aa && ab && aa===ab && !hiddenFor(a,"c_name") && !hiddenFor(b,"c_name") && projSameCustomer(a,b)) r.push("顧客と住所が同じ");
    return r;
  }
  function findProjectDuplicates(data, excludeId){
    var out = [], kd = projKeys(data);
    state.projects.forEach(function(p){ if(p.id===excludeId) return; var r = projKeyReasons(kd, projKeys(p)); if(r.length) out.push({p:p, reasons:r}); });
    return out;
  }
  function projDupLine(p){
    return '<b>'+esc(p.name||"（名称なし）")+'</b> <span style="color:var(--ink-faint)">'+esc([hiddenFor(p,"c_name")?"":p.customerName, projAddrHidden(p)?"":(propertyAddressOf(p).full||p.address), hiddenFor(p,"p_status")?"":p.status].filter(Boolean).join("　"))+'</span>';
  }
  function openProjectDupScan(){ dupIgnoreLoad(openProjectDupScan2); }
  function openProjectDupScan2(){
    var groups = [], seen = {}, list = state.projects, K = list.map(projKeys), ign = {};
    dupIgn("projects").forEach(function(k){ ign[k] = 1; });
    for(var i=0;i<list.length;i++){
      if(seen[list[i].id]) continue;
      var members = [list[i]];
      for(var j=i+1;j<list.length;j++){
        if(!projKeyReasons(K[i], K[j]).length) continue;
        if(ign[dupKey(list[i], list[j])]) continue;
        members.push(list[j]);
      }
      if(members.length>1){ members.forEach(function(m){ seen[m.id]=1; }); groups.push(members); }
    }
    var body = groups.length ? groups.map(function(g, gi){
      var why = projKeyReasons(projKeys(g[0]), projKeys(g[1]));
      return '<div style="border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px">'+
        '<span style="font-size:11.5px;color:var(--warning);font-weight:700">'+(why.length?esc(why.join("・")):"")+'</span>'+
        (state.canWrite?'<button class="btn sm" data-pdup-ok="'+gi+'">確認済み（重複ではない）</button>':'')+'</div>'+
        g.map(function(p){
          return '<div style="display:flex;gap:8px;align-items:center;justify-content:space-between;padding:3px 0"><span style="font-size:12.5px">'+projDupLine(p)+'</span><button class="btn sm" data-pdup-open="'+esc(p.id)+'">開く</button></div>';
        }).join("")+'</div>';
    }).join("") : '<div style="font-size:13px">重複している可能性のある案件は見つかりませんでした。</div>';
    openModal("案件の重複チェック", '<div style="font-size:12px;color:var(--ink-faint);margin-bottom:8px">案件名が同じ・似ている、または顧客と住所が同じ案件をまとめています。'+(groups.length?'（'+groups.length+'組）':'')+'</div><div style="max-height:55vh;overflow:auto">'+body+'</div>', dupFooter("projects"));
    document.querySelectorAll("#modal-box [data-pdup-ok]").forEach(function(el){ el.addEventListener("click", function(){ dupMarkChecked("projects", groups[Number(el.getAttribute("data-pdup-ok"))]).then(function(){ toast("確認済みにしました（リストから外しました）"); openProjectDupScan2(); }); }); });
    var rs = document.getElementById("dup-reset"); if(rs) rs.addEventListener("click", function(){ state.dupIgnore.projects = []; dupIgnoreSave().then(openProjectDupScan2); });
    document.querySelectorAll("#modal-box [data-pdup-open]").forEach(function(el){ el.addEventListener("click", function(){ var id = el.getAttribute("data-pdup-open"); closeModal(); goProjectDetail(id); }); });
  }

  /* ---- 顧客の重複チェック／顧客から案件へ ---- */
  function custNormName(x){ return String(x||"").normalize("NFKC").toLowerCase().replace(/株式会社|有限会社|合同会社|\(株\)|\(有\)|㈱|㈲|御中|様|殿/g,"").replace(/[\s\u3000・\-ー_.,、。()（）]/g,""); }
  function custMatchReasons(a, b){
    var r = [], na = custNormName(a.name), nb = custNormName(b.name);
    if(na && nb){
      if(na===nb) r.push("名前が同じ");
      else if(Math.min(na.length,nb.length)>=3 && (na.indexOf(nb)!==-1 || nb.indexOf(na)!==-1)) r.push("名前が似ている");
    }
    var pa = normPhone(a.phone), pb = normPhone(b.phone);
    if(pa && pb && pa===pb) r.push("電話番号が同じ");
    var ea = String(a.email||"").trim().toLowerCase(), eb = String(b.email||"").trim().toLowerCase();
    if(ea && eb && ea===eb) r.push("メールが同じ");
    return r;
  }
  function findCustomerDuplicates(data, excludeId){
    var out = [];
    state.customers.forEach(function(c){ if(c.id===excludeId) return; var r = custMatchReasons(data, c); if(r.length) out.push({c:c, reasons:r}); });
    return out;
  }

  function openCustomerDupScan(){ dupIgnoreLoad(openCustomerDupScan2); }
  function openCustomerDupScan2(){

    var K = list.map(function(c){ return {n:custNormName(c.name), p:normPhone(c.phone), e:String(c.email||"").trim().toLowerCase()}; });
    var match = function(x, y){
      if(x.n && y.n && (x.n===y.n || (Math.min(x.n.length,y.n.length)>=3 && (x.n.indexOf(y.n)!==-1 || y.n.indexOf(x.n)!==-1)))) return true;

      return '<div style="border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px">'+(state.canWrite?'<div style="text-align:right;display:flex;gap:6px;justify-content:flex-end"><button class="btn sm" data-dup-ok="'+gi+'">確認済み（重複ではない）</button><button class="btn sm primary" data-dup-merge="'+gi+'">結合する</button></div>':'')+g.map(function(c){

    document.querySelectorAll("#modal-box [data-dup-ok]").forEach(function(el){ el.addEventListener("click", function(){ dupMarkChecked("customers", groups[Number(el.getAttribute("data-dup-ok"))]).then(function(){ toast("確認済みにしました（リストから外しました）"); openCustomerDupScan2(); }); }); });
    var rs = document.getElementById("dup-reset"); if(rs) rs.addEventListener("click", function(){ state.dupIgnore.customers = []; dupIgnoreSave().then(openCustomerDupScan2); });

  // 重複している顧客を1件に結合する（残す顧客を選び、案件を付け替え、空欄を補い、ほかの顧客はゴミ箱へ＝復元可）
  function openCustomerMerge(group){
    if(!state.canWrite){ toast("この操作を行う権限がありません"); return; }
    var list = group.map(function(c){ return state.customers.find(function(x){ return x.id===c.id; }) || c; });
    var score = function(c){ return (c.freeePartnerId?1000:0) + custProjCount(c)*10 + (c.email?1:0) + (c.phone?1:0); };
    var keepId = list.slice().sort(function(a,b){ return score(b)-score(a); })[0].id;
    var blank = function(v){ return v===undefined || v===null || v==="" || v==="未選択"; };
    var SKIP = {id:1, name:1, createdAt:1, updatedAt:1, registeredDate:1, notes:1};
    function plan(keepId){
      var keep = list.find(function(c){ return c.id===keepId; }), others = list.filter(function(c){ return c.id!==keepId; });
      var fill = {}, notes = String(keep.notes||"");
      others.forEach(function(o){
        Object.keys(o).forEach(function(k){
          if(SKIP[k]) return;
          if(blank(keep[k]) && blank(fill[k]) && !blank(o[k])) fill[k] = o[k];
        });
        var n = String(o.notes||"").trim(); if(n && notes.indexOf(n)===-1) notes = (notes?notes+"\n":"")+n;
      });
      if(notes!==String(keep.notes||"")) fill.notes = notes;
      var moved = state.projects.filter(function(p){ return others.some(function(o){ return o.id===p.customerId; }); });
      var freeeDiff = others.some(function(o){ return o.freeePartnerId && keep.freeePartnerId && o.freeePartnerId!==keep.freeePartnerId; });
      return {keep:keep, others:others, fill:fill, moved:moved, freeeDiff:freeeDiff};
    }
    function draw(){
      var pl = plan(keepId), labels = {kana:"ふりがな",email:"メール",phone:"電話番号",postalCode:"郵便番号",prefecture:"都道府県",address:"住所",building:"建物名",contactName:"担当者名",department:"部署",notes:"備考",freeePartnerId:"freee連携"};
      var fl = Object.keys(pl.fill).map(function(k){ return labels[k]||null; }).filter(Boolean);
      var body = '<div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:8px">残す顧客を選んでください。ほかの顧客の案件は、残す顧客に付け替えます。</div>'+
        list.map(function(c){
          return '<label style="display:flex;gap:8px;align-items:flex-start;border:1px solid '+(c.id===keepId?'var(--accent)':'var(--border)')+';border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer"><input type="radio" name="mg-keep" value="'+esc(c.id)+'"'+(c.id===keepId?' checked':'')+' style="margin-top:3px"><span style="font-size:12.5px"><b>'+esc(c.name)+'</b>'+(c.freeePartnerId?' <span class="tag">freee連携</span>':'')+'<br><span style="color:var(--ink-faint)">'+esc([c.phone,c.email,c.address].filter(Boolean).join("　"))+'（案件 '+custProjCount(c)+'件）</span></span></label>';
        }).join("")+
        '<div style="font-size:12.5px;line-height:1.8;margin-top:10px;background:var(--surface-2);border-radius:8px;padding:8px 10px">・案件 <b>'+pl.moved.length+'件</b> を「'+esc(pl.keep.name)+'」に付け替え<br>・空欄の項目を補完：'+(fl.length?esc(fl.join("、")):'なし')+'<br>・ほかの '+pl.others.length+'件 はゴミ箱へ移動（あとから復元できます）'+
        (pl.freeeDiff?'<br><span style="color:var(--danger)">・freeeの取引先が異なります。結合後は残す顧客のfreee連携だけが残ります（freee側の取引先は変わりません）</span>':'')+'</div>';
      openModal("顧客を結合", body, '<button class="btn" id="mg-cancel">キャンセル</button><button class="btn primary" id="mg-go">結合する</button>');
      document.querySelectorAll('input[name="mg-keep"]').forEach(function(el){ el.addEventListener("change", function(){ keepId = el.value; draw(); }); });
      document.getElementById("mg-cancel").addEventListener("click", function(){ openCustomerDupScan(); });
      document.getElementById("mg-go").addEventListener("click", function(){
        var btn = this; btn.disabled = true; btn.textContent = "結合中…";
        var p2 = plan(keepId), ok = true;
        var step1 = Object.keys(p2.fill).length ? saveRaw("customers", p2.keep.id, p2.fill) : Promise.resolve();
        Promise.resolve(step1).then(function(){
          return Promise.all(p2.moved.map(function(p){
            return saveRaw("projects", p.id, {customerId:p2.keep.id, customerName:p2.keep.name});
          }));
        }).then(function(){
          // 付け替えが済んでから、ほかの顧客をゴミ箱へ（1件ずつ）
          return p2.others.reduce(function(chain, o){
            return chain.then(function(){ return deleteRaw("customers", o.id); });
          }, Promise.resolve());
        }).then(function(){ toast("「"+p2.keep.name+"」に結合しました（"+p2.others.length+"件をゴミ箱へ）"); openCustomerDupScan(); }, function(){ toast("結合に失敗しました。一覧を確認してください"); openCustomerDupScan(); });
      });
    }
    draw();
  }

  function writeDoc(col,id,data,msg,after){
    if(!state.canWrite){ toast("この操作を行う権限がありません"); return; }
    if(col==="members" && !state.isAdmin){
      // Non-admins may only edit their OWN contact fields / password
      // (個人情報) -- never name, company, roles or permission.
      var me = myMember();
      var selfOk = !!(id && me && me.id===id && Object.keys(data).every(function(k){ return ["name","kana","phone","email","company","password"].indexOf(k)!==-1; }));
      if(!selfOk){ toast("メンバーの変更は管理者のみ行えます"); return; }
    }
    data.updatedAt = new Date().toISOString();
    if(col==="tasks" && state.myName && !id) data.createdBy = state.myName;   // 誰が依頼（作成）したタスクかを残す
    if((col==="projects"||col==="customers") && state.myName){ data.updatedBy = state.myName; if(!id) data.createdBy = state.myName; }
    var oldRec = id ? (rawOf(col).find(function(x){ return x.id===id; }) || null) : null;
    var hn = histNext(col, oldRec, data); if(hn) data.history = hn;
    if(!db){
      var arr = rawOf(col);
      if(id){ var idx=arr.findIndex(function(x){return x.id===id;}); if(idx>-1) arr[idx]=Object.assign({},arr[idx],data); }
      else { data.id=uid(); data.createdAt=new Date().toISOString(); arr.unshift(data); }
      closeModal(); toast(msg+"（プレビューのみ）"); render(); try{ worksNotifyAfterWrite(col, id||data.id, data, oldRec); }catch(e){} if(after) after(id||data.id); return;
    }
    var p = id ? db.collection(col).doc(id).update(data) : db.collection(col).add(Object.assign({createdAt:new Date().toISOString()},data));
    p.then(function(ref){
      closeModal(); toast(msg);
      // LINE WORKS・アプリの通知は、サーバーに保存できたことを確認してから送る（保存できなかった変更を知らせないため）
      (p.__ack || p).then(function(){ try{ worksNotifyAfterWrite(col, id||(ref&&ref.id), data, oldRec); }catch(e){} }, function(){});
      if(after) after(id||(ref&&ref.id));
    }).catch(function(e){ toast("保存に失敗しました"); });
  }
  // ---- ゴミ箱: 削除したデータは trash コレクションに控えを残し、管理画面から復元できる ----
  var TRASH_TYPES = {reports:"報告書",projects:"案件",customers:"顧客",members:"メンバー",tasks:"タスク",files:"ファイル",events:"予定",steps:"工程",folders:"フォルダ",cards:"名刺"};
  var TRASH_NAME = {reports:"title",projects:"name",customers:"name",members:"name",tasks:"title",files:"filename",events:"title",steps:"name",folders:"name",cards:"name"};
  function trashPut(col, id){
    var rec = TRASH_TYPES[col] ? rawOf(col).find(function(x){ return x.id===id; }) : null;
    if(!rec) return Promise.resolve();
    var data = Object.assign({}, rec); delete data.id;
    var nm = rec[TRASH_NAME[col]] || "";
    if(col==="steps") nm = (rec.projectName?rec.projectName+"：":"")+(rec.name||"");
    var entry = {col:col, docId:id, name:nm, data:data, deletedAt:new Date().toISOString(), deletedBy:state.myName||""};
    if(!db){ state.trash.unshift(Object.assign({id:uid()}, entry)); return Promise.resolve(); }
    return db.collection("trash").add(entry);
  }
  function deleteDoc(col,id,msg,after){
    if(!state.canWrite){ toast("この操作を行う権限がありません"); return; }
    if(col==="members" && !state.isAdmin){ toast("メンバーの削除は管理者のみ行えます"); return; }
    var put = trashPut(col,id);
    if(!db){ put.then(function(){ setRaw(col, rawOf(col).filter(function(x){return x.id!==id;})); toast(msg+"（プレビューのみ）"); render(); if(after) after(); }); return; }
    put.then(function(){ return db.collection(col).doc(id).delete(); }).then(function(){toast(msg); if(after) after();}).catch(function(){toast("削除に失敗しました");});
  }
  function restoreTrash(entry){
    var col = entry.col, id = entry.docId;
    if(rawOf(col).some(function(x){ return x.id===id; })){ toast("同じデータがすでに存在します"); return; }
    var data = Object.assign({}, entry.data);
    if(col==="files" && data.folderId && state.loaded.folders && !state.folders.some(function(g){ return g.id===data.folderId; })) data.folderId = null;
    if(!db){
      rawOf(col).unshift(Object.assign({id:id}, data));
      state.trash = state.trash.filter(function(x){ return x.id!==entry.id; });
      toast("「"+(entry.name||TRASH_TYPES[col])+"」を元に戻しました（プレビューのみ）"); render(); return;
    }
    db.collection(col).doc(id).set(data).then(function(){ return db.collection("trash").doc(entry.id).delete(); })
      .then(function(){ toast("「"+(entry.name||TRASH_TYPES[col])+"」を元に戻しました"); }).catch(function(){ toast("元に戻せませんでした"); });

  function purgeTrash(ids){

  // One generic mechanism shared by every list screen: 営業/施工案件, 顧客,
  // メンバー, ホーム(タスク) and 写真・ファイル. Each entity below declares its
  // CSV columns; export, import (upsert by ID) and bulk edit/delete are all
  // driven from that declaration.
  var CSV_LIST_SEP = /[、,，;；]+/;

  function csvNormDate(s){
    var m = /^(\d{4})[-\/.年](\d{1,2})[-\/.月](\d{1,2})日?$/.exec(String(s).trim());
    if(!m) return null;
    var y=+m[1], mo=+m[2], d=+m[3], dt=new Date(y,mo-1,d);
    if(dt.getFullYear()!==y || dt.getMonth()!==mo-1 || dt.getDate()!==d) return null;
    return y+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0");
  }
  function csvSpaceless(s){ return String(s||"").replace(/[\s　]+/g,""); }
  function csvResolveMemberName(raw){
    var key = csvSpaceless(raw);
    var m = state.members.find(function(x){ return csvSpaceless(x.name)===key; });
    return m ? m.name : null;
  }
  // Keep each assignee's existing 確認 status; new ones start 未確認.
  function csvBuildAssignees(names, existing){
    var old = normalizeAssignees(existing||[]);
    return names.map(function(n){
      var o = old.find(function(a){ return a.name===n; });
      if(o) return o;
      var m = memberByName(n);
      return {name:n, kind:m?m.kind:"internal", status:"未確認"};
    });
  }

      var ch = text.charAt(i);
      if(inQ){
        if(ch==='"'){ if(text.charAt(i+1)==='"'){ cur+='"'; i++; } else inQ=false; }
        else cur+=ch;
      }else{
        if(ch==='"') inQ=true;
        else if(ch===','){ row.push(cur); cur=""; }
        else if(ch==="\r"){ /* ignore: \r\n and lone \r both end up handled by \n / end */ if(text.charAt(i+1)!=="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; } }
        else if(ch==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
        else cur+=ch;
      }
    }
    if(cur!=="" || row.length){ row.push(cur); rows.push(row); }
    return rows;
  }
  function csvEscape(v){
    v = v==null ? "" : String(v);
    return /[",\r\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  }
  function csvDecode(buf){
    try{ return new TextDecoder("utf-8",{fatal:true}).decode(buf); }
    catch(e){
      try{ return new TextDecoder("shift_jis").decode(buf); }
      catch(e2){ return new TextDecoder("utf-8").decode(buf); }
    }
  }
  function cellOut(c, r){
    var v = r[c.key];
    switch(c.type){
      case "number": return (v==null||v==="") ? "" : v;
      case "names": return normalizeAssignees(v).map(function(a){return a.name;}).join("、");
      case "list": return (v||[]).join("、");
      case "bool": return v ? "はい" : "いいえ";
      case "perm": return permissionLabel(memberPermission(r));
      default:
        var s = v==null ? "" : String(v);
        // Stop spreadsheet apps from treating text as a formula.
        if(!c.type && /^[=+\-@]/.test(s)) s = "'"+s;
        return s;
    }
  }
  function buildCsv(entity, rows){
    var cols = CSV_ENTITIES[entity].columns.filter(function(c){ return !c.importOnly; });
    var out = [cols.map(function(c){return c.label;})];
    rows.forEach(function(r){ out.push(cols.map(function(c){ return cellOut(c, r); })); });
    return "﻿"+out.map(function(r){ return r.map(csvEscape).join(","); }).join("\r\n");
  }

  /* ---- cell parsing (shared by import and bulk edit) ---- */
  // Returns {empty:true} | {value:...} | {error:"..."}.
  function parseCell(c, raw, existing){
    var s = String(raw==null ? "" : raw).trim();
    if(s==="") return {empty:true};
    switch(c.type){
      case "number":
        var n = parseFloat(s.replace(/[,，¥￥円\s　]/g,""));
        if(isNaN(n)) return {error:"「"+c.label+"」が数値ではありません（"+s+"）"};
        return {value:n};
      case "date":
        var d = csvNormDate(s);
        if(!d) return {error:"「"+c.label+"」は 2026-10-06 の形式で入力してください（"+s+"）"};
        return {value:d};
      case "bool":
        if(/^(はい|true|1|yes|完了|済|○|〇)$/i.test(s)) return {value:true};
        if(/^(いいえ|false|0|no|未完了|未|×)$/i.test(s)) return {value:false};
        return {error:"「"+c.label+"」は はい／いいえ で入力してください（"+s+"）"};
      case "perm":
        var p = PERMISSION_LEVELS.find(function(x){ return x[0]===s.toLowerCase() || x[1]===s; });
        if(!p) return {error:"「"+c.label+"」は 管理者／一般／外部 のいずれかです（"+s+"）"};
        return {value:p[0]};
      case "names":
        var names = [];
        var bad = [];
        s.split(CSV_LIST_SEP).forEach(function(part){
          part = part.trim(); if(!part) return;
          var nm = csvResolveMemberName(part);
          if(!nm && existing){ var keep = normalizeAssignees(existing[c.key]).find(function(x){ return csvSpaceless(x.name)===csvSpaceless(part); }); if(keep) nm = keep.name; }   // その案件に既にいる担当者は（メンバー一覧に無くても）そのまま許可
          if(!nm) bad.push(part); else if(names.indexOf(nm)===-1) names.push(nm);
        });
        if(bad.length) return {error:"「"+c.label+"」に未登録のメンバーがいます（"+bad.join("、")+"）"};
        return {value:names};
      case "list":
        var items = [], badItems = [];
        s.split(/[、,，;；\s　]+/).forEach(function(part){
          if(!part) return;
          if(c.options && c.options.indexOf(part)===-1) badItems.push(part);
          else if(items.indexOf(part)===-1) items.push(part);
        });
        if(badItems.length) return {error:"「"+c.label+"」に選択肢にない値があります（"+badItems.join("、")+"）"};
        return {value:items};
      default:
        if(c.options){
          // Accept a value the record already has even if it is not in the list.
          if(c.options.indexOf(s)===-1 && !(existing && existing[c.key]===s))
            return {error:"「"+c.label+"」は次のいずれかです："+c.options.join("／")+"（"+s+"）"};
          return {value:s};
        }
        if(/^'[=+\-@]/.test(s)) s = s.slice(1);
        return {value:s};
    }
  }

  /* ---- raw writes (no per-row toast; callers report totals) ---- */
  /* ---- 案件の変更履歴（誰が・いつ・何を変えたか。最新50件を案件に保存） ---- */
  var PROJ_HIST_FIELDS = {name:"案件名", status:"進捗", amount:"金額", startDate:"施工開始日", endDate:"施工完了予定日", division:"事業部", customerName:"顧客", workInstruction:"作業指示", handoverDate:"引渡日", estimateDate:"見積日", invoiceDate:"請求日", propertyType:"物件種別", propertyStructure:"構造"};
  function histNorm(k, v){
    if(k==="assignees") return JSON.stringify(normalizeAssignees(v||[]).map(function(a){ return a.name+"/"+a.kind; }).sort());
    return JSON.stringify(v==null ? "" : v);
  }
  function histNext(col, oldRec, data){
    if(col!=="projects" || !state.myName) return null;
    var at = new Date().toISOString(), by = state.myName, hist = (oldRec && Array.isArray(oldRec.history)) ? oldRec.history.slice(-49) : [];
    if(!oldRec){ hist.push({at:at, by:by, a:"登録"}); return hist; }
    var changed = [];
    Object.keys(data).forEach(function(k){
      var label = k==="assignees" ? "担当者" : (PROJ_HIST_FIELDS[k] || (/^(property|address)/.test(k) ? "物件・住所" : ""));
      if(!label || changed.indexOf(label)!==-1) return;
      if(histNorm(k, data[k]) !== histNorm(k, oldRec[k])) changed.push(label);
    });
    if(!changed.length) return null;
    hist.push({at:at, by:by, a:"編集", f:changed});
    return hist;
  }
  function saveRaw(col, id, data){
    var now = new Date().toISOString();
    data = Object.assign({}, data, {updatedAt:now});
    if((col==="projects"||col==="customers") && state.myName){ data.updatedBy = state.myName; if(!id) data.createdBy = state.myName; }
    var hn = histNext(col, id ? (rawOf(col).find(function(x){ return x.id===id; }) || null) : null, data); if(hn) data.history = hn;
    if(!db){
      var arr = rawOf(col);
      if(id){ var i = arr.findIndex(function(x){return x.id===id;}); if(i>-1) arr[i] = Object.assign({}, arr[i], data); }
      else arr.unshift(Object.assign({id:uid(), createdAt:now}, data));
      return Promise.resolve();
    }
    return id ? db.collection(col).doc(id).update(data) : db.collection(col).add(Object.assign({createdAt:now}, data));
  }
  function deleteRaw(col, id){
    return trashPut(col,id).then(function(){
      if(!db){ setRaw(col, rawOf(col).filter(function(x){return x.id!==id;})); return; }
      return db.collection(col).doc(id).delete();
    });
  }
  function runBatch(promises, doneLabel){
    var ok = 0, fail = 0;
    return Promise.all(promises.map(function(p){ return p.then(function(){ ok++; }, function(){ fail++; }); })).then(function(){
      closeModal();
      toast(fail ? (ok+"件を"+doneLabel+"、"+fail+"件は失敗しました") : (ok+"件を"+doneLabel+"しました"));
      render();
    });
  }

  /* ---- import ---- */
  function csvTemplate(entity){
    var E = CSV_ENTITIES[entity];
    var cols = E.columns.filter(function(c){ return !c.readonly || c.key==="id"; });
    var rows = [cols.map(function(c){return c.label;}), cols.map(function(c){ return c.key==="id" ? "" : (E.sample[c.key]||""); })];
    var text = "﻿"+rows.map(function(r){ return r.map(csvEscape).join(","); }).join("\r\n");
    downloadBlob(E.label+"_取込テンプレート.csv", new Blob([text], {type:"text/csv"}));
  }

  function planImport(entity, rows){
    var E = CSV_ENTITIES[entity];
    var plan = {ops:[], errors:[], unknown:[], total:0};
    if(!rows.length){ plan.errors.push({line:0, msg:"ファイルが空です"}); return plan; }
    var header = rows[0].map(function(h){ return String(h==null?"":h).replace(/^﻿/,"").trim(); });
    var colIdx = {};
    header.forEach(function(h, i){
      var c = E.columns.find(function(x){ return x.label===h || x.key.toLowerCase()===h.toLowerCase(); });
      if(c && colIdx[c.key]==null) colIdx[c.key] = i; else if(h && !c) plan.unknown.push(h);
    });
    if(Object.keys(colIdx).length===0){ plan.errors.push({line:1, msg:"見出し行が認識できません。「CSV出力」したファイルかテンプレートの形式にしてください"}); return plan; }

    var existingList = E.all();
    var seenNames = {};
    var adminAfter = null;
    if(entity==="members"){
      adminAfter = {};
      state.members.forEach(function(m){ adminAfter[m.id] = memberPermission(m)==="admin"; });
    }
    for(var i=1;i<rows.length;i++){
      var row = rows[i];
      if(!row.some(function(v){ return String(v||"").trim()!==""; })) continue;
      plan.total++;
      var line = i+1;
      var idRaw = colIdx.id!=null ? String(row[colIdx.id]||"").trim() : "";
      var existing = idRaw ? existingList.find(function(x){ return x.id===idRaw; }) : null;
      var patch = {}, rowErrors = [];
      E.columns.forEach(function(c){
        if(c.readonly || colIdx[c.key]==null) return;
        var res = parseCell(c, row[colIdx[c.key]], existing);
        if(res.error) rowErrors.push(res.error); else if(!res.empty) patch[c.key] = res.value;
      });
      var label = patch[E.nameKey] || (existing && existing[E.nameKey]) || "";
      if(!existing && !patch[E.nameKey]) rowErrors.push("必須項目「"+E.requiredLabel+"」が空です");
      if(entity==="members" && patch.name){
        var dup = state.members.find(function(m){ return csvSpaceless(m.name)===csvSpaceless(patch.name) && (!existing || m.id!==existing.id); });
        if(dup) rowErrors.push("同じ氏名のメンバーが既に登録されています（"+patch.name+"）");
        if(seenNames[csvSpaceless(patch.name)]) rowErrors.push("ファイル内で氏名が重複しています（"+patch.name+"）");
        seenNames[csvSpaceless(patch.name)] = true;
      }
      if(!rowErrors.length && E.validate){ var ve = E.validate(patch, existing); if(ve) rowErrors.push(ve); }
      if(rowErrors.length){ plan.errors.push({line:line, msg:(label?label+"：":"")+rowErrors.join(" / ")}); continue; }
      var data = E.finalize(patch, existing);
      plan.ops.push({type: existing ? "update" : "create", id: existing ? existing.id : null, data:data, label:label});
      if(adminAfter && existing && data.permission) adminAfter[existing.id] = data.permission==="admin";
      else if(adminAfter && !existing) adminAfter["new"+i] = data.permission==="admin";
    }
    if(adminAfter && plan.ops.length && !Object.keys(adminAfter).some(function(k){ return adminAfter[k]; })){
      plan.ops = []; plan.errors.push({line:0, msg:"管理者が1人もいなくなるため取り込めません"});
    }
    return plan;
  }

            (plan.errors.length>30?'<div>…ほか'+(plan.errors.length-30)+'件</div>':'')+'</div>';
        }
        box.innerHTML = h;
        run.disabled = plan.ops.length===0;
      };
      fr.readAsArrayBuffer(file);
    });
    document.getElementById("csv-run").onclick = function(){
      if(!currentPlan || !currentPlan.ops.length) return;
      if(!csvCanWrite(entity)) return;
      document.getElementById("csv-run").disabled = true;
      runBatch(currentPlan.ops.map(function(op){ return saveRaw(E.col, op.id, op.data); }), "取り込み");
    };
  }

  function extIsoDate(v){

  function extStatus(v, dflt){

  function openExtImport(){

      '<button class="btn" data-close-modal>閉じる</button><button class="btn primary" id="ext-run" disabled>取り込む</button>');
    var rows = null, head = [], skippedRows = 0, asgCols = [];

    var colVal = function(r, key){ var sel = document.getElementById("ext-map-"+key); var i = sel ? Number(sel.value) : -1; return i>=0 ? String(r[i]==null?"":r[i]).trim() : ""; };

            if(!m){ unknownAsg[n] = (unknownAsg[n]||0)+1; return; }
            if(seen[m.name]) return; seen[m.name] = 1;
            as.push({name:m.name, kind:m.kind||"internal", status:"確認済"});
          });
          d.assignees = as; if(as.length) assigned++;
        }
        out.push(d);
      });
      return {list:out, dup:dup, newTypes:Object.keys(newTypes), newProps:Object.keys(newProps), unknownAsg:unknownAsg, assigned:assigned};
    };
    var preview = function(){
      var b = build(), pv = document.getElementById("ext-preview");
      var unk = Object.keys(b.unknownAsg);
      pv.innerHTML = '<div style="margin-bottom:6px">取り込める案件 <b>'+b.list.length+'</b>件'+(b.dup?'　<span style="color:var(--ink-faint)">（登録済み・重複の '+b.dup+'件は除外）</span>':'')+(skippedRows?'　<span style="color:var(--danger)">（列数が合わず読めない行 '+skippedRows+'件）</span>':'')+'</div>'+
        (b.newTypes.length||b.newProps.length ? '<div style="font-size:11.5px;color:var(--ink-faint);margin-bottom:4px">選択肢に追加される値：'+esc(b.newTypes.concat(b.newProps).join("、"))+'</div>' : '')+
        (asgCols.length ? '<div style="font-size:11.5px;color:var(--ink-faint);margin-bottom:4px">担当者あり '+b.assigned+'件'+(unk.length?'　／メンバーに見つからない名前（取り込みません）：'+esc(unk.slice(0,6).join("、"))+(unk.length>6?"…":""):'')+'</div>' : '')+
        '<div style="max-height:160px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:11.5px;color:var(--ink-soft)">'+b.list.slice(0,8).map(function(x){ return '<div>'+esc(x.name)+'　'+esc([x.customerName,(x.prefecture||x.propertyPrefecture||"")+(x.address||x.propertyAddress||""),x.startDate&&(x.startDate+"〜"+x.endDate),x.type,x.status].filter(Boolean).join(" / "))+'</div>'; }).join("")+(b.list.length>8?'<div>…ほか '+(b.list.length-8)+'件</div>':'')+'</div>';
      run.disabled = b.list.length===0;
    };
    var loadRows = function(all){
      all = all.filter(function(r){ return r.some(function(x){ return String(x).trim(); }); });
      if(all.length<2){ body.textContent = "データ行がありません（1行目に見出し、2行目以降にデータが必要です）"; return; }
      head = all[0].map(function(x){ return String(x).trim(); });
      rows = all.slice(1).filter(function(r){ return r.length<=head.length; });
      skippedRows = all.length-1-rows.length;
      asgCols = []; head.forEach(function(h,i){ if(/担当/.test(h)) asgCols.push(i); });
      var used = {};
      var guess = function(f){
        var pick = function(match){ for(var k=0;k<f[3].length;k++){ for(var i=0;i<head.length;i++){ if(!used[i] && match(head[i].toLowerCase(), f[3][k].toLowerCase())) return i; } } return -1; };
        var r = pick(function(h,w){ return h===w; });
        if(r<0) r = pick(function(h,w){ return h.indexOf(w)!==-1; });
        if(r>=0) used[r] = 1;
        return r;
      };
      var guessed = {}; EXT_FIELDS.forEach(function(f){ guessed[f[0]] = guess(f); });
      var opts = function(sel){ return '<option value="-1">（取り込まない）</option>'+head.map(function(h,i){ return '<option value="'+i+'"'+(i===sel?" selected":"")+'>'+esc(h||("列"+(i+1)))+'</option>'; }).join(""); };
      body.innerHTML = '<div style="font-size:12px;color:var(--ink-faint);margin-bottom:6px">'+rows.length+'行を読み込みました。元の列を、このアプリの項目に対応付けてください。</div>'+
        '<div style="display:grid;grid-template-columns:150px 1fr;gap:6px 10px;align-items:center;font-size:12.5px">'+EXT_FIELDS.map(function(f){ return '<span>'+esc(f[1])+(f[2]?' <span class="req">必須</span>':'')+'</span><select id="ext-map-'+f[0]+'">'+opts(guessed[f[0]])+'</select>'; }).join("")+
        '<span>状態が不明なとき</span><select id="ext-dflt">'+STATUS_LIST.map(function(x){ return '<option'+(x==="施工中"?" selected":"")+'>'+esc(x)+'</option>'; }).join("")+'</select></div>'+
        '<label style="display:flex;gap:8px;margin-top:10px;font-size:12.5px;cursor:pointer"><input type="checkbox" id="ext-addtypes" checked><span>案件種類・物件種類で、リストにない値は選択肢に追加する（外すと「その他」にします）</span></label>'+
        (asgCols.length?'<label style="display:flex;gap:8px;margin-top:6px;font-size:12.5px;cursor:pointer"><input type="checkbox" id="ext-useasg" checked><span>担当者も取り込む（'+esc(asgCols.map(function(c){ return head[c]; }).join("・"))+'。メンバーの名前と一致する人だけ）</span></label>':'')+
        '<div id="ext-preview" style="margin-top:12px"></div>';
      body.querySelectorAll("select,input[type=checkbox]").forEach(function(sl){ sl.addEventListener("change", preview); });
      preview();
    };
    document.getElementById("ext-file").addEventListener("change", function(ev){
      var file = ev.target.files && ev.target.files[0]; if(!file) return;
      var fr = new FileReader();
      fr.onload = function(){ var all; try{ all = parseCsv(csvDecode(fr.result)); }catch(e){ body.textContent = "CSVの解析に失敗しました"; return; } loadRows(all); };
      fr.readAsArrayBuffer(file);
    });
    // 画面の表をコピーして貼り付け（Excel・Webの表はタブ区切りになる）
    document.getElementById("ext-paste").addEventListener("input", function(ev){
      var t = ev.target.value; if(!t.trim()) return;
      var all = t.indexOf("\t")!==-1 ? t.replace(/\r/g,"").split("\n").map(function(l){ return l.split("\t"); }) : parseCsv(t);
      loadRows(all);
    });
    run.onclick = function(){
      var b = build(); if(!b.list.length) return;
      run.disabled = true;
      // リストにない種類は選択肢（マスタ）に追加
      if(b.newTypes.length || b.newProps.length){
        b.newTypes.forEach(function(x){ if(DIVISIONS.indexOf(x)===-1) DIVISIONS.push(x); });
        b.newProps.forEach(function(x){ if(PROPERTY_TYPES.indexOf(x)===-1) PROPERTY_TYPES.push(x); });
        saveMaster("divisions", DIVISIONS.slice(), "選択肢に追加しました");
      }
      // 顧客は同じ名前があれば紐づけ、なければ作成してから案件を登録する
      var names = {}; b.list.forEach(function(x){ if(x.customerName) names[x.customerName] = ""; });
      var ids = {}, queue = Object.keys(names);
      var nextCust = function(){
        if(!queue.length) return Promise.resolve();
        var n = queue.shift();
        return new Promise(function(res){ ensureCustomer({name:n}, function(id){ ids[n] = id; res(); }); }).then(nextCust);
      };
      var pos = 0, ok = 0, fail = 0, CH = 40;
      var nextChunk = function(){
        if(pos>=b.list.length) return Promise.resolve();
        var part = b.list.slice(pos, pos+CH); pos += CH;
        return Promise.all(part.map(function(x){
          return saveRaw("projects", null, Object.assign({}, x, {customerId:ids[x.customerName]||""})).then(function(){ ok++; }, function(){ fail++; });
        })).then(function(){ toast("取り込み中… "+Math.min(pos,b.list.length)+" / "+b.list.length); }).then(nextChunk);
      };
      toast("取り込みを始めます（"+b.list.length+"件）。完了まで画面を閉じないでください");
      nextCust().then(nextChunk).then(function(){ closeModal(); toast(ok+"件を取り込みました"+(fail?"（"+fail+"件は失敗）":"")); render(); });
    };
  }

  function bindBulkValue(){

      var ms = document.getElementById("bulk-mode"); if(ms){ state.bulk.mode = ms.value; ms.onchange = function(){ state.bulk.mode = ms.value; }; }

    return state.members.some(function(m){
      var p = Object.prototype.hasOwnProperty.call(changes, m.id) ? changes[m.id] : memberPermission(m);

  function bulkApply(){
    var entity = state.bulk.entity, E = CSV_ENTITIES[entity];
    if(!csvCanWrite(entity)) return;
    var ids = bulkSelectedIds();
    if(!ids.length){ toast("変更する行を選択してください"); return; }
    var col = E.columns.find(function(c){ return c.key===state.bulk.field; });
    if(!col) return;
    if(bulkIsMulti(col)){
      var picked = state.bulk.picked||[], mode = state.bulk.mode||"add";
      if(!picked.length && mode!=="replace"){ toast(col.label+"を選んでください"); return; }
      var modeLabel = (BULK_MODES.find(function(m){ return m[0]===mode; })||[])[1];
      openModal("一括編集の確認",
        '<div style="font-size:13px;line-height:1.7">選択した <b>'+ids.length+'</b> 件の「'+esc(col.label)+'」に<br><b>'+esc(picked.join("、")||"（なし）")+'</b><br>を「'+esc(modeLabel)+'」で変更します。よろしいですか？</div>',
        '<button class="btn" data-close-modal>キャンセル</button><button class="btn primary" id="bulk-apply-ok">変更する</button>');
      document.getElementById("bulk-apply-ok").onclick = function(){
        document.getElementById("bulk-apply-ok").disabled = true;
        var list = E.all();
        var jobs = ids.map(function(id){
          var existing = list.find(function(x){ return x.id===id; }) || {};
          var patch = {}; patch[col.key] = bulkApplyChecks(bulkCurrent(col, existing), picked, mode);
          return saveRaw(E.col, id, E.finalize(patch, existing));
        });
        state.bulk.selected = {};
        runBatch(jobs, "変更");
      };
      return;
    }
    var raw = (document.getElementById("bulk-value")||{}).value || "";
    var res = parseCell(col, raw, null), value;
    if(res.error){ toast(res.error); return; }
    if(res.empty){
      if(col.options && col.type!=="list" || col.type==="number" || col.type==="bool" || col.type==="perm"){ toast("変更後の値を入力してください"); return; }
      value = (col.type==="names"||col.type==="list") ? [] : "";
    }else value = res.value;
    if(col.key==="customerName" && value && !state.customers.some(function(x){ return x.name===value; })){ toast("登録されている顧客を候補から選んでください"); return; }
    var shown = Array.isArray(value) ? (value.join("、")||"（なし）") : (col.type==="perm" ? permissionLabel(value) : (col.type==="bool" ? (value?"はい":"いいえ") : (value===""?"（空欄）":String(value))));
    if(entity==="members" && col.key==="permission"){
      var ch = {}; ids.forEach(function(id){ ch[id] = value; });
      if(!adminsRemainAfter(ch)){ toast("管理者が1人もいなくなるため変更できません"); return; }
    }
    openModal("一括編集の確認",
      '<div style="font-size:13px;line-height:1.7">選択した <b>'+ids.length+'</b> 件の「'+esc(col.label)+'」を<br><b>'+esc(shown)+'</b><br>に変更します。よろしいですか？</div>',
      '<button class="btn" data-close-modal>キャンセル</button><button class="btn primary" id="bulk-apply-ok">変更する</button>');
    document.getElementById("bulk-apply-ok").onclick = function(){
      document.getElementById("bulk-apply-ok").disabled = true;
      var list = E.all();
      var jobs = ids.map(function(id){
        var existing = list.find(function(x){ return x.id===id; });
        var patch = {}; patch[col.key] = value;
        return saveRaw(E.col, id, E.finalize(patch, existing));
      });
      state.bulk.selected = {};
      runBatch(jobs, "変更");
    };
  }

    document.getElementById("bm-ok").onclick = function(){

      for(var i=0;i<cols.length;i++){
        var on = box.querySelector('[data-bm-on="'+i+'"]');

        var c = cols[i];

          var mode = document.getElementById("bm-mode-"+i).value;

        }else{
          var raw = document.getElementById("bm-val-"+i).value, res = parseCell(c, raw, null);
          if(c.key==="customerName" && raw.trim() && !state.customers.some(function(x){ return x.name===raw.trim(); })){ toast("登録されている顧客を候補から選んでください"); return; }
          if(res.error){ toast(res.error); return; }
          if(res.empty && (c.options && c.type!=="list" || c.type==="number")){ toast("「"+c.label+"」の値を入力してください"); return; }
          plan.push({col:c, value: res.empty ? (c.type==="list"?[]:"") : res.value});
        }
      }
      if(!plan.length){ toast("変更する項目にチェックを入れてください"); return; }
      document.getElementById("bm-ok").disabled = true;
      var list = E.all();
      var jobs = ids.map(function(id){
        var existing = list.find(function(x){ return x.id===id; }) || {};
        var patch = {};
        plan.forEach(function(p){
          if(p.names){
            patch[p.col.key] = bulkApplyChecks(bulkCurrent(p.col, existing), p.names, p.mode);
          }else patch[p.col.key] = p.value;
        });
        return saveRaw(E.col, id, E.finalize(patch, existing));
      });
      state.bulk.selected = {};
      runBatch(jobs, "変更");
    };
  }

  /* ============ events ============ */

  // ---- 物件の地図（ピン付き）。住所から自動で位置を探し、特定できない・ずれている場合はピンを動かして保存できる ----
  var __leafletP = null;
  function loadLeaflet(){
    if(window.L) return Promise.resolve();
    if(__leafletP) return __leafletP;
    __leafletP = new Promise(function(res, rej){
      var l = document.createElement("link"); l.rel="stylesheet"; l.href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"; document.head.appendChild(l);
      var sc = document.createElement("script"); sc.src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
      sc.onload=function(){ window.L ? res() : rej(); }; sc.onerror=function(){ __leafletP=null; rej(); };
      document.head.appendChild(sc);
      setTimeout(function(){ if(!window.L) rej(); }, 8000);
    });
    return __leafletP;
  }
  var __geoCache = {};
  function geocodeJp(q){
    if(__geoCache[q]) return Promise.resolve(__geoCache[q]);
    return fetch("https://msearch.gsi.go.jp/address-search/AddressSearch?q="+encodeURIComponent(q))
      .then(function(r){ return r.json(); })
      .then(function(a){
        if(!a || !a.length) return null;
        var c = a[0].geometry.coordinates; var o = {lat:c[1], lng:c[0], title:(a[0].properties||{}).title||""};
        __geoCache[q]=o; return o;
      });
  }
  function initPropMap(box){
    var p = state.projects.find(function(x){ return x.id===box.getAttribute("data-pid"); });
    if(!p) return;
    var pa = propertyAddressOf(p); if(!pa.text) return;
    var canMove = !isExternalViewer();
    var gFrame = function(q){
      return '<iframe title="物件の地図" loading="lazy" referrerpolicy="no-referrer-when-downgrade" style="display:block;width:100%;height:260px;border:0" src="https://www.google.com/maps?q='+q+'&z=17&hl=ja&output=embed"></iframe>';
    };
    // Googleマップにもピンを出すため、位置（保存済み→住所から検索した座標）を緯度経度で渡す。見つからなければ住所で表示。
    var parseLatLng = function(t){
      t = String(t||"").trim();
      var m = t.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || t.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || t.match(/[?&](?:q|query|ll|destination)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/) || t.match(/^(-?\d+\.\d+)\s*[,，\s]\s*(-?\d+\.\d+)$/);
      if(!m) return null;
      var la = parseFloat(m[1]), ln = parseFloat(m[2]);
      return (la>=20&&la<=46&&ln>=122&&ln<=154) ? {lat:Math.round(la*1e6)/1e6, lng:Math.round(ln*1e6)/1e6} : null;
    };
    var googleCtl = function(){
      var ctl = document.getElementById("propmap-ctl"); if(!ctl) return;
      var has = (typeof p.mapLat==="number" && typeof p.mapLng==="number");
      if(!canMove){ ctl.innerHTML = ""; return; }
      ctl.innerHTML = '<div style="font-size:12px;margin-top:8px;line-height:1.6;color:var(--ink-soft)">Googleマップの埋め込み画面では、ピンを直接ドラッグできません。ピンの位置を直すには、<b>①「Googleマップで開く」で正しい場所を右クリック（スマホは長押し）→ 表示された緯度・経度をコピー</b>（またはその時のURLをコピー）し、<b>②下に貼り付けて「この位置に設定」</b>を押してください。ピン付き地図にも同じ位置が反映されます。'+(has?'（現在：保存したピン位置を使用中）':'')+'</div>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;align-items:flex-start"><input id="pm-gin" type="text" placeholder="例: 39.7036, 141.1527 またはGoogleマップのURL" style="flex:1;min-width:220px;height:34px">'+
        '<button class="btn sm primary" id="pm-gset">この位置に設定</button>'+(has?'<button class="btn sm" id="pm-greset">保存した位置を解除</button>':'')+'</div><div id="pm-gmsg" style="font-size:12px;margin-top:4px;color:var(--danger)"></div>';
      var set = function(g){
        p.mapLat = g ? g.lat : null; p.mapLng = g ? g.lng : null;
        if(db) db.collection("projects").doc(p.id).update({mapLat:p.mapLat, mapLng:p.mapLng}).then(function(){ toast(g?"ピンの位置を保存しました":"保存した位置を解除しました"); }).catch(function(){ toast("保存できませんでした"); });
        showGoogle();
      };
      document.getElementById("pm-gset").onclick = function(){
        var g = parseLatLng(document.getElementById("pm-gin").value);
        if(!g){ document.getElementById("pm-gmsg").textContent = "緯度・経度を読み取れませんでした。「39.7036, 141.1527」の形式か、位置が入ったGoogleマップのURL（短縮URLは不可）を貼り付けてください。"; return; }
        set(g);
      };
      var rb = document.getElementById("pm-greset"); if(rb) rb.onclick = function(){ set(null); };
    };
    var showGoogle = function(){
      googleCtl();
      var token = (box._gtok = (box._gtok||0)+1);
      var put = function(q){ if(box._gtok===token && document.body.contains(box) && state.propMapMode==="google") box.innerHTML = gFrame(q); };
      if(typeof p.mapLat==="number" && typeof p.mapLng==="number") return put(p.mapLat+","+p.mapLng);
      box.innerHTML = gFrame(encodeURIComponent(pa.text));
      geocodeJp(pa.text).then(function(g){ if(g) put(g.lat+","+g.lng); }).catch(function(){});
    };
    document.querySelectorAll("#pm-mode [data-pmmode]").forEach(function(o){
      if(o._pmBound) return; o._pmBound = true;
      o.addEventListener("click", function(){
        var m = o.getAttribute("data-pmmode"); if(m===(state.propMapMode==="google"?"google":"pin")) return;
        state.propMapMode = m;
        document.querySelectorAll("#pm-mode [data-pmmode]").forEach(function(x){ x.classList.toggle("active", x===o); });
        var ctl0 = document.getElementById("propmap-ctl"); if(ctl0) ctl0.innerHTML = "";
        if(m==="google"){ showGoogle(); } else { initPropMap(box); }
      });
    });
    if(state.propMapMode==="google"){ showGoogle(); return; }
    loadLeaflet().then(function(){
      if(!document.body.contains(box)) return;
      var saved = (typeof p.mapLat==="number" && typeof p.mapLng==="number") ? {lat:p.mapLat,lng:p.mapLng} : null;
      var pre = saved ? Promise.resolve(saved) : geocodeJp(pa.text).catch(function(){ return null; });
      return pre.then(function(pos){
        if(!document.body.contains(box)) return;
        box.innerHTML = '<div id="propmap-canvas" style="height:260px;width:100%"></div>';
        var found = !!pos, cur = pos || {lat:36.2, lng:138.25}, dirty = false;
        var map = L.map("propmap-canvas", {scrollWheelZoom:false}).setView([cur.lat,cur.lng], found?17:5);
        L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png", {maxZoom:18, attribution:"地理院タイル"}).addTo(map);
        var icon = L.divIcon({className:"", iconSize:[30,40], iconAnchor:[15,38],
          html:'<svg width="30" height="40" viewBox="0 0 30 40"><path d="M15 1C7.8 1 2 6.8 2 14c0 9.5 13 25 13 25s13-15.500 13-25C28 6.800 22.200 1 15 1z" fill="#d93025" stroke="#fff" stroke-width="2"/><circle cx="15" cy="14" r="5" fill="#fff"/></svg>'});
        var mk = L.marker([cur.lat,cur.lng], {icon:icon, draggable:canMove}).addTo(map);
        var ctl = document.getElementById("propmap-ctl");
        var paint = function(){
          var msg = dirty ? '<span style="color:var(--danger);font-weight:700">ピンの位置を変更しました。保存してください。</span>'
            : (saved ? '<span style="color:var(--ink-soft)">ピンの位置は保存済みです。</span>'
            : (found ? '<span style="color:var(--ink-soft)">住所から位置を自動で表示しています。'+(canMove?'ずれている場合はピンを動かしてください。':'')+'</span>'
            : '<span style="color:var(--danger);font-weight:700">住所から場所を特定できませんでした。'+(canMove?'地図をタップするか、ピンを動かして位置を指定してください。':'')+'</span>'));
          ctl.innerHTML = '<div style="font-size:12px;margin-top:8px;line-height:1.6">'+msg+'</div>'+(canMove ?
            '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;align-items:flex-start">'+
            (dirty?'<button class="btn sm primary" id="pm-save">この位置で保存</button><button class="btn sm" id="pm-cancel">元に戻す</button>':'')+
            (saved&&!dirty?'<button class="btn sm" id="pm-reset">保存した位置を解除（住所から再検索）</button>':'')+'</div>' : '');
          var b;
          if((b=document.getElementById("pm-save"))) b.onclick=function(){
            var ll = mk.getLatLng(), lat = Math.round(ll.lat*1e6)/1e6, lng = Math.round(ll.lng*1e6)/1e6;
            p.mapLat = lat; p.mapLng = lng; saved = {lat:lat,lng:lng}; dirty = false; paint();
            if(db) db.collection("projects").doc(p.id).update({mapLat:lat, mapLng:lng}).then(function(){ toast("ピンの位置を保存しました"); }).catch(function(){ toast("保存できませんでした"); });
          };
          if((b=document.getElementById("pm-cancel"))) b.onclick=function(){ mk.setLatLng([cur.lat,cur.lng]); map.panTo([cur.lat,cur.lng]); dirty=false; paint(); };
          if((b=document.getElementById("pm-reset"))) b.onclick=function(){
            p.mapLat = null; p.mapLng = null; saved = null;
            if(db) db.collection("projects").doc(p.id).update({mapLat:null, mapLng:null}).catch(function(){});
            geocodeJp(pa.text).catch(function(){return null;}).then(function(g){ found=!!g; if(g){ cur=g; mk.setLatLng([g.lat,g.lng]); map.setView([g.lat,g.lng],17);} paint(); });
          };
        };
        if(canMove){
          mk.on("dragend", function(){ dirty = true; paint(); });
          map.on("click", function(e){ mk.setLatLng(e.latlng); dirty = true; paint(); });
        }
        paint();
        setTimeout(function(){ map.invalidateSize(); }, 200);
      });
    }).catch(function(){ /* 読み込めない環境では、従来のGoogleマップ表示のまま */ });
  }

        openModal("パスワードの初期化",'<div style="font-size:13px">'+esc(m.name)+' さんのパスワードを「1234」に戻します。よろしいですか？</div>',
          '<button class="btn" data-close-modal>キャンセル</button><button class="btn primary" id="f-reset-confirm">初期化する</button>');
        document.getElementById("f-reset-confirm").onclick = function(){
          writeDoc("members", id, {password:"1234"}, m.name+" さんのパスワードを初期化しました");
        };
      });
    });
    var pcSave = document.getElementById("pc-save");
    if(pcSave) pcSave.addEventListener("click", function(){
      var v = {up:Number(document.getElementById("pc-up").value), side:Number(document.getElementById("pc-side").value), q:Number(document.getElementById("pc-q").value), min:Number(document.getElementById("pc-min").value)};
      state.photoCfg = Object.assign({}, state.photoCfg, v);
      if(!db){ toast("保存しました（プレビューのみ）"); return; }
      db.doc("settings/photo").set(Object.assign({}, v, {updatedAt:new Date().toISOString(), updatedBy:state.myName||""})).then(function(){ toast("写真の設定を保存しました"); }).catch(function(){ toast("保存に失敗しました"); });
    });
    var delPwSave = document.getElementById("del-pw-save");
    if(delPwSave) delPwSave.addEventListener("click", function(){
      if(!state.isAdmin){ toast("削除用パスワードの変更は管理者のみ行えます"); return; }
      var oldPw = document.getElementById("del-pw-old").value;
      var newPw = document.getElementById("del-pw-new").value;
      var newPw2 = document.getElementById("del-pw-new2").value;
      loadDeletePassword(function(current){
        if(oldPw!==current){ toast("現在の削除用パスワードが正しくありません"); return; }
        if(!newPw || newPw.length<4){ toast("新しい削除用パスワードは4文字以上で入力してください"); return; }
        if(newPw!==newPw2){ toast("新しい削除用パスワード（確認）が一致しません"); return; }
        var done = function(){ state.deletePassword = newPw; toast("削除用パスワードを変更しました"); render(); };
        if(db) db.doc("settings/security").set({deletePassword:newPw, updatedAt:new Date().toISOString()}).then(done).catch(function(){ toast("保存に失敗しました"); });
        else done();
      });
    });
    var saveSecretDefaults = function(list, msg){
      if(!state.isAdmin){ toast("初期設定の変更は管理者のみ行えます"); return; }
      var done = function(){ state.secretDefaults = list; toast(msg); render(); };
      if(db) db.doc("settings/secret").set({defaults:list, updatedAt:new Date().toISOString()}).then(done).catch(function(){ toast("保存に失敗しました"); });

      var list = []; ta.value.split(/\r?\n/).forEach(function(x){ x=x.trim(); if(x && list.indexOf(x)===-1) list.push(x); });
      if(!list.length){ toast("項目を1つ以上入力してください"); return; }
      if(key==="statuses"){ var miss = STATUS_REQUIRED.filter(function(x){ return list.indexOf(x)===-1; }); if(miss.length){ toast("次の進捗は集計に使うため削除できません：" + miss.join("・")); return; } }
      if(list.some(function(x){ return x.length>30; })){ toast("1項目は30文字以内にしてください"); return; }
      saveMaster(key, list, "マスタを保存しました");
    }); });
    c.querySelectorAll("[data-master-reset]").forEach(function(btn){ btn.addEventListener("click", function(){
      var key = btn.getAttribute("data-master-reset"), m = MASTERS.find(function(x){return x.key===key;});

        saveMaster(key, MASTER_DEFAULTS[key].slice(), "標準の項目に戻しました", true);
      }, {title:"標準に戻す確認", button:"標準に戻す"});
    }); });
    var sdSave = document.getElementById("secret-def-save");
    if(sdSave) sdSave.addEventListener("click", function(){
      var list = Array.prototype.slice.call(c.querySelectorAll("input[data-secret-default]:checked")).map(function(b){ return b.getAttribute("data-secret-default"); });
      saveSecretDefaults(list, "社外秘の初期設定を保存しました");
    });
    var sdReset = document.getElementById("secret-def-reset");
    if(sdReset) sdReset.addEventListener("click", function(){
      confirmDelete("社外秘の初期設定を標準の設定に戻します。", function(){ saveSecretDefaults(DEFAULT_SECRET.slice(), "標準の設定に戻しました"); }, {title:"標準に戻す確認", button:"標準に戻す"});
    });
    var backupBtn = document.getElementById("admin-backup");
    if(backupBtn) backupBtn.addEventListener("click", function(){ if(!state.isAdmin) return; backupAllData(); });

    if(bkRun) bkRun.addEventListener("click", function(){ if(!state.isAdmin) return; backupAllData(document.getElementById("bk-pw").checked); });
    var fb = document.getElementById("files-backup-btn");
    if(fb) fb.addEventListener("click", function(){ if(state.isAdmin) backupFilesOnly(null); });
    var pl = document.getElementById("pf-lighten");
    if(pl) pl.addEventListener("click", function(){ lightenPhotos(state.filesProjectId); });
    var pb = document.getElementById("pf-backup");
    if(pb) pb.addEventListener("click", function(){ if(state.isAdmin) backupFilesOnly(state.filesProjectId); });
    var bkRunF = document.getElementById("bk-run-files");
    if(bkRunF) bkRunF.addEventListener("click", function(){ if(!state.isAdmin) return; bkRunF.disabled = true; backupAllData(document.getElementById("bk-pw").checked, true); });
    var bkFile = document.getElementById("bk-file");
    if(bkFile) bkFile.addEventListener("change", function(){
      var f = bkFile.files && bkFile.files[0]; if(!f || !state.isAdmin) return;
      var r = new FileReader();
      r.onload = function(){ var b = parseBackup(String(r.result||"")); if(b.error){ state.backupPreview=null; toast(b.error); render(); return; } b.name=f.name; state.backupPreview=b; render(); };
      r.readAsText(f);
    });
    var bkCancel = document.getElementById("bk-cancel");
    if(bkCancel) bkCancel.addEventListener("click", function(){ state.backupPreview=null; render(); });
    var bkRestore = document.getElementById("bk-restore");
    if(bkRestore) bkRestore.addEventListener("click", function(){
      var b = state.backupPreview; if(!b || !state.isAdmin) return;
      confirmDelete("バックアップ（"+b.total+"件）の内容で現在のデータを上書き・追加します。", function(){ restoreBackup(b); }, {title:"復元の確認", button:"復元する"});
    });
  }
