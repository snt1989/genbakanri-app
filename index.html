<title>現場管理アプリ</title>
<style>
  :root{
    --sidebar:#175C40;
    --sidebar-active:#2C8358;
    --sidebar-ink:#DCEBE1;
    --sidebar-ink-dim:#8FB9A2;
    --bg:#F3F2EE;
    --surface:#FFFFFF;
    --surface-2:#F6F5F1;
    --row-head:#EDECE6;
    --ink:#20241F;
    --ink-soft:#5C6459;
    --ink-faint:#93998E;
    --border:#E3E1D8;
    --accent:#1E8449;
    --accent-hover:#187038;
    --accent-ink:#FFFFFF;
    --accent-soft:#E2F1E7;
    --success:#1E8449;
    --success-soft:#E2F1E7;
    --warning:#B9800F;
    --warning-soft:#F6EACB;
    --danger:#C1443C;
    --danger-soft:#F8E1DE;
    --info:#2F6FA8;
    --info-soft:#DEEAF3;
    --lock:#C1443C;
    --black-badge:#232823;
    --shadow:0 1px 2px rgba(20,30,22,.05),0 6px 16px -10px rgba(20,30,22,.18);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12151B; --surface:#1A1F24; --surface-2:#20262C; --row-head:#232A31;
      --ink:#E7E9E3; --ink-soft:#A2AAA0; --ink-faint:#707870;
      --border:#2B333A; --sidebar:#0F3A29; --sidebar-active:#1F6B47;
      --sidebar-ink:#D6E9DD; --sidebar-ink-dim:#7FA48E;
      --accent:#37A263; --accent-hover:#2E8C54; --accent-ink:#08150E; --accent-soft:#173322;
      --success:#3FA46A; --success-soft:#153726;
      --warning:#D9A53B; --warning-soft:#3A2E12;
      --danger:#E17A73; --danger-soft:#3A201E; --lock:#E17A73;
      --info:#6AA5D6; --info-soft:#182D3C;
      --black-badge:#E7E9E3;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px -10px rgba(0,0,0,.55);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12151B; --surface:#1A1F24; --surface-2:#20262C; --row-head:#232A31;
    --ink:#E7E9E3; --ink-soft:#A2AAA0; --ink-faint:#707870;
    --border:#2B333A; --sidebar:#0F3A29; --sidebar-active:#1F6B47;
    --sidebar-ink:#D6E9DD; --sidebar-ink-dim:#7FA48E;
    --accent:#37A263; --accent-hover:#2E8C54; --accent-ink:#08150E; --accent-soft:#173322;
    --success:#3FA46A; --success-soft:#153726;
    --warning:#D9A53B; --warning-soft:#3A2E12;
    --danger:#E17A73; --danger-soft:#3A201E; --lock:#E17A73;
    --info:#6AA5D6; --info-soft:#182D3C;
    --black-badge:#E7E9E3;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px -10px rgba(0,0,0,.55);
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",-apple-system,sans-serif;-webkit-font-smoothing:antialiased;font-size:13px;}
  h1,h2,h3{font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif;font-weight:700;text-wrap:balance;margin:0;}
  .num{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;}
  button{font-family:inherit;}
  a{color:var(--accent);text-decoration:none;}
  a:hover{text-decoration:underline;}
  a.crumb{font-size:12px;font-weight:700;}

  #app{display:flex;min-height:100%;}
  #sidebar{
    width:212px;flex:none;background:var(--sidebar);color:var(--sidebar-ink);
    display:flex;flex-direction:column;padding:0;position:sticky;top:env(safe-area-inset-top,0px);
    align-self:flex-start;height:100vh;height:100dvh;
  }
  .brand{display:flex;align-items:center;gap:9px;padding:18px 18px 14px;}
  .brand-mark{width:28px;height:28px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;flex:none;}
  .brand-name{font-size:15.5px;font-weight:700;color:#fff;letter-spacing:.01em;}
  nav.mainnav{display:flex;flex-direction:column;gap:1px;flex:1;padding:4px 10px;}
  .navbtn{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;border:none;background:transparent;color:var(--sidebar-ink-dim);font-size:13px;font-weight:500;cursor:pointer;text-align:left;width:100%;}
  .navbtn svg{flex:none;width:17px;height:17px;}
  .navbtn:hover{background:rgba(255,255,255,.06);color:#fff;}
  .navbtn.active{background:var(--sidebar-active);color:#fff;font-weight:700;}
  .side-foot{padding:12px 16px 16px;}
  .closebtn{display:flex;align-items:center;gap:6px;color:var(--sidebar-ink-dim);background:transparent;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 14px;font-size:12px;cursor:pointer;}
  .closebtn:hover{color:#fff;border-color:rgba(255,255,255,.4);}

  #main{flex:1;min-width:0;display:flex;flex-direction:column;padding-bottom:64px;}
  header.topbar{
    position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--border);
    padding:12px 24px;display:flex;align-items:center;justify-content:flex-end;gap:16px;
  }
  .topbar-user{display:flex;align-items:center;gap:9px;font-size:12.5px;}
  .bellwrap{position:relative;color:var(--ink-soft);}
  .bellwrap svg{width:19px;height:19px;}
  .bell-dot{position:absolute;top:-3px;right:-4px;background:var(--warning);color:#3a2a00;font-size:9px;font-weight:800;border-radius:99px;padding:1px 4px;min-width:14px;text-align:center;line-height:1.3;}
  .avatar{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none;}
  .content{padding:22px 26px 40px;flex:1;}
  .content.flush{padding:0;display:flex;min-height:0;}
  .content.narrow{max-width:980px;}

  @media (max-width:900px){
    #sidebar{position:fixed;left:0;top:0;bottom:0;z-index:30;transform:translateX(-100%);transition:transform .2s;}
    #sidebar.open{transform:translateX(0);}
    .content{padding:14px 14px 24px;}
    header.topbar{padding:10px 14px;justify-content:space-between;}
  }
  .menubtn{display:none;}
  @media (max-width:900px){.menubtn{display:flex;}}
  .menubtn{border:1px solid var(--border);background:var(--surface);border-radius:8px;width:34px;height:34px;align-items:center;justify-content:center;color:var(--ink);}

  h1.pagetitle{font-size:19px;margin-bottom:2px;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;}
  .btn{display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:12.5px;font-weight:600;padding:8px 15px;cursor:pointer;white-space:nowrap;}
  .btn:hover{border-color:var(--ink-faint);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);}
  .btn.outline{background:transparent;border-color:var(--accent);color:var(--accent);}
  .btn.ghost{border-color:transparent;background:transparent;}
  .btn.sm{padding:5px 12px;font-size:11.5px;}
  .btn svg{width:14px;height:14px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .iconbtn{width:30px;height:30px;border-radius:8px;border:none;background:transparent;color:var(--ink-faint);cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .iconbtn:hover{background:var(--surface-2);color:var(--ink);}

  .badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 11px;border-radius:999px;white-space:nowrap;}
  .badge.fill-black{background:var(--black-badge);color:var(--surface);}
  .badge.fill-green{background:var(--accent);color:var(--accent-ink);}
  .badge.fill-gray{background:var(--ink-faint);color:var(--surface);}
  .badge.fill-info{background:var(--info);color:#fff;}
  .badge.line-green{background:transparent;color:var(--accent);border:1px solid var(--accent);}
  .badge.line-gray{background:transparent;color:var(--ink-faint);border:1px solid var(--border);}
  .badge.line-red{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  .badge.soft-warning{background:var(--warning-soft);color:var(--warning);}
  .badge.soft-success{background:var(--success-soft);color:var(--success);}

  .tag{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);background:var(--accent-soft);}
  .tag.muted{border-color:var(--border);color:var(--ink-soft);background:var(--surface-2);}
  .tagrow{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;}

  select,input[type=text],input[type=date],input[type=time],input[type=number],input[type=tel],input[type=email],input[type=search],textarea{
    font-family:inherit;font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;width:100%;
  }
  select:focus,input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  textarea{resize:vertical;min-height:64px;font-family:inherit;}
  label.field{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--ink-soft);font-weight:600;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (max-width:520px){.field-row{grid-template-columns:1fr;}}

  .filter-card{padding:16px 18px;margin-bottom:16px;display:flex;flex-direction:column;gap:12px;}
  .filter-line{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .filter-line .fitem{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--ink-faint);font-weight:600;min-width:140px;}
  .checkgroup{display:flex;gap:12px;flex-wrap:wrap;}
  .checkopt{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-soft);white-space:nowrap;}
  .checkopt input{width:auto;}
  .chip-toggle{border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:11.5px;cursor:pointer;background:var(--surface);color:var(--ink-soft);}
  .chip-toggle.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700;}

  .summary-line{display:flex;align-items:center;gap:22px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);padding:4px 2px 12px;border-bottom:1px solid var(--border);margin-bottom:2px;}
  .summary-line b{font-size:16px;color:var(--ink);font-family:"JetBrains Mono",monospace;margin-right:2px;}
  .summary-pager{margin-left:auto;font-size:11.5px;color:var(--ink-faint);}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;font-size:10.5px;letter-spacing:.03em;color:var(--ink-faint);padding:10px 14px;background:var(--row-head);font-weight:700;border-bottom:1px solid var(--border);}
  td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  tr.rowhover:hover{background:var(--surface-2);}
  .tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface);}
  .cell-name{font-weight:700;font-size:13px;}
  .cell-sub{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}

  .pager{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:20px;}
  .pagebtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .pagebtn.active{background:var(--black-badge);color:var(--surface);border-color:var(--black-badge);}
  .pagebtn:hover:not(.active){border-color:var(--ink-faint);}
  .pagelink{font-size:12px;color:var(--accent);cursor:pointer;}

  .empty{padding:44px 20px;text-align:center;color:var(--ink-faint);font-size:13px;}
  .empty svg{width:32px;height:32px;margin-bottom:10px;opacity:.5;}

  /* ---- Home ---- */
  .home-grid{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:flex-start;}
  @media (max-width:920px){.home-grid{grid-template-columns:1fr;}}
  .todo-row{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:14px 4px;border-bottom:1px solid var(--border);}
  .todo-row:last-child{border-bottom:none;}
  .todo-due{font-family:"JetBrains Mono",monospace;font-size:12px;}
  .todo-due .rel{font-size:11px;margin-top:2px;}
  .todo-title{font-weight:700;font-size:13px;margin-bottom:3px;}
  .side-card{padding:16px 18px;display:flex;flex-direction:column;gap:12px;}
  .side-card h3{font-size:13px;}
  .side-stat{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink-soft);padding:8px 0;border-bottom:1px dashed var(--border);}
  .side-stat:last-child{border-bottom:none;}
  .side-stat b{font-family:"JetBrains Mono",monospace;font-size:16px;color:var(--ink);}

  /* ---- Members ---- */
  .segmented{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .segopt{padding:9px 20px;font-size:12.5px;font-weight:600;background:var(--surface);color:var(--ink-soft);cursor:pointer;border-right:1px solid var(--border);}
  .segopt:last-child{border-right:none;}
  .segopt.active{background:var(--accent);color:var(--accent-ink);}
  .member-name{display:flex;align-items:center;gap:10px;font-weight:700;}
  .mini-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex:none;}

  /* ---- Chat ---- */
  .chat-shell{display:flex;width:100%;min-height:calc(100vh - 62px);border-top:1px solid var(--border);}
  .chat-list{width:290px;flex:none;border-right:1px solid var(--border);overflow-y:auto;}
  .chat-list-head{padding:16px 18px 10px;display:flex;justify-content:space-between;align-items:center;}
  .chat-item{display:flex;gap:10px;padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--border);align-items:flex-start;}
  .chat-item:hover,.chat-item.active{background:var(--surface-2);}
  .chat-ava{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;}
  .chat-ava svg{width:16px;height:16px;}
  .chat-item-name{font-weight:700;font-size:12.5px;line-height:1.35;}
  .chat-item-meta{font-size:10.5px;color:var(--ink-faint);margin-top:3px;}
  .chat-pane{flex:1;display:flex;flex-direction:column;min-width:0;}
  .chat-pane-head{padding:14px 20px;border-bottom:1px solid var(--border);font-weight:700;font-size:13.5px;}
  .chat-msgs{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px;}
  .msg{max-width:70%;padding:9px 13px;border-radius:12px;font-size:12.5px;line-height:1.55;background:var(--surface-2);align-self:flex-start;}
  .msg .ma{font-size:10.5px;font-weight:700;color:var(--ink-faint);margin-bottom:3px;}
  .msg.me{background:var(--accent-soft);color:var(--ink);align-self:flex-end;}
  .chat-input-row{display:flex;gap:8px;padding:14px 18px;border-top:1px solid var(--border);}
  .chat-input-row input{flex:1;}
  .chat-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:13px;}

  /* ---- Form page (project / member) ---- */
  .form-shell{display:flex;flex-direction:column;gap:0;max-width:900px;}
  .form-section-title{font-size:12.5px;font-weight:800;padding:18px 4px 8px;display:flex;justify-content:space-between;align-items:center;}
  .form-section-title .lockhint{font-size:10px;color:var(--ink-faint);font-weight:600;display:flex;align-items:center;gap:3px;}
  .form-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .form-row{display:grid;grid-template-columns:170px minmax(0,1fr);gap:16px;padding:16px 20px;border-bottom:1px solid var(--border);align-items:center;}
  .form-row:last-child{border-bottom:none;}
  @media (max-width:640px){.form-row{grid-template-columns:1fr;}}
  .form-row .flabel{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .flabel .req{color:var(--danger);font-size:10.5px;font-weight:700;}
  .secret-chk{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--lock);font-weight:600;margin-top:4px;cursor:pointer;white-space:nowrap}
  .secret-chk input{width:auto;margin:0}
  .flabel .lock{color:var(--lock);font-size:11px;}
  .form-row .fcontrol{display:flex;flex-direction:column;gap:8px;min-width:0;}
  .inline2{display:flex;gap:10px;align-items:center;}
  .inline2 input,.inline2 select{width:auto;flex:1;min-width:0;}
  .radiogroup{display:flex;gap:18px;flex-wrap:wrap;}
  .radioopt{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;}
  .radioopt input{width:auto;}
  .member-picker{display:flex;flex-direction:column;gap:10px;}
  .member-picker .mp-label{font-size:11.5px;font-weight:700;color:var(--ink-soft);}
  .assignee-pick{display:flex;flex-wrap:wrap;gap:6px;}
  .formfoot{display:flex;justify-content:center;padding:26px 0 10px;}

  /* ---- Project detail ---- */
  .detail-grid{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:flex-start;max-width:1180px;}
  @media (max-width:960px){.detail-grid{grid-template-columns:1fr;}}
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin:6px 0 16px;}
  .detail-head h1{font-size:19px;}
  .detail-head .updated{font-size:11px;color:var(--ink-faint);}
  .lock-ico{display:inline-flex;align-items:center;vertical-align:-2px;margin-right:3px;}
  .secret-ico{color:var(--lock);}
  .admin-ico{color:var(--accent);}
  .btn.primary .admin-ico,.segopt.active .admin-ico{color:inherit;}
  .bulk-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;margin-bottom:14px;border-color:var(--accent);}
  .bulk-bar select,.bulk-bar input[type=text],.bulk-bar input:not([type=checkbox]){width:auto;flex:0 0 auto;}
  .bulk-bar select,.bulk-bar input[type=text],.bulk-bar input[type=date],.bulk-bar input[type=number]{padding:5px 8px;font-size:12px;}
  .bulk-cell{width:34px;text-align:center;}
  .bulk-float{position:absolute;left:6px;top:6px;z-index:3;width:18px;height:18px;cursor:pointer;}
  .row-selected{background:var(--surface-2);outline:2px solid var(--accent);outline-offset:-2px;}
  .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;}
  .photo-thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface-2);border:1px solid var(--border);}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-thumb.filekind{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink-soft);padding:8px;}
  .photo-thumb.filekind svg{width:26px;height:26px;}
  .photo-thumb .fname{font-size:10px;text-align:center;line-height:1.3;word-break:break-all;max-width:100%;padding:0 4px;}
  .photo-thumb .thumb-del{position:absolute;top:4px;right:4px;background:rgba(20,20,20,.55);color:#fff;border:none;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .12s;}
  .photo-thumb:hover .thumb-del{opacity:1;}
  .photo-thumb .thumb-proj{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;font-size:10px;padding:10px 6px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .upload-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink-faint);font-size:11px;border:1.5px dashed var(--border);border-radius:10px;aspect-ratio:1;cursor:pointer;background:var(--surface-2);}
  .upload-tile:hover{border-color:var(--accent);color:var(--accent);}
  .files-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px;}
  .kv{display:grid;grid-template-columns:140px 1fr;gap:6px 16px;padding:14px 20px;border-bottom:1px solid var(--border);}
  .kv:last-child{border-bottom:none;}
  .kv dt{font-size:11.5px;color:var(--ink-faint);font-weight:700;grid-column:1;}
  .kv dd{margin:0;font-size:12.5px;grid-column:2;white-space:pre-wrap;}
  .maplink{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;}
  .member-side-item{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid var(--border);align-items:flex-start;}
  .member-side-item:last-child{border-bottom:none;}

<!--
  Firebase/Firestore client, used only for the standalone/Vercel deployment
  (where window.claude's "db" capability does not exist). Harmless no-op on
  the claude.ai Artifact, which keeps using its own "db" capability as
  before. Loaded as an ES module (via jsdelivr's npm "+esm" wrapper) so it
  can use the modern modular Firebase SDK without a build step; it exposes
  a tiny Firestore-backed shim on window.__fbDbPromise that the main script
  below awaits.
-->
<script type="module">
  window.__fbDbPromise = (async function(){
    try{
      var cfgRes = await fetch("/api/config");
      if(!cfgRes.ok) return null;
      var cfg = await cfgRes.json();
      if(!cfg || !cfg.apiKey || !cfg.projectId) return null;

      // Use Google's own gstatic CDN (not jsdelivr's "+esm" wrapper) for both
      // modules. jsdelivr's "+esm" wrapper bundles each Firebase subpackage
      // (app, firestore) separately, which can give them two independent
      // internal Firebase registries -- initializeApp() registers the app in
      // one registry while getFirestore() looks for it in the other, failing
      // with "Service firestore is not available". gstatic's modular URLs
      // are Google's officially supported, mutually-compatible build.
      var appMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
      var fsMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
      var app = appMod.initializeApp(cfg);
      var fs = fsMod.getFirestore(app);

      function wrapSnap(qs){
        return { docs: qs.docs.map(function(d){ return { id: d.id, data: function(){ return d.data(); } }; }) };
      }
      function makeCollectionRef(path){
        var orderField = null, limitN = null;
        var api = {
          doc: function(id){ return makeDocRef(path+"/"+id); },
          add: function(data){
            return fsMod.addDoc(fsMod.collection(fs, path), data).then(function(ref){ return { id: ref.id }; });
          },
          orderBy: function(f){ orderField = f; return api; },
          limit: function(n){ limitN = n; return api; },
          onSnapshot: function(cb, errCb){
            var constraints = [];
            if(orderField) constraints.push(fsMod.orderBy(orderField));
            if(limitN) constraints.push(fsMod.limit(limitN));
            var q = constraints.length ? fsMod.query.apply(null, [fsMod.collection(fs, path)].concat(constraints)) : fsMod.collection(fs, path);
            return fsMod.onSnapshot(q, function(qs){ cb(wrapSnap(qs)); }, errCb);
          }
        };
        return api;
      }
      function makeDocRef(path){
        var ref = fsMod.doc(fs, path);
        return {
          id: path.split("/").pop(),
          get: function(){
            return fsMod.getDoc(ref).then(function(snap){
              return { exists: snap.exists(), data: function(){ return snap.data(); }, id: snap.id };
            });
          },
          set: function(data){ return fsMod.setDoc(ref, data); },
          update: function(data){ return fsMod.updateDoc(ref, data); },
          delete: function(){ return fsMod.deleteDoc(ref); },
          collection: function(sub){ return makeCollectionRef(path+"/"+sub); }
        };
      }

      // IMPORTANT: run the one-time seed + permission-migration checks in the
      // BACKGROUND, without awaiting them here. They used to be awaited
      // before this promise resolved, which meant window.__fbDbPromise
      // (and therefore the whole app's "db ready" signal) stayed pending
      // until TWO extra Firestore round-trips completed on top of the
      // initial connection. On a cold connection that easily took longer
      // than connectFirebase()'s timeout, so the app silently gave up and
      // fell back to offline/demo mode -- with no console error at all,
      // since withTimeout() just resolves null when it times out. The app
      // itself (subscribeAll's onSnapshot calls) doesn't need either of
      // these to have finished; they only backfill/migrate data that may
      // already be there, so let them run independently and let the app
      // connect immediately.
      (async function(){
        try{
          var existing = await fsMod.getDocs(fsMod.collection(fs, "projects"));
          if(existing.empty){
            var SEED = window.__GENBA_SEED_DATA__ || {};
            var batch = fsMod.writeBatch(fs);
            (SEED.customers||[]).forEach(function(r){ batch.set(fsMod.doc(fs, "customers", r.id), r.data); });
            (SEED.members||[]).forEach(function(r){ batch.set(fsMod.doc(fs, "members", r.id), r.data); });
            (SEED.projects||[]).forEach(function(r){ batch.set(fsMod.doc(fs, "projects", r.id), r.data); });
            (SEED.tasks||[]).forEach(function(r){ batch.set(fsMod.doc(fs, "tasks", r.id), r.data); });
            (SEED.chats||[]).forEach(function(r){ batch.set(fsMod.doc(fs, "chats", r.id), r.data); });
            (SEED.messages||[]).forEach(function(r){ batch.set(fsMod.doc(fs, "chats", r.chatId, "messages", r.id), r.data); });
            await batch.commit();
          }
        }catch(e){ console.error("Firestore seed failed (non-fatal)", e); }
      })();

      // One-time permission-field migration: backfills the unified
      // "permission" field (admin/general/external) on any member record
      // that predates it, deriving it from the older isAdmin/kind fields
      // where present, and granting admin to the named members below
      // otherwise. Idempotent -- skips any member that already has a
      // permission field -- so it's safe to run on every boot. Also
      // backgrounded, same reasoning as the seed step above.
      (async function(){
        try{
          var membersSnap = await fsMod.getDocs(fsMod.collection(fs, "members"));
          var BOOTSTRAP_ADMIN_NAMES = ["阿部 晋太郎", "鷹羽 悠希"];
          var migBatch = fsMod.writeBatch(fs);
          var any = false;
          membersSnap.docs.forEach(function(d){
            var data = d.data();
            var upd = {};
            if(!data.permission){
              var perm = data.isAdmin ? "admin" : (data.kind==="external" ? "external" : (BOOTSTRAP_ADMIN_NAMES.indexOf(data.name)!==-1 ? "admin" : "general"));
              upd = { permission: perm, isAdmin: perm==="admin", kind: perm==="external"?"external":"internal" };
            }
            // Company was renamed: members still on the old name move to the new one.
            if(data.company === "株式会社サノー") upd.company = "株式会社三桜";
            if(Object.keys(upd).length){
              migBatch.update(fsMod.doc(fs, "members", d.id), upd);
              any = true;
            }
          });
          if(any) await migBatch.commit();
        }catch(e){ console.error("Firestore permission migration failed (non-fatal)", e); }
      })();

      return {
        collection: function(name){ return makeCollectionRef(name); },
        doc: function(path){ return makeDocRef(path); }
      };
    }catch(e){ console.error("Firebase init failed", e); return null; }
  })();
</script>

  /* ============ login ============ */

    if(scr) scr.classList.remove("hidden");
    var pf = document.getElementById("login-password"); if(pf) pf.value = "";

  }

  /* ============ boot ============ */
  function withTimeout(promise, ms){
    return new Promise(function(resolve){
      var done=false;
      var t=setTimeout(function(){ if(!done){ done=true; resolve(null); } }, ms);
      Promise.resolve(promise).then(function(v){ if(!done){ done=true; clearTimeout(t); resolve(v); } }, function(){ if(!done){ done=true; clearTimeout(t); resolve(null); } });
    });
  }

  // Watchdog: scheduled synchronously, BEFORE any await, so it fires even if
  // claude.use(...) itself never settles (e.g. a stalled capability prompt)
  // or an onSnapshot subscription never calls back (e.g. a permission rule
  // silently denies a read with no error callback).
  //
  // IMPORTANT: always fall back to setPreview() here, even when `db` itself
  // resolved non-null. Previously this only called setPreview() when db was
  // null, and otherwise just force-marked every collection as "loaded" while
  // leaving state.members (etc.) as an empty array. That produced a silent
  // broken state: the login screen showed no offline-mode hint (because
  // offlineMode was never set), yet state.members.find(...) could never
  // match anything, so every login attempt failed with "ログインIDまたは
  // パスワードが正しくありません" even for verified-correct credentials.
  // Falling back to sample data + the visible offline hint whenever a
  // collection fails to load in time means the user always sees *why*
  // login isn't working against the real data, and can still use the
  // documented demo credentials in the meantime.
  function startLoadWatchdog(){
    setTimeout(function(){
      var stillLoading = Object.keys(state.loaded).some(function(k){ return !state.loaded[k]; });
      if(stillLoading){
        setPreview();
        state.loadTimedOut = true;
        toast("データの読み込みに時間がかかっています");
        render();
      }
    }, 15000);
  }

  // Standalone deployment (e.g. Vercel) persistence: a small <script
  // type="module"> block earlier in this document connects to Firebase/
  // Firestore and exposes a tiny Firestore-backed shim -- matching the
  // same collection/doc/onSnapshot/add/update/delete/orderBy/limit shape
  // this file already calls against claude.ai's own "db" capability -- as
  // window.__fbDbPromise. This just awaits that, with a timeout.
  //
  // IMPORTANT -- this used to just check `if(!window.__fbDbPromise) return
  // null` ONCE and bail immediately if it wasn't there yet. But a <script
  // type="module"> is deferred by spec (it only runs after the whole
  // document has been parsed), while this plain, non-deferred <script>
  // runs immediately as the parser reaches it and calls boot() right away
  // at the bottom of the file. So on every load, this code almost always
  // ran BEFORE the module script had assigned window.__fbDbPromise at
  // all -- the check saw `undefined`, returned null instantly (not after
  // any timeout), and the app fell straight into offline/demo mode. This
  // was the actual, final root cause: confirmed via diagnostic logging
  // showing "[boot] db= null" logged essentially instantly, while a
  // manual, hand-typed await of window.__fbDbPromise (typed into the
  // console after the page had finished loading, i.e. with no race) always
  // resolved correctly and received all 8 real members right away.
  //
  // Fixed by polling for window.__fbDbPromise to actually exist (the
  // module script assigns it within milliseconds of starting) before
  // awaiting it, instead of only checking once.
  function waitForFbPromise(timeoutMs){
    return new Promise(function(resolve){
      var start = Date.now();
      (function poll(){
        if(window.__fbDbPromise){ resolve(window.__fbDbPromise); return; }
        if(Date.now() - start > timeoutMs){ resolve(null); return; }
        setTimeout(poll, 50);
      })();
    });
  }
  async function connectFirebase(){
    var p = await waitForFbPromise(5000);
    if(!p) return null;
    try{ return await withTimeout(p, 12000); }catch(e){ return null; }
  }

  async function boot(){
    bindLoginAndTopbarEvents();
    renderShell(); render();
    startLoadWatchdog();

    if(window.claude){
      try{ db = await withTimeout(claude.use("db"), 7000); }catch(e){ db=null; }
      if(!db){ setPreview(); render(); return; }
      try{ downloadsCap = await withTimeout(claude.use("downloads"), 5000); }catch(e){ downloadsCap=null; }
      try{ assetsCap = await withTimeout(claude.use("assets"), 5000); }catch(e){ assetsCap=null; }
      try{
        var user = await withTimeout(claude.use("user"), 5000);
        if(user && user.can){ var can = user.can("data.write"); if(can===false) state.canWrite=false; }
      }catch(e){}
    } else {
      // Standalone deployment (e.g. Vercel): no claude.ai capabilities.
      // Use the Firebase-backed persistence layer instead, so data
      // actually survives reloads/redeploys rather than always resetting
      // to the hardcoded sample data.
      try{ db = await connectFirebase(); }catch(e){ db=null; }
      if(!db){ setPreview(); render(); return; }
    }
    subscribeAll();
    db.doc("settings/org").get().then(function(snap){ if(snap.exists){ state.orgSettings = Object.assign({}, state.orgSettings, snap.data()); render(); } }).catch(function(){});
    loadDeletePassword();
    loadSecretDefaults();
  }

  // 削除用パスワード: one shared password (set by an admin in 設定 > 管理画面)
  // that every delete asks for. Defaults to "0000" until an admin changes it.
  var DEFAULT_DELETE_PASSWORD = "0000";
  function loadDeletePassword(cb){
    if(!db){ if(cb) cb(state.deletePassword); return; }
    db.doc("settings/security").get().then(function(snap){
      var d = snap.exists ? snap.data() : null;
      state.deletePassword = (d && d.deletePassword) ? d.deletePassword : DEFAULT_DELETE_PASSWORD;
      if(cb) cb(state.deletePassword);
    }).catch(function(){ if(cb) cb(state.deletePassword); });
  }

  function retrySync(){
    state.loadTimedOut = false;
    Object.keys(state.loaded).forEach(function(k){ state.loaded[k]=false; });
    render();
    startLoadWatchdog();
    if(db) subscribeAll();
  }

  function subscribeAll(){
    db.collection("projects").onSnapshot(function(snap){
      state.projects = snap.docs.map(toObj); state.loaded.projects=true; render();
    }, onErr);
    db.collection("customers").onSnapshot(function(snap){
      state.customers = snap.docs.map(toObj).sort(function(a,b){return (b.registeredDate||"").localeCompare(a.registeredDate||"");});
      state.loaded.customers=true; render();
    }, onErr);
    db.collection("members").onSnapshot(function(snap){
      state.members = snap.docs.map(toObj); state.loaded.members=true; state.offlineMode=false; updateLoginHint();
      // Keep the logged-in user's admin flag in sync if another admin
      // changes it (or their own record) while they're signed in.
      if(state.authed && state.myName){
        var me = state.members.find(function(x){ return x.name===state.myName; });
        if(me) state.isAdmin = memberPermission(me)==="admin";
      }
      render(); tryAutoLogin();
    }, onErr);
    db.collection("tasks").orderBy("dueDate").onSnapshot(function(snap){
      state.tasks = snap.docs.map(toObj); state.loaded.tasks=true; render();
    }, onErr);
    db.collection("chats").onSnapshot(function(snap){
      state.chats = snap.docs.map(toObj); state.loaded.chats=true; render();
    }, onErr);
    db.collection("files").orderBy("uploadedAt").onSnapshot(function(snap){
      state.files = snap.docs.map(toObj); state.loaded.files=true; render();
    }, onErr);
    db.collection("folders").onSnapshot(function(snap){
      state.folders = snap.docs.map(toObj); state.loaded.folders=true; render();
    }, function(e){ state.loaded.folders=true; state.folders=[]; render(); });
  }
  function onErr(e){
    toast("同期エラー: "+(e&&e.code||"unknown"));
    // A read error on some collection means its onSnapshot will never call
    // back with real data. setPreview() only backfills collections that
    // are still missing (state.loaded.X===false), so calling it here just
    // fills the one gap this error left -- it no longer touches any other
    // collection that already loaded real data successfully.
    setPreview(); render();
  }
  // IMPORTANT: build a NEW object rather than mutating d.data()'s return
  // value in place. claude.ai's own "db" capability returns frozen/
  // non-extensible document snapshots (to stop accidental mutation), so
  // `o.id = d.id` on that object throws "Cannot add property id, object is
  // not extensible" -- silently aborting whichever collection's onSnapshot
  // callback hit it (before state.loaded.<collection> ever got set true),
  // which is what was causing customers/members to be stuck "loading"
  // forever and falling back to the offline/demo dataset.
  function toObj(d){ var o=d.data()||{}; return Object.assign({}, o, {id:d.id}); }

  // IMPORTANT: this only fills in collections that have NOT already loaded
  // real data. It used to unconditionally overwrite every collection with
  // sample data, which meant a single slow/erroring collection (e.g.
  // "files", rarely touched) would silently wipe out an already-correctly-
  // loaded "members" list back down to the 4-person demo roster -- the
  // real data was fine, but the app threw it away a few seconds later.
  // Only flip the offline-mode hint when "members" itself is one of the
  // gaps being filled, since that's what actually breaks login.
  function setPreview(){
    if(!state.loaded.projects) state.projects = SAMPLE_PROJECTS.slice();
    if(!state.loaded.customers) state.customers = SAMPLE_CUSTOMERS.slice();
    if(!state.loaded.members){ state.members = SAMPLE_MEMBERS.slice(); state.offlineMode = true; }
    if(!state.loaded.tasks) state.tasks = SAMPLE_TASKS.slice();
    if(!state.loaded.chats) state.chats = SAMPLE_CHATS.slice();
    Object.keys(state.loaded).forEach(function(k){state.loaded[k]=true;});
    updateLoginHint();
    tryAutoLogin();
  }
  function updateLoginHint(){
    var el = document.getElementById("login-hint");
    if(!el) return;
    if(state.offlineMode){
      el.textContent = "現在オフライン（デモ）モードで動作しています。実際のメンバー情報には接続できていません。デモ用ログイン「佐藤 裕之」「瀬戸 美奈」「鷹羽 悠希」のいずれか／パスワード「1234」でお試しください。";
      el.classList.add("show");
    } else {
      el.classList.remove("show");
    }
  }

  /* ============ helpers ============ */
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function uid(){ return crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random(); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function fmtDate(iso){ if(!iso) return "—"; var p=iso.split("-"); return p.length<3?iso:p[0]+"/"+p[1]+"/"+p[2]; }
  function fmtDateTime(iso){ if(!iso) return "—"; var d=new Date(iso); if(isNaN(d)) return "—"; return d.getFullYear()+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+String(d.getDate()).padStart(2,"0")+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
  function fmtYen(n){ return (n||0).toLocaleString("ja-JP")+" 円"; }
  function daysUntil(iso){ return Math.round((new Date(iso+"T00:00:00")-new Date(todayISO()+"T00:00:00"))/86400000); }
  function toast(msg){
    var t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove("show");},2400);
  }
  function initials(name){ return (name||"?").trim().slice(0,1); }
  function avaColor(name){ var h=0; for(var i=0;i<(name||"").length;i++) h=(h*31+name.charCodeAt(i))%AVA_COLORS.length; return AVA_COLORS[h]; }
  function memberByName(name){ return state.members.find(function(x){return x.name===name;}); }
  function isImageFile(f){ return (f.contentType||"").indexOf("image/")===0; }
  function fileUrl(f){ return f.url || ("/_blob/"+f.assetId); }
  function filesForProject(projectId){
    return state.files.filter(function(f){ return f.projectId===projectId; }).sort(function(a,b){return (a.uploadedAt||"").localeCompare(b.uploadedAt||"");});
  }
  function foldersForProject(pid){
    return state.folders.filter(function(x){ return x.projectId===pid; }).sort(function(a,b){ return (a.createdAt||"").localeCompare(b.createdAt||"") || (a.name||"").localeCompare(b.name||""); });
  }
  function openFolderModal(pid, folder){
    openModal(folder?"フォルダ名を変更":"フォルダを追加",
      '<label class="field">フォルダ名<input type="text" id="f-folder-name" maxlength="40" placeholder="例）施工前、施工中、完了写真、図面" value="'+esc(folder?folder.name:"")+'"></label>',
      '<button class="btn" data-close-modal>キャンセル</button><button class="btn primary" id="f-folder-save">'+(folder?"保存する":"追加する")+'</button>');
    var inp = document.getElementById("f-folder-name");
    var save = function(){
      var name = (inp.value||"").trim();
      if(!name){ toast("フォルダ名を入力してください"); return; }
      var dup = foldersForProject(pid).some(function(x){ return x.name===name && (!folder || x.id!==folder.id); });
      if(dup){ toast("同じ名前のフォルダがあります"); return; }
      if(folder) writeDoc("folders", folder.id, {name:name}, "フォルダ名を変更しました");
      else writeDoc("folders", null, {projectId:pid, name:name}, "フォルダを追加しました", function(id){ if(id) { state.pfFolder=id; render(); } });
    };
    document.getElementById("f-folder-save").addEventListener("click", save);
    inp.addEventListener("keydown", function(ev){ if(ev.key==="Enter") save(); });
    setTimeout(function(){ inp.focus(); },30);
  }
  function deleteFolder(folder){
    var inside = state.files.filter(function(f){ return f.folderId===folder.id; });
    confirmDelete("フォルダ「"+folder.name+"」を削除しますか？（中のファイル"+inside.length+"件は削除されず「未分類」に移動します）", function(){
      if(!db){
        inside.forEach(function(f){ f.folderId=null; });
        state.folders = state.folders.filter(function(x){return x.id!==folder.id;});
        state.pfFolder="all"; toast("フォルダを削除しました（プレビューのみ）"); render(); return;
      }
      Promise.all(inside.map(function(f){ return db.collection("files").doc(f.id).update({folderId:null}); }))
        .then(function(){ return db.collection("folders").doc(folder.id).delete(); })
        .then(function(){ state.pfFolder="all"; toast("フォルダを削除しました"); render(); })
        .catch(function(){ toast("削除に失敗しました"); });
    });
  }
  function fileThumb(f, withDelete, showProject){
    var inner = isImageFile(f) ?
      '<img src="'+esc(fileUrl(f))+'" loading="lazy">' :
      '<div class="filekind" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px">'+iFile()+'<span class="fname">'+esc(f.filename||"ファイル")+'</span></div>';
    var cls = "photo-thumb"+(isImageFile(f)?"":" filekind");
    return '<a href="'+esc(fileUrl(f))+'" target="_blank" rel="noopener" class="'+cls+'" data-row-id="'+esc(f.id)+'" style="display:block">'+inner+
      (showProject && f.projectName ? '<span class="thumb-proj">'+esc(f.projectName)+'</span>':'')+
      (withDelete ? '<button class="thumb-del" data-del-file="'+esc(f.id)+'" title="削除">'+iX()+'</button>':'')+
    '</a>';
  }
  function normalizeAssignees(list){
    return (list||[]).map(function(a){
      if(typeof a === "string"){ var m=memberByName(a); return {name:a, kind:m?m.kind:"internal", status:"未確認"}; }
      return {name:a.name, kind:a.kind||"internal", status:a.status||"未確認"};
    });
  }

  /* ============ shell ============ */
  function renderShell(){
    var nav = document.getElementById("mainnav");
    var highlight = SUBPAGES[state.tab] ? state.returnTab : state.tab;
    // 設定 is now open to everyone (it holds each person's own 個人情報);
    // only the 会社情報 editing and the 管理画面 section inside it are admin-only.
    nav.innerHTML = TABS.map(function(t){
      return '<button class="navbtn'+(highlight===t.id?" active":"")+'" data-tab="'+t.id+'">'+t.icon()+'<span>'+t.label+'</span></button>';
    }).join("");
    document.getElementById("bell-icon").innerHTML = iBell()+(state.tasks.filter(overdueOrToday).length? '<span class="bell-dot">'+state.tasks.filter(overdueOrToday).length+'</span>':'');
    document.getElementById("menu-toggle").innerHTML = iMenu();
    document.getElementById("sidebar").classList.toggle("open", state.sidebarOpen);
    var un = document.getElementById("user-name");
    var displayName = state.myName || state.orgSettings.representative;
    if(un) un.textContent = displayName+"（"+state.orgSettings.companyName+"）";
    var av = document.getElementById("user-avatar");
    if(av) av.textContent = initials(displayName);
  }
  function overdueOrToday(t){ return !t.done && t.dueDate<=todayISO(); }

  function setTab(id){
    bulkReset(); state.tab=id; state.sidebarOpen=false; if(!SUBPAGES[id]) state.returnTab=id; render();
  }
  function goProjectForm(mode, project){ state.formMode=mode||state.returnTab; state.editingProject=project||null; state.tab="project-form"; render(); }
  function goProjectDetail(id){ state.viewingProjectId=id; state.tab="project-detail"; render(); }
  // 案件別ファイル管理ページ. from: "detail" (案件詳細) or "files" (写真・ファイル一覧)
  function goProjectFiles(id, from){ bulkReset(); state.filesProjectId=id; state.filesBack=from||"detail"; state.projectFilesKind="all"; state.pfFolder="all"; state.tab="project-files"; render(); }
  function goMemberForm(){
    if(!state.isAdmin){ toast("メンバーの追加は管理者のみ行えます"); return; }
    state.editingMember=null;
    state.tab="member-form"; render();
  }
  function editMember(id){
    if(!state.isAdmin){ toast("メンバーの変更は管理者のみ行えます"); return; }
    var m = state.members.find(function(x){ return x.id===id; });
    if(!m) return;
    state.editingMember = m;
    state.tab="member-form"; render();
  }

  function render(){
    renderShell();
    var c = document.getElementById("content");
    c.className = "content";
    if(state.tab==="chat") c.classList.add("flush");
    if(state.tab==="project-form"||state.tab==="member-form") c.classList.add("narrow");

    var banner = "";
    if(state.loadTimedOut && state.tab!=="chat"){
      banner = '<div class="card" style="padding:12px 16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-color:var(--warning)">'+
        '<span style="font-size:12.5px;color:var(--ink-soft)">データの同期に時間がかかっています。空の状態で表示している可能性があります。</span>'+
        '<button class="btn sm" id="retry-sync-btn">再読み込み</button></div>';
    }
    if(state.tab==="home") c.innerHTML = banner+renderHome();
    else if(state.tab==="sales") c.innerHTML = banner+renderProjectList("sales");
    else if(state.tab==="construction") c.innerHTML = banner+renderProjectList("construction");
    else if(state.tab==="chat") c.innerHTML = renderChat();
    else if(state.tab==="members") c.innerHTML = banner+renderMembers();
    else if(state.tab==="customers") c.innerHTML = banner+renderCustomers();
    else if(state.tab==="files") c.innerHTML = banner+renderFiles();
    else if(state.tab==="settings") c.innerHTML = banner+renderSettings();
    else if(state.tab==="project-form") c.innerHTML = banner+renderProjectForm();
    else if(state.tab==="project-detail") c.innerHTML = banner+renderProjectDetail();
    else if(state.tab==="project-files") c.innerHTML = banner+renderProjectFiles();
    else if(state.tab==="member-form") c.innerHTML = banner+renderMemberForm();
    bindEvents();
    applyBulkUi();
    if(state.tab==="chat") scrollChatToBottom();
  }

  function skeleton(){ return '<div class="empty">読み込み中…</div>'; }
  function emptyState(iconFn,title,sub){
    return '<div class="empty card">'+iconFn()+'<div>'+esc(title)+'</div>'+(sub?'<div style="font-size:11px;margin-top:4px">'+esc(sub)+'</div>':'')+'</div>';
  }
  function crumb(label, targetTab){ return '<a href="#" class="crumb" data-goto="'+targetTab+'">'+iBack()+' '+esc(label)+'</a>'; }

  /* ============ HOME ============ */
  function renderHome(){
    if(!state.loaded.tasks || !state.loaded.projects) return skeleton();
    var todo = state.tasks.filter(function(t){return !t.done;}).sort(function(a,b){return (a.dueDate||"").localeCompare(b.dueDate||"");});
    var activeProjects = state.projects.filter(function(p){return p.status==="施工中";});
    var thisMonthAmount = state.projects.filter(function(p){return (p.status==="契約済"||p.status==="施工中"||p.status==="施工完了");}).reduce(function(s,p){return s+(hiddenFor(p,"p_amount")?0:(p.amount||0));},0);

    var html = '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px"><h1 class="pagetitle">ホーム</h1><div style="display:flex;gap:8px;flex-wrap:wrap">'+csvToolbar("tasks")+'</div></div><div style="height:16px"></div>';
    html += '<div class="home-grid">';
    html += '<div>';
    html += '<div class="card" style="padding:6px 18px 2px"><h2 style="font-size:14px;padding:12px 0">担当案件のTODO</h2>';
    if(todo.length===0){
      html += '<div class="empty">未完了のタスクはありません</div>';
    }else{
      html += todo.slice(0,8).map(function(t){
        var d = daysUntil(t.dueDate);
        var rel = d<0 ? '<span style="color:var(--danger);font-weight:700">'+Math.abs(d)+'日超過</span>' : (d===0?'<span style="color:var(--danger);font-weight:700">あと0日</span>':'<span style="color:var(--ink-faint)">あと'+d+'日</span>');
        return '<div class="todo-row" data-row-id="'+esc(t.id)+'">'+
          '<div class="todo-due"><div style="color:'+(d<=0?'var(--danger)':'var(--ink)')+'">'+fmtDate(t.dueDate)+'</div><div class="rel">'+rel+'</div></div>'+
          '<div><div class="todo-title">'+esc(t.title)+'</div>'+(t.projectName?'<a href="#" data-open-project="'+esc(t.projectId||"")+'">'+esc(t.projectName)+'</a>':'')+
          ' <button class="iconbtn" data-done-task="'+t.id+'" title="完了にする" style="float:right">'+iCheckIcon()+'</button></div>'+
        '</div>';
      }).join("");
    }
    html += '</div>';
    if(todo.length>8) html += '<div style="text-align:center;margin-top:16px"><button class="btn outline" data-goto="sales">もっと見る</button></div>';
    html += '</div>';

    html += '<div style="display:flex;flex-direction:column;gap:16px">';
    html += '<div class="card side-card"><h3>本日の稼働状況</h3>'+
      '<div class="side-stat">施工中の現場<b>'+activeProjects.length+'</b></div>'+
      '<div class="side-stat">今月の契約金額合計<b class="num">'+fmtYen(thisMonthAmount)+'</b></div>'+
      '<div class="side-stat">未完了タスク<b>'+todo.length+'</b></div>'+
      '<div class="side-stat">登録メンバー<b>'+state.members.length+'</b></div>'+
    '</div>';
    var upcoming = state.projects.filter(function(p){return p.startDate>=todayISO();}).sort(function(a,b){return (a.startDate||"").localeCompare(b.startDate||"");}).slice(0,4);
    html += '<div class="card side-card"><h3>今後の施工開始予定</h3>';
    if(upcoming.length===0){ html+='<div style="font-size:12px;color:var(--ink-faint)">予定はありません</div>'; }
    else{
      html += upcoming.map(function(p){
        return '<div class="side-stat" style="display:block"><div style="font-weight:700;font-size:12px">'+esc(p.name)+'</div><div style="color:var(--ink-faint);font-size:11px;margin-top:2px" class="num">'+fmtDate(p.startDate)+'〜</div></div>';
      }).join("");
    }
    html += '</div></div>';
    html += '</div>';
    return html;
  }

  /* ============ 物件住所 ============ */
  // 物件住所区分 "same": the customer's address; "new": the separately entered 物件住所.
  function propertyAddressOf(p){
    if(p.addressMode==="new"){
      var text = (p.propertyPrefecture||"")+(p.propertyAddress||"");
      var postal = customerPostal({postalCode:p.propertyPostalCode});
      return {postal:postal, text:text, building:p.propertyBuilding||"", full:text+(p.propertyBuilding?" "+p.propertyBuilding:"")};
    }
    var t = (p.prefecture||"")+(p.address||"");
    return {postal:customerPostal({postalCode:p.postalCode, postalCode1:p.postalCode1, postalCode2:p.postalCode2}), text:t, building:p.building||"", full:t+(p.building?" "+p.building:"")};
  }

  /* ============ PROJECT LIST ============ */
  function renderProjectList(mode){
    if(!state.loaded.projects || !state.loaded.members) return skeleton();
    var f = mode==="sales" ? state.salesFilter : state.constFilter;
    var title = mode==="sales" ? "営業案件一覧" : "施工案件一覧";

    var filtered = state.projects.filter(function(p){
      if(f.name && (p.name||"").indexOf(f.name)===-1 && propertyAddressOf(p).full.indexOf(f.name)===-1 && (p.address||"").indexOf(f.name)===-1) return false;
      if(f.status.length && f.status.indexOf(p.status)===-1) return false;
      if(f.type!=="all" && p.type!==f.type) return false;
      if(f.store!=="all" && p.store!==f.store) return false;
      if(f.assignees.length){
        var names = normalizeAssignees(p.assignees).map(function(a){return a.name;});
        if(!names.some(function(n){return f.assignees.indexOf(n)!==-1;})) return false;
      }
      return true;
    }).sort(function(a,b){return (b.createdAt||"").localeCompare(a.createdAt||"");});

    var perPage = 6, totalPages = Math.max(1,Math.ceil(filtered.length/perPage));
    if(f.page>totalPages) f.page = totalPages;
    var pageItems = filtered.slice((f.page-1)*perPage, f.page*perPage);

    var counts = {}; STATUS_LIST.forEach(function(s){counts[s]=state.projects.filter(function(p){return p.status===s;}).length;});
    var totalAmount = filtered.reduce(function(s,p){return s+(hiddenFor(p,"p_amount")?0:(p.amount||0));},0);

    var html = '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">'+
      '<h1 class="pagetitle">'+title+'</h1>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
        '<button class="btn primary" data-newproject="'+mode+'">'+iPlus()+' 案件登録</button>'+
        csvToolbar("projects")+
      '</div></div><div style="height:14px"></div>';

    html += '<div class="card filter-card" data-filter-mode="'+mode+'">';
    html += '<div class="filter-line">'+
      '<div class="fitem" style="min-width:220px"><span>案件名・住所で検索</span><input type="text" id="flt-name" value="'+esc(f.name)+'" placeholder="案件名または住所"></div>'+
      '<div class="fitem"><span>案件種類</span><select id="flt-type"><option value="all">すべて</option>'+PROJECT_TYPES.map(function(t){return '<option value="'+esc(t)+'"'+(f.type===t?" selected":"")+'>'+esc(t)+'</option>';}).join("")+'</select></div>'+
      '<div class="fitem"><span>店舗</span><select id="flt-store"><option value="all">すべて</option>'+STORES.map(function(s){return '<option value="'+esc(s)+'"'+(f.store===s?" selected":"")+'>'+esc(s)+'</option>';}).join("")+'</select></div>'+
      '<button class="btn primary" id="flt-search">'+iSearch()+' 検索する</button>'+
    '</div>';
    html += '<div class="fitem"><span>案件の進捗</span><div class="checkgroup">'+STATUS_LIST.map(function(s){
      return '<label class="checkopt"><input type="checkbox" class="flt-status" value="'+esc(s)+'"'+(f.status.indexOf(s)!==-1?" checked":"")+'>'+esc(s)+'</label>';
    }).join("")+'</div></div>';
    html += '<div class="fitem"><span>担当者で絞り込み</span><div class="checkgroup">'+state.members.map(function(m){
      return '<span class="chip-toggle'+(f.assignees.indexOf(m.name)!==-1?" on":"")+'" data-assignee-chip="'+esc(m.name)+'">'+esc(m.name)+'</span>';
    }).join("")+'</div></div>';
    html += '</div>';

    html += '<div class="summary-line">'+
      '<span><b>'+filtered.length+'</b>件 / 全'+state.projects.length+'件</span>'+
      STATUS_LIST.slice(0,4).map(function(s){return '<span>'+s+' <b style="font-size:13px">'+counts[s]+'</b></span>';}).join("")+
      '<span>合計金額 <b class="num" style="font-size:14px">'+fmtYen(totalAmount)+'</b></span>'+
      '<span class="summary-pager">'+((f.page-1)*perPage+1)+'-'+Math.min(filtered.length,f.page*perPage)+' / '+filtered.length+'件</span>'+
    '</div>';

    if(pageItems.length===0){
      html += emptyState(iBriefcase,"該当する案件がありません","条件を変更するか、新規案件を登録してください");
    }else{
      html += '<div class="tablewrap"><table><thead><tr><th>案件名 / 物件住所</th><th>進捗</th><th>施工開始日</th><th>施工完了予定日</th><th>金額</th><th>作成日</th><th></th></tr></thead><tbody>';
      html += pageItems.map(function(p){
        var names = normalizeAssignees(p.assignees).map(function(a){return a.name;});
        return '<tr class="rowhover" data-row-id="'+esc(p.id)+'"><td>'+
            '<div class="cell-name"><a href="#" data-open-project="'+p.id+'">'+esc(p.name)+'</a></div>'+
            '<div class="cell-sub">'+(hiddenFor(p,"pr_addr")?"":esc(propertyAddressOf(p).full))+'</div>'+
            '<div class="tagrow">'+names.map(function(a){return '<span class="tag">'+esc(a)+'</span>';}).join("")+'</div>'+
          '</td>'+
          '<td>'+(hiddenFor(p,"p_status")?"—":'<span class="badge '+(STATUS_STYLE[p.status]||"line-gray")+'">'+esc(p.status)+'</span>')+'</td>'+
          '<td class="num">'+(hiddenFor(p,"p_period")?"—":fmtDate(p.startDate))+'</td>'+
          '<td class="num">'+(hiddenFor(p,"p_period")?"—":fmtDate(p.endDate))+'</td>'+
          '<td class="num">'+(hiddenFor(p,"p_amount")?"—":fmtYen(p.amount))+'</td>'+
          '<td class="num">'+fmtDate((p.createdAt||"").slice(0,10))+'</td>'+
          '<td style="white-space:nowrap"><button class="btn sm" data-edit-project="'+p.id+'">編集</button> <button class="iconbtn" data-del-project="'+p.id+'">'+iTrash()+'</button></td>'+
        '</tr>';
      }).join("");
      html += '</tbody></table></div>';
      html += renderPager(f.page, totalPages, mode);
    }
    return html;
  }

  function renderPager(page,total,mode){
    if(total<=1) return "";
    var html = '<div class="pager" data-pager-mode="'+mode+'">';
    for(var i=1;i<=total && i<=6;i++){
      html += '<button class="pagebtn'+(i===page?" active":"")+'" data-page="'+i+'">'+i+'</button>';
    }
    if(total>page) html += '<span class="pagelink" data-page="'+(page+1)+'">次のページへ</span>';
    html += '</div>';
    return html;
  }

  /* ============ PROJECT FORM (full page) ============ */
  function renderProjectForm(){
    if(!state.loaded.members || !state.loaded.customers) return skeleton();
    var p = state.editingProject || {};
    var isEdit = !!state.editingProject;
    secretCtx = secretSet(p);
    var assignees = normalizeAssignees(p.assignees);
    var internalPicked = assignees.filter(function(a){return a.kind==="internal";}).map(function(a){return a.name;});
    var externalPicked = assignees.filter(function(a){return a.kind==="external";}).map(function(a){return a.name;});
    var internalMembers = state.members.filter(function(m){return m.kind==="internal";});
    var externalMembers = state.members.filter(function(m){return m.kind==="external";});

    var html = crumb(state.returnTab==="sales"?"営業案件一覧に戻る":"施工案件一覧に戻る", state.returnTab);
    html += '<h1 class="pagetitle" style="margin-top:8px">'+(isEdit?"案件の編集":"案件の登録")+'</h1><div style="height:12px"></div>';
    html += '<div class="form-shell">';

    html += '<div class="form-section-title"><span>顧客情報</span><span class="lockhint">'+iLock()+' 「社外秘」にチェックした項目は社外に表示されません</span></div>';
    html += '<div class="form-card">';
    html += '<div style="padding:12px 20px;font-size:12px;color:var(--ink-faint);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px">'+
      '<span>顧客情報を入力、または顧客一覧から選択してください</span><button class="btn outline sm" id="pick-customer-btn">顧客一覧から選ぶ</button></div>';
    html += '<div style="padding:6px 20px 0">'+customerFormSectionsHtml(projectCustomerSrc(p), !isEdit, true)+'</div>';
    html += '</div>';

    html += '<div class="form-section-title"><span>案件メンバー</span></div>';

  /* ============ 郵便番号 → 住所 自動入力 ============ */
  // zipcloud (https://zipcloud.ibsnet.jp) returns the 都道府県/市区町村/町域 for
  // a 7-digit postal code. Try fetch first; if the browser blocks it (CORS /
  // CSP) fall back to JSONP. Never throws -- calls cb(result|null, err).
  function lookupPostal(zip, cb){
    var done = false;
    function finish(res, err){ if(done) return; done = true; cb(res, err); }
    function parse(j){
      if(j && j.results && j.results.length){ var r=j.results[0]; finish({prefecture:r.address1, address:(r.address2||"")+(r.address3||"")}); }
      else if(j && j.status===200) finish(null, "notfound");
      else finish(null, "error");
    }
    function jsonp(){
      var name = "__zipcb"+Date.now(), sc = document.createElement("script");
      var timer = setTimeout(function(){ cleanup(); finish(null, "error"); }, 8000);
      function cleanup(){ clearTimeout(timer); try{ delete window[name]; }catch(e){ window[name]=undefined; } if(sc.parentNode) sc.parentNode.removeChild(sc); }
      window[name] = function(j){ cleanup(); parse(j); };
      sc.onerror = function(){ cleanup(); finish(null, "error"); };
      sc.src = "https://zipcloud.ibsnet.jp/api/search?zipcode="+zip+"&callback="+name;
      document.head.appendChild(sc);
    }
    try{
      fetch("https://zipcloud.ibsnet.jp/api/search?zipcode="+zip).then(function(r){ return r.json(); }).then(parse).catch(jsonp);
    }catch(e){ jsonp(); }
  }
  // Wires postal input(s) to the 都道府県 select and 住所 input. With id2 it is
  // the 3+4 digit pair; with id2 === null it is one field ("020-0033").
  function bindPostalLookup(id1, id2, prefId, addrId){
    var e1 = document.getElementById(id1), e2 = id2 ? document.getElementById(id2) : null;
    var pref = document.getElementById(prefId), addr = document.getElementById(addrId);
    if(!e1 || (id2 && !e2) || !pref || !addr) return;
    var seq = 0;
    // A typed address is never overwritten; one we filled in ourselves may be refreshed.
    addr.addEventListener("input", function(){ addr.removeAttribute("data-auto"); });
    function toHalf(v){ return String(v).replace(/[０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0xFEE0); }).replace(/[^0-9]/g, ""); }
    function digits(){ return e2 ? toHalf(e1.value)+toHalf(e2.value) : toHalf(e1.value); }
    function run(){
      var z = digits();
      if(z.length!==7 || (e2 && (toHalf(e1.value).length!==3 || toHalf(e2.value).length!==4))) return;
      var my = ++seq;
      lookupPostal(z, function(res, err){
        if(my!==seq) return;
        if(!res){ toast(err==="notfound" ? "該当する住所が見つかりませんでした" : "住所を取得できませんでした。手入力してください"); return; }
        if(Array.prototype.some.call(pref.options, function(o){ return o.value===res.prefecture; })) pref.value = res.prefecture;
        if(!addr.value.trim() || addr.getAttribute("data-auto")==="1"){ addr.value = res.address; addr.setAttribute("data-auto","1"); }
        toast("郵便番号から住所を入力しました");
      });
    }
    if(!e2){
      e1.addEventListener("input", function(){
        var d = toHalf(e1.value).slice(0,7);
        e1.value = d.length>3 ? d.slice(0,3)+"-"+d.slice(3) : d;
        run();
      });
      return;
    }
    e1.addEventListener("input", function(){
      var d = toHalf(e1.value);
      if(d.length>3){ e2.value = d.slice(3,7); d = d.slice(0,3); }   // pasted "0200866" / "020-0866"
      e1.value = d;
      if(d.length===3 && toHalf(e2.value)==="") e2.focus();
      run();
    });
    e2.addEventListener("input", function(){ e2.value = toHalf(e2.value).slice(0,4); run(); });
  }

  // Finds the customer by name or creates it. An existing customer is only
  // topped up with the non-empty values entered on the 案件 form.
  function ensureCustomer(cdata, cb){
    var existing = state.customers.find(function(c){return c.name===cdata.name;});
    if(existing){
      var patch = {};
      Object.keys(cdata).forEach(function(k){ if(k!=="name" && cdata[k]!=="" && cdata[k]!==existing[k]) patch[k] = cdata[k]; });
      if(!Object.keys(patch).length){ cb(existing.id); return; }
      saveRaw("customers", existing.id, patch).then(function(){ cb(existing.id); }, function(){ cb(existing.id); });
      return;
    }
    var rec = Object.assign({}, cdata, {registeredDate:todayISO()});
    if(!db){ rec.id = uid(); state.customers.unshift(rec); cb(rec.id); return; }
    db.collection("customers").add(Object.assign({createdAt:new Date().toISOString()}, rec))
      .then(function(ref){ cb(ref.id); }).catch(function(){ cb(""); });
  }

  function bindMemberFormEvents(){
    var editing = state.editingMember;
    var picked = editing ? (editing.roles||[]).slice() : [];
    var c = document.getElementById("content");
    var submit = document.getElementById("f-submit");
    function refreshEnabled(){
      var ok = document.getElementById("f-mphone").value.trim() && document.getElementById("f-mname").value.trim() && document.getElementById("f-mpassword").value.trim() && picked.length>0;
      submit.disabled = !ok;
    }
    ["f-mphone","f-mname","f-mpassword"].forEach(function(id){ var el=document.getElementById(id); if(el) el.addEventListener("input", refreshEnabled); });
    bindPwToggle("f-mpassword-toggle", "f-mpassword");
    var rolesWrap = document.getElementById("f-mroles");
    if(rolesWrap) rolesWrap.querySelectorAll(".chip-toggle").forEach(function(chip){
      chip.addEventListener("click", function(){
        var r = chip.getAttribute("data-role-pick"); var idx = picked.indexOf(r);
        if(idx===-1){picked.push(r);chip.classList.add("on");} else {picked.splice(idx,1);chip.classList.remove("on");}
        refreshEnabled();
      });
    });
    if(submit) submit.addEventListener("click", function(){
      var name = document.getElementById("f-mname").value.trim();
      var phone = document.getElementById("f-mphone").value.trim();
      var password = document.getElementById("f-mpassword").value.trim();
      if(!name||!phone||!password||picked.length===0){ toast("携帯番号・氏名・職種・パスワードは必須です"); return; }
      var store = document.getElementById("f-mstore").value;
      var perm = document.getElementById("f-mpermission").value;
      var data = Object.assign({
        name:name, phone:phone, kana:document.getElementById("f-mkana").value.trim(),
        email:document.getElementById("f-memail").value.trim(),
        company: editing ? document.getElementById("f-mcompany").value.trim() : state.orgSettings.companyName,
        store: store==="未選択"?"":store, roles:picked, password:password
      }, permissionFields(perm));
      if(!editing){
        writeDoc("members", null, data, "メンバーを登録しました", function(){ setTab("members"); });
        return;
      }
      // Never let the last remaining admin be demoted.
      var adminCount = state.members.filter(function(x){ return memberPermission(x)==="admin"; }).length;
      if(memberPermission(editing)==="admin" && perm!=="admin" && adminCount<=1){ toast("最後の管理者の権限は変更できません"); return; }
      var oldName = editing.name, id = editing.id;
      writeDoc("members", id, data, "メンバー情報を更新しました", function(){
        if(oldName!==name){ renameInProjects(oldName, name); if(state.myName===oldName){ state.myName=name; try{ localStorage.setItem("gc_myname", name); if(localStorage.getItem("gc_login_name")!==null) localStorage.setItem("gc_login_name", name); }catch(e){} } }
        if(state.myName===name) state.isAdmin = perm==="admin";
        state.editingMember = null;
        setTab("members");
      });
    });
  }

  // Projects reference assignees by name, so when a member is renamed the
  // same name is updated in every project's assignee list.
  function renameInProjects(oldName, newName){
    state.projects.forEach(function(p){
      var list = normalizeAssignees(p.assignees);
      if(!list.some(function(a){ return a.name===oldName; })) return;
      var updated = list.map(function(a){ return a.name===oldName ? Object.assign({}, a, {name:newName}) : a; });
      if(db) db.collection("projects").doc(p.id).update({assignees:updated}).catch(function(){});
      else p.assignees = updated;
    });
  }

  /* ============ MEMBERS ============ */
  // Unified 3-tier permission: "admin" (管理者), "general" (一般), "external"
  // (外部). Older records only have isAdmin/kind, so this derives the tier
  // from whichever fields are present without needing a one-time migration.
  var PERMISSION_LEVELS = [["admin","管理者"],["general","一般"],["external","外部"]];
  function memberPermission(m){
    if(m.permission) return m.permission;
    if(m.isAdmin) return "admin";
    if(m.kind==="external") return "external";
    return "general";
  }
  function permissionLabel(p){ var f=PERMISSION_LEVELS.find(function(x){return x[0]===p;}); return f?f[1]:p; }
  function permissionFields(p){
    // Keeps the legacy kind/isAdmin fields in sync with the new permission
    // field, so existing code that reads m.kind / m.isAdmin still works.
    return { permission:p, isAdmin: p==="admin", kind: p==="external"?"external":"internal" };
  }

  function fmtSize(n){
    n = n||0;

  }

  /* ============ 案件別ファイル管理ページ ============ */

      '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="badge '+(STATUS_STYLE[p.status]||"line-gray")+'">'+esc(p.status)+'</span>'+
      '<label class="btn primary" style="cursor:pointer">'+iPlus()+' 写真・ファイルを追加<input type="file" id="pf-input" multiple style="display:none"></label></div></div>';

    var chip = function(key,label,n){ return '<button type="button" class="chip-toggle'+(fid===key?' on':'')+'" data-pf-folder="'+esc(key)+'">'+iFolder()+' '+esc(label)+' <span style="opacity:.7">'+n+'</span></button>'; };
    var curFolder = folders.find(function(x){return x.id===fid;});
    html += '<div class="card" style="padding:12px 14px;margin-bottom:12px"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+
      chip("all","すべて",all.length)+chip("none","未分類",cntNone)+
      folders.map(function(g){ return chip(g.id,g.name,all.filter(function(x){return x.folderId===g.id;}).length); }).join("")+
      '<button type="button" class="btn" id="pf-newfolder">'+iPlus()+' フォルダ追加</button>'+
      (curFolder ? '<button type="button" class="btn" id="pf-renfolder">'+iEdit()+' 名前変更</button><button type="button" class="btn" id="pf-delfolder" style="color:var(--danger)">'+iTrash()+' フォルダ削除</button>' : '')+
      '</div>'+(curFolder?'<div class="cell-sub" style="margin-top:8px">追加したファイルは「'+esc(curFolder.name)+'」に保存されます</div>':'')+'</div>';
    html += '<div class="card filter-card"><div class="filter-line"><div class="fitem"><span>種類</span><select id="pf-kind">'+
      '<option value="all"'+(kind==="all"?" selected":"")+'>すべて</option>'+
      '<option value="image"'+(kind==="image"?" selected":"")+'>写真</option>'+
      '<option value="other"'+(kind==="other"?" selected":"")+'>その他ファイル</option></select></div></div></div>';
    html += '<div class="summary-line"><span><b>'+list.length+'</b>件 / 全'+all.length+'件</span><span>写真 <b style="font-size:13px">'+imgs+'</b></span><span>その他 <b style="font-size:13px">'+(all.length-imgs)+'</b></span></div>';
    if(list.length===0){
      html += emptyState(iImage,"写真・ファイルがありません", fid==="all" ? "右上の「写真・ファイルを追加」から登録できます" : "このフォルダにはファイルがありません。右上の「写真・ファイルを追加」または他フォルダから移動できます");
    }else{
      html += '<div class="photo-grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px">'+list.map(function(f){
        return '<div>'+fileThumb(f, true)+'<div class="cell-sub" style="word-break:break-all;margin-top:5px;color:var(--ink)">'+esc(f.filename||"ファイル")+'</div>'+
          '<div class="cell-sub" style="margin-top:0">'+esc(fmtDateTime(f.uploadedAt))+(f.uploadedBy?" ・ "+esc(f.uploadedBy):"")+(f.size?" ・ "+fmtSize(f.size):"")+'</div>'+
          '<select class="pf-move" data-move-file="'+esc(f.id)+'" style="margin-top:5px;width:100%;font-size:11.5px;padding:3px 4px" title="フォルダへ移動">'+
          '<option value="">📁 未分類</option>'+folders.map(function(g){ return '<option value="'+esc(g.id)+'"'+(f.folderId===g.id?' selected':'')+'>📁 '+esc(g.name)+'</option>'; }).join("")+'</select></div>';
      }).join("")+'</div>';

  function uploadProjectFile(projectId, file, folderId){
    if(!assetsCap){ toast("この環境ではファイルアップロードを利用できません"); return; }
    var p = state.projects.find(function(x){return x.id===projectId;});
    toast("アップロード中…");
    assetsCap.upload(file).then(function(res){
      writeDoc("files", null, {
        projectId: projectId,
        projectName: p?p.name:"",
        folderId: folderId||null,
        assetId: res.id,
        url: res.url||null,
        filename: file.name||"ファイル",
        contentType: file.type||"",
        size: file.size||0,
        uploadedAt: new Date().toISOString(),
        uploadedBy: state.myName||""
      }, "写真・ファイルを追加しました");
    }).catch(function(e){ toast("アップロードに失敗しました"); });
  }

  /* ============ CHAT ============ */
  function renderChat(){
    if(!state.loaded.chats) return skeleton();
    if(!state.activeChat && state.chats.length) state.activeChat = state.chats[0].id;
    var chat = state.chats.find(function(c){return c.id===state.activeChat;});
    var html = '<div class="chat-shell">';
    html += '<div class="chat-list"><div class="chat-list-head"><h2 style="font-size:14.5px">チャット</h2><button class="btn sm outline" data-open="chat-form">'+iPlus()+' 新規</button></div>';
    if(state.chats.length===0){ html += '<div class="empty">チャットがありません</div>'; }
    else{
      html += state.chats.slice().sort(function(a,b){return (b.updatedAt||"").localeCompare(a.updatedAt||"");}).map(function(c){
        return '<div class="chat-item'+(c.id===state.activeChat?" active":"")+'" data-select-chat="'+c.id+'">'+
          '<div class="chat-ava">'+(c.kind==="group"?iUsers():iDoc())+'</div>'+
          '<div><div class="chat-item-name">'+esc(c.name)+'</div><div class="chat-item-meta">'+(c.kind==="group"?"グループ":"案件")+'</div></div>'+
        '</div>';
      }).join("");
    }
    html += '</div>';
    html += '<div class="chat-pane">';
    if(!chat){
      html += '<div class="chat-empty">左のリストからチャットを選択してください</div>';
    }else{
      html += '<div class="chat-pane-head">'+esc(chat.name)+'</div>';
      html += '<div class="chat-msgs" id="chat-msgs">';
      var msgs = state.chatMsgs[chat.id] || [];
      if(msgs.length===0){ html += '<div style="color:var(--ink-faint);font-size:12px;text-align:center;margin-top:20px">まだメッセージはありません</div>'; }
      else{
        html += msgs.map(function(m){
          var mine = state.myName && m.author===state.myName;
          return '<div class="msg'+(mine?" me":"")+'"><div class="ma">'+esc(m.author)+'</div>'+esc(m.text)+'</div>';
        }).join("");
      }
      html += '</div>';
      html += '<div class="chat-input-row"><input type="text" id="chat-input" placeholder="メッセージを入力…"><button class="btn primary" id="chat-send">'+iSend()+' 送信</button></div>';
    }
    html += '</div></div>';
    if(chat && !state.chatMsgs[chat.id]) loadChatMsgs(chat.id);
    return html;
  }

  function loadChatMsgs(chatId){
    if(!db){ state.chatMsgs[chatId] = SAMPLE_MSGS[chatId] || []; render(); return; }
    db.collection("chats").doc(chatId).collection("messages").orderBy("ts").limit(200).onSnapshot(function(snap){
      state.chatMsgs[chatId] = snap.docs.map(toObj);
      if(state.activeChat===chatId) render();
    }, function(){});
  }
  function scrollChatToBottom(){
    var el = document.getElementById("chat-msgs");
    if(el) el.scrollTop = el.scrollHeight;
  }
  function ensureProjectChat(project, cb){
    var existing = state.chats.find(function(c){return c.projectId===project.id;});
    if(existing){ cb(existing.id); return; }
    var data = {name:project.name, kind:"project", projectId:project.id, updatedAt:new Date().toISOString()};
    if(!db){ data.id=uid(); state.chats.unshift(data); cb(data.id); return; }
    db.collection("chats").add(data).then(function(ref){ cb(ref.id); }).catch(function(){ toast("チャットの作成に失敗しました"); });
  }

  function confirmDelete(msg,onYes){
    openModal("削除の確認",
      '<div style="font-size:13px;line-height:1.6">'+esc(msg)+'</div>'+
      '<label class="field">削除用パスワードを入力してください<input type="password" id="f-del-pw" autocomplete="off" placeholder="削除用パスワード"></label>',
      '<button class="btn" data-close-modal>キャンセル</button><button class="btn primary" style="background:var(--danger);border-color:var(--danger)" id="f-confirm">削除する</button>');

    var run = function(){
      var typed = pw.value;
      btn.disabled = true;
      // re-read so a password changed by another admin takes effect immediately
      loadDeletePassword(function(current){
        btn.disabled = false;
        if(!typed || typed!==current){ toast("削除用パスワードが正しくありません"); pw.value=""; pw.focus(); return; }

  /* ============ db writes ============ */
  function writeDoc(col,id,data,msg,after){
    if(!state.canWrite){ toast("この操作を行う権限がありません"); return; }
    if(col==="members" && !state.isAdmin){
      // Non-admins may only edit their OWN contact fields / password
      // (個人情報) -- never name, company, store, roles or permission.
      var me = myMember();
      var selfOk = !!(id && me && me.id===id && Object.keys(data).every(function(k){ return ["name","kana","phone","email","company","store","password"].indexOf(k)!==-1; }));
      if(!selfOk){ toast("メンバーの変更は管理者のみ行えます"); return; }
    }
    data.updatedAt = new Date().toISOString();
    if(!db){
      var arr = state[col];
      if(id){ var idx=arr.findIndex(function(x){return x.id===id;}); if(idx>-1) arr[idx]=Object.assign({},arr[idx],data); }
      else { data.id=uid(); data.createdAt=new Date().toISOString(); arr.unshift(data); }
      closeModal(); toast(msg+"（プレビューのみ）"); render(); if(after) after(id||data.id); return;
    }
    var p = id ? db.collection(col).doc(id).update(data) : db.collection(col).add(Object.assign({createdAt:new Date().toISOString()},data));
    p.then(function(ref){ closeModal(); toast(msg); if(after) after(id||(ref&&ref.id)); }).catch(function(e){ toast("保存に失敗しました"); });
  }
  function deleteDoc(col,id,msg,after){
    if(!state.canWrite){ toast("この操作を行う権限がありません"); return; }
    if(col==="members" && !state.isAdmin){ toast("メンバーの削除は管理者のみ行えます"); return; }
    if(!db){ state[col]=state[col].filter(function(x){return x.id!==id;}); toast(msg+"（プレビューのみ）"); render(); if(after) after(); return; }
    db.collection(col).doc(id).delete().then(function(){toast(msg); if(after) after();}).catch(function(){toast("削除に失敗しました");});
  }

  /* ============ CSV 入力・出力 / 一括編集 (all list screens) ============ */
  // One generic mechanism shared by every list screen: 営業/施工案件, 顧客,
  // メンバー, ホーム(タスク) and 写真・ファイル. Each entity below declares its
  // CSV columns; export, import (upsert by ID) and bulk edit/delete are all
  // driven from that declaration.
  var CSV_LIST_SEP = /[、,，;；]+/;

  function csvNormDate(s){
    var m = /^(\d{4})[-\/.年](\d{1,2})[-\/.月](\d{1,2})日?$/.exec(String(s).trim());
    if(!m) return null;
    var y=+m[1], mo=+m[2], d=+m[3], dt=new Date(y,mo-1,d);
    if(dt.getFullYear()!==y || dt.getMonth()!==mo-1 || dt.getDate()!==d) return null;
    return y+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0");
  }
  function csvSpaceless(s){ return String(s||"").replace(/[\s　]+/g,""); }
  function csvResolveMemberName(raw){
    var key = csvSpaceless(raw);
    var m = state.members.find(function(x){ return csvSpaceless(x.name)===key; });
    return m ? m.name : null;
  }
  // Keep each assignee's existing 確認 status; new ones start 未確認.
  function csvBuildAssignees(names, existing){
    var old = normalizeAssignees(existing||[]);
    return names.map(function(n){
      var o = old.find(function(a){ return a.name===n; });
      if(o) return o;
      var m = memberByName(n);
      return {name:n, kind:m?m.kind:"internal", status:"未確認"};
    });
  }

      finalize:function(patch, existing){
