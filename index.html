        var type = colVal(r,"type"), ptype = colVal(r,"propertyType");
        if(type && PROJECT_TYPES.indexOf(type)===-1){ if(addTypes) newTypes[type] = 1; else type = "その他"; }
        if(ptype && PROPERTY_TYPES.indexOf(ptype)===-1){ if(addTypes) newProps[ptype] = 1; else ptype = "その他"; }
        var d = {name:name, customerName:colVal(r,"customerName"), type:type,
          startDate:extIsoDate(colVal(r,"startDate")), endDate:extIsoDate(colVal(r,"endDate")), status:extStatus(colVal(r,"status"), dflt),
          amount:parseInt(String(colVal(r,"amount")).normalize("NFKC").replace(/[^0-9]/g,"")||"0",10), workInstruction:colVal(r,"memo")};
        if(!d.type) d.type = "その他";
        if(ptype) d.propertyType = ptype;
        if(colVal(r,"addrKind").indexOf("新しい")!==-1){ d.addressMode = "new"; d.propertyPrefecture = pref; d.propertyAddress = addr; d.propertyPostalCode = z; }
        else { d.addressMode = "same"; d.prefecture = pref; d.address = addr; d.postalCode = z; }
        if(useAsg){
          var seen = {}, as = [];
          asgCols.forEach(function(ci){
            var n = String(r[ci]||"").trim(); if(!n) return;
            var m = byKey[memberKey(n)];
            if(!m){ unknownAsg[n] = (unknownAsg[n]||0)+1; return; }
            if(seen[m.name]) return; seen[m.name] = 1;
            as.push({name:m.name, kind:m.kind||"internal", status:"確認済"});
          });
          d.assignees = as; if(as.length) assigned++;
        }
        out.push(d);
      });
      return {list:out, dup:dup, newTypes:Object.keys(newTypes), newProps:Object.keys(newProps), unknownAsg:unknownAsg, assigned:assigned};
    };
    var preview = function(){
      var b = build(), pv = document.getElementById("ext-preview");
      var unk = Object.keys(b.unknownAsg);
      pv.innerHTML = '<div style="margin-bottom:6px">取り込める案件 <b>'+b.list.length+'</b>件'+(b.dup?'　<span style="color:var(--ink-faint)">（登録済み・重複の '+b.dup+'件は除外）</span>':'')+(skippedRows?'　<span style="color:var(--danger)">（列数が合わず読めない行 '+skippedRows+'件）</span>':'')+'</div>'+
        (b.newTypes.length||b.newProps.length ? '<div style="font-size:11.5px;color:var(--ink-faint);margin-bottom:4px">選択肢に追加される値：'+esc(b.newTypes.concat(b.newProps).join("、"))+'</div>' : '')+
        (asgCols.length ? '<div style="font-size:11.5px;color:var(--ink-faint);margin-bottom:4px">担当者あり '+b.assigned+'件'+(unk.length?'　／メンバーに見つからない名前（取り込みません）：'+esc(unk.slice(0,6).join("、"))+(unk.length>6?"…":""):'')+'</div>' : '')+
        '<div style="max-height:160px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:11.5px;color:var(--ink-soft)">'+b.list.slice(0,8).map(function(x){ return '<div>'+esc(x.name)+'　'+esc([x.customerName,(x.prefecture||x.propertyPrefecture||"")+(x.address||x.propertyAddress||""),x.startDate&&(x.startDate+"〜"+x.endDate),x.type,x.status].filter(Boolean).join(" / "))+'</div>'; }).join("")+(b.list.length>8?'<div>…ほか '+(b.list.length-8)+'件</div>':'')+'</div>';
      run.disabled = b.list.length===0;
    };
    var loadRows = function(all){
      all = all.filter(function(r){ return r.some(function(x){ return String(x).trim(); }); });
      if(all.length<2){ body.textContent = "データ行がありません（1行目に見出し、2行目以降にデータが必要です）"; return; }
      head = all[0].map(function(x){ return String(x).trim(); });
      rows = all.slice(1).filter(function(r){ return r.length<=head.length; });
      skippedRows = all.length-1-rows.length;
      asgCols = []; head.forEach(function(h,i){ if(/担当/.test(h)) asgCols.push(i); });
      var used = {};
      var guess = function(f){
        var pick = function(match){ for(var k=0;k<f[3].length;k++){ for(var i=0;i<head.length;i++){ if(!used[i] && match(head[i].toLowerCase(), f[3][k].toLowerCase())) return i; } } return -1; };
        var r = pick(function(h,w){ return h===w; });
        if(r<0) r = pick(function(h,w){ return h.indexOf(w)!==-1; });
        if(r>=0) used[r] = 1;
        return r;
      };
      var guessed = {}; EXT_FIELDS.forEach(function(f){ guessed[f[0]] = guess(f); });
      var opts = function(sel){ return '<option value="-1">（取り込まない）</option>'+head.map(function(h,i){ return '<option value="'+i+'"'+(i===sel?" selected":"")+'>'+esc(h||("列"+(i+1)))+'</option>'; }).join(""); };
      body.innerHTML = '<div style="font-size:12px;color:var(--ink-faint);margin-bottom:6px">'+rows.length+'行を読み込みました。元の列を、このアプリの項目に対応付けてください。</div>'+
        '<div style="display:grid;grid-template-columns:150px 1fr;gap:6px 10px;align-items:center;font-size:12.5px">'+EXT_FIELDS.map(function(f){ return '<span>'+esc(f[1])+(f[2]?' <span class="req">必須</span>':'')+'</span><select id="ext-map-'+f[0]+'">'+opts(guessed[f[0]])+'</select>'; }).join("")+
        '<span>状態が不明なとき</span><select id="ext-dflt">'+STATUS_LIST.map(function(x){ return '<option'+(x==="施工中"?" selected":"")+'>'+esc(x)+'</option>'; }).join("")+'</select></div>'+
        '<label style="display:flex;gap:8px;margin-top:10px;font-size:12.5px;cursor:pointer"><input type="checkbox" id="ext-addtypes" checked><span>案件種類・物件種類で、リストにない値は選択肢に追加する（外すと「その他」にします）</span></label>'+
        (asgCols.length?'<label style="display:flex;gap:8px;margin-top:6px;font-size:12.5px;cursor:pointer"><input type="checkbox" id="ext-useasg" checked><span>担当者も取り込む（'+esc(asgCols.map(function(c){ return head[c]; }).join("・"))+'。メンバーの名前と一致する人だけ）</span></label>':'')+
        '<div id="ext-preview" style="margin-top:12px"></div>';
      body.querySelectorAll("select,input[type=checkbox]").forEach(function(sl){ sl.addEventListener("change", preview); });
      preview();
    };
    document.getElementById("ext-file").addEventListener("change", function(ev){
      var file = ev.target.files && ev.target.files[0]; if(!file) return;
      var fr = new FileReader();
      fr.onload = function(){ var all; try{ all = parseCsv(csvDecode(fr.result)); }catch(e){ body.textContent = "CSVの解析に失敗しました"; return; } loadRows(all); };
      fr.readAsArrayBuffer(file);
    });
    // 画面の表をコピーして貼り付け（Excel・Webの表はタブ区切りになる）
    document.getElementById("ext-paste").addEventListener("input", function(ev){
      var t = ev.target.value; if(!t.trim()) return;
      var all = t.indexOf("\t")!==-1 ? t.replace(/\r/g,"").split("\n").map(function(l){ return l.split("\t"); }) : parseCsv(t);
      loadRows(all);
    });
    run.onclick = function(){
      var b = build(); if(!b.list.length) return;
      run.disabled = true;
      // リストにない種類は選択肢（マスタ）に追加
      if(b.newTypes.length || b.newProps.length){
        b.newTypes.forEach(function(x){ if(PROJECT_TYPES.indexOf(x)===-1) PROJECT_TYPES.push(x); });
        b.newProps.forEach(function(x){ if(PROPERTY_TYPES.indexOf(x)===-1) PROPERTY_TYPES.push(x); });
        saveMaster("projectTypes", PROJECT_TYPES.slice(), "選択肢に追加しました");
      }
      // 顧客は同じ名前があれば紐づけ、なければ作成してから案件を登録する
      var names = {}; b.list.forEach(function(x){ if(x.customerName) names[x.customerName] = ""; });
      var ids = {}, queue = Object.keys(names);
      var nextCust = function(){
        if(!queue.length) return Promise.resolve();
        var n = queue.shift();
        return new Promise(function(res){ ensureCustomer({name:n}, function(id){ ids[n] = id; res(); }); }).then(nextCust);
      };
      var pos = 0, ok = 0, fail = 0, CH = 40;
      var nextChunk = function(){
        if(pos>=b.list.length) return Promise.resolve();
        var part = b.list.slice(pos, pos+CH); pos += CH;
        return Promise.all(part.map(function(x){
          return saveRaw("projects", null, Object.assign({}, x, {customerId:ids[x.customerName]||""})).then(function(){ ok++; }, function(){ fail++; });
        })).then(function(){ toast("取り込み中… "+Math.min(pos,b.list.length)+" / "+b.list.length); }).then(nextChunk);
      };
      toast("取り込みを始めます（"+b.list.length+"件）。完了まで画面を閉じないでください");
      nextCust().then(nextChunk).then(function(){ closeModal(); toast(ok+"件を取り込みました"+(fail?"（"+fail+"件は失敗）":"")); render(); });
    };
  }

    return state.members.some(function(m){

  function bulkApply(){
    var entity = state.bulk.entity, E = CSV_ENTITIES[entity];
    if(!csvCanWrite(entity)) return;
    var ids = bulkSelectedIds();
    if(!ids.length){ toast("変更する行を選択してください"); return; }
    var col = E.columns.find(function(c){ return c.key===state.bulk.field; });
    if(!col) return;
    if(bulkIsMulti(col)){
      var picked = state.bulk.picked||[], mode = state.bulk.mode||"add";
      if(!picked.length && mode!=="replace"){ toast(col.label+"を選んでください"); return; }
      var modeLabel = (BULK_MODES.find(function(m){ return m[0]===mode; })||[])[1];
      openModal("一括編集の確認",
        '<div style="font-size:13px;line-height:1.7">選択した <b>'+ids.length+'</b> 件の「'+esc(col.label)+'」に<br><b>'+esc(picked.join("、")||"（なし）")+'</b><br>を「'+esc(modeLabel)+'」で変更します。よろしいですか？</div>',
        '<button class="btn" data-close-modal>キャンセル</button><button class="btn primary" id="bulk-apply-ok">変更する</button>');
      document.getElementById("bulk-apply-ok").onclick = function(){
        document.getElementById("bulk-apply-ok").disabled = true;
        var list = E.all();
        var jobs = ids.map(function(id){
          var existing = list.find(function(x){ return x.id===id; }) || {};
          var patch = {}; patch[col.key] = bulkApplyChecks(bulkCurrent(col, existing), picked, mode);
          return saveRaw(E.col, id, E.finalize(patch, existing));
        });
        state.bulk.selected = {};
        runBatch(jobs, "変更");
      };
      return;
    }
    var raw = (document.getElementById("bulk-value")||{}).value || "";
    var res = parseCell(col, raw, null), value;
    if(res.error){ toast(res.error); return; }
    if(res.empty){
      if(col.options && col.type!=="list" || col.type==="number" || col.type==="bool" || col.type==="perm"){ toast("変更後の値を入力してください"); return; }
      value = (col.type==="names"||col.type==="list") ? [] : "";
    }else value = res.value;
    if(col.key==="customerName" && value && !state.customers.some(function(x){ return x.name===value; })){ toast("登録されている顧客を候補から選んでください"); return; }
    var shown = Array.isArray(value) ? (value.join("、")||"（なし）") : (col.type==="perm" ? permissionLabel(value) : (col.type==="bool" ? (value?"はい":"いいえ") : (value===""?"（空欄）":String(value))));
    if(entity==="members" && col.key==="permission"){
      var ch = {}; ids.forEach(function(id){ ch[id] = value; });
      if(!adminsRemainAfter(ch)){ toast("管理者が1人もいなくなるため変更できません"); return; }
    }
    openModal("一括編集の確認",
      '<div style="font-size:13px;line-height:1.7">選択した <b>'+ids.length+'</b> 件の「'+esc(col.label)+'」を<br><b>'+esc(shown)+'</b><br>に変更します。よろしいですか？</div>',
      '<button class="btn" data-close-modal>キャンセル</button><button class="btn primary" id="bulk-apply-ok">変更する</button>');
    document.getElementById("bulk-apply-ok").onclick = function(){
      document.getElementById("bulk-apply-ok").disabled = true;
      var list = E.all();
      var jobs = ids.map(function(id){
        var existing = list.find(function(x){ return x.id===id; });
        var patch = {}; patch[col.key] = value;
        return saveRaw(E.col, id, E.finalize(patch, existing));
      });
      state.bulk.selected = {};
      runBatch(jobs, "変更");
    };
  }

      '<button class="btn" data-close-modal>キャンセル</button><button class="btn primary" id="bm-ok">選択した'+ids.length+'件に適用</button>');

    box.querySelectorAll("[data-bm-cust]").forEach(function(inp){ attachCustomerSuggest(inp, function(cu){ inp.value = cu.name; }); });
    box.querySelectorAll("[data-bm-on]").forEach(function(chk){ chk.addEventListener("change", function(){ box.querySelector('[data-bm-ctl="'+chk.getAttribute("data-bm-on")+'"]').style.opacity = chk.checked ? 1 : .45; }); });
    document.getElementById("bm-ok").onclick = function(){
      var plan = [];
      for(var i=0;i<cols.length;i++){
        var on = box.querySelector('[data-bm-on="'+i+'"]');
        if(!on || !on.checked) continue;
        var c = cols[i];
        if(bulkIsMulti(c)){
          var picked = Array.prototype.slice.call(box.querySelectorAll('[data-bm-name="'+i+'"]:checked')).map(function(x){ return x.value; });
          var mode = document.getElementById("bm-mode-"+i).value;
          if(!picked.length && mode!=="replace"){ toast("「"+c.label+"」の対象者を選んでください"); return; }
          plan.push({col:c, names:picked, mode:mode});
        }else{
          var raw = document.getElementById("bm-val-"+i).value, res = parseCell(c, raw, null);
          if(c.key==="customerName" && raw.trim() && !state.customers.some(function(x){ return x.name===raw.trim(); })){ toast("登録されている顧客を候補から選んでください"); return; }
          if(res.error){ toast(res.error); return; }
          if(res.empty && (c.options && c.type!=="list" || c.type==="number")){ toast("「"+c.label+"」の値を入力してください"); return; }
          plan.push({col:c, value: res.empty ? (c.type==="list"?[]:"") : res.value});
        }
      }
      if(!plan.length){ toast("変更する項目にチェックを入れてください"); return; }
      document.getElementById("bm-ok").disabled = true;
      var list = E.all();
      var jobs = ids.map(function(id){
        var existing = list.find(function(x){ return x.id===id; }) || {};
        var patch = {};
        plan.forEach(function(p){
          if(p.names){
            patch[p.col.key] = bulkApplyChecks(bulkCurrent(p.col, existing), p.names, p.mode);
          }else patch[p.col.key] = p.value;
        });
        return saveRaw(E.col, id, E.finalize(patch, existing));
      });
      state.bulk.selected = {};
      runBatch(jobs, "変更");
    };
  }

  /* ============ events ============ */

  // ---- 物件の地図（ピン付き）。住所から自動で位置を探し、特定できない・ずれている場合はピンを動かして保存できる ----
  var __leafletP = null;
  function loadLeaflet(){
    if(window.L) return Promise.resolve();
    if(__leafletP) return __leafletP;
    __leafletP = new Promise(function(res, rej){
      var l = document.createElement("link"); l.rel="stylesheet"; l.href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"; document.head.appendChild(l);
      var sc = document.createElement("script"); sc.src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
      sc.onload=function(){ window.L ? res() : rej(); }; sc.onerror=function(){ __leafletP=null; rej(); };
      document.head.appendChild(sc);
      setTimeout(function(){ if(!window.L) rej(); }, 8000);
    });
    return __leafletP;
  }
  var __geoCache = {};
  function geocodeJp(q){
    if(__geoCache[q]) return Promise.resolve(__geoCache[q]);
    return fetch("https://msearch.gsi.go.jp/address-search/AddressSearch?q="+encodeURIComponent(q))
      .then(function(r){ return r.json(); })
      .then(function(a){
        if(!a || !a.length) return null;
        var c = a[0].geometry.coordinates; var o = {lat:c[1], lng:c[0], title:(a[0].properties||{}).title||""};
        __geoCache[q]=o; return o;
      });
  }
  function initPropMap(box){
    var p = state.projects.find(function(x){ return x.id===box.getAttribute("data-pid"); });
    if(!p) return;
    var pa = propertyAddressOf(p); if(!pa.text) return;
    var canMove = !isExternalViewer();
    var gFrame = function(q){
      return '<iframe title="物件の地図" loading="lazy" referrerpolicy="no-referrer-when-downgrade" style="display:block;width:100%;height:260px;border:0" src="https://www.google.com/maps?q='+q+'&z=17&hl=ja&output=embed"></iframe>';
    };
    // Googleマップにもピンを出すため、位置（保存済み→住所から検索した座標）を緯度経度で渡す。見つからなければ住所で表示。
    var parseLatLng = function(t){
      t = String(t||"").trim();
      var m = t.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || t.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || t.match(/[?&](?:q|query|ll|destination)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/) || t.match(/^(-?\d+\.\d+)\s*[,，\s]\s*(-?\d+\.\d+)$/);
      if(!m) return null;
      var la = parseFloat(m[1]), ln = parseFloat(m[2]);
      return (la>=20&&la<=46&&ln>=122&&ln<=154) ? {lat:Math.round(la*1e6)/1e6, lng:Math.round(ln*1e6)/1e6} : null;
    };
    var googleCtl = function(){
      var ctl = document.getElementById("propmap-ctl"); if(!ctl) return;
      var has = (typeof p.mapLat==="number" && typeof p.mapLng==="number");
      if(!canMove){ ctl.innerHTML = ""; return; }
      ctl.innerHTML = '<div style="font-size:12px;margin-top:8px;line-height:1.6;color:var(--ink-soft)">Googleマップの埋め込み画面では、ピンを直接ドラッグできません。ピンの位置を直すには、<b>①「Googleマップで開く」で正しい場所を右クリック（スマホは長押し）→ 表示された緯度・経度をコピー</b>（またはその時のURLをコピー）し、<b>②下に貼り付けて「この位置に設定」</b>を押してください。ピン付き地図にも同じ位置が反映されます。'+(has?'（現在：保存したピン位置を使用中）':'')+'</div>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;align-items:flex-start"><input id="pm-gin" type="text" placeholder="例: 39.7036, 141.1527 またはGoogleマップのURL" style="flex:1;min-width:220px;height:34px">'+
        '<button class="btn sm primary" id="pm-gset">この位置に設定</button>'+(has?'<button class="btn sm" id="pm-greset">保存した位置を解除</button>':'')+'</div><div id="pm-gmsg" style="font-size:12px;margin-top:4px;color:var(--danger)"></div>';
      var set = function(g){
        p.mapLat = g ? g.lat : null; p.mapLng = g ? g.lng : null;
        if(db) db.collection("projects").doc(p.id).update({mapLat:p.mapLat, mapLng:p.mapLng}).then(function(){ toast(g?"ピンの位置を保存しました":"保存した位置を解除しました"); }).catch(function(){ toast("保存できませんでした"); });
        showGoogle();
      };
      document.getElementById("pm-gset").onclick = function(){
        var g = parseLatLng(document.getElementById("pm-gin").value);
        if(!g){ document.getElementById("pm-gmsg").textContent = "緯度・経度を読み取れませんでした。「39.7036, 141.1527」の形式か、位置が入ったGoogleマップのURL（短縮URLは不可）を貼り付けてください。"; return; }
        set(g);
      };
      var rb = document.getElementById("pm-greset"); if(rb) rb.onclick = function(){ set(null); };
    };
    var showGoogle = function(){
      googleCtl();
      var token = (box._gtok = (box._gtok||0)+1);
      var put = function(q){ if(box._gtok===token && document.body.contains(box) && state.propMapMode==="google") box.innerHTML = gFrame(q); };
      if(typeof p.mapLat==="number" && typeof p.mapLng==="number") return put(p.mapLat+","+p.mapLng);
      box.innerHTML = gFrame(encodeURIComponent(pa.text));
      geocodeJp(pa.text).then(function(g){ if(g) put(g.lat+","+g.lng); }).catch(function(){});
    };
    document.querySelectorAll("#pm-mode [data-pmmode]").forEach(function(o){
      if(o._pmBound) return; o._pmBound = true;
      o.addEventListener("click", function(){
        var m = o.getAttribute("data-pmmode"); if(m===(state.propMapMode==="google"?"google":"pin")) return;
        state.propMapMode = m;
        document.querySelectorAll("#pm-mode [data-pmmode]").forEach(function(x){ x.classList.toggle("active", x===o); });
        var ctl0 = document.getElementById("propmap-ctl"); if(ctl0) ctl0.innerHTML = "";
        if(m==="google"){ showGoogle(); } else { initPropMap(box); }
      });
    });
    if(state.propMapMode==="google"){ showGoogle(); return; }
    loadLeaflet().then(function(){
      if(!document.body.contains(box)) return;
      var saved = (typeof p.mapLat==="number" && typeof p.mapLng==="number") ? {lat:p.mapLat,lng:p.mapLng} : null;
      var pre = saved ? Promise.resolve(saved) : geocodeJp(pa.text).catch(function(){ return null; });
      return pre.then(function(pos){
        if(!document.body.contains(box)) return;
        box.innerHTML = '<div id="propmap-canvas" style="height:260px;width:100%"></div>';
        var found = !!pos, cur = pos || {lat:36.2, lng:138.25}, dirty = false;
        var map = L.map("propmap-canvas", {scrollWheelZoom:false}).setView([cur.lat,cur.lng], found?17:5);
        L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png", {maxZoom:18, attribution:"地理院タイル"}).addTo(map);
        var icon = L.divIcon({className:"", iconSize:[30,40], iconAnchor:[15,38],
          html:'<svg width="30" height="40" viewBox="0 0 30 40"><path d="M15 1C7.8 1 2 6.8 2 14c0 9.5 13 25 13 25s13-15.500 13-25C28 6.800 22.200 1 15 1z" fill="#d93025" stroke="#fff" stroke-width="2"/><circle cx="15" cy="14" r="5" fill="#fff"/></svg>'});
        var mk = L.marker([cur.lat,cur.lng], {icon:icon, draggable:canMove}).addTo(map);
        var ctl = document.getElementById("propmap-ctl");
        var paint = function(){
          var msg = dirty ? '<span style="color:var(--danger);font-weight:700">ピンの位置を変更しました。保存してください。</span>'
            : (saved ? '<span style="color:var(--ink-soft)">ピンの位置は保存済みです。</span>'
            : (found ? '<span style="color:var(--ink-soft)">住所から位置を自動で表示しています。'+(canMove?'ずれている場合はピンを動かしてください。':'')+'</span>'
            : '<span style="color:var(--danger);font-weight:700">住所から場所を特定できませんでした。'+(canMove?'地図をタップするか、ピンを動かして位置を指定してください。':'')+'</span>'));
          ctl.innerHTML = '<div style="font-size:12px;margin-top:8px;line-height:1.6">'+msg+'</div>'+(canMove ?
            '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;align-items:flex-start">'+
            (dirty?'<button class="btn sm primary" id="pm-save">この位置で保存</button><button class="btn sm" id="pm-cancel">元に戻す</button>':'')+
            (saved&&!dirty?'<button class="btn sm" id="pm-reset">保存した位置を解除（住所から再検索）</button>':'')+'</div>' : '');
          var b;
          if((b=document.getElementById("pm-save"))) b.onclick=function(){
            var ll = mk.getLatLng(), lat = Math.round(ll.lat*1e6)/1e6, lng = Math.round(ll.lng*1e6)/1e6;
            p.mapLat = lat; p.mapLng = lng; saved = {lat:lat,lng:lng}; dirty = false; paint();
            if(db) db.collection("projects").doc(p.id).update({mapLat:lat, mapLng:lng}).then(function(){ toast("ピンの位置を保存しました"); }).catch(function(){ toast("保存できませんでした"); });
          };
          if((b=document.getElementById("pm-cancel"))) b.onclick=function(){ mk.setLatLng([cur.lat,cur.lng]); map.panTo([cur.lat,cur.lng]); dirty=false; paint(); };
          if((b=document.getElementById("pm-reset"))) b.onclick=function(){
            p.mapLat = null; p.mapLng = null; saved = null;
            if(db) db.collection("projects").doc(p.id).update({mapLat:null, mapLng:null}).catch(function(){});
            geocodeJp(pa.text).catch(function(){return null;}).then(function(g){ found=!!g; if(g){ cur=g; mk.setLatLng([g.lat,g.lng]); map.setView([g.lat,g.lng],17);} paint(); });
          };
        };
        if(canMove){
          mk.on("dragend", function(){ dirty = true; paint(); });
          map.on("click", function(e){ mk.setLatLng(e.latlng); dirty = true; paint(); });
        }
        paint();
        setTimeout(function(){ map.invalidateSize(); }, 200);
      });
    }).catch(function(){ /* 読み込めない環境では、従来のGoogleマップ表示のまま */ });
  }
